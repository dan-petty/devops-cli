# One PodDisruptionBudget for each component of the Seaweed CR and for the operator (#4750). A drain
# stops at most one pod of each at a time.
# Three masters keep the Raft quorum with one pod down.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: seaweedfs-master
  namespace: object-store
  labels:
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
      app.kubernetes.io/instance: seaweedfs
      app.kubernetes.io/component: master
---
# Replication 001 keeps the second copy of each volume on another volume server.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: seaweedfs-volume
  namespace: object-store
  labels:
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
      app.kubernetes.io/instance: seaweedfs
      app.kubernetes.io/component: volume
---
# The other filer serves the metadata.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: seaweedfs-filer
  namespace: object-store
  labels:
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
      app.kubernetes.io/instance: seaweedfs
      app.kubernetes.io/component: filer
---
# The other gateway serves S3.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: seaweedfs-s3
  namespace: object-store
  labels:
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
      app.kubernetes.io/instance: seaweedfs
      app.kubernetes.io/component: s3
---
# One pod: a drain can stop it, and the store keeps serving S3 while it is away.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: seaweedfs-admin
  namespace: object-store
  labels:
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
      app.kubernetes.io/instance: seaweedfs
      app.kubernetes.io/component: admin
---
# One pod: a drain can stop it, and the maintenance jobs wait for it.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: seaweedfs-worker
  namespace: object-store
  labels:
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
      app.kubernetes.io/instance: seaweedfs
      app.kubernetes.io/component: worker
---
# One pod: the store keeps serving while the operator is away.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: seaweedfs-operator
  namespace: object-store
  labels:
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs-operator
      app.kubernetes.io/instance: seaweedfs-operator
