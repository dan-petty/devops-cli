apiVersion: batch/v1
kind: Job
metadata:
  name: minio-go
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: object-store-build-test
        app.kubernetes.io/component: minio-go
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio-go
          image: golang:1.27-alpine@sha256:70bd7ddea8b6cbe5d6943cde279d6b67feb10cc924fb9100d1d8757c1575b280
          # minio-go downloads from the Go module proxy at the start of the run, into the emptyDir.
          command:
            - sh
            - -ec
            - >-
              mkdir -p /tmp/stream && cd /tmp/stream && cp /scripts/main.go . &&
              go mod init example.com/buildtest && go get github.com/minio/minio-go/v7 &&
              go run .
          env:
            - name: HOME
              value: /tmp
            - name: GOPATH
              value: /tmp/go
            - name: GOCACHE
              value: /tmp/cache
            - name: CGO_ENABLED
              value: "0"
            - name: S3_ENDPOINT
              value: http://seaweedfs-s3.object-store.svc.cluster.local:8333
            - name: BUCKET
              value: build-test
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: build-test-s3
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: build-test-s3
                  key: secret-key
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: build-test-scripts
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
