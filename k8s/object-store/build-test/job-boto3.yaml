apiVersion: batch/v1
kind: Job
metadata:
  name: boto3
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: object-store-build-test
        app.kubernetes.io/component: boto3
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: boto3
          image: python:3.14-slim@sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f
          # boto3 installs from PyPI at the start of the run, into the emptyDir.
          command: ["sh", "-ec", "pip install --user --no-cache-dir --quiet boto3 && python /scripts/multipart.py"]
          env:
            - name: HOME
              value: /tmp
            - name: PYTHONUSERBASE
              value: /tmp/python
            - name: PIP_DISABLE_PIP_VERSION_CHECK
              value: "1"
            - name: S3_ENDPOINT
              value: http://seaweedfs-s3.object-store.svc.cluster.local:8333
            - name: BUCKET
              value: build-test
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: build-test-s3
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: build-test-s3
                  key: secret-key
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: build-test-scripts
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
