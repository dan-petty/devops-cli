# The build test of the object store (#4750; k8s/README.md, Object Store, Build test). No
# Application applies it: a person applies it after the merge and the push of the Secrets, with the
# keys of a temporary S3 identity in Secret build-test-s3, and deletes the namespace at the end.
#
# The namespace has the label `backup-client: "true"`, so the perimeter of the store admits it to
# the S3 port, as it admits each client namespace. Each Job reaches Service seaweedfs-s3.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: object-store-build-test

resources:
  - namespace.yaml
  - scripts.yaml
  - job-boto3.yaml
  - job-minio-go.yaml
