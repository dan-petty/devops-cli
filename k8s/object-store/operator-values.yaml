# Values of the SeaweedFS operator chart (k8s/argocd/apps/seaweedfs-operator.yaml), and of release
# seaweedfs-operator of `devops k8s deploy-stack --stack infra` (#4750).
#
# The values set no image tag, so the operator is the appVersion of the pinned chart: the operator
# release that the chart release ships. The version rule is in k8s/README.md, section Object Store.

# The chart installs the Seaweed CRD and the other CRDs of the operator from its templates.
crds:
  create: true

# The operator reconciles the Seaweed CR of this namespace only, so it gets a Role here and a small
# ClusterRole for the cluster-scoped reads, not a ClusterRole over every namespace.
watchNamespaces:
  - object-store

# The Grafana sidecar loads only the ConfigMaps of namespace monitoring, so the dashboard is in
# k8s/monitoring/dashboards/seaweedfs.json and the chart writes no dashboard ConfigMap here.
grafanaDashboard:
  enabled: false

# cert-manager issues the certificate of the admission webhooks, and its cainjector writes the CA
# bundle into the two webhook configurations. The chart then renders no certgen hook Job.
webhook:
  enabled: true
  certManager:
    enabled: true

# The operator Deployment counts toward the 1 CPU and 3Gi of requests of the namespace. The chart
# sets the restricted security contexts of the pod and the container.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
