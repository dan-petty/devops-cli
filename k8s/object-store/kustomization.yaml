# The SeaweedFS object store (#4750): Argo CD's `object-store` Application applies it after the
# operator of Application `seaweedfs-operator`, and `devops k8s deploy-stack --stack infra` applies
# it after the charts. operator-values.yaml is the values file of the chart, and build-test/ is the
# build test of the README, which no Application applies.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: object-store

resources:
  - seaweed.yaml
  - networkpolicy.yaml
  - poddisruptionbudgets.yaml
