# kube-prometheus-stack Helm values — minimal dev-mode for minikube.
# Chart: prometheus-community/kube-prometheus-stack
# Repo:  https://prometheus-community.github.io/helm-charts
#
# Bundles: Prometheus, Alertmanager, Grafana, node-exporter, kube-state-metrics.

# ── Prometheus ────────────────────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    # Short retention for local dev — keeps storage minimal
    retention: 2h
    retentionSize: 512MB

    resources:
      requests:
        cpu: 200m
        memory: 512Mi

    # Enable remote write receiver so OTEL Collector can push metrics
    enableRemoteWriteReceiver: true

    additionalScrapeConfigs:
      - job_name: qdrant
        static_configs:
          - targets: ["qdrant.llm.svc.cluster.local:6333"]
      - job_name: otel-collector
        static_configs:
          - targets: ["otel-collector-opentelemetry-collector.otel.svc.cluster.local:8888"]

  service:
    type: NodePort

# ── Alertmanager — disabled for local dev ─────────────────────────────────────
alertmanager:
  enabled: false

# ── Grafana ───────────────────────────────────────────────────────────────────
grafana:
  adminPassword: admin

  service:
    type: NodePort

  resources:
    requests:
      cpu: 100m
      memory: 512Mi

  additionalDataSources:
    - name: Jaeger
      type: jaeger
      access: proxy
      url: http://jaeger.otel.svc.cluster.local:16686
      isDefault: false
      jsonData:
        tracesToLogs:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true

  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 10
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 5

  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 60
    timeoutSeconds: 10
    periodSeconds: 10
    failureThreshold: 10

  # Auto-provision Prometheus as default datasource
  sidecar:
    dashboards:
      enabled: true
    datasources:
      enabled: true

  # Pre-loaded dashboards for Kubernetes monitoring
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

# ── Node Exporter — minimal for local dev ─────────────────────────────────────
nodeExporter:
  enabled: true

# ── kube-state-metrics ────────────────────────────────────────────────────────
kubeStateMetrics:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
