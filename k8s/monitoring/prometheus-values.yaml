# Prometheus Server Helm values
# Chart: prometheus-community/prometheus
# Repo:  https://prometheus-community.github.io/helm-charts

server:
  # Metrics are kept 30 days by time (#550). The size cap only guards the disk: measured on
  # 2026-10-03 the TSDB grew 0.16 GB a day over its first three days, redeploys and power
  # losses included (about 5 GB in 30 days), and #1080's host series add under 0.1 GB, so time
  # retention deletes blocks long before 16 GiB is reached.
  # Units are powers of two. The cap sits at 80% of the 20Gi volume, leaving room for compaction.
  retention: 30d
  retentionSize: 16GB

  # Accept out-of-order samples within 10m (#1132). The v1 remote-write handler otherwise
  # drops a whole batch for one late sample.
  tsdb:
    out_of_order_time_window: 10m

  extraArgs:
    web.enable-remote-write-receiver: ""
    # Ingest zero-value samples at created timestamps (#2039). This allows single-export
    # cluster jobs to count in rate() and increase() queries.
    enable-feature: created-timestamp-zero-ingestion

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2048Mi

  persistentVolume:
    enabled: true
    storageClass: local-path
    size: 20Gi
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false

  service:
    servicePort: 9090

# Alertmanager (#549). Prometheus finds it through the chart's pod discovery, and Grafana reads
# it as the `alertmanager` datasource. Alerts without a routed severity go to `null`, which sends
# nowhere. Critical and warning alerts go to `webhook`, whose URL is the `url` key of the Secret
# `alertmanager-webhook` in `monitoring`. No channel is chosen yet, so that Secret does not exist:
# until it does, those notifications fail and nothing is sent. Creating it wires the channel; the
# optional mount is a directory, so the running pod sees the file without a restart.
alertmanager:
  enabled: true
  persistence:
    storageClass: local-path
  # local-path binds the volume on the node where the pod first runs, and the root disk of the
  # control-plane node has the least free space (#1634; k8s/README.md, Local-Path Volume Placement).
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  # k8s-monitoring's annotation autodiscovery scrapes Alertmanager's own metrics for its health
  # rules. It also finds the config-reloader sidecar and rewrites that target to the annotated
  # port, so the container key keeps it from scraping Alertmanager a second time.
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9093"
    k8s.grafana.com/metrics.container: alertmanager
  extraSecretMounts:
    - name: webhook-url
      mountPath: /etc/alertmanager-webhook
      secretName: alertmanager-webhook
      readOnly: true
      optional: true
  config:
    route:
      receiver: "null"
      group_by: [alertname, node]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: webhook
          matchers:
            - severity=~"critical|warning"
    receivers:
      - name: "null"
      - name: webhook
        webhook_configs:
          - url_file: /etc/alertmanager-webhook/url
            send_resolved: true
    inhibit_rules:
      # A node that is not Ready takes its scrape targets with it.
      - source_matchers:
          - alertname="NodeNotReady"
        target_matchers:
          - alertname="TargetDown"
        equal: [node]
      # A rule with two thresholds fires both at once past the higher one.
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity="warning"
        equal: [alertname, node, gpu, mountpoint]

# Disable sub-charts already deployed by k8s-monitoring
prometheus-node-exporter:
  enabled: false

kube-state-metrics:
  enabled: false

prometheus-pushgateway:
  enabled: false

# The server scrapes only itself (prometheus-server.json) and the otel collector
# (otel-collector.json); k8s-monitoring discovers every other target (k8s/README.md, Scrape
# Ownership). The chart turns each of its default jobs on unless it is set `enabled: false`.
scrapeConfigs:
  # Both jobs label their series with the cluster, the k8s-monitoring `cluster.name` Alloy
  # writes. Prometheus adds `external_labels` only to remote write, federation and alerts, not
  # to the series it stores.
  prometheus:
    enabled: true
    post_relabel_configs: &cluster |
      - action: replace
        target_label: cluster
        replacement: homelab-k3s
  # Only the collector, which the server scrapes directly rather than through Alloy, so the
  # export failures it counts stay visible when Alloy is what fails (k8s/README.md). Its pods
  # carry the `prometheus.io/*` annotations, and k8s-monitoring's autodiscovery skips `otel`.
  kubernetes-pods:
    enabled: true
    pre_relabel_configs: |
      - source_labels: [__meta_kubernetes_namespace]
        action: keep
        regex: otel
    post_relabel_configs: *cluster
  kubernetes-api-servers:
    enabled: false
  kubernetes-nodes:
    enabled: false
  kubernetes-nodes-cadvisor:
    enabled: false
  kubernetes-service-endpoints:
    enabled: false
  kubernetes-service-endpoints-slow:
    enabled: false
  kubernetes-services:
    enabled: false
  kubernetes-pods-slow:
    enabled: false
  prometheus-pushgateway:
    enabled: false

# Alert rules (#549, #550). Every rule carries `severity` (critical or warning, both routed to
# the webhook) and, when it concerns one node, `node`, so one `node=<name>` silence covers a node
# in planned maintenance (k8s/README.md, Alerting). node-exporter names its node in `instance`.
# No rule watches the controller manager, scheduler or proxy: k3s runs them inside its server
# process and nothing scrapes them, so such a rule would fire on the missing target.
serverFiles:
  alerting_rules.yml:
    groups:
      - name: homelab-nodes
        rules:
          - alert: NodeNotReady
            expr: kube_node_status_condition{condition="Ready", status="true"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ $labels.node }} is not Ready"
              description: "Kubernetes has reported node {{ $labels.node }} not Ready for 5 minutes. Its scrape targets' TargetDown alerts are inhibited while this fires."
          - alert: TargetDown
            expr: up == 0
            for: 10m
            labels:
              severity: warning
              # A target without a node label is named by its instance, which for
              # node-exporter is the node.
              node: "{{ or $labels.node $labels.instance }}"
            annotations:
              summary: "Scrape target {{ $labels.job }} {{ $labels.instance }} is down"
              description: "Prometheus has not scraped {{ $labels.instance }} (job {{ $labels.job }}) for 10 minutes."
          # Uptime under 30 minutes rather than a change in boot time: a node that stayed down
          # longer than the lookback window has no earlier boot time to compare with.
          - alert: NodeRebooted
            expr: (node_time_seconds - node_boot_time_seconds) < 1800
            for: 0m
            labels:
              severity: warning
              node: "{{ $labels.instance }}"
            annotations:
              summary: "Node {{ $labels.instance }} booted {{ $value | humanizeDuration }} ago"
              description: "Node {{ $labels.instance }} restarted. Its journal in Loki shows whether the restart was clean."
          # A server runs k3s.service and an agent k3s-agent.service; node-exporter reports only
          # the units a node has, so the node's one k3s unit must be active.
          - alert: K3sServiceNotActive
            expr: max by (instance) (node_systemd_unit_state{name=~"k3s\\.service|k3s-agent\\.service", state="active"}) == 0
            for: 5m
            labels:
              severity: critical
              node: "{{ $labels.instance }}"
            annotations:
              summary: "k3s is not active on node {{ $labels.instance }}"
              description: "Neither k3s.service nor k3s-agent.service has been active on node {{ $labels.instance }} for 5 minutes."
          - alert: GpuPowerLimitServiceNotActive
            expr: node_systemd_unit_state{name="nvidia-power-limit.service", state="active"} == 0
            for: 10m
            labels:
              severity: critical
              node: "{{ $labels.instance }}"
            annotations:
              summary: "GPU power caps are not applied on node {{ $labels.instance }}"
              description: "nvidia-power-limit.service has not been active on node {{ $labels.instance }} for 10 minutes, so its GPUs may draw past their caps."
      - name: homelab-gpus
        rules:
          - alert: GpuTemperatureHigh
            expr: max by (node, gpu, modelName) (DCGM_FI_DEV_GPU_TEMP) > 85
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "GPU {{ $labels.gpu }} on node {{ $labels.node }} is at {{ $value }} °C"
              description: "{{ $labels.modelName }} {{ $labels.gpu }} on node {{ $labels.node }} has been over 85 °C for 10 minutes."
          - alert: GpuTemperatureHigh
            expr: max by (node, gpu, modelName) (DCGM_FI_DEV_GPU_TEMP) >= 90
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "GPU {{ $labels.gpu }} on node {{ $labels.node }} is at {{ $value }} °C"
              description: "{{ $labels.modelName }} {{ $labels.gpu }} on node {{ $labels.node }} has been at 90 °C or more for 2 minutes."
          # Site power budget for all GPUs together, in watts: the number in `expr`. The GPUs drew
          # about 1000 W together before a breaker trip on the circuit every node shared. Once the
          # new power layout is known, this should be one budget per circuit, over the GPUs of the
          # nodes on that circuit. `max by (node, gpu)` counts a GPU once while its exporter pod
          # is replaced.
          - alert: GpuPowerOverSiteBudget
            expr: sum(max by (node, gpu) (DCGM_FI_DEV_POWER_USAGE)) > 1000
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "The GPUs draw {{ $value | humanize }}W together, over the site budget"
              description: "Total GPU power has been over the budget in this rule for 5 minutes. Lower the load or the power caps before the circuit trips."
      - name: homelab-storage
        rules:
          # local-path volumes are host directories: they report no kubelet volume stats, and
          # what fills is the host filesystem under them (Prometheus's and Loki's included).
          # This watches every filesystem of every node. LogOrMetricVolumeDiskLow
          # (log-and-metric-retention) watches the same 10% only on the root filesystem of the
          # node holding Loki's and Prometheus's claims, and names the claim at risk, so on that
          # node both fire.
          - alert: HostFilesystemSpaceLow
            expr: node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.10
            for: 15m
            labels:
              severity: warning
              node: "{{ $labels.instance }}"
            annotations:
              summary: "{{ $labels.mountpoint }} on node {{ $labels.instance }} is {{ $value | humanizePercentage }} free"
              description: "{{ $labels.mountpoint }} on node {{ $labels.instance }} has had under 10% free for 15 minutes. local-path volumes on that node fill with it."
          - alert: HostFilesystemSpaceLow
            expr: node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.05
            for: 5m
            labels:
              severity: critical
              node: "{{ $labels.instance }}"
            annotations:
              summary: "{{ $labels.mountpoint }} on node {{ $labels.instance }} is {{ $value | humanizePercentage }} free"
              description: "{{ $labels.mountpoint }} on node {{ $labels.instance }} has had under 5% free for 5 minutes. local-path volumes on that node fill with it."
          # At 85% used the kubelet starts to delete unused images (imageGCHighThresholdPercent), and
          # a node under DiskPressure evicts its pods. A pod on a local-path volume cannot start on
          # another node, so this warns at 85% on the root filesystem of each node that runs a pod
          # on a local-path claim (#1634): the claim gives the storage class, the pod's volumes give
          # the claim, and kube_pod_info gives the node. The joins are `and`, which accepts many
          # series on each side: for a few minutes after a pod moves, kube_pod_info holds a series
          # for each node, and a `group_left` join on the pod would stop the rule.
          # HostFilesystemSpaceLow fires later, at 10% free, on every node.
          - alert: LocalPathNodeDiskHigh
            expr: |
              (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) > 0.85
              and on (instance)
              label_replace(
                max by (node) (
                  kube_pod_info
                  and on (namespace, pod)
                  (
                    kube_pod_spec_volumes_persistentvolumeclaims_info
                    and on (namespace, persistentvolumeclaim)
                    kube_persistentvolumeclaim_info{storageclass="local-path"}
                  )
                ),
                "instance", "$1", "node", "(.+)"
              )
            for: 15m
            labels:
              severity: warning
              node: "{{ $labels.instance }}"
            annotations:
              summary: "The root filesystem of node {{ $labels.instance }}, which holds local-path volumes, is {{ $value | humanizePercentage }} used"
              description: "The root filesystem of node {{ $labels.instance }} has been over 85% used for 15 minutes. At 85% the kubelet starts to delete unused images, and under DiskPressure it evicts pods. The pods on its local-path volumes cannot start on another node: free the disk, or move a volume (k8s/README.md, Local-Path Volume Placement)."
          # Silent on this cluster for now: the kubelet reports volume stats only for volumes
          # whose plugin measures them, and no claim here uses one. It fires once a claim on such
          # a storage class exists.
          - alert: PersistentVolumeSpaceLow
            expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.10
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} free"
              description: "The volume of claim {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has had under 10% free for 15 minutes."
          # The claim is not enforced on local-path, but it is what 30 days of metrics are sized to.
          # `server.retentionSize` sits at 80% of the claim, so this fires only when that cap is
          # not holding the data (unset, rolled back, or overshot between retention runs).
          # PrometheusNearRetentionSizeCap warns earlier, at 80% of the cap, and
          # PrometheusSizeLimitCutHistory once the cap has deleted blocks.
          # `on ()` fails to evaluate on a second series on either side, so each side is reduced
          # to one: this server's self-scrape (`job="prometheus"`) and `max` over the claim's
          # size. A second Prometheus and a second kube-state-metrics were scraped for hours on
          # 2026-10-01/02.
          - alert: PrometheusStorageNearClaim
            expr: (prometheus_tsdb_storage_blocks_bytes{job="prometheus"} + prometheus_tsdb_wal_storage_size_bytes{job="prometheus"} + prometheus_tsdb_head_chunks_storage_size_bytes{job="prometheus"}) / on () max(kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace="monitoring", persistentvolumeclaim="prometheus-server"}) > 0.8
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "Prometheus data fills {{ $value | humanizePercentage }} of its claim"
              description: "Prometheus's blocks, WAL and head chunks have used over 80% of the prometheus-server claim for an hour, so 30 days of metrics may not fit it."
      # Alerts before the log or metric volume fills (#550). They route like every other rule:
      # a warning goes to the webhook receiver.
      - name: log-and-metric-retention
        rules:
          # local-path keeps a volume on its node's root filesystem and does not hold it to its
          # claimed size, so the volume fills when that filesystem does. Each claim is followed
          # through its pod to the node, so the alert moves with the volume. The result keeps the
          # claim's `node` label, so a node silence covers it. HostFilesystemSpaceLow
          # (homelab-storage) watches the same filesystem at the same 10% without naming a claim.
          # Joining kube_pod_info on the left of group_left (persistentvolumeclaim) ensures that
          # when a moving pod has series on multiple nodes in kube_pod_info, the rule still
          # evaluates without a many-to-many match error (#2148).
          - alert: LogOrMetricVolumeDiskLow
            expr: |
              min by (instance) (
                node_filesystem_avail_bytes{mountpoint="/"}
                / node_filesystem_size_bytes{mountpoint="/"}
              )
              * on (instance) group_right ()
              label_replace(
                max by (node, namespace, persistentvolumeclaim) (
                  max by (namespace, pod, node) (kube_pod_info)
                  * on (namespace, pod) group_left (persistentvolumeclaim)
                  max by (namespace, pod, persistentvolumeclaim) (
                    kube_pod_spec_volumes_persistentvolumeclaims_info{namespace=~"logging|monitoring", persistentvolumeclaim=~"storage-loki-0|prometheus-server"}
                  )
                ),
                "instance", "$1", "node", "(.+)"
              )
              < 0.10
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: The disk holding {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is almost full.
              description: >-
                The root filesystem of node {{ $labels.node }}, which holds
                {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}, has
                {{ $value | humanizePercentage }} free. When it fills, Loki stops accepting logs
                or Prometheus stops writing samples.
          # The size cap is set well above 30 days of samples, so time retention is what deletes
          # history. This fires before the cap would start deleting blocks younger than 30 days;
          # PrometheusSizeLimitCutHistory fires once it has, and PrometheusStorageNearClaim if the
          # data outgrows the claim with no cap holding it. Every series is this server's own
          # self-scrape (`job="prometheus"`), so the alert is about this server's retentionSize
          # only. Matching is one-to-one, so a second Prometheus scraped next to it (as on
          # 2026-10-01/02) cannot break evaluation the way it broke `on ()`; without the pin it
          # would raise this alert, with this text, for that server's own cap.
          - alert: PrometheusNearRetentionSizeCap
            expr: |
              (
                prometheus_tsdb_storage_blocks_bytes{job="prometheus"}
                + prometheus_tsdb_wal_storage_size_bytes{job="prometheus"}
                + prometheus_tsdb_head_chunks_storage_size_bytes{job="prometheus"}
              )
              / prometheus_tsdb_retention_limit_bytes{job="prometheus"}
              > 0.8
              and prometheus_tsdb_retention_limit_bytes{job="prometheus"} > 0
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: Prometheus storage is near its retention size cap.
              description: >-
                Prometheus uses {{ $value | humanizePercentage }} of server.retentionSize. At the
                cap it deletes blocks before they are 30 days old.
      - name: monitoring-self
        rules:
          - alert: ClusterMetricsMissing
            expr: absent(kube_node_status_condition)
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "Prometheus has no node status metrics"
              description: "kube_node_status_condition has been absent for 10 minutes: kube-state-metrics or Alloy's remote write to Prometheus has stopped, and the node rules cannot fire."
          - alert: PrometheusConfigReloadFailed
            expr: max_over_time(prometheus_config_last_reload_successful[5m]) == 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Prometheus failed to reload its configuration"
              description: "Prometheus's last configuration reload failed and has not succeeded since; it runs the configuration it had before."
          - alert: PrometheusRuleEvaluationFailures
            expr: increase(prometheus_rule_evaluation_failures_total[5m]) > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Prometheus rule group {{ $labels.rule_group }} is failing"
              description: "Rules in {{ $labels.rule_group }} have failed to evaluate for 15 minutes, so their alerts cannot fire."
          - alert: PrometheusNotConnectedToAlertmanager
            expr: max_over_time(prometheus_notifications_alertmanagers_discovered[5m]) < 1
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Prometheus has no Alertmanager"
              description: "Prometheus has discovered no Alertmanager for 10 minutes, so no alert leaves it. Prometheus's Alerts page still shows them."
          - alert: PrometheusDroppingAlerts
            expr: increase(prometheus_notifications_dropped_total[15m]) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Prometheus dropped alerts on their way to Alertmanager"
              description: "Prometheus dropped {{ $value | humanize }} alerts in 15 minutes because it could not send them to Alertmanager."
          - alert: PrometheusCompactionsFailing
            expr: increase(prometheus_tsdb_compactions_failed_total[3h]) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Prometheus storage compaction is failing"
              description: "Prometheus failed {{ $value | humanize }} block compactions in 3 hours."
          # Metrics are kept 30 days by time (`server.retention`); a size cap must not cut that short.
          # PrometheusNearRetentionSizeCap (log-and-metric-retention) warns before this fires.
          - alert: PrometheusSizeLimitCutHistory
            expr: increase(prometheus_tsdb_size_retentions_total[1h]) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Prometheus deleted data to stay under its size cap"
              description: "Prometheus removed blocks for its size cap in the last hour, so it holds less than the 30 days of metrics its time retention keeps."
          - alert: LokiRequestErrors
            expr: sum by (route) (rate(loki_request_duration_seconds_count{status_code=~"5.."}[5m])) / sum by (route) (rate(loki_request_duration_seconds_count[5m])) > 0.05
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Loki fails {{ $value | humanizePercentage }} of {{ $labels.route }} requests"
              description: "Over 5% of Loki's {{ $labels.route }} requests have returned a 5xx status for 15 minutes."
          # Pyroscope 5xx errors (such as torn-segment reads on local-path storage, #1134), over
          # the series #1131's ServiceMonitor scrapes.
          - alert: PyroscopeQueryErrors
            expr: sum by (route) (rate(pyroscope_request_duration_seconds_count{status_code=~"5.."}[15m])) > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Pyroscope is returning 5xx responses on {{ $labels.route }}"
              description: "Pyroscope's {{ $labels.route }} route has returned 5xx errors over 15 minutes for 15 minutes."
          # Loki keeps logs 30 days (`retention_period: 720h`), but only its compactor's retention
          # deletes them, on every compaction (every 10 minutes). #550 turns that retention on
          # (`compactor.retention_enabled`), and it takes effect with #550's Loki migration; this
          # rule fires if the compactor stops applying it. Loki's series come from k8s-monitoring's
          # Loki integration wherever the logging stack runs; without that stack this stays silent.
          - alert: LokiRetentionNotRunning
            expr: time() - loki_compactor_apply_retention_last_successful_run_timestamp_seconds > 3600
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Loki is not deleting logs past their retention"
              description: "Loki's compactor has not applied retention for over 90 minutes, so logs older than 30 days stay on disk. Its retention needs compactor.retention_enabled in k8s/logging/loki-values.yaml."
          - alert: AlertmanagerConfigReloadFailed
            expr: max_over_time(alertmanager_config_last_reload_successful[5m]) == 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Alertmanager failed to reload its configuration"
              description: "Alertmanager's last configuration reload failed and has not succeeded since; it runs the configuration it had before."
          # Without the webhook Secret every webhook notification fails by design, so this fires
          # only once the Secret exists.
          - alert: AlertmanagerNotificationsFailing
            expr: sum by (integration) (increase(alertmanager_notifications_failed_total[15m])) > 0 and on () kube_secret_info{namespace="monitoring", secret="alertmanager-webhook"}
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Alertmanager cannot deliver {{ $labels.integration }} notifications"
              description: "Alertmanager's {{ $labels.integration }} notifications have failed for 15 minutes. Its log names the error."
      # Alloy's metric remote-write and log-write drops (#1131) and log-shipper silence (#890),
      # scraped by k8s-monitoring's Alloy integration (`job="integrations/alloy"`).
      - name: homelab-telemetry-pipeline
        rules:
          - alert: AlloyRemoteWriteSamplesFailed
            expr: increase(prometheus_remote_storage_samples_failed_total{job="integrations/alloy"}[15m]) > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Alloy collector {{ $labels.pod }} failed to remote-write samples"
              description: "Alloy collector {{ $labels.pod }} failed to send {{ $value | humanize }} samples to Prometheus in 15 minutes, so those samples were dropped."
          - alert: AlloyLogEntriesDropped
            expr: increase(loki_write_dropped_entries_total{job="integrations/alloy"}[15m]) > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Alloy collector {{ $labels.pod }} dropped log entries"
              description: "Alloy collector {{ $labels.pod }} dropped {{ $value | humanize }} log entries on their way to Loki in 15 minutes."
          # Only alloy-logs ships pod and journal logs from each node; alloy-singleton ships
          # cluster events, which can be quiet on an idle cluster (#890). Joining kube_pod_info
          # adds the pod's `node` label, so a planned-maintenance `node=<name>` silence covers it.
          - alert: PodLogsNotShipped
            expr: >-
              sum by (namespace, pod) (rate(loki_write_sent_entries_total{job="integrations/alloy", pod=~".*alloy-logs.*"}[5m]))
              * on (namespace, pod) group_left (node)
              max by (namespace, pod, node) (kube_pod_info)
              == 0
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Alloy log collector {{ $labels.pod }} on node {{ $labels.node }} is shipping no logs"
              description: "Alloy log collector {{ $labels.pod }} on node {{ $labels.node }} has sent 0 log entries to Loki for 30 minutes."
      # Argo CD sync and health, Cloudflare Tunnel HA connectivity, Valkey cache health (#551),
      # and CoreDNS SERVFAIL rate (#822).
      - name: homelab-services
        rules:
          - alert: ArgoCdApplicationOutOfSync
            expr: argocd_app_info{sync_status!="Synced"} == 1
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Argo CD application {{ $labels.name }} is {{ $labels.sync_status }}"
              description: "Argo CD application {{ $labels.name }} in {{ $labels.dest_namespace }} has been {{ $labels.sync_status }} for 15 minutes."
          - alert: ArgoCdApplicationUnhealthy
            expr: argocd_app_info{health_status!~"Healthy|Progressing"} == 1
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Argo CD application {{ $labels.name }} is {{ $labels.health_status }}"
              description: "Argo CD application {{ $labels.name }} in {{ $labels.dest_namespace }} has reported health {{ $labels.health_status }} for 15 minutes."
          - alert: ArgoCdAutoSyncDisabled
            expr: argocd_app_info{autosync_enabled="false"} == 1
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Argo CD application {{ $labels.name }} has automated sync disabled"
              description: "Argo CD application {{ $labels.name }} in {{ $labels.dest_namespace }} has had automated sync disabled for 15 minutes."
          - alert: ArgoCdSyncOperationStuck
            expr: argocd_app_info{operation!=""} == 1
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "Argo CD application {{ $labels.name }} has a {{ $labels.operation }} operation running for over an hour"
              description: "Argo CD application {{ $labels.name }} in {{ $labels.dest_namespace }} has been running a {{ $labels.operation }} operation for over an hour."
          # Git names every host under the placeholder domain, and deploy-stack sets the real hosts
          # on the Argo CD Applications `devops` and `ingress`. A placeholder host on a live Ingress
          # means those overrides are lost or do not cover a host that git added (#1817).
          - alert: IngressServesPlaceholderHost
            expr: count by (namespace, ingress) (kube_ingress_path{host=~"(.+\\.)?example\\.com"}) > 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Ingress {{ $labels.namespace }}/{{ $labels.ingress }} routes {{ $value }} host(s) under the placeholder domain of git"
              description: "Traefik matches hosts exactly, so the real hosts of Ingress {{ $labels.namespace }}/{{ $labels.ingress }} return 404. The host overrides that devops k8s deploy-stack sets on the Argo CD Applications devops and ingress are lost, or do not cover a host that git added. Set them again with devops k8s deploy-stack (k8s/README.md, GitOps)."
          - alert: CloudflareTunnelDegraded
            expr: sum(cloudflared_tunnel_ha_connections) < 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Cloudflare Tunnel has {{ $value }} active HA connections"
              description: "Fewer than 2 Cloudflare Tunnel HA connections have been active across cloudflared replicas for 5 minutes."
          - alert: CoreDnsServfailResponses
            expr: sum(rate(coredns_dns_responses_total{job="integrations/kubernetes/kube-dns", rcode="SERVFAIL"}[5m])) / sum(rate(coredns_dns_responses_total{job="integrations/kubernetes/kube-dns"}[5m])) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "CoreDNS returns SERVFAIL for {{ $value | humanizePercentage }} of queries"
              description: "Over 5% of CoreDNS responses have returned SERVFAIL over 5 minutes for 5 minutes."
          - alert: ValkeyCacheErrors
            expr: redis_up == 0 or increase(redis_rejected_connections_total[5m]) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Valkey cache {{ $labels.namespace }}/{{ $labels.instance }} is down or rejecting connections"
              description: "Valkey exporter {{ $labels.namespace }}/{{ $labels.instance }} reports redis_up == 0 or rejected client connections over the last 5 minutes."
      # The roadmap Service (#2472). Two paths send its series, and both give them
      # job="roadmap-service": k8s-monitoring's annotation autodiscovery scrapes its /metrics and
      # names the job after the pod's app.kubernetes.io/name, and the OpenTelemetry collector
      # names the job after OTEL_SERVICE_NAME. Each selector names the job, so the same series of
      # a workstation (job="devops-cli"), or of the server's kubernetes-pods job, which scraped the
      # pod before #1130, never counts.
      # kube-state-metrics gives the restarts and the replicas. On both paths a series starts at
      # its first count, with no zero sample before it, and increase() does not count that first
      # value. The OTLP series also get a sample only when the Service sends a new observation.
      - name: roadmap-service
        rules:
          # A refusal stops every round until the pod restarts, and /healthz stays healthy. The
          # counter stays at 1 for as long, so the alert holds while the Service is stopped.
          - alert: RoadmapServiceIdentityRefused
            expr: max by (identity) (devops_cli_service_identity_refused_total{job="roadmap-service"}) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "GitHub refused the identity {{ $labels.identity }} of the roadmap Service"
              description: "The roadmap Service stopped all rounds and starts no round until its pod restarts. Its health check stays healthy. Repair the GitHub App, then restart the Service (k8s/README.md, Roadmap service)."
          # Each sample is a throttle, so one sample in 15 minutes fires. increase() needs two
          # samples in its window and does not see one throttle alone.
          - alert: RoadmapServiceGitHubThrottled
            expr: sum by (resource) (count_over_time(devops_cli_github_throttle_wait_seconds{job="roadmap-service"}[15m])) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "GitHub throttled {{ $labels.resource }} requests of the roadmap Service"
              description: "In the last 15 minutes GitHub refused a {{ $labels.resource }} request of the roadmap Service with a rate limit, or gave a 5xx for a read. The Service waited and sent the request again (k8s/README.md, Roadmap service)."
          # Three failed rounds in a row suspend a job (roadmap-service-limits), so three errors
          # in an hour is a job that fails at each round. An error series that starts in the hour
          # adds its first value: `offset 1h * 0` gives 0 for a series that was there an hour ago,
          # and `or` gives the lowest value of the hour for a new series.
          - alert: RoadmapServiceJobsFailing
            expr: >-
              sum by (repo, lane) (
              increase(devops_cli_service_jobs_total{job="roadmap-service", result="error"}[1h])
              + (devops_cli_service_jobs_total{job="roadmap-service", result="error"} offset 1h * 0
              or min_over_time(devops_cli_service_jobs_total{job="roadmap-service", result="error"}[1h]))
              ) >= 3
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: '{{ printf "%.0f" $value }} {{ $labels.lane }} jobs of {{ $labels.repo }} failed in the last hour'
              description: "Three or more {{ $labels.lane }} jobs of {{ $labels.repo }} failed in one hour. A job that fails three rounds in a row stops until its input changes (k8s/README.md, Roadmap service)."
          # Each poll starts a round on every lane, every 5 minutes by default. A replica that is
          # not available starts no job, and RoadmapServiceUnavailable covers it.
          - alert: RoadmapServiceLaneStalled
            expr: >-
              time() - max by (repo, lane) (devops_cli_service_job_start_timestamp_seconds{job="roadmap-service"}) > 7200
              and on () max(kube_deployment_status_replicas_available{namespace="devops", deployment="roadmap-service"}) > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "No {{ $labels.lane }} job of {{ $labels.repo }} started for {{ $value | humanizeDuration }}"
              description: "The roadmap Service has an available replica, but no {{ $labels.lane }} job of {{ $labels.repo }} started for over 2 hours (k8s/README.md, Roadmap service)."
          - alert: RoadmapServiceRestarted
            expr: max by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total{namespace="devops", pod=~"roadmap-service-.+", container="service"}[1h])) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "The roadmap Service container in {{ $labels.pod }} restarted"
              description: 'The restart count of container {{ $labels.container }} of pod {{ $labels.namespace }}/{{ $labels.pod }} increased by {{ printf "%.0f" $value }} in the last hour (k8s/README.md, Roadmap service).'
          # The Recreate strategy stops the old pod before it starts the new one, so a rollout
          # has no available replica for a few minutes.
          - alert: RoadmapServiceUnavailable
            expr: max by (namespace, deployment) (kube_deployment_status_replicas_unavailable{namespace="devops", deployment="roadmap-service"}) > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "The roadmap Service has an unavailable replica"
              description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has had an unavailable replica for 10 minutes (k8s/README.md, Roadmap service)."
          # 90% of the default service.github_requests_per_hour (500). The Service holds its
          # rounds at the budget, and one round per worker can go past it.
          - alert: RoadmapServiceGitHubRequestsHigh
            expr: sum(increase(devops_cli_github_requests_total{job="roadmap-service"}[1h])) > 450
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: 'The roadmap Service sent {{ printf "%.0f" $value }} GitHub requests in the last hour'
              description: "The roadmap Service sent more than 450 GitHub requests in one hour, near its default budget of 500 (k8s/README.md, Roadmap service)."
          # A request that the cache answered does not go to a model.
          - alert: RoadmapServiceModelRequestsHigh
            expr: sum(increase(devops_cli_ai_requests_total{job="roadmap-service", cached!="true"}[1h])) > 352
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: 'The roadmap Service sent {{ printf "%.0f" $value }} model requests in the last hour'
              description: "The roadmap Service sent more than 352 model requests in one hour (k8s/README.md, Roadmap service)."
