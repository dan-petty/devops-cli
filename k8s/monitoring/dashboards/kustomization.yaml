# Grafana dashboard ConfigMaps for the dashboard sidecar (k8s/monitoring/grafana-values.yaml),
# which loads every ConfigMap labelled grafana_dashboard.
# Applied by: kubectl apply -k k8s/ (devops k8s deploy-stack), through the root kustomization.
#
# Names carry no content hash, so a re-apply updates each ConfigMap in place rather than leaving
# the old one behind for the sidecar to load twice. Each ConfigMap stays under kubectl's
# 262,144-byte last-applied annotation, which is why the dashboards are partitioned across
# focused ConfigMaps. All stack, Kubernetes view, CLI, and SRE dashboards are provisioned.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: devops-cli-stack

configMapGenerator:
  - name: grafana-k8s-global-dashboards
    files:
      - k8s-views-global.json
      - k8s-views-pods.json
  - name: grafana-k8s-node-dashboards
    files:
      - k8s-views-nodes.json
      - k8s-views-namespaces.json
  - name: grafana-devops-cli-dashboards
    files:
      - devops-cli.json
      - ai-spend.json
  - name: grafana-stack-dashboards
    files:
      - sre-service.json
      - llm-stack.json
      - otel-collector.json
      - prometheus-server.json
