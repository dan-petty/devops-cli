# Grafana dashboard ConfigMaps for the dashboard sidecar (k8s/monitoring/grafana-values.yaml),
# which loads every ConfigMap labelled grafana_dashboard.
# Applied through k8s/monitoring/kustomization.yaml: by Argo CD's `monitoring` Application on a
# cluster it manages, or by `kubectl apply -k k8s/monitoring` in `devops k8s deploy-stack
# --stack infra` without Argo CD. The root kustomization leaves it out so `base` does not own it
# as well.
#
# Names carry no content hash, so a re-apply updates each ConfigMap in place rather than leaving
# the old one behind for the sidecar to load twice. Each ConfigMap stays under kubectl's
# 262,144-byte last-applied annotation, which is why the dashboards are partitioned across
# focused ConfigMaps. All stack, Kubernetes view, CLI, and service dashboards are provisioned.
# The product dashboards of devops-cli (ConfigMap grafana-devops-cli-dashboards) have their own
# generator in k8s/devops/dashboards, which this kustomization lists, so this Application stays
# their owner (#5292).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - ../../devops/dashboards

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: devops-cli-stack

configMapGenerator:
  - name: grafana-k8s-global-dashboards
    files:
      - k8s-views-global.json
      - k8s-views-pods.json
  - name: grafana-k8s-node-dashboards
    files:
      - k8s-views-nodes.json
      - k8s-views-namespaces.json
  # The service dashboards that `make dashboards` builds from services.toml with the SRE template
  # (#5184). Do not edit them: change services.toml and run `make dashboards`.
  - name: grafana-service-dashboards
    files:
      - devops-roadmap-service.json
      - devops-sre-service.json
  - name: grafana-stack-dashboards
    files:
      - ingress-tunnel.json
      - llm-stack.json
      - otel-collector.json
      - prometheus-server.json
      - pyroscope.json
      - nvidia-dcgm.json
      - coredns.json
  # The upstream CloudNativePG dashboard (cloudnative-pg/grafana-dashboards, Apache-2.0) for each
  # CloudNativePG Cluster: llm-gateway-db and mattermost-db (#4994). It fills most of a ConfigMap.
  - name: grafana-database-dashboards
    files:
      - cloudnative-pg.json
