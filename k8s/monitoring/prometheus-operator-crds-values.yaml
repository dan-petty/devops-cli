# Prometheus Operator CRDs Helm values: the monitoring.coreos.com CRDs (#819).
# Chart: prometheus-community/prometheus-operator-crds
# Repo:  https://prometheus-community.github.io/helm-charts
#
# k8s-monitoring 4.x no longer bundles these CRDs and asks for this chart to be installed first
# (its UPGRADING.md, "Prometheus Operator Object CRDs removed"). argocd, argo-workflows, pyroscope,
# qdrant and k8s/llm/gateway/servicemonitor.yaml define ServiceMonitors, and Alloy's
# prometheusOperatorObjects feature watches ServiceMonitors, PodMonitors and Probes. Deleting a
# CRD deletes every object of its kind in the cluster, so teardown-stack never uninstalls this
# release.

crds:
  annotations:
    # Helm leaves the CRDs in place if the release is ever uninstalled by hand.
    helm.sh/resource-policy: keep
