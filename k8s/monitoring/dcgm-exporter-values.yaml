# NVIDIA DCGM exporter Helm values: utilisation, memory, power and temperature of every GPU (#546).
# Chart: nvidia-dcgm/dcgm-exporter
# Repo:  https://nvidia.github.io/dcgm-exporter/helm-charts
#
# DCGM supports Maxwell and newer GeForce and Quadro GPUs and Kepler and newer datacenter GPUs.
# Datacenter GPUs (such as Tesla PG500-216) require the SYS_ADMIN capability to access hardware
# performance counters without failing host engine checks. Which fields a card reports varies;
# the dashboards use device fields supported across cards.

image:
  tag: 4.6.1-4.8.4-distroless

# GPU nodes run containers with the NVIDIA runtime and are labelled by GPU feature discovery.
runtimeClassName: nvidia
nodeSelector:
  nvidia.com/gpu.present: "true"
tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

# Root reads the kubelet's pod-resources socket, which maps each GPU to the pod using it.
# SYS_ADMIN capability is required on datacenter GPUs for DCGM host engine hardware counter collection.
securityContext:
  runAsNonRoot: false
  runAsUser: 0
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
    add: ["SYS_ADMIN"]

arguments:
  - "-f"
  - "/etc/dcgm-exporter/dcp-metrics-included.csv"

rollingUpdate:
  maxUnavailable: "50%"

# k8s-monitoring's dcgm-exporter integration (k8s/monitoring/k8s-monitoring-values.yaml) scrapes
# the exporter, so the chart's own ServiceMonitor, on by chart default, stays off.
serviceMonitor:
  enabled: false
