# Grafana Pyroscope Helm values
# Chart: grafana/pyroscope
# Repo:  https://grafana.github.io/helm-charts
# https://github.com/grafana/pyroscope/tree/main/operations/pyroscope

pyroscope:
  replicaCount: 1
  # Override the chart's debug default (#1133) while keeping info-level startup and compaction lines.
  extraArgs:
    log.level: info

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1024Mi

  persistence:
    enabled: true
    storageClassName: local-path
    size: 5Gi

  service:
    type: ClusterIP
    port: 4040
    port_name: http2
    scheme: HTTP

architecture:
  microservices:
    enabled: false
  storage:
    v1: false
    v2: true

minio:
  enabled: false

# Profiling is collected by k8s-monitoring's alloy-profiles DaemonSet (#1134), not the bundled subchart.
alloy:
  enabled: false

serviceMonitor:
  enabled: true
  # The pyroscope and pyroscope-headless Services both match the selector, so each sample was
  # scraped twice and every sum counted it twice (#1955).
  relabelings:
    - sourceLabels: [__meta_kubernetes_service_name]
      regex: pyroscope-headless
      action: drop
