# Grafana Helm values
# Chart: grafana-community/grafana
# Repo:  https://grafana-community.github.io/helm-charts
# https://github.com/grafana-community/helm-charts/tree/main/charts/grafana

# Grafana keeps its data in SQLite on the `grafana` volume. A rolling update runs two pods on one
# database file, and SQLite can fail with `database is locked`, also during the unified-storage
# migration at the first start of Grafana 13. Recreate stops the old pod first (#1624).
deploymentStrategy:
  type: Recreate

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1024Mi

persistence:
  enabled: true
  storageClassName: local-path
  size: 5Gi
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false

initChownData:
  enabled: false

admin:
  existingSecret: grafana-admin

grafana.ini:
  security:
    allow_embedding: true
  auth.anonymous:
    enabled: true
    org_role: Viewer
  analytics:
    reporting_enabled: false
    check_for_updates: false
    check_for_plugin_updates: false
    feedback_links_enabled: false
  news:
    news_feed_enabled: false

# The Drilldown apps that Grafana preinstalls, each pinned at its release for Grafana 13: every
# 3.x release needs Grafana 13.1.0 or later. The chart sets `[plugins] preinstall_auto_update` to
# false, and Grafana auto-updates no plugin to a new major version, so an unpinned app stays at
# the version on the volume. The chart writes this list to `GF_PLUGINS_PREINSTALL_SYNC`, and at
# start Grafana installs each `<id>@<version>` that is not the installed version (#2022).
plugins:
  - grafana-lokiexplore-app@3.0.0
  - grafana-metricsdrilldown-app@3.0.0
  - grafana-pyroscope-app@3.0.0
  - grafana-exploretraces-app@3.0.0

datasources:
  datasources.yaml:
    apiVersion: 1
    # Grafana marks each datasource below as prunable, and at start deletes a prunable datasource
    # that this file no longer lists (#1624). A datasource removed before this setting is not
    # prunable, and the API refuses to delete a provisioned datasource, so deleteDatasources
    # deletes it at start. Grafana ignores a listed name that no longer exists (#2036).
    prune: true
    deleteDatasources:
      - name: Jaeger
        orgId: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local:9090
        access: proxy
        isDefault: true
        jsonData:
          # The scrape interval of k8s-monitoring (global.scrapeInterval). Grafana sets
          # $__rate_interval to at least four times it; with the 15s default a rate window held
          # one 60s sample, and every rate panel was empty (#1955).
          timeInterval: 60s
      - name: Loki
        type: loki
        uid: loki
        url: http://loki.logging.svc.cluster.local:3100
        access: proxy
        isDefault: false
        jsonData:
          maxLines: 1000
      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo.otel.svc.cluster.local:3200
        access: proxy
        isDefault: false
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            filterByTraceID: true
          tracesToProfiles:
            datasourceUid: pyroscope
          lokiSearch:
            datasourceUid: loki
      - name: Pyroscope
        type: grafana-pyroscope-datasource
        uid: pyroscope
        url: http://pyroscope.monitoring.svc.cluster.local:4040
        access: proxy
        isDefault: false
      # The prometheus chart's Alertmanager (#549): its alerts and silences in Grafana's Alerting.
      - name: Alertmanager
        type: alertmanager
        uid: alertmanager
        url: http://prometheus-alertmanager.monitoring.svc.cluster.local:9093
        access: proxy
        isDefault: false
        jsonData:
          implementation: prometheus
          handleGrafanaManagedAlerts: false

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    node-exporter-full:
      gnetId: 1860
      revision: 37
      datasource: Prometheus

rbac:
  # All dashboard ConfigMaps live in monitoring and the datasource sidecar is disabled, so a
  # namespaced Role replaces the chart's cluster-wide Secret/ConfigMap ClusterRole (#1133).
  namespaced: true

sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: ""
    searchNamespace: monitoring
    resource: configmap
  datasources:
    enabled: false
