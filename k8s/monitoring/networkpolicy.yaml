apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-default-perimeter
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 1. Allow intra-namespace pod communications (Prometheus, Grafana, node-exporter, kube-state-metrics)
    - from:
        - podSelector: {}
    # 2. Allow Traefik ingress to monitoring UIs and APIs. Traefik is the only way in from outside
    #    the cluster: cloudflared forwards the Access-gated tunnel to Traefik alone, and Traefik
    #    routes k8s/ingress/ingress-routes.yaml's monitoring hosts to these ports. No ipBlock:
    #    kube-router matches ingress CIDRs against pod addresses, so 0.0.0.0/0 or any private range
    #    here would admit every pod in the cluster. `kubectl port-forward` enters the pod's own
    #    network namespace and needs no rule. `configure-urls --addressing proxy` connects from the
    #    control-plane node's host network, which kube-router admits only to pods on that node
    #    (k8s/README.md, Port Forwarding & Automated Configuration).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 9100
        - protocol: TCP
          port: 9400
        - protocol: TCP
          port: 12345
        - protocol: TCP
          port: 4040
    # 3. Allow OpenTelemetry collector to push metrics (9090) and profiles (4040)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: otel
      ports:
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 4040
  egress:
    # 1. Allow intra-namespace pod communications
    - to:
        - podSelector: {}
    # 2. Allow CoreDNS lookups and metrics scraping in kube-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 9153
    # 3. Allow Kubernetes API server and kubelet metrics scraping
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 9100
        - protocol: TCP
          port: 10250
    # 4. Allow cross-namespace metrics scraping (LLM and OTel)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: llm
      ports:
        - protocol: TCP
          port: 6333
        - protocol: TCP
          port: 11434
        # vLLM servers and the LLM gateway (#546)
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 4000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: devops
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: otel
      ports:
        - protocol: TCP
          port: 8888
        - protocol: TCP
          port: 16686
    # 5. Allow egress to cloudflared namespace for Cloudflare Tunnel metrics scraping
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
      ports:
        - protocol: TCP
          port: 2000
    # 6. Allow egress to logging namespace for Loki log shipping
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: logging
      ports:
        - protocol: TCP
          port: 3100
    # 7. Outbound external egress (e.g. Grafana plugins/alerts) with cloud metadata SSRF strictly blocked
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
