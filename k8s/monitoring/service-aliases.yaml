apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alloy-metrics
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
    - name: http-metrics
      port: 12345
      targetPort: 12345
      protocol: TCP
