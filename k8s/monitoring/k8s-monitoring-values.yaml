# Grafana Kubernetes Monitoring Helm values
# Chart: grafana/k8s-monitoring
# Repo:  https://grafana.github.io/helm-charts
# https://github.com/grafana/k8s-monitoring-helm/tree/main/charts/k8s-monitoring

cluster:
  name: homelab-k3s

destinations:
  localPrometheus:
    type: prometheus
    url: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/write
  localLoki:
    type: loki
    url: http://loki.logging.svc.cluster.local:3100/loki/api/v1/push

# ── Self-Reporting ───────────────────────────────────────────────────────────
selfReporting:
  enabled: false

# ── Features ─────────────────────────────────────────────────────────────────
clusterMetrics:
  enabled: true
  collector: alloy-metrics
  cadvisor:
    metricsTuning:
      includeMetrics:
        - machine_cpu_cores
        - container_cpu_cfs_throttled_seconds_total
        - container_oom_events_total
        - container_network_receive_errors_total
        - container_network_transmit_errors_total
        - container_cpu_usage_seconds_total
        - container_memory_working_set_bytes
        - container_network_receive_packets_total
        - container_network_transmit_packets_total
        - container_network_receive_packets_dropped_total
        - container_network_transmit_packets_dropped_total
  kube-state-metrics:
    metricsTuning:
      includeMetrics:
        - kube_deployment_labels
        - kube_daemonset_labels
        - kube_statefulset_labels
        - kube_service_info
        - kube_ingress_info
        - kube_namespace_created
        - kube_namespace_labels
        - kube_networkpolicy_labels
        - kube_endpoint_info
        - kube_secret_info
        - kube_pod_container_status_running
        - kube_pod_status_qos_class
        - kube_pod_status_reason
        - kube_hpa_labels
        - kube_pod_container_status_ready
        - kube_pod_container_status_last_terminated_exitcode
        - kube_pod_container_status_terminated
        - kube_pod_container_status_waiting
        - kube_deployment_status_replicas_unavailable

hostMetrics:
  enabled: true
  collector: alloy-metrics
  linuxHosts:
    enabled: true
    metricsTuning:
      useIntegrationAllowList: false
      # Beyond the chart's default list, the series that explain a host failure (#1080): boot time
      # (an unclean restart), temperatures with their chip names, pressure stalls, memory errors
      # (EDAC), the NVMe disk, free filesystem space, and the host units' state. node-exporter runs
      # every collector these need by default except systemd, turned on under telemetryServices.
      includeMetrics:
        - node_time_seconds
        - node_boot_time_seconds
        - node_hwmon_temp_celsius
        - node_hwmon_chip_names
        - node_systemd_unit_state
        - node_pressure_.*
        - node_edac_correctable_errors_total
        - node_edac_uncorrectable_errors_total
        - node_nvme_info
        - node_filesystem_avail_bytes
        - node_filesystem_size_bytes

clusterEvents:
  enabled: true
  collector: alloy-singleton

podLogsViaLoki:
  enabled: true
  collector: alloy-logs

# Each node's journal, read from /var/log/journal by the same alloy-logs DaemonSet (#1080). Kept:
# kernel lines at every priority (GPU Xid, machine checks, thermal events); the host units, and
# systemd's own lines about them (start, stop, exit, restart), at info and above; every other line
# at warning and above. The units are the ones the systemd collector reports below. Lines carry
# job="integrations/kubernetes/journal", instance (the node), unit, transport and level, with the
# boot ID as structured metadata. Each unit may send 1 line/s after a burst of 10000, which covers a
# boot and the 8h the reader goes back after a restart; kernel lines have no unit and no limit.
nodeLogs:
  enabled: true
  collector: alloy-logs
  journalLabels:
    transport: transport
  structuredMetadata:
    boot_id: boot_id
  extraDiscoveryRules: |
    rule {
      source_labels = ["__journal__transport"]
      regex         = "kernel"
      target_label  = "__tmp_keep"
      replacement   = "true"
    }
    rule {
      source_labels = ["__journal_priority", "__journal__systemd_unit", "__journal_unit"]
      separator     = ";"
      regex         = "[0-6];(.*;)?(k3s|k3s-agent|nvidia-power-limit|containerd|systemd-journald)\\.service(;.*)?"
      target_label  = "__tmp_keep"
      replacement   = "true"
    }
    rule {
      source_labels = ["__journal_priority"]
      regex         = "[0-4]"
      target_label  = "__tmp_keep"
      replacement   = "true"
    }
    rule {
      source_labels = ["__tmp_keep"]
      regex         = "true"
      action        = "keep"
    }
  extraLogProcessingStages: |
    stage.limit {
      rate          = 1
      burst         = 10000
      by_label_name = "unit"
      drop          = true
    }

prometheusOperatorObjects:
  enabled: true
  collector: alloy-metrics

prometheusMetricsReceiver:
  enabled: true
  collector: alloy-metrics

# ── Telemetry Services ───────────────────────────────────────────────────────
telemetryServices:
  kube-state-metrics:
    deploy: true
    collectorsExtra:
      - endpoints
    metricLabelsAllowlist:
      - namespaces=[*]
      - daemonsets=[*]
      - deployments=[*]
      - statefulsets=[*]
      - horizontalpodautoscalers=[*]
      - networkpolicies=[*]
      - persistentvolumeclaims=[*]
      - pods=[*]
      - services=[*]
      - ingresses=[*]
      - nodes=[agentpool,alpha.eksctl.io/cluster-name,alpha.eksctl.io/nodegroup-name,beta.kubernetes.io/instance-type,cloud.google.com/gke-nodepool,cluster-name,ec2.amazonaws.com/Name,ec2.amazonaws.com/aws-autoscaling-groupName,ec2.amazonaws.com/aws-autoscaling-group-name,ec2.amazonaws.com/name,eks.amazonaws.com/nodegroup,k8s.io/cloud-provider-aws,karpenter.sh/nodepool,kubernetes.azure.com/cluster,kubernetes.io/arch,kubernetes.io/hostname,kubernetes.io/os,node.kubernetes.io/instance-type,topology.kubernetes.io/region,topology.kubernetes.io/zone]
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  node-exporter:
    deploy: true
    # Helm replaces a list, so the chart's filesystem exclusion is repeated here. The systemd
    # collector reports only the host units (#1080) and reaches the host's D-Bus socket through the
    # node root the chart already mounts at /host/root.
    extraArgs:
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs|tmpfs|ramfs)$
      - --collector.systemd
      - --collector.systemd.unit-include=(k3s|k3s-agent|nvidia-power-limit|containerd|systemd-journald)\.service
    env:
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/host/root/run/dbus/system_bus_socket
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ── Collectors ───────────────────────────────────────────────────────────────
collectors:
  alloy-metrics:
    presets:
      - clustered
      - statefulset
    alloy:
      enableReporting: false
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1024Mi
  alloy-singleton:
    alloy:
      enableReporting: false
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  alloy-logs:
    presets:
      - daemonset
      - filesystem-log-reader
    alloy:
      enableReporting: false
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi

# ── Extra Monitoring Objects ─────────────────────────────────────────────────
extraObjects:
  - apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: llm-gateway
      namespace: llm
      labels:
        app.kubernetes.io/name: llm-gateway
        app.kubernetes.io/part-of: devops-cli-stack
    spec:
      selector:
        matchLabels:
          app.kubernetes.io/name: llm-gateway
      endpoints:
        - port: http
          path: /metrics/
          interval: 15s
