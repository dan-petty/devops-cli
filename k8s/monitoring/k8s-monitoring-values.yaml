# Grafana Kubernetes Monitoring Helm values
# Chart: grafana/k8s-monitoring
# Repo:  https://grafana.github.io/helm-charts
# https://github.com/grafana/k8s-monitoring-helm/tree/main/charts/k8s-monitoring

cluster:
  name: homelab-k3s

destinations:
  localPrometheus:
    type: prometheus
    url: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/write
    # Dashboards and rules key on `cluster`; the chart default would also write `k8s_cluster_name`.
    clusterLabels:
      - cluster
  localLoki:
    type: loki
    url: http://loki.logging.svc.cluster.local:3100/loki/api/v1/push

# ── Self-Reporting ───────────────────────────────────────────────────────────
selfReporting:
  enabled: false

# ── Features ─────────────────────────────────────────────────────────────────
clusterMetrics:
  enabled: true
  collector: alloy-metrics
  cadvisor:
    metricsTuning:
      includeMetrics:
        - machine_cpu_cores
        - container_cpu_cfs_throttled_seconds_total
        - container_oom_events_total
        - container_network_receive_errors_total
        - container_network_transmit_errors_total
        - container_cpu_usage_seconds_total
        - container_memory_working_set_bytes
        - container_network_receive_packets_total
        - container_network_transmit_packets_total
        - container_network_receive_packets_dropped_total
        - container_network_transmit_packets_dropped_total
  kube-state-metrics:
    metricsTuning:
      includeMetrics:
        - kube_deployment_labels
        - kube_daemonset_labels
        - kube_statefulset_labels
        - kube_service_info
        - kube_ingress_info
        - kube_namespace_created
        - kube_namespace_labels
        - kube_networkpolicy_labels
        - kube_endpoint_info
        - kube_secret_info
        - kube_pod_container_status_running
        - kube_pod_status_qos_class
        - kube_pod_status_reason
        - kube_pod_container_status_ready
        - kube_pod_container_status_last_terminated_exitcode
        - kube_pod_container_status_terminated
        - kube_pod_container_status_waiting
        - kube_deployment_status_replicas_unavailable
  # CoreDNS (#1130), which the Prometheus server's service-endpoints job scraped before. The rule
  # keeps each CoreDNS pod's node as `node`, as that job set it, so the node-maintenance silence
  # and the NodeNotReady inhibition cover its TargetDown (k8s/README.md, Alerting). The other
  # Alloy jobs that took over the server's targets reuse it.
  kubeDNS:
    enabled: true
    extraDiscoveryRules: &node_rule |
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }

hostMetrics:
  enabled: true
  collector: alloy-metrics
  linuxHosts:
    enabled: true
    # No allow list: node-exporter's collector flags (telemetryServices.node-exporter.extraArgs)
    # decide what is collected, and Prometheus keeps every series it serves. With the default list,
    # the integration list and includeMetrics all empty, the chart renders no keep rule; its
    # ramfs/tmpfs filesystem drop stays. An allow list cannot follow a third-party dashboard (Node
    # Exporter Full), and each release that widened or narrowed it left different panels empty
    # (#1129). The series that explain a host failure (#1080) come through because node-exporter
    # serves them, with the systemd collector turned on under telemetryServices.
    metricsTuning:
      useDefaultAllowList: false
      useIntegrationAllowList: false

clusterEvents:
  enabled: true
  collector: alloy-singleton

podLogsViaLoki:
  enabled: true
  collector: alloy-logs

# Each node's journal, read from /var/log/journal by the same alloy-logs DaemonSet (#1080). Kept:
# kernel lines at every priority (GPU Xid, machine checks, thermal events); the host units, and
# systemd's own lines about them (start, stop, exit, restart), at info and above; every other line
# at warning and above. The units are the ones the systemd collector reports below. Lines carry
# job="integrations/kubernetes/journal", instance (the node), unit, transport and level, with the
# boot ID as structured metadata. Each unit may send 1 line/s after a burst of 10000, which covers a
# boot and the 8h the reader goes back after a restart; kernel lines have no unit and no limit.
nodeLogs:
  enabled: true
  collector: alloy-logs
  journalLabels:
    transport: transport
  structuredMetadata:
    boot_id: boot_id
  extraDiscoveryRules: |
    rule {
      source_labels = ["__journal__transport"]
      regex         = "kernel"
      target_label  = "__tmp_keep"
      replacement   = "true"
    }
    rule {
      source_labels = ["__journal_priority", "__journal__systemd_unit", "__journal_unit"]
      separator     = ";"
      regex         = "[0-6];(.*;)?(k3s|k3s-agent|nvidia-power-limit|containerd|systemd-journald)\\.service(;.*)?"
      target_label  = "__tmp_keep"
      replacement   = "true"
    }
    rule {
      source_labels = ["__journal_priority"]
      regex         = "[0-4]"
      target_label  = "__tmp_keep"
      replacement   = "true"
    }
    rule {
      source_labels = ["__tmp_keep"]
      regex         = "true"
      action        = "keep"
    }
  extraLogProcessingStages: |
    stage.limit {
      rate          = 1
      burst         = 10000
      by_label_name = "unit"
      drop          = true
    }

prometheusOperatorObjects:
  enabled: true
  collector: alloy-metrics

prometheusMetricsReceiver:
  enabled: true
  collector: alloy-metrics

# Pods annotated for scraping (#1130): cloudflared, Traefik, Alertmanager and roadmap-service,
# found through the `prometheus.io/*` keys they already carry. The job is the pod's
# app.kubernetes.io/name. `otel` is left to the Prometheus server, which scrapes the collector
# so its export failures stay visible when Alloy is what fails. The only annotated Service is
# kube-dns, which clusterMetrics.kubeDNS scrapes, so Service discovery stays off. No annotated
# target needs the ServiceAccount token, which must not go to every annotated pod over plain
# HTTP, so it is not sent.
annotationAutodiscovery:
  enabled: true
  collector: alloy-metrics
  annotations:
    scrape: prometheus.io/scrape
    metricsPortNumber: prometheus.io/port
    metricsPath: prometheus.io/path
  excludeNamespaces:
    - otel
  services:
    enabled: false
  bearerToken:
    enabled: false
  extraDiscoveryRules: *node_rule

# Service integrations (#1130), each a plain list of instances.
integrations:
  collector: alloy-metrics
  # Loki's own metrics, within the integration's default allow list, wherever the logging stack
  # runs; the component selector leaves out the Loki canary pods. Metrics only: Loki's own pod
  # logs stay as podLogsViaLoki ships them, without the integration's log processing.
  loki:
    instances:
      - name: loki
        labelSelectors:
          app.kubernetes.io/name: loki
          app.kubernetes.io/component: single-binary
        logs:
          enabled: false
  # The DCGM exporter on every GPU node. Its series carry the GPU's node as `node`, which the GPU
  # rules group by, and as `instance`, which dashboard 12239 lists.
  dcgm-exporter:
    instances:
      - name: dcgm-exporter
        labelSelectors:
          app.kubernetes.io/name: dcgm-exporter
        metrics:
          scrapeInterval: 15s
        extraDiscoveryRules: |
          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            target_label  = "node"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            target_label  = "instance"
          }

# ── Telemetry Services ───────────────────────────────────────────────────────
telemetryServices:
  kube-state-metrics:
    deploy: true
    collectorsExtra:
      - endpoints
    metricLabelsAllowlist:
      - namespaces=[*]
      - daemonsets=[*]
      - deployments=[*]
      - statefulsets=[*]
      - horizontalpodautoscalers=[*]
      - networkpolicies=[*]
      - persistentvolumeclaims=[*]
      - pods=[*]
      - services=[*]
      - ingresses=[*]
      - nodes=[agentpool,alpha.eksctl.io/cluster-name,alpha.eksctl.io/nodegroup-name,beta.kubernetes.io/instance-type,cloud.google.com/gke-nodepool,cluster-name,ec2.amazonaws.com/Name,ec2.amazonaws.com/aws-autoscaling-groupName,ec2.amazonaws.com/aws-autoscaling-group-name,ec2.amazonaws.com/name,eks.amazonaws.com/nodegroup,k8s.io/cloud-provider-aws,karpenter.sh/nodepool,kubernetes.azure.com/cluster,kubernetes.io/arch,kubernetes.io/hostname,kubernetes.io/os,node.kubernetes.io/instance-type,topology.kubernetes.io/region,topology.kubernetes.io/zone]
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  node-exporter:
    deploy: true
    # Helm replaces a list, so the chart's filesystem exclusion is repeated here. The systemd
    # collector reports only the host units (#1080) and reaches the host's D-Bus socket through the
    # node root the chart already mounts at /host/root.
    extraArgs:
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs|tmpfs|ramfs)$
      - --collector.systemd
      - --collector.systemd.unit-include=(k3s|k3s-agent|nvidia-power-limit|containerd|systemd-journald)\.service
    env:
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/host/root/run/dbus/system_bus_socket
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ── Collectors ───────────────────────────────────────────────────────────────
collectors:
  alloy-metrics:
    presets:
      - clustered
      - statefulset
    alloy:
      enableReporting: false
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1024Mi
  alloy-singleton:
    # clusterEvents runs unclustered, so exactly one pod watches and ships the events.
    presets:
      - singleton
    alloy:
      enableReporting: false
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  alloy-logs:
    presets:
      - daemonset
      - filesystem-log-reader
    alloy:
      enableReporting: false
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi

# ── Extra Monitoring Objects ─────────────────────────────────────────────────
extraObjects:
  - apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: llm-gateway
      namespace: llm
      labels:
        app.kubernetes.io/name: llm-gateway
        app.kubernetes.io/part-of: devops-cli-stack
    spec:
      selector:
        matchLabels:
          app.kubernetes.io/name: llm-gateway
      endpoints:
        - port: http
          path: /metrics/
          interval: 15s
