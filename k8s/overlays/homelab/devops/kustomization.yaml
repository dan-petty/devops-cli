apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../devops

patches:
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: roadmap-service
        namespace: devops
      spec:
        rules:
          - host: hooks.retric.click
            http:
              paths:
                - path: /webhooks/github
                  pathType: Prefix
                  backend:
                    service:
                      name: roadmap-service
                      port:
                        number: 8000
