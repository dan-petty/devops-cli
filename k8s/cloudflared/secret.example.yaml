# Secret template for Cloudflare Tunnel Token.
# NEVER commit the real tunnel token into version control.
# Create the secret imperatively in your cluster via:
#   kubectl create secret generic cloudflared-token \
#     --from-literal=token="<your-cloudflare-tunnel-token>" \
#     -n cloudflared
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-token
  namespace: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/component: tunnel
    app.kubernetes.io/part-of: devops-cli-stack
type: Opaque
stringData:
  token: "<your-cloudflare-tunnel-token>"
