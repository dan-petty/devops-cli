apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflared
  namespace: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/component: tunnel
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  # A drain evicts a tunnel connector only while another one is available, so external ingress
  # stays up. A pod that is not ready serves no traffic, so it never blocks a drain.
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
