apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudflared-isolation
  namespace: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/component: tunnel
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Prometheus metrics scraping on port 2000 strictly from monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 2000
  egress:
    # Allow DNS queries
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow outbound HTTPS to Cloudflare Edge
    - ports:
        - protocol: TCP
          port: 443
    # Allow outbound tunnel traffic to Cloudflare Edge (QUIC UDP 7844 and TCP 7844 fallback)
    - ports:
        - protocol: UDP
          port: 7844
        - protocol: TCP
          port: 7844
    # Allow the tunnel's k8s.<domain> TCP route to reach the API server. The `kubernetes`
    # Service resolves to the node's address on 6443, which no namespace selector matches, so
    # the peer is an ipBlock with the cloud metadata address excluded, as Argo CD's is.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 6443
    # Allow forwarding traffic exclusively to Traefik in kube-system.
    # NOTE: no `ports:` restriction here — this cluster's kube-router NetworkPolicy
    # engine fails to enforce (as "allow") egress rules that combine a peer
    # selector (`to:`) with a `ports:` restriction in the same rule, silently
    # rejecting matching traffic. The `to:` selector alone still tightly scopes
    # this rule to the Traefik pod specifically.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
