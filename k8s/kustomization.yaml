apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespaces.yaml
  - cloudflared
  - registry
  # No chart creates these Services: Alloy writes to and Grafana queries `prometheus`, and
  # `devops k8s port-forward` targets the kube-prometheus names (#912, #818).
  - monitoring/service-aliases.yaml
  - monitoring/dashboards
