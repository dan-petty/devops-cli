apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rules
  namespace: logging
  labels:
    app.kubernetes.io/part-of: devops-cli-stack
data:
  ollama-evictions.yaml: |
    groups:
      - name: ollama-tier-evictions
        rules:
          - alert: OllamaTierEvictions
            expr: sum(count_over_time({service_name="ollama-48gib"} |= "model predicted to exceed available memory, evicting" [1h])) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              description: The ollama-48gib tier evicted a model, losing its KV cache.
