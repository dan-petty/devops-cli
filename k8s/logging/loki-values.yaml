# Loki Helm values, SingleBinary mode. Argo CD's Application `loki` installs them on the k3s
# homelab, and `devops k8s deploy-stack --stack logging` installs them on either cluster.
# Chart: grafana-community/loki
# Repo:  https://grafana-community.github.io/helm-charts

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  analytics:
    reporting_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  # Logs are kept 30 days (#550). Only the compactor applies retention_period, and only with
  # retention_enabled; without it Loki kept every chunk whatever its age.
  compactor:
    retention_enabled: true
    # Loki 3 refuses to start with retention on and no delete-request store.
    delete_request_store: filesystem

  limits_config:
    retention_period: 720h # 30 days
    # The delete-request store opens the log delete API, which needs no credentials while
    # auth_enabled is false. Retention does not use it, so it stays closed.
    # Note (#1133, checked again for #1632): in Loki 3.7.9 (grafana-community/loki chart 20.0.2
    # appVersion), initQuerier attaches CacheGenNumberHeaderSetterMiddleware whenever store=tsdb
    # and compactor.retention_enabled=true (pkg/loki/modules.go:613, 726), and
    # initCacheGenerationLoader passes an unwrapped gRPC client to NewGenNumberLoader
    # (pkg/loki/modules.go:1212-1239) instead of NewPerTenantDeleteRequestsClient.
    # Every query therefore calls /grpc.Compactor/GetCacheGenNumbers, which checks validDeletionLimit
    # and logs "deletion is not available for this tenant" when deletion_mode is disabled
    # (pkg/compactor/generationnumber/gennumber_loader.go:106-126,
    # pkg/compactor/deletion/grpc_request_handler.go:72-94; upstream grafana/loki#8468,
    # grafana/loki#9855). No Loki 3.7.9 config setting disables the lookup while keeping both
    # retention_enabled: true and deletion_mode: disabled.
    deletion_mode: disabled
    max_query_length: 720h
    max_query_parallelism: 4
    reject_old_samples: true
    reject_old_samples_max_age: 720h

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 2048Mi
  # Sized for 30 days (measured 2026-10-03): pod logs arrived at 0.5-1.3 GB a day from
  # 2026-09-30 on, 1.3 GB on the busiest day (2026-10-02 UTC), and are stored at about 11:1
  # (8.7 GB of logs fill 0.79 GB of chunks). The host journals #1080 adds are an estimate from
  # journal file growth (about 0.04 GB a day), budgeted here at 0.2 GB a day. 30 days need
  # about 4.5 GB, and about 9.4 GB at a pessimistic 5:1 with every day as busy as the busiest.
  # 20Gi holds that twice over and leaves room for more nodes.
  # local-path does not expand a claim in place, so a change to this size needs the
  # StatefulSet recreated and the volume rebound (#550): set the volume's reclaim policy to
  # Retain and its capacity to the new size, delete the StatefulSet with --cascade=orphan,
  # delete pod loki-0 and claim storage-loki-0, remove claimRef.uid and
  # claimRef.resourceVersion from the volume, deploy Loki again, and then set the reclaim
  # policy back to Delete.
  persistence:
    enabled: true
    size: 20Gi
    enableStatefulSetAutoDeletePVC: false

# Pipeline liveness comes from Alloy's loki_write_sent_entries_total series (#1131, #890),
# not the chart's internal canary DaemonSet (#1133).
lokiCanary:
  enabled: false

test:
  enabled: false

gateway:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false

# Disable rule sidecar container in dev-mode SingleBinary cluster to eliminate k8s API watch crashloop
sidecar:
  rules:
    enabled: false

# With the rules sidecar off, no Loki pod calls the Kubernetes API, so none mounts a ServiceAccount
# token (#1652). Chart 20.0.2 sets the field on each Loki pod from `defaults`, and the pod field
# wins over the field of the ServiceAccount. The `serviceAccount` value covers a pod that sets no
# field. The canary and the gateway have values of their own, which are false by default.
defaults:
  automountServiceAccountToken: false

serviceAccount:
  automountServiceAccountToken: false

# Zero out scalable targets to satisfy SingleBinary deploymentMode validation
read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0
