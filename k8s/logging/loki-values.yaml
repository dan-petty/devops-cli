# Loki Helm values — minimal dev-mode for workstation Minikube cluster.
# Chart: grafana/loki
# Repo:  https://grafana.github.io/helm-charts

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  analytics:
    reporting_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  limits_config:
    retention_period: 720h # 30 days
    max_query_length: 720h
    max_query_parallelism: 4
    reject_old_samples: true
    reject_old_samples_max_age: 720h

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 2048Mi
  persistence:
    enabled: true
    size: 2Gi

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false

test:
  enabled: false

gateway:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false

# Disable rule sidecar container in dev-mode SingleBinary cluster to eliminate k8s API watch crashloop
sidecar:
  rules:
    enabled: false

# Zero out scalable targets to satisfy SingleBinary deploymentMode validation
read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0
