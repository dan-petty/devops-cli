# Loki Helm values — minimal dev-mode for workstation Minikube cluster.
# Chart: grafana/loki
# Repo:  https://grafana.github.io/helm-charts

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  analytics:
    reporting_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  # Logs are kept 30 days (#550). Only the compactor applies retention_period, and only with
  # retention_enabled; without it Loki kept every chunk whatever its age.
  compactor:
    retention_enabled: true
    # Loki 3 refuses to start with retention on and no delete-request store.
    delete_request_store: filesystem

  limits_config:
    retention_period: 720h # 30 days
    # The delete-request store opens the log delete API, which needs no credentials while
    # auth_enabled is false. Retention does not use it, so it stays closed.
    deletion_mode: disabled
    max_query_length: 720h
    max_query_parallelism: 4
    reject_old_samples: true
    reject_old_samples_max_age: 720h

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 2048Mi
  # Sized for 30 days (measured 2026-10-03): pod logs arrived at 0.5-1.3 GB a day from
  # 2026-09-30 on, 1.3 GB on the busiest day (2026-10-02 UTC), and are stored at about 11:1
  # (8.7 GB of logs fill 0.79 GB of chunks). The host journals #1080 adds are an estimate from
  # journal file growth (about 0.04 GB a day), budgeted here at 0.2 GB a day. 30 days need
  # about 4.5 GB, and about 9.4 GB at a pessimistic 5:1 with every day as busy as the busiest.
  # 20Gi holds that twice over and leaves room for more nodes.
  # local-path does not expand a claim in place, so a change to this size needs the
  # StatefulSet recreated and the volume rebound, as
  # docs/agent/tasks/task-550-metrics-and-logs-are-kept-for-two-hours.md describes.
  persistence:
    enabled: true
    size: 20Gi

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false

test:
  enabled: false

gateway:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false

# Disable rule sidecar container in dev-mode SingleBinary cluster to eliminate k8s API watch crashloop
sidecar:
  rules:
    enabled: false

# Zero out scalable targets to satisfy SingleBinary deploymentMode validation
read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0
