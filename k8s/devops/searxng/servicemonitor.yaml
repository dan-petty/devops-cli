apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: searxng
  namespace: devops
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      basicAuth:
        username:
          name: searxng-metrics-auth
          key: username
        password:
          name: searxng-metrics-auth
          key: password
