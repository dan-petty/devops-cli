# The roadmap Service calls SearXNG on TCP 8080 (#3924). This policy adds to
# `devops-default-perimeter`, which gives the Service pod no such port. No policy gives a Job pod
# (`devops-cli-job`) this port, so a Job cannot call the search service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: searxng-clients
  namespace: devops
  labels:
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: roadmap-service
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: searxng
      ports:
        - protocol: TCP
          port: 8080
