# The settings of SearXNG (#3924). The image reads this file as /etc/searxng/settings.yml. It holds
# no secret: the server secret reaches the pod as SEARXNG_SECRET, which SearXNG reads before the
# file. The file keeps only the engines that need no key. The scraping engines of Google, Bing,
# Brave, Startpage, Mojeek and Qwant were suspended by their upstream sites in October 2026
# (SearXNG issues 6866 and 6819), and the keyed Brave engine is not used, so none of them is kept.
# The pod logs two lines at start, and both are harmless:
# - ERROR "X-Forwarded-For nor X-Real-IP header is set!" comes from `log_error_only_once` in
#   searx/botdetection/trusted_proxies.py. It shows once, because the roadmap Service sends no proxy
#   header, and `server.limiter: false` means that no code uses the client address.
# - WARNING "missing config file: /etc/searxng/limiter.toml" comes from `Config.from_toml` in
#   searx/botdetection/config.py. `limiter.initialize` reads the config even with the limiter off,
#   and a missing file leaves the defaults. No limiter.toml is mounted.
# `request_timeout` stays at 5.0: the live measure of 2026-11-07 showed no timeout of duckduckgo in
# 20 queries, and the 95th percentile of the successful requests is 4.7 s or less for every engine.
# `pypi` is not kept: pypi.org serves a Client Challenge page to a scraper, and the engine returned
# no hit in the live check.
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: devops
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/part-of: devops-cli-stack
data:
  settings.yml: |
    use_default_settings:
      engines:
        # Every name is the `name` of an engine in the default settings.yml of the pinned image.
        keep_only:
          - duckduckgo
          - wikipedia
          - github
          - stackoverflow
          - askubuntu
          - superuser
          - arxiv
          - mdn
          - docker hub
    server:
      # The limiter needs Valkey and refuses a plain machine client. The NetworkPolicy
      # `searxng-perimeter` is the access control: only roadmap-service reaches the pod.
      limiter: false
      public_instance: false
      image_proxy: false
    search:
      # The roadmap Service reads the reply as JSON.
      formats:
        - html
        - json
      autocomplete: ""
      default_lang: en
    outgoing:
      request_timeout: 5.0
      # The suffix names the project and holds no e-mail address.
      useragent_suffix: https://github.com/dan-petty/devops-cli
