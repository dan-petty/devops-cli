# SearXNG searches the web for the roadmap Service and returns JSON (#3924). Upstream ships no
# Helm chart and no Kubernetes manifest, only a compose file, so this file follows that file:
# the image runs as user 977, reads /etc/searxng/settings.yml, and writes under /var/cache/searxng.
# The image is a pin: Renovate bumps the tag and the digest together. Follow the bump steps in
# docs/CLUSTER.md ("SearXNG") before you merge a bump. The image is used as it is, with no patch.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: devops
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  replicas: 1
  # The new pod gets ready before the old pod stops (RL1, docs/SERVICE_PATTERNS.md). For 3
  # replicas or fewer, these are the default values of Kubernetes.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
        app.kubernetes.io/part-of: devops-cli-stack
    spec:
      # The pod calls no Kubernetes API, so it mounts no token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The ID of user `searxng` in the image. A name cannot be checked against runAsNonRoot.
        runAsUser: 977
        runAsGroup: 977
        fsGroup: 977
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # `general.open_metrics` reads no environment variable, so the settings file is written at
        # pod start from the ConfigMap and the metrics password (#4201). The init container runs the
        # pinned image of the `searxng` container, which holds `sh` and `sed`, so it adds no pin.
        # The metrics are an optional feature, so the reference to the Secret is optional (#6805).
        # With no password, the script writes `''`: SearXNG then turns `/metrics` off, and search
        # works. The `k8s` row of `devops ci` runs this script (tests/gate/k8s_checks/searxng_render.py).
        - name: render-settings
          image: docker.io/searxng/searxng:2026.11.26-b5605b8f2@sha256:462d8dbeadd7c7c304be08d47084f5caba70f47a9145a01fd25990a7944e61b7
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          # `&`, `\` and `|` are special in a sed replacement, so the password is escaped first.
          args:
            - |
              set -eu
              if [ -z "${SEARXNG_METRICS_PASSWORD:-}" ]; then
                echo "render-settings: Secret devops/searxng-metrics-auth has no password, so the OpenMetrics endpoint /metrics is off" >&2
                escaped="''"
              else
                escaped=$(printf '%s' "$SEARXNG_METRICS_PASSWORD" | sed 's/[\\&|]/\\&/g')
              fi
              sed "s|\${SEARXNG_METRICS_PASSWORD}|$escaped|g" \
                /etc/searxng-template/settings.yml > /etc/searxng-rendered/settings.yml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: SEARXNG_METRICS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: searxng-metrics-auth
                  key: password
                  optional: true
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng-template
              readOnly: true
            - name: settings-rendered
              mountPath: /etc/searxng-rendered
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
      containers:
        - name: searxng
          image: docker.io/searxng/searxng:2026.11.26-b5605b8f2@sha256:462d8dbeadd7c7c304be08d47084f5caba70f47a9145a01fd25990a7944e61b7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # SearXNG reads this variable before the secret_key of settings.yml, so the file holds
            # no secret. It refuses to start with the key `ultrasecretkey`.
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng
                  key: SEARXNG_SECRET
            # An IPv4 bind. The default `::` takes IPv4 only when the node allows it.
            - name: GRANIAN_HOST
              value: 0.0.0.0
            # Granian replaces a worker whose memory passes this value (MiB). The worker grows
            # about 50 MiB a day and is never replaced otherwise, so it reached the old limit (#4939).
            - name: GRANIAN_WORKERS_MAX_RSS
              value: "512"
          volumeMounts:
            # One file, so that /etc/searxng stays the directory of the image, which user 977 owns.
            # A mount of the whole directory is owned by root, and the entrypoint warns of it.
            - name: settings-rendered
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/searxng
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          # A search takes the 4 worker threads for up to the engine timeout, so the probe waits
          # long and fails three times before it restarts the pod.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          # Measured with the pinned image under these controls: 20 queries one after another
          # peaked at 117 MiB, and 10 at once at 122 MiB and 0.8 CPU. The limit holds the main
          # process, the resource tracker and a worker at GRANIAN_WORKERS_MAX_RSS, with room for
          # the new worker while Granian replaces it (docs/CLUSTER.md, "SearXNG").
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 256Mi
      volumes:
        # The ConfigMap reaches the pod through the `render-settings` init container, which writes
        # the rendered file into this volume.
        - name: settings
          configMap:
            name: searxng-settings
        - name: settings-rendered
          emptyDir:
            sizeLimit: 8Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: cache
          emptyDir:
            sizeLimit: 128Mi
