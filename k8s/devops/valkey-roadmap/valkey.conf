# The settings of valkey-roadmap, the store of the shared state of the roadmap jobs (ADR 0021
# section 3). They replace the cache settings of the base. Valkey writes each change to the
# append-only file in /data, on the claim of valkey-persistence, and syncs the file each second.
# At maxmemory it refuses a write and evicts no key. The file has no requirepass line and no bind
# line: the aclfile of the Secret valkey-roadmap-auth defines each user.
port 6379
dir /data
save ""
appendonly yes
appendfsync everysec
# Half of the 256Mi memory limit of the container: a fork that rewrites the append-only file needs
# memory for the pages that change.
maxmemory 128mb
maxmemory-policy noeviction
