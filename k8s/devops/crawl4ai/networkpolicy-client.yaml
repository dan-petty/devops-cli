# The roadmap Service calls Crawl4AI on TCP 11235 (#3884). This policy adds to
# `devops-default-perimeter`, which gives the Service pod no such port. No policy gives a Job pod
# (`devops-cli-job`) this port, so a Job cannot call the fetch service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: roadmap-service-to-crawl4ai
  namespace: devops
  labels:
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: roadmap-service
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: crawl4ai
      ports:
        - protocol: TCP
          port: 11235
