# Traefik limits the requests to the webhook route of the roadmap Service (#2476). The Ingress
# roadmap-service names this Middleware as devops-roadmap-service-rate-limit@kubernetescrd.
# Each request comes in through the Cloudflare tunnel, so its remote address is a cloudflared
# pod: one bucket for the request host bounds what gets to the Service. Traefik answers a request
# above the limit with HTTP 429. The next poll of the Service starts the round that a refused
# delivery would have started (k8s/README.md, Roadmap service, Webhook route).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: roadmap-service-rate-limit
  namespace: devops
  labels:
    app.kubernetes.io/name: roadmap-service
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  rateLimit:
    average: 60
    period: 1m
    burst: 60
    sourceCriterion:
      requestHost: true
