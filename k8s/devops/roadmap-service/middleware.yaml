# Traefik limits the requests to the webhook route of the roadmap Service (#2476). The Ingress
# roadmap-service names this Middleware as devops-roadmap-service-rate-limit@kubernetescrd.
# Traefik keeps one bucket for each client, keyed on the header Cf-Connecting-Ip (#5035). The
# Cloudflare edge sets that header to the address of the client that connects to it, and it
# overwrites a value that the client sends. Each request comes in through the Cloudflare tunnel,
# so its remote address is a cloudflared pod and its host is the same for each sender: a key on
# either one puts all senders in one bucket, and another sender could use up the bucket of
# GitHub's deliveries. Only the tunnel reaches Traefik from outside the cluster (its Service is
# ClusterIP). A pod of the cluster can set the header, but the HMAC check of the route still
# refuses its deliveries. Traefik answers a request above the limit with HTTP 429. The next poll
# of the Service starts the round that a refused delivery would have started (docs/CLUSTER.md,
# Roadmap service, Webhook route).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: roadmap-service-rate-limit
  namespace: devops
  labels:
    app.kubernetes.io/name: roadmap-service
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  rateLimit:
    average: 60
    period: 1m
    burst: 60
    sourceCriterion:
      requestHeaderName: Cf-Connecting-Ip
