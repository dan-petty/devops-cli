# The account of the roadmap Service pod. The Service creates the implement Job through the
# Kubernetes API (#2667), so it needs a token. The account mounts none by itself: the Deployment
# projects one that expires in an hour. Cluster Jobs run as `devops-cli`, which has no token and
# no Role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: roadmap-service
  namespace: devops
  labels:
    app.kubernetes.io/name: roadmap-service
    app.kubernetes.io/part-of: devops-cli-stack
automountServiceAccountToken: false
