apiVersion: apps/v1
kind: Deployment
metadata:
  name: roadmap-service
  namespace: devops
  labels:
    app.kubernetes.io/name: roadmap-service
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  # Held at 0: the Service acts as a GitHub App (ADR 0015), which cannot reach the
  # project board of a personal account. Do not raise it until a separate item moves
  # the roadmap state to labels and milestones.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: roadmap-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: roadmap-service
        app.kubernetes.io/part-of: devops-cli-stack
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      terminationGracePeriodSeconds: 150
      # local-path binds the volume on the node where the pod first runs, and the root disk of the
      # control-plane node has the least free space (#1634; k8s/README.md, Local-Path Volume Placement).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      serviceAccountName: devops-cli
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service
          image: ghcr.io/dan-petty/devops-cli/service
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --service
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --workers
            - "1"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: devops-cli
          env:
            - name: DEVOPS_CLI_CONFIG
              value: /config/devops-cli.yaml
            - name: DEVOPS_CLI_DATA_DIR
              value: /home/devops/.data
            - name: OTEL_SERVICE_NAME
              value: roadmap-service
            # Prometheus names the series by service.instance.id (`instance`). It defaults to
            # the host name, which is the pod name and changes at each restart. One replica
            # and the Recreate strategy mean one pod sends at a time, so all pods share one id.
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.instance.id=roadmap-service
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/devops
            - name: config
              mountPath: /config
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          persistentVolumeClaim:
            claimName: roadmap-service-home
        - name: config
          configMap:
            name: devops-cli-config
