apiVersion: apps/v1
kind: Deployment
metadata:
  name: roadmap-service
  namespace: devops
  labels:
    app.kubernetes.io/name: roadmap-service
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  # One pod. The Service acts as GitHub App devops-cli-service (ADR 0015) on each repository
  # in service.repos. Argo CD self-heals this value, so a scale by hand does not stay. To stop
  # the Service, do the stop switch in docs/CLUSTER.md, "Roadmap service".
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: roadmap-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: roadmap-service
        app.kubernetes.io/part-of: devops-cli-stack
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      # CONST_SERVICE_STOP_GRACE_SECONDS: the drain wait (600 s) and the cut wait (30 s) of the
      # stop of the Service, and 30 s for the exit (#4485). uvicorn starts the drain on SIGTERM,
      # so the pod has no preStop hook: one would use the same grace period first.
      terminationGracePeriodSeconds: 660
      # local-path binds the volume on the node where the pod first runs, and the root disk of the
      # control-plane node has the least free space (#1634; k8s/README.md, Local-Path Volume Placement).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      # The account of the Service, with a Role for the implement Job (#2667). The token comes
      # from the projected volume `kube-api-access` below, which expires in an hour.
      serviceAccountName: roadmap-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service
          image: ghcr.io/dan-petty/devops-cli/service
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --service
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --workers
            - "1"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: devops-cli
          env:
            - name: DEVOPS_CLI_CONFIG
              value: /config/devops-cli.yaml
            - name: DEVOPS_CLI_DATA_DIR
              value: /home/devops/.data
            - name: OTEL_SERVICE_NAME
              value: roadmap-service
            # Prometheus names the series by service.instance.id (`instance`). It defaults to
            # the host name, which is the pod name and changes at each restart. One replica
            # and the Recreate strategy mean one pod sends at a time, so all pods share one id.
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.instance.id=roadmap-service
            # The spans and the log records name the cluster (`k8s.cluster.name`) and the
            # namespace (`k8s.namespace.name`) from these two values. The cluster name is the
            # name in k8s/monitoring/k8s-monitoring-values.yaml; without it, they name minikube.
            - name: K8S_CONTEXT
              value: homelab-k3s
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DO_NOT_TRACK
              value: "1"
            - name: OPENSPEC_TELEMETRY
              value: "0"
            - name: OPENSPEC_NO_UPDATE_CHECK
              value: "1"
            - name: PYDANTIC_AI_NO_BANNER
              value: "1"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/devops
            - name: config
              mountPath: /config
              readOnly: true
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          # The memory limit is a stopgap (#4149). The working set grows 100 to
          # 150 MiB each hour from about 460 MiB, so 1Gi killed the pod after
          # about 4 hours. #4116 holds the analysis of the leak. #4125 is the
          # open 6-hour flat check. Revisit the limit when the working set is flat.
          # The CPU limit is 2: the container reached 1.00 core at a limit of 1 (#4991). The event
          # loop uses one core, so the raise is for the bursts of subprocesses and native threads.
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 3Gi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          persistentVolumeClaim:
            claimName: roadmap-service-home
        - name: config
          configMap:
            name: devops-cli-config
        # A token for the Kubernetes API, which the kubelet renews, and the cluster CA. The
        # client reads the token file again each minute.
        - name: kube-api-access
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
