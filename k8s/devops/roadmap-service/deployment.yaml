apiVersion: apps/v1
kind: Deployment
metadata:
  name: roadmap-service
  namespace: devops
  labels:
    app.kubernetes.io/name: roadmap-service
    app.kubernetes.io/part-of: devops-cli-stack
  annotations:
    ignore-check.kube-linter.io/latest-tag: >-
      Argo CD Image Updater sets the digest of the image in Application devops
      (argocd/image-updater-values.yaml of dan-petty/homelab, #6068).
spec:
  # One replica. The Service acts as GitHub App devops-cli-service (ADR 0015) on each repository
  # in service.repos. Argo CD self-heals this value, so a scale by hand does not stay. To stop
  # the Service, do the stop switch in docs/CLUSTER.md, "Roadmap service".
  replicas: 1
  # A surge release (#6107): the new pod starts beside the old pod and gets the webhooks when
  # /readyz passes, and only then does the old pod get SIGTERM. The PV of the home volume binds to
  # one node, so the scheduler puts the new pod on that node, and ReadWriteOnce lets the two pods
  # of that node mount the claim. Only the pod that holds the Lease roadmap-service-rows runs the
  # rows, so the new pod waits for the Lease while the old pod drains (#6058; docs/CLUSTER.md,
  # "Roadmap service").
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: roadmap-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: roadmap-service
        app.kubernetes.io/part-of: devops-cli-stack
        # The policy valkey-ingress-roadmap admits only a pod with this label to valkey-roadmap
        # (#4676; docs/CLUSTER.md, valkey-roadmap).
        valkey-client: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      # CONST_SERVICE_STOP_GRACE_SECONDS: the preStop sleep (10 s), the drain wait (600 s) and the
      # cut wait (30 s) of the stop of the Service (#4485), the call that gives back the Lease
      # (5 s), and 15 s for the exit (#6058).
      terminationGracePeriodSeconds: 660
      # local-path binds the volume on the node where the pod first runs, and the root disk of the
      # control-plane node has the least free space (#1634; k8s/README.md, Local-Path Volume Placement).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      # The account of the Service, with a Role for the implement Job (#2667). The token comes
      # from the projected volume `kube-api-access` below, which expires in an hour.
      serviceAccountName: roadmap-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service
          image: ghcr.io/dan-petty/devops-cli/service
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --service
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --workers
            - "1"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # The Service mints its own LiteLLM virtual key, with a budget and a requests-per-minute
            # limit, so it never holds the gateway master key (#3685). A person creates this Secret
            # from the key; k8s/README.md gives the step.
            - name: DEVOPS_CLI_AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: roadmap-service-llm-key
                  key: api-key
            - name: DEVOPS_CLI_SERVICE_GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: devops-cli
                  key: DEVOPS_CLI_SERVICE_GITHUB_APP_PRIVATE_KEY
            - name: DEVOPS_CLI_SERVICE_WEBHOOK_SECRETS
              valueFrom:
                secretKeyRef:
                  name: devops-cli
                  key: DEVOPS_CLI_SERVICE_WEBHOOK_SECRETS
            - name: DEVOPS_CLI_FIRECRAWL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devops-cli
                  key: DEVOPS_CLI_FIRECRAWL_API_KEY
                  optional: true
            - name: DEVOPS_CLI_VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devops-cli
                  key: DEVOPS_CLI_VALKEY_PASSWORD
                  optional: true
            # The password of the ACL user brain of valkey-roadmap: the alternatives row writes
            # the brain index (#4676). The ConfigMap names the store and the user
            # (roadmap.state.url and roadmap.state.username). Without the key the row counts a
            # fallback and the round goes on.
            - name: DEVOPS_CLI_ROADMAP_STATE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-roadmap-auth
                  key: brain
                  optional: true
            - name: DEVOPS_CLI_MATTERMOST_COMMAND_TOKEN
              valueFrom:
                secretKeyRef:
                  name: devops-cli
                  key: DEVOPS_CLI_MATTERMOST_COMMAND_TOKEN
                  optional: true
            - name: DEVOPS_CLI_CRAWL4AI_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: devops-cli
                  key: DEVOPS_CLI_CRAWL4AI_API_TOKEN
                  optional: true
            - name: DEVOPS_CLI_CONFIG
              value: /config/devops-cli.yaml
            - name: DEVOPS_CLI_DATA_DIR
              value: /home/devops/.data
            - name: OTEL_SERVICE_NAME
              value: roadmap-service
            # The pod name: the holder identity of the Lease roadmap-service-rows, and the
            # service.instance.id (`instance`) of the metrics. During a surge release two pods
            # send at the same time, so each pod sends its own metric stream (#6058, #6107).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.instance.id=$(POD_NAME)
            # The spans and the log records name the cluster (`k8s.cluster.name`) and the
            # namespace (`k8s.namespace.name`) from these two values. The cluster name is the
            # name in monitoring/k8s-monitoring-values.yaml of dan-petty/homelab;
            # without it, they name minikube.
            - name: K8S_CONTEXT
              value: homelab-k3s
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DO_NOT_TRACK
              value: "1"
            - name: OPENSPEC_TELEMETRY
              value: "0"
            - name: OPENSPEC_NO_UPDATE_CHECK
              value: "1"
            - name: PYDANTIC_AI_NO_BANNER
              value: "1"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/devops
            - name: config
              mountPath: /config
              readOnly: true
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          # uvicorn closes its socket on SIGTERM, before the drain. The sleep keeps the socket open
          # while the endpoint of the pod leaves the Service, so no webhook meets a closed port.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          # The memory limit is a stopgap (#4149). The working set grows 100 to
          # 150 MiB each hour from about 460 MiB, so 1Gi killed the pod after
          # about 4 hours. #4116 holds the analysis of the leak. #4125 is the
          # open 6-hour flat check. Revisit the limit when the working set is flat.
          # The CPU limit is 2: the container reached 1.00 core at a limit of 1 (#4991). The event
          # loop uses one core, so the raise is for the bursts of subprocesses and native threads.
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 3Gi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          persistentVolumeClaim:
            claimName: roadmap-service-home
        - name: config
          configMap:
            name: devops-cli-config
        # A token for the Kubernetes API, which the kubelet renews, and the cluster CA. The
        # client reads the token file again each minute.
        - name: kube-api-access
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
