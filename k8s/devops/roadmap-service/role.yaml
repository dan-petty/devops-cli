# What the roadmap Service may do in namespace devops: create the implement Job from CronJob
# devops-cli-runner, the stage Job from CronJob roadmap-stage (#5483) and the planner run Job from
# CronJob devops-cli-planner-run (#4003), list Jobs, patch the
# deadline and the annotations of a Job while it makes progress (#3063), delete a stage Job and a
# waiting fix-checks Job (#6018), list their pods, read a pod's log, and read the digest of its own
# image in Deployment roadmap-service (#2917). `resourceNames` limits `get` only: the name of each
# Job is new, so `create`, `delete`, `list` and `patch` cover the namespace. The policy
# `roadmap-service-jobs` checks a patch as it checks a create, and the policy
# `roadmap-service-job-deletes` admits the delete of a stage Job and of a suspended fix-checks
# Job, and of no other Job. A Job can take Secret `devops-cli`, which the Service pod holds
# already, so the Role gives no secret that the Service does not have. It reads no Secret and
# creates nothing but Jobs and the Lease of the rows.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: roadmap-service-jobs
  namespace: devops
  labels:
    app.kubernetes.io/name: roadmap-service
    app.kubernetes.io/part-of: devops-cli-stack
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "patch"]
  # The Jobs are built from these templates.
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: ["devops-cli-runner", "roadmap-stage", "devops-cli-planner-run"]
    verbs: ["get"]
  # The Service reads the digest of its own image for the row release_comments, which says when a
  # release runs in the cluster. The Deployment holds no secret value.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["roadmap-service"]
    verbs: ["get"]
  # The Job controller gives a pod a random name, so the Service lists the pods to find the one
  # whose log it reads.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # The pod that holds the Lease roadmap-service-rows runs the rows (#6058). It reads and renews
  # this one Lease, and gives it back with an update.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["roadmap-service-rows"]
    verbs: ["get", "update"]
  # The first pod creates the Lease. RBAC cannot limit `create` to a name, because the API server
  # checks a create before the object has a name, so this rule names no Lease.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: roadmap-service-jobs
  namespace: devops
  labels:
    app.kubernetes.io/name: roadmap-service
    app.kubernetes.io/part-of: devops-cli-stack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: roadmap-service-jobs
subjects:
  - kind: ServiceAccount
    name: roadmap-service
    namespace: devops
