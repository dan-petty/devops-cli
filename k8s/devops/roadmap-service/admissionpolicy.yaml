# What a Job of the roadmap Service may be (#2696). Kubernetes RBAC cannot limit `create` on
# `jobs` to a name, and Pod Security `restricted` only warns about a Job: it refuses the pod later.
# So the Role `roadmap-service-jobs` could make a Job with any image, any ServiceAccount of the
# namespace, any other Secret and any volume that `restricted` admits. This policy refuses such a
# Job when the Service makes it. It matches no other user: the CLI user, Argo CD and the CronJob
# controller are never evaluated. It uses only standard CEL, so a test runs the same expressions
# against the Jobs that CronJobs `devops-cli-runner` and `roadmap-stage` make
# (tests/gate/k8s_checks/job_admission_policy.py).
# A Job whose name starts with `devops-cli-stage-` is a stage Job (#5483, `variables.stage`): the
# Service image, 3 keys of Secret devops-cli through `secretKeyRef` and no `envFrom`, 2 retries
# only after exit 75 or a disruption, the stage resources and the component `roadmap-stage`. Every
# other Job is a runner Job, with every rule that it had before.
# The pod keeps the label `app.kubernetes.io/name: devops-cli-job`, because the NetworkPolicies of
# the stack select pods by that label: a Job pod with the label of the Service would take its
# egress to the API server. A runner Job runs its pod once, and no Job has a `command`,
# `imagePullSecrets`, a `priorityClassName` or a `nodeName`.
# The CPU and the memory request of the container are a row of the size table of the Service
# (`RUNNER_SIZES` in src/devops_cli/roadmap/implement/implement_size.py, #3193); a gate check holds the two
# equal. The memory limit is not pinned, because the setting `roadmap.implement.max_memory_limit`
# raises it.
# Not pinned: the tag or digest of the image, the args, the plain `env` values but the worker
# count of a runner Job, the memory limit of a runner Job, `nodeSelector`, `tolerations`,
# `hostUsers` and the number of Jobs (docs/CLUSTER.md, Runner Jobs and Stage Jobs).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: roadmap-service-jobs
  labels:
    app.kubernetes.io/name: roadmap-service
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  # The policy runs in the API server, not behind a webhook, so no outage can block a request.
  # `Fail` matters when an expression errors: the Service's Job is then refused, in the open.
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
  matchConditions:
    - name: made-by-the-roadmap-service
      expression: request.userInfo.username == "system:serviceaccount:devops:roadmap-service"
  variables:
    # The prefix of `RepoRef.unit_name` and `RepoRef.adhoc_name` for the row stage (ADR 0022).
    - name: stage
      expression: >-
        has(object.metadata.name) && object.metadata.name.startsWith("devops-cli-stage-")
  validations:
    - expression: >-
        size(object.spec.template.spec.containers) == 1 &&
        (!has(object.spec.template.spec.initContainers) ||
        size(object.spec.template.spec.initContainers) == 0)
      message: The Job must have one container and no init container.
      reason: Forbidden
    # The repository alone, or followed by a tag or a digest: a bare prefix would admit
    # `runner-evil`.
    - expression: >-
        object.spec.template.spec.containers.all(c, variables.stage ?
        (c.image == "ghcr.io/dan-petty/devops-cli/service" ||
        c.image.startsWith("ghcr.io/dan-petty/devops-cli/service:") ||
        c.image.startsWith("ghcr.io/dan-petty/devops-cli/service@")) :
        (c.image == "ghcr.io/dan-petty/devops-cli/runner" ||
        c.image.startsWith("ghcr.io/dan-petty/devops-cli/runner:") ||
        c.image.startsWith("ghcr.io/dan-petty/devops-cli/runner@")))
      message: The image must be ghcr.io/dan-petty/devops-cli/runner for a runner Job and ghcr.io/dan-petty/devops-cli/service for a stage Job, alone or with a tag or a digest.
      reason: Forbidden
    - expression: >-
        has(object.spec.template.spec.serviceAccountName) &&
        object.spec.template.spec.serviceAccountName == "devops-cli"
      message: The pod must use ServiceAccount devops-cli.
      reason: Forbidden
    - expression: >-
        has(object.spec.template.spec.automountServiceAccountToken) &&
        object.spec.template.spec.automountServiceAccountToken == false
      message: The pod must set automountServiceAccountToken to false, so that it has no token.
      reason: Forbidden
    # A stage Job takes 3 keys of the Secret and no other value of it.
    - expression: >-
        object.spec.template.spec.containers.all(c, !has(c.envFrom) ||
        c.envFrom.all(e, !variables.stage && has(e.secretRef) && !has(e.configMapRef) &&
        e.secretRef.name == "devops-cli"))
      message: envFrom may name only Secret devops-cli, and a stage Job has no envFrom.
      reason: Forbidden
    # `valueFrom` reads one key of any Secret, which `envFrom` does not allow. A stage Job reads the
    # keys of `CONST_ROADMAP_STAGE_JOB_SECRET_KEYS`, each in the variable of its name.
    - expression: >-
        object.spec.template.spec.containers.all(c, !has(c.env) ||
        c.env.all(e, !has(e.valueFrom) || (variables.stage &&
        has(e.valueFrom.secretKeyRef) && !has(e.valueFrom.fieldRef) &&
        !has(e.valueFrom.configMapKeyRef) && !has(e.valueFrom.resourceFieldRef) &&
        e.valueFrom.secretKeyRef.name == "devops-cli" &&
        e.valueFrom.secretKeyRef.key in ["DEVOPS_CLI_SERVICE_GITHUB_APP_PRIVATE_KEY",
        "DEVOPS_CLI_AI_API_KEY", "DEVOPS_CLI_MCP_STAGE_TOKEN"] &&
        e.name == e.valueFrom.secretKeyRef.key)))
      message: An env entry must not use valueFrom, but a stage Job reads the keys DEVOPS_CLI_SERVICE_GITHUB_APP_PRIVATE_KEY, DEVOPS_CLI_AI_API_KEY and DEVOPS_CLI_MCP_STAGE_TOKEN of Secret devops-cli, each in the variable of its name.
      reason: Forbidden
    - expression: >-
        !has(object.spec.template.spec.volumes) ||
        object.spec.template.spec.volumes.all(v,
        ((v.name == "tmp" || v.name == "home") && has(v.emptyDir)) ||
        (v.name == "config" && has(v.configMap) && v.configMap.name == "devops-cli-config"))
      message: The pod may have only the volumes tmp and home (emptyDir) and config (ConfigMap devops-cli-config).
      reason: Forbidden
    - expression: >-
        (!has(object.spec.template.spec.hostNetwork) || !object.spec.template.spec.hostNetwork) &&
        (!has(object.spec.template.spec.hostPID) || !object.spec.template.spec.hostPID) &&
        (!has(object.spec.template.spec.hostIPC) || !object.spec.template.spec.hostIPC)
      message: The pod must not use the host namespaces hostNetwork, hostPID or hostIPC.
      reason: Forbidden
    # The NetworkPolicies select pods by this label (networkpolicy-egress.yaml admits the label of
    # the Service to the API server), so the label of a Job pod stays the label of a Job. The
    # component `roadmap-stage` admits a pod to SearXNG (searxng/networkpolicy-client.yaml), so
    # only the pod of a stage Job carries it.
    - expression: >-
        has(object.spec.template.metadata) && has(object.spec.template.metadata.labels) &&
        "app.kubernetes.io/name" in object.spec.template.metadata.labels &&
        object.spec.template.metadata.labels["app.kubernetes.io/name"] == "devops-cli-job" &&
        (variables.stage ==
        ("app.kubernetes.io/component" in object.spec.template.metadata.labels &&
        object.spec.template.metadata.labels["app.kubernetes.io/component"] == "roadmap-stage"))
      message: The pod label app.kubernetes.io/name must be devops-cli-job, and the pod label app.kubernetes.io/component is roadmap-stage on the pod of a stage Job and on no other pod.
      reason: Forbidden
    # Fields that reach beyond the pod: a priority class can preempt other pods, and a node name
    # skips the scheduler.
    - expression: >-
        !has(object.spec.template.spec.priorityClassName) &&
        !has(object.spec.template.spec.nodeName)
      message: The pod must not set priorityClassName or nodeName.
      reason: Forbidden
    # Another entry would let the pod use another Secret of the namespace.
    - expression: >-
        !has(object.spec.template.spec.imagePullSecrets) ||
        size(object.spec.template.spec.imagePullSecrets) == 0
      message: The pod must not set imagePullSecrets.
      reason: Forbidden
    # The image sets the entrypoint. The Service sets only `args`.
    - expression: object.spec.template.spec.containers.all(c, !has(c.command))
      message: The container must not set command.
      reason: Forbidden
    - expression: >-
        !has(object.spec.manualSelector) || !object.spec.manualSelector
      message: The Job must not set manualSelector.
      reason: Forbidden
    # The Job runs one pod at a time. A work queue or a parallel Job would run many.
    - expression: >-
        (!has(object.spec.completions) || object.spec.completions == 1) &&
        (!has(object.spec.parallelism) || object.spec.parallelism == 1)
      message: The Job must run its pod once, so completions and parallelism are 1 or not set.
      reason: Forbidden
    # A runner Job that changed GitHub never runs twice (cronjob-runner.yaml). A stage Job runs its
    # pod again only after exit 75, the `evicted` exit, or a disruption, at most twice
    # (cronjob-stage.yaml): the pod that runs again removes the branch of its own intent mark.
    - expression: >-
        has(object.spec.backoffLimit) && (variables.stage ?
        (object.spec.backoffLimit == 2 && has(object.spec.podFailurePolicy) &&
        object.spec.podFailurePolicy.rules.exists(r, r.action == "FailJob" &&
        has(r.onExitCodes) && r.onExitCodes.operator == "NotIn" && r.onExitCodes.values == [75]) &&
        object.spec.podFailurePolicy.rules.all(r,
        (r.action == "Ignore" && has(r.onPodConditions) && !has(r.onExitCodes) &&
        r.onPodConditions.all(p, p.type == "DisruptionTarget" &&
        (!has(p.status) || p.status == "True"))) ||
        (r.action == "FailJob" && has(r.onExitCodes) && r.onExitCodes.operator == "NotIn" &&
        r.onExitCodes.values == [75]))) :
        (object.spec.backoffLimit == 0 && !has(object.spec.podFailurePolicy)))
      message: backoffLimit must be 0 with no podFailurePolicy for a runner Job, and 2 for a stage Job with a podFailurePolicy that fails the Job on each exit but 75 and ignores only a disruption.
      reason: Forbidden
    # The Service extends the deadline of its Job while the Job makes progress, up to
    # `roadmap.implement.deadline_ceiling_seconds` (#3063). The cap is the most that setting may be
    # (`CONST_ROADMAP_IMPLEMENT_DEADLINE_CAP_SECONDS`); a test holds both.
    - expression: >-
        has(object.spec.activeDeadlineSeconds) && object.spec.activeDeadlineSeconds > 0 &&
        object.spec.activeDeadlineSeconds <= 14400
      message: The Job must set a deadline (activeDeadlineSeconds) of 14400 seconds at most.
      reason: Forbidden
    # The rows of `RUNNER_SIZES`: CPU 1 with 2Gi, and CPU 4 with 6Gi. The CPU request equals the
    # CPU limit, and the worker count of the test runner equals the CPU limit, because
    # `pytest-xdist` counts the CPUs of the node and not of the pod (#2806). A stage Job has the
    # size of cronjob-stage.yaml.
    - expression: >-
        object.spec.template.spec.containers.all(c, has(c.resources) &&
        has(c.resources.requests) && has(c.resources.limits) &&
        has(c.resources.requests.cpu) && has(c.resources.requests.memory) &&
        has(c.resources.limits.cpu) && has(c.resources.limits.memory) &&
        (variables.stage ?
        (c.resources.requests.cpu == "250m" && c.resources.requests.memory == "1Gi" &&
        c.resources.limits.cpu == "1" && c.resources.limits.memory == "2Gi") :
        (c.resources.requests.cpu == c.resources.limits.cpu &&
        ((c.resources.limits.cpu == "1" && c.resources.requests.memory == "2Gi") ||
        (c.resources.limits.cpu == "4" && c.resources.requests.memory == "6Gi")) &&
        has(c.env) && c.env.exists(e, e.name == "PYTEST_XDIST_AUTO_NUM_WORKERS" &&
        has(e.value) && e.value == c.resources.limits.cpu))))
      message: The CPU and the memory request of a runner Job must be a row of the size table (1 CPU with 2Gi, or 4 CPU with 6Gi), the CPU request must equal the CPU limit, the memory limit must be set, and PYTEST_XDIST_AUTO_NUM_WORKERS must equal the CPU limit. A stage Job requests 250m CPU and 1Gi with limits of 1 CPU and 2Gi, the stage size.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: roadmap-service-jobs
  labels:
    app.kubernetes.io/name: roadmap-service
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  policyName: roadmap-service-jobs
  # `Audit` writes each refusal to the audit log of the API server.
  validationActions: ["Deny", "Audit"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: devops
---
# The Service deletes a stage Job (#5483): a Job past the deadline of its check-out, and a failed
# Job before it runs the item again. RBAC cannot limit `delete` on `jobs` to some names, so this
# policy admits the delete of a stage Job by the Service and refuses the delete of any other Job,
# such as a runner Job. It matches no other user.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: roadmap-service-job-deletes
  labels:
    app.kubernetes.io/name: roadmap-service
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["jobs"]
  matchConditions:
    - name: made-by-the-roadmap-service
      expression: request.userInfo.username == "system:serviceaccount:devops:roadmap-service"
  validations:
    - expression: >-
        has(oldObject.metadata.name) && oldObject.metadata.name.startsWith("devops-cli-stage-") &&
        has(oldObject.metadata.labels) &&
        "app.kubernetes.io/component" in oldObject.metadata.labels &&
        oldObject.metadata.labels["app.kubernetes.io/component"] == "roadmap-stage"
      message: The roadmap Service may delete a stage Job and no other Job.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: roadmap-service-job-deletes
  labels:
    app.kubernetes.io/name: roadmap-service
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  policyName: roadmap-service-job-deletes
  validationActions: ["Deny", "Audit"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: devops
