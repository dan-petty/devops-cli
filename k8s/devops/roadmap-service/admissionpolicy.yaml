# What a Job of the roadmap Service may be (#2696). Kubernetes RBAC cannot limit `create` on
# `jobs` to a name, and Pod Security `restricted` only warns about a Job: it refuses the pod later.
# So the Role `roadmap-service-jobs` could make a Job with any image, any ServiceAccount of the
# namespace, any other Secret and any volume that `restricted` admits. This policy refuses such a
# Job when the Service makes it. It matches no other user: the CLI user, Argo CD and the CronJob
# controller are never evaluated. It uses only standard CEL, so a test runs the same expressions
# against the Jobs that CronJobs `devops-cli-runner` and `roadmap-stage` make
# (tests/gate/k8s_checks/job_admission_policy.py).
# Every Job runs the runner image (#6417). A Job whose name starts with `devops-cli-stage-` is a
# stage Job (#5483, `variables.stage`): 2 keys of Secret devops-cli through `secretKeyRef` and no
# `envFrom`, the args `roadmap stage --repo <owner/name> --job-item <n> --confirm`, only the plain
# env values of cronjob-stage.yaml and of `stage_job_env` with a token for the repository of
# `--repo`, 2 retries
# only after exit 75 (eviction or retryable failure) or a disruption, exit 1 for non-retryable
# failures, the deadline of the template, the stage resources and the component `roadmap-stage`.
# The pod keeps the label `app.kubernetes.io/name: devops-cli-job`, because the NetworkPolicies of
# the stack select pods by that label: a Job pod with the label of the Service would take its
# egress to the API server. A runner Job runs its pod once, and no Job has a `command`,
# `imagePullSecrets`, a `priorityClassName` or a `nodeName`.
# A runner Job runs the step as three containers, one after the other (#3700, ADR 0030): the init
# containers `prepare` and `agent` and the container `publish`. Only `prepare` and `publish` read
# the App key, only `agent` reads the model key, `agent` mounts neither the state folder nor a
# home of the other two, and `publish` mounts the run folder read only. No container restarts in
# the pod, and the pod shares no process namespace.
# The CPU and the memory of `agent` are a row of the size table of the Service
# (`RUNNER_SIZES` in src/devops_cli/roadmap/implement/implement_size.py, #3193), each limit equal
# to its request (#7422); a gate check holds the two equal. `prepare` and `publish` have one small
# fixed row.
# Not pinned: the tag or digest of the image, the args and the plain `env` values of a runner Job
# but its worker count, the values of the plain `env` of a stage Job but its token repository,
# `nodeSelector`, `tolerations`, `hostUsers` and the number of Jobs (docs/CLUSTER.md, Runner Jobs
# and Stage Jobs).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: roadmap-service-jobs
  labels:
    app.kubernetes.io/name: roadmap-service
    app.kubernetes.io/part-of: devops-cli-stack
  annotations:
    # Argo CD applies the policy and its binding before CronJob devops-cli-runner (wave 0), so the
    # cluster admits a Job of the three containers before the Service makes one (#3700).
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # The policy runs in the API server, not behind a webhook, so no outage can block a request.
  # `Fail` matters when an expression errors: the Service's Job is then refused, in the open.
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
  matchConditions:
    - name: made-by-the-roadmap-service
      expression: request.userInfo.username == "system:serviceaccount:devops:roadmap-service"
  variables:
    # The prefix of `RepoRef.unit_name` and `RepoRef.adhoc_name` for the row stage (ADR 0022).
    - name: stage
      expression: >-
        has(object.metadata.name) && object.metadata.name.startsWith("devops-cli-stage-")
    # The planner's run Job carries its own pod label, so no egress allow policy selects it and the
    # deny-all policy applies (ADR 0018, #4003).
    - name: planner
      expression: >-
        has(object.spec.template.metadata) && has(object.spec.template.metadata.labels) &&
        "app.kubernetes.io/name" in object.spec.template.metadata.labels &&
        object.spec.template.metadata.labels["app.kubernetes.io/name"] == "devops-cli-planner-run"
    # The containers of the pod in the order that they run: the init containers, then the
    # containers. Each rule of a container reads this list, so an init container meets each rule.
    - name: containers
      expression: >-
        has(object.spec.template.spec.initContainers) ?
        object.spec.template.spec.initContainers + object.spec.template.spec.containers :
        object.spec.template.spec.containers
    # A runner Job of the three containers (#3700).
    - name: phases
      expression: >-
        !variables.stage && !variables.planner &&
        has(object.spec.template.spec.initContainers) &&
        size(object.spec.template.spec.initContainers) > 0
  validations:
    - expression: >-
        (size(object.spec.template.spec.containers) == 1 &&
        (!has(object.spec.template.spec.initContainers) ||
        size(object.spec.template.spec.initContainers) == 0) &&
        (variables.stage || variables.planner)) ||
        (!variables.stage && !variables.planner &&
        has(object.spec.template.spec.initContainers) &&
        object.spec.template.spec.initContainers.map(c, c.name) == ["prepare", "agent"] &&
        object.spec.template.spec.containers.map(c, c.name) == ["publish"])
      message: A stage Job and a planner run Job must have one container and no init container. A runner Job must have the init containers prepare and agent and the container publish.
      reason: Forbidden
    # A container that restarts runs at the same time as another one (a native sidecar), or runs
    # `publish` again, which pushes and comments twice.
    - expression: >-
        variables.containers.all(c, !has(c.restartPolicy) && !has(c.restartPolicyRules))
      message: A container must not set restartPolicy or restartPolicyRules, an init container included.
      reason: Forbidden
    - expression: >-
        !has(object.spec.template.spec.shareProcessNamespace) ||
        !object.spec.template.spec.shareProcessNamespace
      message: The pod must not set shareProcessNamespace, so that no container sees the processes of another.
      reason: Forbidden
    # Each container runs its own phase on the run folder that the volumes hold (`build_job`):
    # `publish --work /run/roadmap/work` would read a state folder that `agent` writes, and
    # `prepare --phase all` would run the agent next to the App key. Standard CEL has no slice, so
    # the rule reads the last four args by index.
    - expression: >-
        !variables.phases || variables.containers.all(c,
        !(c.name in ["prepare", "agent", "publish"]) || has(c.args) && size(c.args) >= 4 &&
        c.args[size(c.args) - 4] == "--phase" && c.args[size(c.args) - 3] == c.name &&
        c.args[size(c.args) - 2] == "--work" && c.args[size(c.args) - 1] == "/run/roadmap" &&
        size(c.args.filter(a, a == "--phase" || a.startsWith("--phase="))) == 1 &&
        size(c.args.filter(a, a == "--work" || a.startsWith("--work="))) == 1)
      message: On the three containers, the args of each container must end with --phase and its name and --work /run/roadmap, with no other --phase or --work.
      reason: Forbidden
    # A pod that restarts a container runs `publish` again, or runs `prepare` again on a run
    # folder that `agent` wrote.
    - expression: >-
        !variables.phases || (has(object.spec.template.spec.restartPolicy) &&
        object.spec.template.spec.restartPolicy == "Never")
      message: The pod of a runner Job on the three containers must set restartPolicy Never.
      reason: Forbidden
    - expression: >-
        !variables.phases || variables.containers.all(c, !has(c.lifecycle) &&
        !has(c.livenessProbe) && !has(c.readinessProbe) && !has(c.startupProbe) &&
        !has(c.workingDir))
      message: A container of a runner Job on the three containers must not set lifecycle, livenessProbe, readinessProbe, startupProbe or workingDir, because each runs a program or changes the folder of the phase.
      reason: Forbidden
    # A plain value can make a program load code or read a file of the run folder, such as
    # PYTHONPATH, LD_PRELOAD, GIT_CONFIG_GLOBAL or HOME. So each container sets only the plain values
    # of the template and of the Service (`RunnerUnit.env`), and the configuration and the data
    # folder keep the paths of the template.
    - expression: >-
        !variables.phases || variables.containers.all(c, !has(c.env) || c.env.all(e,
        has(e.valueFrom) || (e.name in ["DEVOPS_CLI_CONFIG", "DEVOPS_CLI_DATA_DIR",
        "DEVOPS_CLI_ROADMAP_IMPLEMENT_IN_RUNNER", "OTEL_SERVICE_NAME", "OTEL_RESOURCE_ATTRIBUTES",
        "K8S_CONTEXT", "POD_NAMESPACE", "DO_NOT_TRACK", "PYTEST_XDIST_AUTO_NUM_WORKERS",
        "OPENSPEC_TELEMETRY", "OPENSPEC_NO_UPDATE_CHECK", "PYDANTIC_AI_NO_BANNER",
        "DEVOPS_CLI_SERVICE_GITHUB_APP_TOKEN_REPOSITORY"] &&
        (e.name != "DEVOPS_CLI_CONFIG" || (has(e.value) && e.value == "/config/devops-cli.yaml")) &&
        (e.name != "DEVOPS_CLI_DATA_DIR" || (has(e.value) && e.value == "/home/devops/.data")))))
      message: A container of a runner Job on the three containers sets only the plain env values of the template and of the Service, with DEVOPS_CLI_CONFIG at /config/devops-cli.yaml and DEVOPS_CLI_DATA_DIR at /home/devops/.data.
      reason: Forbidden
    # Every Job of the Service runs the runner image (#6417). The repository alone, or followed by
    # a tag or a digest: a bare prefix would admit `runner-evil`.
    - expression: >-
        variables.containers.all(c,
        c.image == "ghcr.io/dan-petty/devops-cli/runner" ||
        c.image.startsWith("ghcr.io/dan-petty/devops-cli/runner:") ||
        c.image.startsWith("ghcr.io/dan-petty/devops-cli/runner@"))
      message: The image must be ghcr.io/dan-petty/devops-cli/runner, alone or with a tag or a digest.
      reason: Forbidden
    - expression: >-
        has(object.spec.template.spec.serviceAccountName) &&
        object.spec.template.spec.serviceAccountName == "devops-cli"
      message: The pod must use ServiceAccount devops-cli.
      reason: Forbidden
    - expression: >-
        has(object.spec.template.spec.automountServiceAccountToken) &&
        object.spec.template.spec.automountServiceAccountToken == false
      message: The pod must set automountServiceAccountToken to false, so that it has no token.
      reason: Forbidden
    # A Job takes no envFrom: a stage Job and a runner Job read their keys of the Secret with
    # valueFrom (#6518).
    - expression: >-
        variables.containers.all(c, !has(c.envFrom))
      message: A Job must not use envFrom.
      reason: Forbidden
    # `valueFrom` reads one key of any Secret, which `envFrom` does not allow. A stage Job and a
    # runner Job (#6518) read the keys of `CONST_ROADMAP_STAGE_JOB_SECRET_KEYS`, each in the
    # variable of its name. On the three containers, only `agent` reads the model key, and only
    # `prepare` and `publish` read the App key (#3700) and the password of the cache Valkey
    # (#7293, owner decision of 2026-11-26). A planner run Job reads no key.
    - expression: >-
        variables.containers.all(c, !has(c.env) ||
        c.env.all(e, !has(e.valueFrom) || (!variables.planner &&
        has(e.valueFrom.secretKeyRef) && !has(e.valueFrom.fieldRef) &&
        !has(e.valueFrom.configMapKeyRef) && !has(e.valueFrom.resourceFieldRef) &&
        e.valueFrom.secretKeyRef.name == "devops-cli" &&
        e.valueFrom.secretKeyRef.key in ["DEVOPS_CLI_SERVICE_GITHUB_APP_PRIVATE_KEY",
        "DEVOPS_CLI_AI_API_KEY", "DEVOPS_CLI_VALKEY_PASSWORD"] &&
        e.name == e.valueFrom.secretKeyRef.key &&
        (!variables.phases || (c.name == "agent") ==
        (e.valueFrom.secretKeyRef.key == "DEVOPS_CLI_AI_API_KEY")))))
      message: An env entry must not use valueFrom, but a runner Job and a stage Job read the keys DEVOPS_CLI_SERVICE_GITHUB_APP_PRIVATE_KEY, DEVOPS_CLI_AI_API_KEY and DEVOPS_CLI_VALKEY_PASSWORD of Secret devops-cli, each in the variable of its name. On the three containers, only agent reads DEVOPS_CLI_AI_API_KEY, and only prepare and publish read DEVOPS_CLI_SERVICE_GITHUB_APP_PRIVATE_KEY and DEVOPS_CLI_VALKEY_PASSWORD.
      reason: Forbidden
    # A stage Job of the Service runs the stage job of one item and nothing else, with the keys of
    # the Secret. `devops k8s run-job` of a person is not evaluated, so this rule does not limit it.
    - expression: >-
        !variables.stage || object.spec.template.spec.containers.all(c,
        has(c.args) && size(c.args) == 7 && c.args[0] == "roadmap" && c.args[1] == "stage" &&
        c.args[2] == "--repo" && c.args[3].matches("^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$") &&
        c.args[4] == "--job-item" && c.args[5].matches("^[1-9][0-9]*$") &&
        c.args[6] == "--confirm")
      message: The args of a stage Job must be roadmap stage --repo <owner/name> --job-item <n> --confirm.
      reason: Forbidden
    # A plain value can change where a key goes, such as a base URL of the gateway, so a stage Job
    # sets only the plain env values of cronjob-stage.yaml and of `stage_job_env` (a gate check holds
    # the list equal to both). Its GitHub token names the repository of `--repo` and no other
    # (#2667), and the Job refuses to run as the App without it.
    - expression: >-
        !variables.stage || object.spec.template.spec.containers.all(c, has(c.env) &&
        c.env.exists(e, e.name == "DEVOPS_CLI_SERVICE_GITHUB_APP_TOKEN_REPOSITORY" &&
        has(e.value) && has(c.args) && size(c.args) > 3 && e.value == c.args[3]) &&
        c.env.all(e, has(e.valueFrom) || e.name in ["DEVOPS_CLI_CONFIG", "DEVOPS_CLI_DATA_DIR",
        "OTEL_SERVICE_NAME", "OTEL_RESOURCE_ATTRIBUTES", "K8S_CONTEXT", "POD_NAMESPACE",
        "DO_NOT_TRACK", "OPENSPEC_TELEMETRY", "OPENSPEC_NO_UPDATE_CHECK", "PYDANTIC_AI_NO_BANNER",
        "DEVOPS_CLI_SERVICE_GITHUB_APP_TOKEN_REPOSITORY", "DEVOPS_CLI_ROADMAP_STAGE_JOB",
        "DEVOPS_CLI_ROADMAP_STAGE_JOB_DEADLINE"]))
      message: A stage Job sets only the plain env values of CronJob roadmap-stage and of the Service, and DEVOPS_CLI_SERVICE_GITHUB_APP_TOKEN_REPOSITORY must name the repository of --repo.
      reason: Forbidden
    - expression: >-
        !has(object.spec.template.spec.volumes) ||
        object.spec.template.spec.volumes.all(v,
        ((v.name == "tmp" || v.name == "home") && has(v.emptyDir) &&
        (!variables.planner || has(v.emptyDir.sizeLimit))) ||
        (!variables.stage && !variables.planner &&
        v.name in ["run", "state", "prepare-tmp", "prepare-home", "agent-tmp", "agent-home",
        "publish-tmp", "publish-home"] && has(v.emptyDir)) ||
        (v.name == "config" && has(v.configMap) &&
        ((!variables.planner && v.configMap.name == "devops-cli-config") ||
        (variables.planner && v.configMap.name == "devops-cli-config-sandbox"))) ||
        (variables.planner && v.name == "repo" && has(v.persistentVolumeClaim) &&
        v.persistentVolumeClaim.claimName == "roadmap-service-home" &&
        has(v.persistentVolumeClaim.readOnly) && v.persistentVolumeClaim.readOnly))
      message: The pod may have only the volumes tmp and home (emptyDir), for a runner Job also run, state and the tmp and the home of each of its three containers (emptyDir), config (ConfigMap devops-cli-config, or devops-cli-config-sandbox for a planner run Job) and, for a planner run Job, repo (claim roadmap-service-home, read only).
      reason: Forbidden
    # Each container of the three mounts only its own volumes at their fixed paths (#3700):
    # `prepare` writes the run folder and the state, `agent` writes the run folder and reads no
    # state, and `publish` reads both. The tmp and the home of a container are its own, so no
    # writable volume of `agent` reaches `publish`. The rule of the layout refuses any other container.
    - expression: >-
        !variables.phases || variables.containers.all(c,
        !(c.name in ["prepare", "agent", "publish"]) || has(c.volumeMounts) &&
        c.volumeMounts.all(m, !has(m.subPath) && !has(m.subPathExpr) &&
        ((m.name == "run" && m.mountPath == "/run/roadmap" &&
        (c.name != "publish" || (has(m.readOnly) && m.readOnly))) ||
        (m.name == "state" && m.mountPath == "/run/roadmap/state" && c.name != "agent" &&
        (c.name != "publish" || (has(m.readOnly) && m.readOnly))) ||
        (m.name == c.name + "-tmp" && m.mountPath == "/tmp") ||
        (m.name == c.name + "-home" && m.mountPath == "/home/devops") ||
        (m.name == "config" && m.mountPath == "/config" && has(m.readOnly) && m.readOnly))) &&
        c.volumeMounts.exists(m, m.name == "run") &&
        (c.name == "agent" || c.volumeMounts.exists(m, m.name == "state")))
      message: Each container of a runner Job mounts only run at /run/roadmap, state at /run/roadmap/state, its own tmp at /tmp and home at /home/devops, and config at /config read only, with no subPath. Each mounts run, agent mounts no state, prepare and publish mount state, and publish mounts run and state read only.
      reason: Forbidden
    - expression: >-
        (!has(object.spec.template.spec.hostNetwork) || !object.spec.template.spec.hostNetwork) &&
        (!has(object.spec.template.spec.hostPID) || !object.spec.template.spec.hostPID) &&
        (!has(object.spec.template.spec.hostIPC) || !object.spec.template.spec.hostIPC)
      message: The pod must not use the host namespaces hostNetwork, hostPID or hostIPC.
      reason: Forbidden
    # The NetworkPolicies select pods by this label (networkpolicy-egress.yaml admits the label of
    # the Service to the API server), so the label of a Job pod stays the label of a Job. The
    # component `roadmap-stage` admits a pod to SearXNG (searxng/networkpolicy-client.yaml), so
    # only the pod of a stage Job carries it.
    - expression: >-
        has(object.spec.template.metadata) && has(object.spec.template.metadata.labels) &&
        "app.kubernetes.io/name" in object.spec.template.metadata.labels &&
        (variables.planner ?
        (object.spec.template.metadata.labels["app.kubernetes.io/name"] == "devops-cli-planner-run" &&
        !("app.kubernetes.io/component" in object.spec.template.metadata.labels)) :
        (object.spec.template.metadata.labels["app.kubernetes.io/name"] == "devops-cli-job" &&
        (variables.stage ==
        ("app.kubernetes.io/component" in object.spec.template.metadata.labels &&
        object.spec.template.metadata.labels["app.kubernetes.io/component"] == "roadmap-stage"))))
      message: The pod label app.kubernetes.io/name must be devops-cli-job, or devops-cli-planner-run for a planner run Job with no component label, and the pod label app.kubernetes.io/component is roadmap-stage on the pod of a stage Job and on no other pod.
      reason: Forbidden
    # Fields that reach beyond the pod: a priority class can preempt other pods, and a node name
    # skips the scheduler.
    - expression: >-
        !has(object.spec.template.spec.priorityClassName) &&
        !has(object.spec.template.spec.nodeName)
      message: The pod must not set priorityClassName or nodeName.
      reason: Forbidden
    # Another entry would let the pod use another Secret of the namespace.
    - expression: >-
        !has(object.spec.template.spec.imagePullSecrets) ||
        size(object.spec.template.spec.imagePullSecrets) == 0
      message: The pod must not set imagePullSecrets.
      reason: Forbidden
    # The image sets the entrypoint. The Service sets only `args`.
    - expression: variables.containers.all(c, !has(c.command))
      message: The container must not set command.
      reason: Forbidden
    - expression: >-
        !has(object.spec.manualSelector) || !object.spec.manualSelector
      message: The Job must not set manualSelector.
      reason: Forbidden
    # The Job runs one pod at a time. A work queue or a parallel Job would run many.
    - expression: >-
        (!has(object.spec.completions) || object.spec.completions == 1) &&
        (!has(object.spec.parallelism) || object.spec.parallelism == 1)
      message: The Job must run its pod once, so completions and parallelism are 1 or not set.
      reason: Forbidden
    # The seven isolation controls of ADR 0018: the pod runs as UID and GID 1000 with no privilege
    # and the default seccomp profile, and the container mounts the two writable volumes and the
    # two read-only ones at their fixed paths.
    - expression: >-
        !variables.planner || (has(object.spec.template.spec.securityContext) &&
        has(object.spec.template.spec.securityContext.runAsNonRoot) &&
        object.spec.template.spec.securityContext.runAsNonRoot == true &&
        has(object.spec.template.spec.securityContext.runAsUser) &&
        object.spec.template.spec.securityContext.runAsUser == 1000 &&
        has(object.spec.template.spec.securityContext.runAsGroup) &&
        object.spec.template.spec.securityContext.runAsGroup == 1000 &&
        has(object.spec.template.spec.securityContext.seccompProfile) &&
        object.spec.template.spec.securityContext.seccompProfile.type == "RuntimeDefault" &&
        object.spec.template.spec.containers.all(c, has(c.securityContext) &&
        has(c.securityContext.allowPrivilegeEscalation) &&
        c.securityContext.allowPrivilegeEscalation == false &&
        has(c.securityContext.readOnlyRootFilesystem) &&
        c.securityContext.readOnlyRootFilesystem == true &&
        has(c.securityContext.capabilities) &&
        has(c.securityContext.capabilities.drop) &&
        c.securityContext.capabilities.drop.all(d, d == "ALL")))
      message: A planner run Job must run as UID 1000 and GID 1000 with runAsNonRoot and the RuntimeDefault seccomp profile, and its container must set allowPrivilegeEscalation false, readOnlyRootFilesystem true and drop all capabilities.
      reason: Forbidden
    - expression: >-
        !variables.planner || object.spec.template.spec.containers.all(c, has(c.volumeMounts) &&
        c.volumeMounts.exists(m, m.name == "tmp" && m.mountPath == "/tmp") &&
        c.volumeMounts.exists(m, m.name == "home" && m.mountPath == "/home/devops") &&
        c.volumeMounts.exists(m, m.name == "config" && m.mountPath == "/config" &&
        has(m.readOnly) && m.readOnly) &&
        c.volumeMounts.exists(m, m.name == "repo" && m.mountPath == "/repo" &&
        has(m.readOnly) && m.readOnly))
      message: A planner run Job must mount tmp at /tmp, home at /home/devops, config at /config read only and repo at /repo read only.
      reason: Forbidden
    # A runner Job that changed GitHub never runs twice (cronjob-runner.yaml). A stage Job runs its
    # pod again only after exit 75 (an eviction or a retryable failure), or a disruption, at most
    # twice (cronjob-stage.yaml): the pod that runs again removes the branch of its own intent
    # mark. A non-retryable failure exits 1 and fails the Job.
    - expression: >-
        has(object.spec.backoffLimit) && (variables.stage ?
        (object.spec.backoffLimit == 2 && has(object.spec.podFailurePolicy) &&
        object.spec.podFailurePolicy.rules.exists(r, r.action == "FailJob" &&
        has(r.onExitCodes) && r.onExitCodes.operator == "NotIn" && r.onExitCodes.values == [75]) &&
        object.spec.podFailurePolicy.rules.all(r,
        (r.action == "Ignore" && has(r.onPodConditions) && !has(r.onExitCodes) &&
        r.onPodConditions.all(p, p.type == "DisruptionTarget" &&
        (!has(p.status) || p.status == "True"))) ||
        (r.action == "FailJob" && has(r.onExitCodes) && r.onExitCodes.operator == "NotIn" &&
        r.onExitCodes.values == [75]))) :
        (object.spec.backoffLimit == 0 && !has(object.spec.podFailurePolicy)))
      message: backoffLimit must be 0 with no podFailurePolicy for a runner Job, and 2 for a stage Job with a podFailurePolicy that fails the Job on each exit but 75 and ignores only a disruption.
      reason: Forbidden
    # The Service extends the deadline of its runner Job while the Job makes progress, up to
    # `roadmap.implement.deadline_ceiling_seconds` (#3063). The cap is the most that setting may be
    # (`CONST_ROADMAP_IMPLEMENT_DEADLINE_CAP_SECONDS`); a test holds both. A stage Job keeps the
    # deadline of cronjob-stage.yaml (`CONST_ROADMAP_STAGE_JOB_DEADLINE_SECONDS`), so the time
    # budget and the check-out deadline of the Service stay inside it.
    - expression: >-
        has(object.spec.activeDeadlineSeconds) && (variables.stage ?
        object.spec.activeDeadlineSeconds == 10800 :
        (variables.planner ? object.spec.activeDeadlineSeconds == 120 :
        (object.spec.activeDeadlineSeconds > 0 && object.spec.activeDeadlineSeconds <= 14400)))
      message: The Job must set a deadline (activeDeadlineSeconds) of 14400 seconds at most, a stage Job the deadline of 10800 seconds of its template, and a planner run Job the deadline of 120 seconds of its template.
      reason: Forbidden
    # The rows of `RUNNER_SIZES`: CPU 1 with 5Gi, and CPU 4 with 11Gi. Each limit equals its
    # request, so the scheduler places the Job on a node that holds its limit (#7422). The worker
    # count of the test runner equals the CPU limit, because `pytest-xdist` counts the CPUs of the
    # node and not of the pod (#2806). On the three
    # containers the row is of `agent`, and `prepare` and `publish` have the small fixed row of
    # the template. A stage Job has the size of cronjob-stage.yaml.
    - expression: >-
        variables.containers.all(c, has(c.resources) &&
        has(c.resources.requests) && has(c.resources.limits) &&
        has(c.resources.requests.cpu) && has(c.resources.requests.memory) &&
        has(c.resources.limits.cpu) && has(c.resources.limits.memory) &&
        (variables.stage ?
        (c.resources.requests.cpu == "250m" && c.resources.requests.memory == "1Gi" &&
        c.resources.limits.cpu == "1" && c.resources.limits.memory == "2Gi") :
        (variables.planner ?
        (c.resources.requests.cpu == "1" && c.resources.limits.cpu == "1" &&
        c.resources.requests.memory == "2Gi" && c.resources.limits.memory == "2Gi") :
        (variables.phases && c.name != "agent") ?
        (c.resources.requests.cpu == "250m" && c.resources.requests.memory == "512Mi" &&
        c.resources.limits.cpu == "1" && c.resources.limits.memory == "2Gi") :
        (c.resources.requests.cpu == c.resources.limits.cpu &&
        c.resources.requests.memory == c.resources.limits.memory &&
        ((c.resources.limits.cpu == "1" && c.resources.requests.memory == "5Gi") ||
        (c.resources.limits.cpu == "4" && c.resources.requests.memory == "11Gi")) &&
        has(c.env) && c.env.exists(e, e.name == "PYTEST_XDIST_AUTO_NUM_WORKERS" &&
        has(e.value) && e.value == c.resources.limits.cpu)))))
      message: The CPU and the memory request of a runner Job, of agent on the three containers, must be a row of the size table (1 CPU with 5Gi, or 4 CPU with 11Gi), each limit must equal its request, and PYTEST_XDIST_AUTO_NUM_WORKERS must equal the CPU limit. prepare and publish request 250m CPU and 512Mi with limits of 1 CPU and 2Gi. A stage Job requests 250m CPU and 1Gi with limits of 1 CPU and 2Gi, the stage size, and a planner run Job requests and limits 1 CPU and 2Gi.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: roadmap-service-jobs
  labels:
    app.kubernetes.io/name: roadmap-service
    app.kubernetes.io/part-of: devops-cli-stack
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  policyName: roadmap-service-jobs
  # `Audit` writes each refusal to the audit log of the API server.
  validationActions: ["Deny", "Audit"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: devops
---
# The Service deletes a stage Job (#5483): a Job past the deadline of its check-out, and a failed
# Job before it runs the item again. The watch row deletes a fix-checks Job that waited suspended
# longer than roadmap.fix_checks.max_wait_minutes (#6018). RBAC cannot limit `delete` on `jobs` to
# some names, so this policy admits the delete of a stage Job, and of a fix-checks Job that is
# suspended, by the Service, and refuses the delete of any other Job, such as a runner Job that
# runs. It matches no other user.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: roadmap-service-job-deletes
  labels:
    app.kubernetes.io/name: roadmap-service
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["jobs"]
  matchConditions:
    - name: made-by-the-roadmap-service
      expression: request.userInfo.username == "system:serviceaccount:devops:roadmap-service"
  validations:
    - expression: >-
        has(oldObject.metadata.name) && has(oldObject.metadata.labels) &&
        "app.kubernetes.io/component" in oldObject.metadata.labels &&
        (
          (oldObject.metadata.name.startsWith("devops-cli-stage-") &&
            oldObject.metadata.labels["app.kubernetes.io/component"] == "roadmap-stage") ||
          (oldObject.metadata.name.startsWith("devops-cli-fix-checks-") &&
            oldObject.metadata.labels["app.kubernetes.io/component"] == "roadmap-fix-checks" &&
            has(oldObject.spec.suspend) && oldObject.spec.suspend == true)
        )
      message: The roadmap Service may delete a stage Job and a waiting fix-checks Job, and no other Job.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: roadmap-service-job-deletes
  labels:
    app.kubernetes.io/name: roadmap-service
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  policyName: roadmap-service-job-deletes
  validationActions: ["Deny", "Audit"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: devops
