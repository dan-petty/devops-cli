# The planner's run Job reaches no network (ADR 0018, #4003). The pod carries its own label, and
# `devops-default-perimeter-ingress` and `devops-default-perimeter-egress` leave that label out,
# so this policy alone selects it (#6065): NetworkPolicies add their rules, so a second policy
# that selects the pod would add its egress.
# A policy with no ingress rule and no egress rule denies all traffic, DNS included.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: devops-cli-planner-run
  namespace: devops
  labels:
    app.kubernetes.io/name: devops-cli-planner-run
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: devops-cli-planner-run
  policyTypes:
    - Egress
