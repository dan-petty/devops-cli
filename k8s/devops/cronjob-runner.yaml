# The template of the runner Job, the pod in which the implement job runs its steps (#2667). It
# never runs on a schedule: `devops k8s run-job --template runner -- ARGS` and the roadmap
# Service create a Job from it with only the container's args, the name and some labels and
# environment values changed. The shell of a step is no security boundary, so this pod is the
# sandbox: a read-only root, no Linux capability, no Kubernetes token, and the egress of
# `devops-default-perimeter` (DNS, the gateway, the cache, the OTLP collector and public HTTPS).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: devops-cli-runner
  namespace: devops
  labels:
    app.kubernetes.io/name: devops-cli-runner
    app.kubernetes.io/part-of: devops-cli-stack
  annotations:
    ignore-check.kube-linter.io/job-ttl-seconds-after-finished: >-
      A suspended template. The Job made from it keeps the TTL that
      docs/guidelines/kubernetes.md (Bounded) asks for each Job (#6068).
    ignore-check.kube-linter.io/latest-tag: >-
      Argo CD Image Updater sets the digest of the image in Application devops
      (k8s/argocd/image-updater-values.yaml, #6068).
    ignore-check.kube-linter.io/no-liveness-probe: >-
      A Job runs to its end, and activeDeadlineSeconds stops a Job that hangs (#6068).
    ignore-check.kube-linter.io/no-readiness-probe: A Job serves no traffic (#6068).
spec:
  schedule: "0 0 1 1 *"
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # A job that changed GitHub never runs twice.
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: devops-cli-runner
            app.kubernetes.io/part-of: devops-cli-stack
        spec:
          restartPolicy: Never
          serviceAccountName: devops-cli
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: runner
              image: ghcr.io/dan-petty/devops-cli/runner
              imagePullPolicy: IfNotPresent
              args: ["--version"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              envFrom:
                - secretRef:
                    name: devops-cli
              env:
                - name: DEVOPS_CLI_CONFIG
                  value: /config/devops-cli.yaml
                - name: DEVOPS_CLI_DATA_DIR
                  value: /home/devops/.data
                # Only the pod of a runner Job sets this. `devops roadmap implement --confirm`
                # runs a step only when it is true.
                - name: DEVOPS_CLI_ROADMAP_IMPLEMENT_IN_RUNNER
                  value: "true"
                # The telemetry of a runner Job reports under the service name `roadmap-implement`.
                - name: OTEL_SERVICE_NAME
                  value: roadmap-implement
                # Every Job pod of the workload sends this one instance, so its metric stream
                # continues across the Job pods instead of starting again at zero in the same
                # Prometheus series (#4697).
                - name: OTEL_RESOURCE_ATTRIBUTES
                  value: service.instance.id=devops-cli-job
                # The spans and the log records name the cluster (`k8s.cluster.name`) and the
                # namespace (`k8s.namespace.name`) from these two values. The cluster name is the
                # name in k8s/monitoring/k8s-monitoring-values.yaml; without it, they name
                # minikube. The admission policy `roadmap-service-jobs` refuses `valueFrom` in a
                # Job of the Service, so the namespace is a plain value.
                - name: K8S_CONTEXT
                  value: homelab-k3s
                - name: POD_NAMESPACE
                  value: devops
                # `pytest-xdist` starts one worker for each CPU of the node, not of the pod
                # (`-n logical`, 280 MB each). On a node with 48 CPUs that is about 13 GB in a pod
                # with 2 CPUs (#2806). The value equals the CPU limit; a test checks it. The shell
                # of a step takes it from here.
                - name: PYTEST_XDIST_AUTO_NUM_WORKERS
                  value: "2"
                - name: DO_NOT_TRACK
                  value: "1"
                - name: OPENSPEC_TELEMETRY
                  value: "0"
                - name: OPENSPEC_NO_UPDATE_CHECK
                  value: "1"
                - name: PYDANTIC_AI_NO_BANNER
                  value: "1"
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                # The clone, the worktree, its venv, the uv cache and the caches of the checks.
                # Measured on 2026-11-16 (#5960): 1.8 GB for the clone, the worktree, the venv and
                # the cache, and 68 MB for the tree of the mutation run, which the strength check
                # removes after its run. A run of #3648 went over 4 GiB, so the limit is twice that.
                - name: home
                  mountPath: /home/devops
                - name: config
                  mountPath: /config
                  readOnly: true
              resources:
                # The storage limit covers both volumes below (8 Gi and 1 Gi) and the log, so a
                # step cannot fill the disk of the node. The storage request is the 4 GiB that a
                # run of #3648 used (#5960). The memory request is the normal peak of
                # a Job (1.24 GB at most over the 10 Jobs that did not run out of memory). The
                # memory limit is a burst class (#2806): twice the 4.13 GB that the killed Job had
                # reached, and below the 15 Gi that the smallest node can allocate, so a pod that
                # lands on it cannot starve the node. The CPU limit only slows a step, so it stays.
                requests:
                  cpu: "2"
                  memory: 4Gi
                  ephemeral-storage: 4Gi
                limits:
                  cpu: "2"
                  memory: 8Gi
                  ephemeral-storage: 10Gi
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
            - name: home
              emptyDir:
                sizeLimit: 8Gi
            - name: config
              configMap:
                name: devops-cli-config
