# devops-cli's configuration in cluster jobs. It holds no credential: those reach the pod as
# environment variables from Secret devops-cli (`devops k8s push-secrets`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-cli-config
  namespace: devops
  labels:
    app.kubernetes.io/name: devops-cli
    app.kubernetes.io/part-of: devops-cli-stack
data:
  devops-cli.yaml: |
    ai:
      # The gateway in namespace llm, reached directly instead of through the tunnel's edge,
      # which cuts long calls at about 125 s. Its address is private, hence the allowance.
      provider: gateway
      gateway_url: http://llm-gateway.llm.svc.cluster.local:4000/v1
      allow_private_network: true
      model: devops-background
      # devops-background serves one request at a time, so a model call is sent at most two
      # times (k8s/README.md, LLM Gateway).
      max_retries: 1
      tasks:
        # The model lane (stage, refine, alternatives) plans with DeepSeek through the gateway
        # group deepseek-v4.1-flash-1017 (#3155). The verification slot is the model that
        # reviews a plan; no code reads it before #3153 is built.
        analysis:
          model: deepseek-v4.1-flash-1017
          context_window: 65536
        # The implement job runs every step on the same group (#3573). Its prompts, which hold
        # the code of the repository, leave the cluster to OpenRouter (SECURITY.md rule 13). The
        # window is the smallest that an fp8 provider of the group offers (256,000 tokens); the
        # gateway group allows 1,048,576.
        implement:
          model: deepseek-v4.1-flash-1017
          context_window: 256000
        verification:
          model: claude-sonnet-5-5
        chat:
          model: devops-background
        embedding:
          model: qwen3-embedding:0.6b
        triage:
          model: devops-triage
    # devops-cli's cache Valkey in namespace llm (llm/valkey-devops.yaml): the embedding cache
    # and the threat-intelligence cache. Its password reaches the pod from Secret devops-cli as
    # DEVOPS_CLI_VALKEY_PASSWORD, never from this ConfigMap.
    valkey:
      url: valkey://valkey-devops.llm.svc.cluster.local:6379/0
    telemetry:
      enabled: true
      endpoint: http://otel-collector-opentelemetry-collector.otel.svc.cluster.local:4318
    service:
      repos:
        - owner/repo
      # The GitHub App the Service and the cluster jobs act as (ADR 0015). Its private key
      # reaches the pods from Secret devops-cli, never from this ConfigMap.
      github_app:
        app_id: 1
        installation_id: 1
        slug: devops-cli-service
    # The stage job of the Service (k8s/README.md, Roadmap service): it stages the Ready items
    # that this filter names, at most `limit` in a round, in task groups that each fit
    # `step_tokens`. At `planned_limit` open Planned items it plans no new item, except for an
    # item of the highest priority. A repository's ConfigMap changes the filter; an entry is
    # `family=value` over status, priority, type, value or effort. The `toolset` names the tools
    # of a plan run: `extended` adds `references`, `read_issue` and `find_issues`, which read
    # GitHub with the token of the Service; `base` has the nine tools that read the staged
    # commit only.
    roadmap:
      stage:
        filter:
          - status=ready
        limit: 3
        planned_limit: 20
        step_tokens: 64000
        toolset: extended
      # The alternatives row takes `first_pass_limit` items in a round while an item has no
      # check, and `limit` items after, when every item has a check and a round only rechecks.
      alternatives:
        limit: 5
        first_pass_limit: 20
      # One tier for every step class of the implement job (#3573): a step has no weaker or
      # stronger tier to move to, so a failure that selects `change_tier` ends the step.
      implement:
        # The effort values of the passes of the job (#3385): the job takes a low-effort item, and a
        # medium-effort item only when no low-effort item is selectable.
        effort:
          - low
          - medium
        ladder:
          plan: [deepseek-v4.1-flash-1017]
          edit: [deepseek-v4.1-flash-1017]
          repair: [deepseek-v4.1-flash-1017]
          review: [deepseek-v4.1-flash-1017]
