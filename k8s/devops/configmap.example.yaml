# devops-cli's configuration in cluster jobs. It holds no credential: those reach the pod as
# environment variables from Secret devops-cli (`devops k8s push-secrets`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-cli-config
  namespace: devops
  labels:
    app.kubernetes.io/name: devops-cli
    app.kubernetes.io/part-of: devops-cli-stack
data:
  devops-cli.yaml: |
    ai:
      # The gateway in namespace llm, reached directly instead of through the tunnel's edge,
      # which cuts long calls at about 125 s. Its address is private, hence the allowance.
      provider: gateway
      gateway_url: http://llm-gateway.llm.svc.cluster.local:4000/v1
      allow_private_network: true
      # One chat model for every slot of the Service, by the owner decision of 2026-11-07
      # (#3874): ai.model and the tasks analysis, stage, implement, verification, chat and
      # triage name the same group. A failure then shows one model and not a mix. Undo this when
      # most steps of the roadmap jobs work most of the time: then name a model for each slot
      # again. The embedding slot stays the embedding model, because a chat model cannot embed.
      # Each prompt of a chat slot leaves the cluster to OpenRouter (SECURITY.md rule 13).
      model: deepseek-v4.1-flash-1017
      # `model` and `tasks.*.model` name generative models: they write the plans, comments, code
      # and findings, and they use tools. A decision model is a different kind: it answers one
      # closed question (yes/no, one option or a rubric) with a calibrated probability and writes
      # no text. TypeSafe Jev (`typesafe/jev-1.14`) is the decision model of this project. A
      # workflow uses the model that `ai.decision_model` names, only at a registered decision
      # point, and a deterministic rule goes first (ADR 0020). With `ai.decision_model` empty,
      # every point does what it does today. `devops ai ask-jev` asks Jev directly. This section
      # refuses a key that it does not know, and the Service, runner and MCP server images all
      # load this ConfigMap. Thus `decision_model` goes here only after all three images know the
      # key (#4446): #4397 holds the `Live since` comment of its release (Service and runner), and
      # `kubectl -n devops exec deploy/mcp-server -- devops config get ai.decision_model` prints
      # an empty value and no error (MCP server). docs/roadmap/stage.md gives the order.
      # A model call is sent at most two times. The gateway already retries a failed call of
      # the group up to 5 times (router_settings.num_retries in k8s/llm/gateway/config.yaml), so
      # a client retry adds a layer on a call that the provider bills (k8s/README.md, LLM Gateway).
      max_retries: 1
      # The spend reports value local tokens at the hosted price of these two models, by the
      # owner decision of 2026-11-09 (#4241). The prices are the OpenRouter quotes: 0.035 USD
      # input and 1.50 USD output for chat, and 0.01 USD for embeddings, per million tokens.
      # genai-prices does not know both names, so `price_overrides` below holds their prices
      # (#4242). A price that `devops ai cost set-price` saved in the file pricing_overrides.json
      # of the data volume wins over the price here for the same model.
      reference_model: qwen3.8:27b
      reference_embedding_model: qwen/qwen3-embedding-8b
      price_overrides:
        qwen3.8:27b:
          prompt_usd_per_million: 0.035
          completion_usd_per_million: 1.50
        qwen/qwen3-embedding-8b:
          prompt_usd_per_million: 0.01
          completion_usd_per_million: 0.0
      tasks:
        # The model lane (stage, refine, alternatives) plans with DeepSeek through the gateway
        # group deepseek-v4.1-flash-1017 (#3155). The verification slot is the model that
        # reviews a plan; no code reads it before #3153 is built.
        # The stage task needs this window. A plan run needs about 38,000 tokens for its first
        # request and 1.5 million input tokens in 23 requests, and the run ends its tools at
        # three quarters of the window. At 65,536 tokens the tools ended after 2 or 3 requests,
        # and the model answered with a placeholder (#3880). 256,000 tokens is the smallest window
        # that an fp8 provider of the gateway group offers; the group allows 1,048,576.
        # By the owner decision of 2026-11-10 the slot names DeepSeek again (#4369), and the
        # one-model rule of #3874 holds for every chat slot. Sonnet was the slot's model from
        # 2026-11-09 (#4204) and cost about 67 USD a week there. A later trial may name Sonnet
        # again with context_window 200000; the Sonnet group allows 1,000,000 input tokens.
        analysis:
          model: deepseek-v4.1-flash-1017
          context_window: 256000
        # The stage job has its own entry, as the cluster ConfigMap has. Without it the task
        # takes the model and the window of analysis, so a trial of another model in analysis
        # leaves the stage job on DeepSeek.
        stage:
          model: deepseek-v4.1-flash-1017
          context_window: 256000
        # The implement job runs every step on the same group (#3573). Its prompts, which hold
        # the code of the repository, leave the cluster to OpenRouter (SECURITY.md rule 13). The
        # window is the smallest that an fp8 provider of the group offers (256,000 tokens); the
        # gateway group allows 1,048,576.
        implement:
          model: deepseek-v4.1-flash-1017
          context_window: 256000
        # The review run of a plan has the read tools of the planner and no parent task, so it
        # takes the default window of 32,768 tokens when it sets none. The run ends its tools at
        # three quarters of the window, which is 24,576 tokens: too soon for the first request and
        # 8 tool calls (#3911). The window is 256,000 tokens, as it is for analysis, and a run
        # that the window ends too soon fails the item.
        verification:
          model: deepseek-v4.1-flash-1017
          context_window: 256000
        chat:
          model: deepseek-v4.1-flash-1017
        embedding:
          model: qwen3-embedding:0.6b
        triage:
          model: deepseek-v4.1-flash-1017
    # devops-cli's cache Valkey in namespace llm (llm/valkey-devops.yaml): the embedding cache
    # and the threat-intelligence cache. Its password reaches the pod from Secret devops-cli as
    # DEVOPS_CLI_VALKEY_PASSWORD, never from this ConfigMap.
    valkey:
      url: valkey://valkey-devops.llm.svc.cluster.local:6379/0
    # The Crawl4AI service in namespace devops, which gives the text of a web page. Its token
    # reaches the pod from Secret devops-cli as DEVOPS_CLI_CRAWL4AI_API_TOKEN, never from this
    # ConfigMap.
    crawl4ai:
      url: http://crawl4ai.devops.svc.cluster.local:11235
    # The SearXNG service in namespace devops, which searches the web with no key. The cluster
    # address needs ai.allow_private_network. On a workstation, set the address to
    # http://127.0.0.1:8080 after `kubectl port-forward -n devops svc/searxng 8080:8080`.
    search:
      searxng_url: http://searxng.devops.svc.cluster.local:8080
    telemetry:
      enabled: true
      endpoint: http://otel-collector-opentelemetry-collector.otel.svc.cluster.local:4318
    service:
      repos:
        - owner/repo
      # The GitHub App the Service and the cluster jobs act as (ADR 0015). Its private key
      # reaches the pods from Secret devops-cli, never from this ConfigMap.
      github_app:
        app_id: 1
        installation_id: 1
        slug: devops-cli-service
    # The stage job of the Service (k8s/README.md, Roadmap service): it stages the Ready items
    # that this filter names, at most `limit` in a round, in task groups that each fit
    # `step_tokens`. At `planned_limit` open Planned items it plans only items with the priority
    # P0-Critical or P1-High. A repository's ConfigMap changes the filter; an entry is
    # `family=value` over status, priority, type, value or effort. The `toolset` names the tools
    # of a plan run: `extended` adds `references`, `read_issue` and `find_issues`, which read
    # GitHub with the token of the Service; `base` has the nine tools that read the staged
    # commit only.
    roadmap:
      # The MCP server that the stage and implement jobs call at `<url>/<role>/mcp`. Both jobs stay
      # off until `roadmap.stage.mcp` or `roadmap.implement.mcp` is true. They send the token of
      # Secret devops/mcp-server (`devops k8s push-secrets`).
      mcp:
        url: http://mcp-server.devops.svc.cluster.local:8001
      stage:
        filter:
          - status=ready
        limit: 3
        planned_limit: 20
        step_tokens: 64000
        toolset: extended
      # What TypeSafe Jev does in intake (#4395, ADR 0019): `off` makes no request, `shadow` keeps
      # the triage model for every label and records the Jev answers in the job record of each
      # issue (`devops roadmap eval jev --from-shadow` reads them), `on` lets Jev decide. Jev
      # must not decide yet. An image from before #4395 refuses `shadow`: roll the image first.
      intake:
        jev: "off"
      # The row fix_plan repairs one plan pull request with the label plan/needs-fix in a round
      # (#5061, ADR 0021 section 8). `off` sends no request, `plan` logs the pull request that it
      # would take and writes nothing, and `on` revises the plan with the stage models and pushes a
      # better revision. Each new row starts in `plan`, and a person sets `on`.
      fix_plan:
        mode: plan
      # The mode of each decision point (ADR 0020): `off`, `shadow` or `on`. The verify screen
      # (`stage.verify_screen`) asks the decision model before the model review of a plan. In
      # `shadow` the review always runs and the log records the band and the result of the review.
      # A point asks no model while `ai.decision_model` is empty. Turn a point `on` only after a
      # person reads its shadow records and its fit.
      decisions:
        stage.verify_screen: shadow
      # The alternatives row takes `first_pass_limit` items in a round while an item has no
      # check, and `limit` items after, when every item has a check and a round only rechecks.
      alternatives:
        limit: 5
        first_pass_limit: 20
      # Every step class of the implement job has one tier (#3573), as the cluster ConfigMap has
      # it: a failure that selects `change_tier` ends the step. The owner decided on 2026-11-10
      # (#4371) to use DeepSeek first. The code of #4274 supports more tiers for each class, and a
      # Sonnet tier is a later trial, after a Sonnet investigation. A Sonnet tier sends the prompts
      # of a step to Anthropic (SECURITY.md rule 13).
      implement:
        # The effort values of the passes of the job (#3385): the job takes a low-effort item, and a
        # medium-effort item only when no low-effort item is selectable.
        effort:
          - low
          - medium
        ladder:
          edit: [deepseek-v4.1-flash-1017]
          repair: [deepseek-v4.1-flash-1017]
