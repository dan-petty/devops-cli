# devops-cli's configuration in cluster jobs. It holds no credential: those reach the pod as
# environment variables from Secret devops-cli (`devops k8s push-secrets`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-cli-config
  namespace: devops
  labels:
    app.kubernetes.io/name: devops-cli
    app.kubernetes.io/part-of: devops-cli-stack
data:
  devops-cli.yaml: |
    ai:
      # The gateway in namespace llm, reached directly instead of through the tunnel's edge,
      # which cuts long calls at about 125 s. Its address is private, hence the allowance.
      provider: gateway
      gateway_url: http://llm-gateway.llm.svc.cluster.local:4000/v1
      allow_private_network: true
      # Each roadmap job has a task of its own in ai.tasks, so a model trial moves one job
      # (#5903). A new job starts on DeepSeek, the model of ai.model (owner decisions of
      # 2026-11-07, #3874, and 2026-11-16). After its grade reaches 80%, a person can try it on
      # local/qwen3.8:27b with a revert rule. A job stays on local/qwen3.8:27b only while its
      # grade is above 90% over 7 days and its largest request stays under 256,000 tokens (owner
      # decision of 2026-11-13). A task that sets no model uses ai.model. The embedding slot stays
      # the embedding model, because a chat model cannot embed.
      # Each prompt of a DeepSeek slot leaves the cluster to OpenRouter (SECURITY.md rule 13).
      # The DeepSeek slots name the gateway group deepseek-v4.1-flash-1017. On 2026-11-16 its
      # dated model waited about 300 s for its first token on OpenRouter, and every job call
      # failed until a person moved the slots to deepseek-v4.1-flash (#5988). The group now does
      # this itself (#5990): a failed call or a failed health check takes the dated model out of
      # the routing, the next calls go to order 2 (the undated model, about 4 times the input
      # price), and the dated model gets its calls back when its checks pass. A call in flight
      # when the stall begins still fails, and the client sends it again (#5965).
      model: openrouter/deepseek/deepseek-v4.1-flash-1017
      # `model` and `tasks.*.model` name generative models: they write the plans, comments, code
      # and findings, and they use tools. A decision model is a different kind: it answers one
      # closed question (yes/no, one option or a rubric) with a calibrated probability and writes
      # no text. TypeSafe Jev (`typesafe/jev-1.14`) is the decision model of this project. A
      # workflow uses the model that `ai.decision_model` names, only at a registered decision
      # point, and a deterministic rule goes first (ADR 0020). With `ai.decision_model` empty,
      # every point does what it does today. `devops ai ask-jev` asks Jev directly. This section
      # refuses a key that it does not know, and the Service, runner and MCP server images all
      # load this ConfigMap. Each image knows the key since #4397: on 2026-11-15 the Service, a
      # runner Job and the MCP server printed an empty value and no error for `devops config get
      # ai.decision_model` (#4446). docs/roadmap/stage.md gives the order.
      # A point in the mode `shadow` records the answer of the model and keeps the rule, and a
      # point in the mode `on` takes the answer when its fitted cut exists (ADR 0020).
      decision_model: typesafe/jev-1.14
      # A model call is sent at most two times. The gateway owns the retries: it retries a failed
      # call of the group up to 5 times and then falls back (router_settings in
      # k8s/llm/gateway/config.yaml). The client sends a call again only when the call did not
      # reach the gateway, or when its stream failed before its first event (#5965), and each
      # send is a call that the provider bills (k8s/README.md, LLM Gateway).
      max_retries: 1
      # The spend reports value local tokens at the hosted price of these two models, by the
      # owner decision of 2026-11-09 (#4241). The prices are the OpenRouter quotes: 0.035 USD
      # input and 1.50 USD output for chat, and 0.01 USD for embeddings, per million tokens.
      # genai-prices does not know both names, so `price_overrides` below holds their prices
      # (#4242). A price that `devops ai cost set-price` saved in the file pricing_overrides.json
      # of the data volume wins over the price here for the same model.
      reference_model: qwen3.8:27b
      reference_embedding_model: qwen/qwen3-embedding-8b
      price_overrides:
        qwen3.8:27b:
          prompt_usd_per_million: 0.035
          completion_usd_per_million: 1.50
        qwen/qwen3-embedding-8b:
          prompt_usd_per_million: 0.01
          completion_usd_per_million: 0.0
        # Jev bills by input token at 0.042 USD per million and charges no output (k8s/README.md,
        # #4296). The client records the tokens of each Jev decision call in the spend ledger.
        typesafe/jev-1.14:
          prompt_usd_per_million: 0.042
          completion_usd_per_million: 0.0
      tasks:
        # The roadmap jobs plan with DeepSeek through the gateway group deepseek-v4.1-flash-1017
        # (#3155), which moves a call to the undated model while the dated model stalls (#5990).
        # By the owner decision of 2026-11-10 the planner names
        # DeepSeek again (#4369), and the one-model rule of #3874 holds for each job that has no
        # trial. Sonnet was the planner's model from 2026-11-09 (#4204) and cost about
        # 67 USD a week there. A later trial may name Sonnet again with context_window 200000;
        # the Sonnet group allows 1,000,000 input tokens.
        # A plan run needs about 38,000 tokens for its first request and 1.5 million input tokens
        # in 23 requests, and the run ends its tools at three quarters of the window. At 65,536
        # tokens the tools ended after 2 or 3 requests, and the model answered with a placeholder
        # (#3880). No provider limit sets 256,000 tokens now: on 2026-11-19 each fp8 endpoint of
        # the group offered 1,000,000 tokens or more, and the group allows 1,048,576. The stage
        # run reached its window stop in 5 of the 28 six-hour periods of the 7 days to 2026-11-19
        # (devops_cli_roadmap_tool_limit_hits_total, limit "window").
        stage:
          model: openrouter/deepseek/deepseek-v4.1-flash-1017
          context_window: 256000
        # The review run of a plan has the read tools of the planner, so it takes the default
        # window of 32,768 tokens when it sets none. The run ends its tools at three quarters of
        # the window, which is 24,576 tokens: too soon for the first request and 8 tool calls
        # (#3911). A run that the window ends too soon fails the item.
        stage_review:
          model: openrouter/deepseek/deepseek-v4.1-flash-1017
          context_window: 256000
        # The step fix-plan repairs a plan with the stage planner and its review, on tasks of its
        # own, so a trial of the stage job does not move it.
        fix_plan:
          model: openrouter/deepseek/deepseek-v4.1-flash-1017
          context_window: 256000
        fix_plan_review:
          model: openrouter/deepseek/deepseek-v4.1-flash-1017
          context_window: 256000
        # Refine ran a trial on the local model from 2026-11-16, and returned to DeepSeek on the
        # same day: 2 of its first 8 runs ended with no structured reply (UnexpectedModelBehavior).
        refine:
          model: openrouter/deepseek/deepseek-v4.1-flash-1017
          context_window: 256000
        refine_review:
          model: openrouter/deepseek/deepseek-v4.1-flash-1017
          context_window: 256000
        # The alternatives check ran a trial on the local model from 2026-11-16, and returned to
        # DeepSeek on the same day: it passed 8 of 20 runs, and 11 ended with no structured reply
        # (UnexpectedModelBehavior) (#5933).
        alternatives:
          model: openrouter/deepseek/deepseek-v4.1-flash-1017
          context_window: 256000
        consolidate:
          model: openrouter/deepseek/deepseek-v4.1-flash-1017
          context_window: 256000
        # The implement job runs every step on the same group (#3573). Its prompts, which hold
        # the code of the repository, leave the cluster to OpenRouter (SECURITY.md rule 13). The
        # window is 256,000 tokens. No provider limit sets it: on 2026-11-19 each fp8 endpoint of
        # the group offered 1,000,000 tokens or more, and the group allows 1,048,576. The task
        # implement_split is the call that splits a task group of the job.
        implement:
          model: openrouter/deepseek/deepseek-v4.1-flash-1017
          context_window: 256000
        implement_split:
          model: openrouter/deepseek/deepseek-v4.1-flash-1017
          context_window: 256000
        # The fix-checks Job runs a step of the implement job, so its task gets the window of the
        # implement task. With no entry, its window is the code default of 128,000 tokens.
        # fix_checks passed 1 of 8 runs in the 7 days to 2026-11-19, and a limit of a job under
        # 80% goes up. No failure of the 8 is a window stop.
        fix_checks:
          model: openrouter/deepseek/deepseek-v4.1-flash-1017
          context_window: 256000
        # Intake and retitle run on the local model in the cluster, by the owner decision of
        # 2026-11-15, so their prompts stay in the cluster.
        intake:
          model: local/qwen3.8:27b
        retitle:
          model: local/qwen3.8:27b
        chat:
          model: openrouter/deepseek/deepseek-v4.1-flash-1017
        embedding:
          model: local/qwen3-embedding:0.6b
    # devops-cli's cache Valkey in namespace llm (llm/valkey-devops.yaml): the embedding cache
    # and the threat-intelligence cache. Its password reaches the pod from Secret devops-cli as
    # DEVOPS_CLI_VALKEY_PASSWORD, never from this ConfigMap.
    valkey:
      url: valkey://valkey-devops.llm.svc.cluster.local:6379/0
    # Qdrant in namespace llm, the vector store of the RAG index. The pods send the read-only key
    # from Secret devops-cli as DEVOPS_CLI_QDRANT_API_KEY, never from this ConfigMap (#3823).
    qdrant:
      url: http://qdrant.llm.svc.cluster.local:6333
    # The Crawl4AI service in namespace devops, which gives the text of a web page. Its token
    # reaches the pod from Secret devops-cli as DEVOPS_CLI_CRAWL4AI_API_TOKEN, never from this
    # ConfigMap.
    crawl4ai:
      url: http://crawl4ai.devops.svc.cluster.local:11235
    # The SearXNG service in namespace devops, which searches the web with no key. The cluster
    # address needs ai.allow_private_network. On a workstation, set the address to
    # http://127.0.0.1:8080 after `kubectl port-forward -n devops svc/searxng 8080:8080`.
    search:
      searxng_url: http://searxng.devops.svc.cluster.local:8080
    telemetry:
      enabled: true
      endpoint: http://otel-collector-opentelemetry-collector.otel.svc.cluster.local:4318
    service:
      repos:
        - owner/repo
      # The GitHub App the Service and the cluster jobs act as (ADR 0015). Its private key
      # reaches the pods from Secret devops-cli, never from this ConfigMap.
      github_app:
        app_id: 1
        installation_id: 1
        slug: devops-cli-service
    # The stage job of the Service (docs/CLUSTER.md, Roadmap service): it stages the Ready items
    # that this filter names, one stage Job for each free slot of `jobs` and `model_jobs`, in
    # task groups that each fit `step_tokens`. `limit` applies only to a `devops roadmap stage`
    # run that a person starts. At `planned_limit` open Planned items it plans only items with the priority
    # P0-Critical or P1-High. A repository's ConfigMap changes the filter; an entry is
    # `family=value` over status, priority, type, value or effort. The `toolset` names the tools
    # of a plan run: `extended` adds `references`, `read_issue` and `find_issues`, which read
    # GitHub with the token of the Service; `base` has the nine tools that read the staged
    # commit only.
    roadmap:
      # The MCP server that the stage and implement jobs call at `<url>/<role>/mcp`. A job adds
      # the remote tools of its role only when `roadmap.stage.mcp` or `roadmap.implement.mcp` is
      # true, and then sends the token of Secret devops/mcp-server (`devops k8s push-secrets`).
      # Both are false, so no job calls this URL now.
      mcp:
        url: http://mcp-server.devops.svc.cluster.local:8001
      stage:
        filter:
          - status=ready
        limit: 3
        planned_limit: 20
        step_tokens: 64000
        toolset: extended
        # The stage Jobs that run at once in the cluster, for every repository together (#4559).
        # Each Job plans one item in a pod of its own, with one model call in flight.
        jobs: 1
        # While the stage queue holds 10 or more items, the next stage round starts 4 minutes
        # after the last one, not at the interval of the row, so a free slot gets its next Job at
        # the next poll. In the 7 days to 2026-11-19 the next Job started a median of 9.1 minutes
        # after a Job ended, while the queue grew from 186 to 207 items in one day. A stage round
        # costs about 6 counted GitHub requests.
        backlog_interval_minutes: 4
        backlog_threshold: 10
        # The limits that end a stage attempt (#5440) are twice the code defaults, by the owner
        # decision of 2026-11-13 for the jobs under 80%, and again on 2026-11-16 (#5583).
        # `gate_returns` is 8 since 2026-11-19: from 2026-11-16, 5 of the 6 gate refusals ended at
        # return 6, and stage passed 49% of its attempts in 7 days. The settings refuse a value
        # above 12.
        verify_repair_rounds: 4
        verify_repair_rounds_ceiling: 8
        gate_returns: 8
        gate_return_extensions: 2
        plan_defect_limit: 6
        max_requests: 500
        max_tool_calls: 400
      # What TypeSafe Jev does in intake (#4395, ADR 0019): `off` makes no request, `shadow` keeps
      # the triage model for every label and records the Jev answers in the job record of each
      # issue (`devops roadmap eval jev --from-shadow` reads them), `on` lets Jev decide. Jev
      # must not decide yet.
      intake:
        jev: "off"
      # The row fix_plan repairs one plan pull request with the label verdict/fix-plan in a round
      # (#5061, ADR 0021 section 8). `off` sends no request, `plan` logs the pull request that it
      # would take and writes nothing, and `on` revises the plan with the models of the tasks
      # fix_plan and fix_plan_review and pushes a better revision. Each new row starts in `plan`, and a person sets `on`.
      fix_plan:
        mode: plan
        # The limits of an attempt, twice the code defaults (#5583).
        time_budget_seconds: 7200
        head_attempts: 4
        revisions: 6
      # The row open opens the pull request of a pushed delivery branch that the job record of an
      # open item names and that has no pull request (#5974). `off` sends no request, `plan` logs
      # each branch and writes nothing, and `on` runs the open step, which checks the title, the
      # body and the labels with the rules of CI. It starts in `plan`, and a person sets `on`.
      open:
        mode: plan
      # The watch row starts one fix-checks Job from CronJob devops-cli-runner for a bot pull
      # request whose check fails with the class test, lint, types or plan check (#5027). `off`
      # starts none, `plan` runs the step without --confirm, so the Job logs the repair that it
      # would make and writes nothing, and `on` repairs the check and pushes. The code starts in
      # `plan`; by the owner direction of 2026-11-16 this cluster runs `on`, with no week in `plan`.
      fix_checks:
        mode: "on"
      # The step review gives a bot pull request one verdict (#5969). `off` sends no request,
      # `plan` judges and logs the verdict and writes nothing, and `on` lets
      # `devops roadmap step review --confirm` write the label and the comment and take the next
      # action. A pull request gets at most `rounds` verdicts, and one review at most
      # `token_budget` new tokens. It starts in `plan`, and a person sets `on`. The code default
      # of the task `ai.tasks.review` is DeepSeek with a 256,000-token window, so this file does
      # not set it.
      review:
        mode: plan
        rounds: 3
        token_budget: 16000000
      # The most model Jobs that run at once in the cluster, for all repositories together: the
      # implement, stage and fix-checks Jobs, with the fix-checks Jobs first (#6017). The owner
      # chose 6 on 2026-11-16. The code default is 2.
      model_jobs: 6
      # The mode of each decision point (ADR 0020): `off`, `shadow` or `on`. The verify screen
      # (`stage.verify_screen`) asks the decision model before the model review of a plan. In
      # `shadow` the review always runs and the log records the band and the result of the review.
      # A point asks no model while `ai.decision_model` is empty. Turn a point `on` only after a
      # person reads its shadow records and its fit.
      decisions:
        stage.verify_screen: shadow
      # The alternatives row takes `first_pass_limit` items in a round while an item has no
      # check, and `limit` items after, when every item has a check and a round only rechecks.
      alternatives:
        limit: 5
        first_pass_limit: 20
      # Every step class of the implement job has one tier (#3573), as the cluster ConfigMap has
      # it: a failure that selects `change_tier` ends the step. The owner decided on 2026-11-10
      # (#4371) to use DeepSeek first. The code of #4274 supports more tiers for each class, and a
      # Sonnet tier is a later trial, after a Sonnet investigation. A Sonnet tier sends the prompts
      # of a step to Anthropic (SECURITY.md rule 13).
      implement:
        # The effort values of the passes of the job (#3385): the job takes a low-effort item, and a
        # medium-effort item only when no low-effort item is selectable.
        effort:
          - low
          - medium
        ladder:
          edit: [openrouter/deepseek/deepseek-v4.1-flash-1017]
          repair: [openrouter/deepseek/deepseek-v4.1-flash-1017]
        # The memory limit of a runner Job, above the 2Gi or 6Gi request of its plan. The code
        # default 8Gi is the limit at which the kernel killed two runner Jobs, on 2026-11-12 and
        # on 2026-11-13 (#3727), so this cluster sets 16Gi (#5484). A deploy renders this
        # template and replaces only the `service` section, so a value that a person sets in the
        # live ConfigMap alone is lost at the next deploy.
        max_memory_limit: 16Gi
        # The limits that end an implement attempt (#5440) are twice the code defaults, by the
        # owner decision of 2026-11-13 for the jobs under 80%, and again on 2026-11-16 (#5583).
        # The token budgets count new tokens: input that the cache does not hold, and output.
        # The times nest: a command ends before its step, and a step before its item. The item
        # time is not twice its default of 12600 s: it stops at the 14400 s ceiling of the
        # deadline of the Job.
        repair_rounds: 6
        # The two token budgets are four times the code defaults: the owner rule of 2026-11-16
        # gives every job generous token limits while the jobs are not yet reliable (#5970).
        step_token_budget: 32000000
        item_token_budget: 80000000
        command_timeout_seconds: 3600
        request_timeout_seconds: 2400
        monitor_timeout_seconds: 7200
        step_time_limit_seconds: 10800
        item_time_limit_seconds: 14400
        deadline_stall_seconds: 8400
        deadline_extension_seconds: 10800
        digest_clears_per_class: 2
        digest_clears_per_item: 6
        continuations_per_item: 4
        max_requests: 1000
        max_tool_calls: 3000
        tool_retries: 10
        max_refusals: 60
        max_consecutive_refusals: 6
        model_resends: 2
