# devops-cli's configuration in cluster jobs. It holds no credential: those reach the pod as
# environment variables from Secret devops-cli (`devops k8s push-secrets`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-cli-config
  namespace: devops
  labels:
    app.kubernetes.io/name: devops-cli
    app.kubernetes.io/part-of: devops-cli-stack
data:
  devops-cli.yaml: |
    ai:
      # The gateway in namespace llm, reached directly instead of through the tunnel's edge,
      # which cuts long calls at about 125 s. Its address is private, hence the allowance.
      provider: gateway
      gateway_url: http://llm-gateway.llm.svc.cluster.local:4000/v1
      allow_private_network: true
      model: devops-background
      # devops-background serves one request at a time, so a model call is sent at most two
      # times (k8s/README.md, LLM Gateway).
      max_retries: 1
      tasks:
        analysis:
          model: devops-background
          context_window: 65536
        chat:
          model: devops-background
        embedding:
          model: qwen3-embedding:0.6b
    # devops-cli's cache Valkey in namespace llm (llm/valkey-devops.yaml): the embedding cache
    # and the threat-intelligence cache. Its password reaches the pod from Secret devops-cli as
    # DEVOPS_CLI_VALKEY_PASSWORD, never from this ConfigMap.
    valkey:
      url: valkey://valkey-devops.llm.svc.cluster.local:6379/0
    telemetry:
      enabled: true
      endpoint: http://otel-collector-opentelemetry-collector.otel.svc.cluster.local:4318
    service:
      repos:
        - owner/repo
      # The GitHub App the Service and the cluster jobs act as (ADR 0015). Its private key
      # reaches the pods from Secret devops-cli, never from this ConfigMap.
      github_app:
        app_id: 1
        installation_id: 1
        slug: devops-cli-service
    # The stage job of the Service (k8s/README.md, Roadmap service): it stages the Ready items
    # that this filter names, at most `limit` in a round, in task groups that each fit
    # `step_tokens`. A repository's ConfigMap changes the filter; an entry is `family=value` over
    # status, priority, type, value or effort.
    roadmap:
      stage:
        filter:
          - status=ready
          - priority=p0-critical
          - priority=p1-high
          - type=bug
        limit: 3
        step_tokens: 40000
