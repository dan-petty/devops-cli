# The roadmap Service and the Job pods call the MCP server on TCP 8001 (#3220). This policy adds to
# `devops-default-perimeter`, which gives those pods no intra-namespace port. A Job pod carries the
# label `devops-cli-job` that `build_job` sets, not the label of the CronJob template (#4355; a
# test holds the two equal).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-server-clients
  namespace: devops
  labels:
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - roadmap-service
          - devops-cli-job
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-server
      ports:
        - protocol: TCP
          port: 8001
