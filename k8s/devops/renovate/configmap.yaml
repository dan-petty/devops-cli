# The global config of self-hosted Renovate (#4905, ADR 0027). Renovate reads `config.js`
# (RENOVATE_CONFIG_FILE), which takes the settings of `config.json` and adds the token that the
# init container `token` wrote. The settings are JSON, so a test reads them
# (tests/invariants/test_k8s_renovate.py):
#
# - `autodiscover`: the installation of the App `dan-petty-renovate` is the scope, so no
#   repository list is copied here.
# - `onboarding` is false and `requireConfig` is `required`: a repository with no Renovate config
#   gets no onboarding pull request, and Renovate skips it. Only devops-cli holds a config. #4913
#   turns `onboarding` on for the other Service repositories, and then `onboardingConfig` extends
#   the shared preset of #4896.
# - `binarySource: install`: containerbase installs the uv, Python and Node versions that a
#   repository asks for. `containerbaseDir` keeps the downloads on the claim, under `cacheDir`.
#   Renovate keeps the OSV database in `cacheDir` too.
# - `allowedCommands`: empty, so no `postUpgradeTasks` command runs (#6022). #6020 keeps the token
#   away from the tasks; then each command gets an anchored regex again, with no shell.
# - `executionTimeout` (minutes) ends a child process before the Job deadline, which ends before
#   GitHub ends the token.
# - No `gitAuthor`: `platformCommit` (the shared preset) makes GitHub write and sign each commit
#   as the App bot. No Mend service is used.
apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-config
  namespace: devops
  labels:
    app.kubernetes.io/name: renovate
    app.kubernetes.io/part-of: devops-cli-stack
data:
  # The option `token` reads the file that the init container `token` wrote: the installation
  # token of the Renovate App, with no newline, and removes the file at once (#6020). The key is
  # quoted, as in config.json. Trivy KSV-0109 reads an unquoted `token:` line as a secret in the
  # ConfigMap, and this line holds a file read, not a secret.
  config.js: |
    // Renovate reads this file (RENOVATE_CONFIG_FILE). The settings are in config.json.
    const { readFileSync, unlinkSync } = require('node:fs');

    const tokenPath = process.env.DEVOPS_CLI_TOKEN_FILE ?? '/token/github-token';
    const token = readFileSync(tokenPath, 'utf8');
    unlinkSync(tokenPath);

    module.exports = {
      ...require('./config.json'),
      'token': token,
    };
  config.json: |
    {
      "platform": "github",
      "autodiscover": true,
      "onboarding": false,
      "requireConfig": "required",
      "onboardingConfig": {
        "extends": ["github>dan-petty/devops-cli//.github/renovate/base"]
      },
      "binarySource": "install",
      "cacheDir": "/cache",
      "containerbaseDir": "/cache/containerbase",
      "repositoryCache": "enabled",
      "reportType": "file",
      "reportPath": "/report/renovate-report.json",
      "allowedCommands": [],
      "allowShellExecutorForPostUpgradeCommands": false,
      "executionTimeout": 15,
      "persistRepoData": false
    }
