# The alert rules of devops-cli: the rule groups that watch the `devops_cli_*` series of the
# roadmap Service, of its page fetches, of `devops research sweep`, of the model spend and of the
# RAG ingest workflow. They are product content, so they stay in devops-cli (#5292).
#
# Application `prometheus` gives the prometheus chart this file after the environment values
# (k8s/monitoring/prometheus-values.yaml), as its second `$values` file, and `devops k8s
# deploy-stack` gives `helm upgrade` both files in the same order. The chart writes each key of
# `serverFiles` to the ConfigMap `prometheus-server`, which the server mounts at /etc/config. The
# `rule_files` of the environment values name /etc/config/devops_cli_alerting_rules.yml, so the
# server loads this file next to the environment rules. A group name is unique over both files.
#
# Every rule carries `severity` (critical or warning), as the environment rules do (k8s/README.md,
# Alerting).
serverFiles:
  devops_cli_alerting_rules.yml:
    groups:
      # The roadmap Service (#2472). Two paths send its series, and both give them
      # job="roadmap-service": k8s-monitoring's annotation autodiscovery scrapes its /metrics and
      # names the job after the pod's app.kubernetes.io/name, and the OpenTelemetry collector
      # names the job after OTEL_SERVICE_NAME. Each selector names the job, so the same series of
      # a workstation (job="devops-cli"), or of the server's kubernetes-pods job, which scraped the
      # pod before #1130, never counts.
      # kube-state-metrics gives the restarts and the replicas. The Service starts its /metrics
      # counters at zero (#3495), so their series need no zero sample here. The OTLP series get a
      # sample only when the Service sends a new observation, and the collector starts a stream
      # again from zero after an hour with none (max_stale). So each count of the last hour reads
      # a series with no sample in the hour before as new, and gives its last value, which is all
      # of its count. Each other series gives its increase(). Neither part reads one sample near
      # the start of the hour, so a sparse series from before the hour adds none of its earlier
      # count (#2505).
      - name: roadmap-service
        rules:
          # A refusal stops every round, also after a restart, until a person removes the halt
          # record, and /healthz stays healthy. A start that finds the record counts the refusal
          # again, so the counter stays at 1 and the alert holds while the Service is stopped.
          - alert: RoadmapServiceIdentityRefused
            expr: max by (identity) (devops_cli_service_identity_refused_total{job="roadmap-service"}) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "GitHub refused the identity {{ $labels.identity }} of the roadmap Service"
              description: "The roadmap Service stopped all rounds and starts no round, also after a restart, until a person removes its halt record. Its health check stays healthy. Repair the GitHub App, remove the halt record, then restart the Service (docs/CLUSTER.md, Roadmap service)."
          # Each sample is a throttle, so one sample in 15 minutes fires. increase() needs two
          # samples in its window and does not see one throttle alone.
          - alert: RoadmapServiceGitHubThrottled
            expr: sum by (resource) (count_over_time(devops_cli_github_throttle_wait_seconds{job="roadmap-service"}[15m])) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "GitHub throttled {{ $labels.resource }} requests of the roadmap Service"
              description: "In the last 15 minutes GitHub refused a {{ $labels.resource }} request of the roadmap Service with a rate limit, or gave a 5xx for a read. The Service waited and sent the request again (docs/CLUSTER.md, Roadmap service)."
          # When all jobs of one row of a repository fail in one hour, alert after 30 minutes. A
          # round counts each of its rows, so a join on the lane hides a row that fails while
          # another row of its lane succeeds (#3495).
          - alert: RoadmapServiceJobsFailing
            expr: >-
              sum by (repo, lane, row) (increase(devops_cli_service_jobs_total{job="roadmap-service", result="error"}[1h])) > 0
              unless on (repo, lane, row)
              sum by (repo, lane, row) (increase(devops_cli_service_jobs_total{job="roadmap-service", result="success"}[1h])) > 0
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "All {{ $labels.row }} jobs of {{ $labels.repo }} failed in the last hour, on the {{ $labels.lane }} lane"
              description: '{namespace="devops"} | json | repo="{{ $labels.repo }}" | lane="{{ $labels.lane }}" (docs/CLUSTER.md, Roadmap service)'
          # Each poll starts a round on every lane, every 5 minutes by default. A worker sets the
          # job start of its lane when it starts, so a lane of a new pod that starts no job also
          # fires (#2505). A replica that is not available starts no job, and
          # RoadmapServiceUnavailable covers it.
          - alert: RoadmapServiceLaneStalled
            expr: >-
              time() - max by (repo, lane) (devops_cli_service_job_start_timestamp_seconds{job="roadmap-service"}) > 7200
              and on () max(kube_deployment_status_replicas_available{namespace="devops", deployment="roadmap-service"}) > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "No {{ $labels.lane }} job of {{ $labels.repo }} started for {{ $value | humanizeDuration }}"
              description: "The roadmap Service has an available replica, but no {{ $labels.lane }} job of {{ $labels.repo }} started for over 2 hours (docs/CLUSTER.md, Roadmap service)."
          - alert: RoadmapServiceRestarted
            expr: max by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total{namespace="devops", pod=~"roadmap-service-.+", container="service"}[1h])) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "The roadmap Service container in {{ $labels.pod }} restarted"
              description: 'The restart count of container {{ $labels.container }} of pod {{ $labels.namespace }}/{{ $labels.pod }} increased by {{ printf "%.0f" $value }} in the last hour (docs/CLUSTER.md, Roadmap service).'
          # The kernel kills the container at its memory limit, and RoadmapServiceRestarted fires
          # only after that. The working set grew 100 to 150 MiB each hour before the kill (#4116).
          # The two series come from the kubelet and kube-state-metrics, so max by drops their
          # other labels and the division matches on namespace and pod.
          - alert: RoadmapServiceMemoryNearLimit
            expr: >-
              max by (namespace, pod) (container_memory_working_set_bytes{namespace="devops", pod=~"roadmap-service-.+", container="service"})
              / max by (namespace, pod) (kube_pod_container_resource_limits{namespace="devops", pod=~"roadmap-service-.+", container="service", resource="memory"})
              > 0.85
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: 'The roadmap Service container in {{ $labels.pod }} uses {{ $value | humanizePercentage }} of its memory limit'
              description: 'The working set of container service of pod {{ $labels.namespace }}/{{ $labels.pod }} has been above 85% of its memory limit for 10 minutes, and the kernel kills the container at 100% (docs/CLUSTER.md, Roadmap service).'
          # The Recreate strategy stops the old pod before it starts the new one, so a rollout
          # has no available replica for a few minutes.
          - alert: RoadmapServiceUnavailable
            expr: max by (namespace, deployment) (kube_deployment_status_replicas_unavailable{namespace="devops", deployment="roadmap-service"}) > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "The roadmap Service has an unavailable replica"
              description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has had an unavailable replica for 10 minutes (docs/CLUSTER.md, Roadmap service)."
          # 90% of the hourly budget that the Service reports (service.github_requests_per_hour,
          # 500 by default). The Service holds its requests at the budget: a request waits when
          # the hour has no room. The request counter comes over OTLP and the limit from the
          # scrape of the pod, so their instance labels differ and on() joins the two sums. A
          # Service that is down reports no limit: RoadmapServiceUnavailable covers that case.
          # The sums leave out status 304: GitHub does not count such an answer against its rate
          # limit, and the budget does not count it either (#3939).
          - alert: RoadmapServiceGitHubRequestsHigh
            expr: >-
              sum(
              (last_over_time(devops_cli_github_requests_total{job="roadmap-service", status!="304"}[1h])
              unless last_over_time(devops_cli_github_requests_total{job="roadmap-service", status!="304"}[1h] offset 1h))
              or increase(devops_cli_github_requests_total{job="roadmap-service", status!="304"}[1h])
              ) > on() 0.9 * max(devops_cli_service_budget_limit_requests{job="roadmap-service"})
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: 'The roadmap Service sent {{ printf "%.0f" $value }} GitHub requests in the last hour'
              description: "The roadmap Service sent more than 90% of its hourly GitHub request budget in one hour (docs/CLUSTER.md, Roadmap service)."
          # A request that the cache answered does not go to a model.
          - alert: RoadmapServiceModelRequestsHigh
            expr: >-
              sum(
              (last_over_time(devops_cli_ai_requests_total{job="roadmap-service", cached!="true"}[1h])
              unless last_over_time(devops_cli_ai_requests_total{job="roadmap-service", cached!="true"}[1h] offset 1h))
              or increase(devops_cli_ai_requests_total{job="roadmap-service", cached!="true"}[1h])
              ) > 352
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: 'The roadmap Service sent {{ printf "%.0f" $value }} model requests in the last hour'
              description: "The roadmap Service sent more than 352 model requests in one hour (docs/CLUSTER.md, Roadmap service)."
          # The Service keeps three records on its volume: the budget, the halt and the failure ledger.
          # A write error is one log line, and the Service goes on with memory only (#2474). The gauge is
          # 1 after a write error and 0 after the next good write, by record (#4048). The rule waits 15
          # minutes, so a fault that the next write repairs does not alert.
          - alert: RoadmapServiceStateUnkept
            expr: max by (record) (devops_cli_service_state_unkept{job="roadmap-service"}) > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "The roadmap Service could not write its {{ $labels.record }} record"
              description: "The roadmap Service could not write its {{ $labels.record }} record to its volume, so a restart loses what the record holds. The Service goes on with memory only. Check the free space and the permissions of the volume, and the log line that starts with Could not write (docs/CLUSTER.md, Roadmap service)."
          # A row that failed its limit of rounds in a row waits for its retry time or for new input
          # (#4065). The gauge is 1 while it waits, by repo, row and class, and the series of an old
          # class is set to 0. The rule waits 3 hours: a wait of 1 hour that the first probe round
          # ends does not alert, and a row that fails probe rounds, or waits 6 hours, does.
          - alert: RoadmapServiceRowSuspended
            expr: max by (repo, row, class) (devops_cli_service_job_suspended{job="roadmap-service"}) > 0
            for: 3h
            labels:
              severity: warning
            annotations:
              summary: "The row {{ $labels.row }} of {{ $labels.repo }} stays suspended after a {{ $labels.class }} failure"
              description: "The roadmap Service did not run the row {{ $labels.row }} of {{ $labels.repo }} for 3 hours, because it failed its limit of rounds in a row (setting service.max_failed_rounds) with the failure class {{ $labels.class }}. The row runs one probe round when its retry time comes, or at once when its input changes. The gauge devops_cli_service_job_retry_after_seconds shows the seconds before the next probe round (docs/CLUSTER.md, Roadmap service)."
      # The webhook route of the roadmap Service (#2476), in a group apart from roadmap-service.
      # The route counts each delivery that it refuses under outcome="rejected": unsigned, signed
      # with no secret of a managed repository, too large, not JSON, or without its event name or
      # delivery ID. A forged delivery counts under the event that it names, or under "other", so a
      # flood can start a new label set. The Service starts each label set at zero (#3495), so
      # increase() counts each delivery of a label set from its start, and the rule needs no
      # workaround term. The Service serves this counter only on its /metrics, not through OTLP.
      - name: roadmap-service-webhooks
        rules:
          - alert: RoadmapServiceWebhooksRejected
            expr: sum(increase(devops_cli_service_webhook_deliveries_total{job="roadmap-service", outcome="rejected"}[15m])) > 20
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: 'The roadmap Service rejected {{ printf "%.0f" $value }} webhook deliveries in the last 15 minutes'
              description: "The webhook route of the roadmap Service rejected more than 20 deliveries in 15 minutes: a hook whose secret is wrong, or forged deliveries. Check the last response of each hook (docs/CLUSTER.md, Roadmap service)."
          # GitHub's record of the deliveries of the hooks (#5017). A refusal at the Cloudflare
          # edge answers before Traefik and the route, so the counter above cannot see it. The
          # metrics row of the Service sets the gauge, by repo and code, to the deliveries of the
          # last 15 minutes with no 2xx answer, each time it runs (every 13 minutes), and keeps
          # the value of its last read between reads.
          - alert: RoadmapServiceWebhookDeliveriesFailed
            expr: sum by (repo) (devops_cli_service_webhook_delivery_failures{job="roadmap-service"}) > 5
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: 'GitHub could not deliver {{ printf "%.0f" $value }} webhook deliveries of {{ $labels.repo }} in 15 minutes'
              description: "More than 5 deliveries of the hooks of {{ $labels.repo }} got no 2xx answer in 15 minutes, as GitHub records them. GitHub does not send a failed delivery again. A 403 with the header Server: cloudflare comes from the Cloudflare edge, which RoadmapServiceWebhooksRejected cannot see. Read the failed deliveries of each hook (docs/CLUSTER.md, Roadmap service)."
      # What the roadmap Service writes, the deliveries of its own writes, and its web search
      # (#2475): a burst of comments or label writes, an echo loop with another bot or workflow,
      # and a search provider that refuses for want of credits or at its rate limit. Each count of the last hour
      # reads a series that starts in the hour as the group roadmap-service does (#2505). One rule
      # warns when the alternatives check searches nothing for 3 days (#2950).
      - name: roadmap-service-activity
        rules:
          # GraphQL sends a read and a mutation alike as a POST, and the roadmap jobs write only
          # through REST, so the rule counts the REST requests with a write method. It names each
          # write method of the request classifier: PromQL reads an absent label as the empty
          # string, so a matcher such as method!="GET" counts each request of a series with no
          # method label, such as one of an older image, as a write (#2574).
          - alert: RoadmapServiceGitHubWritesHigh
            expr: >-
              sum(
              (last_over_time(devops_cli_github_requests_total{job="roadmap-service", method=~"POST|PUT|PATCH|DELETE", resource!="graphql"}[1h])
              unless last_over_time(devops_cli_github_requests_total{job="roadmap-service", method=~"POST|PUT|PATCH|DELETE", resource!="graphql"}[1h] offset 1h))
              or increase(devops_cli_github_requests_total{job="roadmap-service", method=~"POST|PUT|PATCH|DELETE", resource!="graphql"}[1h])
              ) > 300
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: 'The roadmap Service sent {{ printf "%.0f" $value }} GitHub writes in the last hour'
              description: "The roadmap Service sent more than 300 GitHub writes, such as comments, labels and issue edits, in one hour (docs/CLUSTER.md, Roadmap service)."
          # A delivery of the App bot's own write counts as outcome self. Each write of the Service
          # can come back as one delivery, so many of them can be another bot or workflow that
          # answers each write of the Service.
          - alert: RoadmapServiceSelfDeliveriesHigh
            expr: sum(increase(devops_cli_service_webhook_deliveries_total{job="roadmap-service", outcome="self"}[1h])) > 150
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: 'The roadmap Service got {{ printf "%.0f" $value }} deliveries of its own writes in the last hour'
              description: "The roadmap Service got more than 150 webhook deliveries of its own writes in one hour (docs/CLUSTER.md, Roadmap service)."
          # A provider answers 402 when its account has no credits and 429 at its rate limit. The
          # search goes on to the next provider, so the alert warns before the chain is spent.
          - alert: RoadmapServiceWebSearchRefused
            expr: >-
              sum by (backend, result) (
              (last_over_time(devops_cli_web_searches_total{job="roadmap-service", result=~"402|429"}[1h])
              unless last_over_time(devops_cli_web_searches_total{job="roadmap-service", result=~"402|429"}[1h] offset 1h))
              or increase(devops_cli_web_searches_total{job="roadmap-service", result=~"402|429"}[1h])
              ) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: 'The provider {{ $labels.backend }} refused web searches of the roadmap Service with HTTP {{ $labels.result }} in the last hour'
              description: "The provider {{ $labels.backend }} refused a web search of the roadmap Service with HTTP {{ $labels.result }}: 402 when the account has no credits, 429 at its rate limit. The search goes on to the next provider (docs/CLUSTER.md, Roadmap service)."
          # The alternatives check ran no search in 3 days while open items have no check (#2950).
          # The counter has the labels backend and result and the gauge has the label repo, so each side is
          # summed to one label set before `and on ()` joins them. The counter holds the searches
          # of every job of the Service, refine too. `or vector(0)` makes a missing counter fire.
          # The search count reads a series that starts in the window as the rules above do
          # (#2505). The gauge is read over 7 days: the row sends it twice a day, so the last
          # value stays while the row is suspended, which is how the check stopped on 2026-10-30.
          - alert: RoadmapServiceAlternativesNotSearching
            expr: >-
              sum by (repo) (last_over_time(devops_cli_roadmap_alternatives_unchecked_items{job="roadmap-service"}[7d])) > 0
              and on ()
              (sum(
              (last_over_time(devops_cli_web_searches_total{job="roadmap-service"}[3d])
              unless last_over_time(devops_cli_web_searches_total{job="roadmap-service"}[3d] offset 3d))
              or increase(devops_cli_web_searches_total{job="roadmap-service"}[3d])
              ) or vector(0)) == 0
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: 'The alternatives check of {{ $labels.repo }} ran no web search in 3 days, and {{ printf "%.0f" $value }} open items have no check'
              description: "The roadmap Service made no web search for 3 days, while {{ $labels.repo }} has open items with no alternatives check. A search of refine counts too. The check can be off, suspended or failing (docs/CLUSTER.md, Roadmap service)."
      # The age of the oldest roadmap item in each state (#2919). The metrics row sends the age and
      # the number of the oldest item of each pair of a state and a plan flag once in each round. So
      # a series has a sample in each round, and the rule reads its last sample of the last 30
      # minutes, which is longer than a round (#2505). The value 86400 is one day, a literal as the
      # other roadmap rules keep theirs: a person who wants another value edits this line and its
      # unit test.
      - name: roadmap-service-items
        rules:
          # A blocked item, or a ready item with a plan that waits for a person, stays in its state
          # for more than a day. The summary names the item number of the same repository, state and
          # plan.
          - alert: RoadmapServiceItemStuck
            expr: >-
              max by (repo, state, plan) (last_over_time(devops_cli_roadmap_item_age_seconds{job="roadmap-service", state="blocked"}[30m])) > 86400
              or
              max by (repo, state, plan) (last_over_time(devops_cli_roadmap_item_age_seconds{job="roadmap-service", state="ready", plan="true"}[30m])) > 86400
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: 'Item {{ with printf "max by (repo, state, plan) (last_over_time(devops_cli_roadmap_oldest_item_number{job=\"roadmap-service\", repo=%q, state=%q, plan=%q}[30m]))" $labels.repo $labels.state $labels.plan | query }}#{{ . | first | value | printf "%.0f" }} {{ end }}of {{ $labels.repo }} has been in state {{ $labels.state }} for {{ $value | humanizeDuration }}'
              description: "An item of the roadmap stayed in one state for more than 24 hours. Run devops roadmap inbox to see the item (docs/CLUSTER.md, Roadmap service)."
      # The tools of the stage planner that no run called (#3240). Each plan run adds 0 to the call
      # counter for every tool of its toolset, so a tool has a series before a run calls it, and
      # the rule needs no list of tool names. The call count of 7 days sums the outcomes of a tool.
      # A series that is younger than 7 days has no sample before the window, so it stays quiet: a
      # new tool gets 7 days. The runs are the observations of the native histogram of the
      # calls per run, of the same row and toolset. A tool that leaves the toolset keeps its alert
      # until its series leaves the 7 days.
      - name: roadmap-service-tools
        rules:
          - alert: RoadmapServiceToolUnused
            expr: >-
              sum by (row, tool, toolset) (increase(devops_cli_roadmap_tool_calls_total{job="roadmap-service"}[7d])) == 0
              and on (row, tool, toolset)
              count by (row, tool, toolset) (count_over_time(devops_cli_roadmap_tool_calls_total{job="roadmap-service"}[7d] offset 7d)) > 0
              and on (row, toolset)
              sum by (row, toolset) (histogram_count(increase(devops_cli_roadmap_tool_calls_per_run{job="roadmap-service"}[7d]))) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Tool {{ $labels.tool }} of the toolset {{ $labels.toolset }} had no call in 7 days"
              description: "No run of the row {{ $labels.row }} called the tool {{ $labels.tool }} of the toolset {{ $labels.toolset }} in 7 days, and the Service made runs of that row in that time. Read the Planner Tools row of the devops-cli Telemetry dashboard, and decide to change the tool description or to remove the tool (docs/CLUSTER.md, Roadmap service)."
      # The Crawl4AI page-text service (#3893). The Service counts each fetch that reaches
      # Crawl4AI in devops_cli_crawl4ai_fetches_total{result} (ok, an HTTP status, or error), so
      # the alert reads that counter and not the /metrics of Crawl4AI, which needs the token. The
      # counter comes over OTLP and starts a series at its first fetch, so each count of the last
      # hour reads a series that starts in the hour as the group roadmap-service does (#2505). A
      # fetch from a workstation has job="devops-cli" and never counts. With no crawl4ai.url the
      # Service sends no fetch, so the counter has no series and the rule stays quiet. One failure
      # alone does not fire: the rule needs 5 failed fetches and a failed share above one half.
      - name: crawl4ai
        rules:
          - alert: Crawl4AIFetchesFailing
            expr: >-
              sum(
              (last_over_time(devops_cli_crawl4ai_fetches_total{job="roadmap-service", result!="ok"}[1h])
              unless last_over_time(devops_cli_crawl4ai_fetches_total{job="roadmap-service", result!="ok"}[1h] offset 1h))
              or increase(devops_cli_crawl4ai_fetches_total{job="roadmap-service", result!="ok"}[1h])
              )
              / sum(
              (last_over_time(devops_cli_crawl4ai_fetches_total{job="roadmap-service"}[1h])
              unless last_over_time(devops_cli_crawl4ai_fetches_total{job="roadmap-service"}[1h] offset 1h))
              or increase(devops_cli_crawl4ai_fetches_total{job="roadmap-service"}[1h])
              ) > 0.5
              and on () sum(
              (last_over_time(devops_cli_crawl4ai_fetches_total{job="roadmap-service", result!="ok"}[1h])
              unless last_over_time(devops_cli_crawl4ai_fetches_total{job="roadmap-service", result!="ok"}[1h] offset 1h))
              or increase(devops_cli_crawl4ai_fetches_total{job="roadmap-service", result!="ok"}[1h])
              ) >= 5
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: 'Crawl4AI failed {{ $value | humanizePercentage }} of the page fetches of the roadmap Service in the last hour'
              description: "At least 5 page fetches of the roadmap Service through Crawl4AI failed in the last hour, and more than half of its fetches failed. The label `result` of devops_cli_crawl4ai_fetches_total tells why: 401 for a wrong token, 429 at the rate limit of the service, 504 when a page took too long, error when the service gave no answer or no page text. Read the warnings with kubectl -n devops logs deployment/roadmap-service, and the service with kubectl -n devops logs deployment/crawl4ai (docs/CLUSTER.md, Crawl4AI)."
          # A Deployment that a person set to 0 replicas wants none, so it stays quiet. A first start
          # pulls an image of 2.3 GB, which the wait of 15 minutes covers.
          - alert: Crawl4AIUnavailable
            expr: >-
              max by (namespace, deployment) (kube_deployment_status_replicas_available{namespace="devops", deployment="crawl4ai"}) < 1
              and on (namespace, deployment)
              max by (namespace, deployment) (kube_deployment_spec_replicas{namespace="devops", deployment="crawl4ai"}) > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Crawl4AI has no available replica"
              description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} wants a replica and has had none available for 15 minutes, so the roadmap Service cannot read page text. Read the events with kubectl -n devops describe deployment/crawl4ai, and the log with kubectl -n devops logs deployment/crawl4ai (docs/CLUSTER.md, Crawl4AI)."
      # The open findings of `devops research sweep` (#3899). The command sets one value for each
      # severity each time it runs, and runs when a person starts it, so the rule reads the last
      # value of the last 7 days. A sweep that finds no critical finding sets zero, and the rule
      # goes quiet. The sweep sets no value when a lookup got no answer.
      - name: research
        rules:
          - alert: ResearchCriticalFindings
            expr: >-
              max(last_over_time(devops_cli_research_open_findings{severity="critical"}[7d])) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: 'The last research sweep found {{ printf "%.0f" $value }} critical advisories that affect a pin'
              description: "The last `devops research sweep` found critical advisories that affect a pin of the project. Intake has a candidate for each. Run `devops research advisories` to read them, and update the pins (k8s/README.md, Alerting)."
      # The USD spend of the model calls in devops_cli_ai_spend_usd_total (#4222). The counter
      # prices a hosted call by the model that the client asked for, and a local call adds 0, so
      # the sum over all models is the hosted spend. increase() keeps the spend of a series that
      # resets at a pod restart, and sum() adds a workstation (job="devops-cli") to the Service.
      # The highest normal day of the owner is 5.59 USD, and a failed stage burst on
      # claude-sonnet-5-5 spent 21 USD per hour, so both rules fire at once: the window of 24
      # hours is the smoothing. Set the thresholds again with the data of a month.
      - name: ai-spend
        rules:
          - alert: ClaudeSpendDailyHigh
            expr: >-
              sum(increase(devops_cli_ai_spend_usd_total{model="claude-sonnet-5-5"}[24h])) > 15
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: 'The spend of claude-sonnet-5-5 in the last 24 hours is {{ printf "%.2f" $value }} USD'
              description: "The hosted calls of claude-sonnet-5-5 cost more than 15 USD in the last 24 hours. Read the cost page of the AI spend dashboard, find the caller by the `end_user` label, and stop the job (k8s/README.md, Alerting)."
          - alert: HostedSpendDailyHigh
            expr: >-
              sum(increase(devops_cli_ai_spend_usd_total[24h])) > 25
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: 'The spend of the hosted models in the last 24 hours is {{ printf "%.2f" $value }} USD'
              description: "The hosted calls of all models cost more than 25 USD in the last 24 hours. Read the cost page of the AI spend dashboard, find the caller by the `end_user` label, and stop the job (k8s/README.md, Alerting)."
      # Argo workflow for RAG ingestion (#1653).
      - name: rag-ingest
        rules:
          - alert: RagIngestBehind
            expr: >-
              time() - max by (repo) (devops_cli_rag_ingest_last_success_timestamp_seconds) > 360
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "RAG index for repository {{ $labels.repo }} is behind"
              description: "No RAG ingestion run succeeded for repository {{ $labels.repo }} in the last two schedule periods (k8s/README.md, Alerting)."
