# Pods with component infra (infra-drift and infra-plan) connect to cluster nodes via SSH on TCP 22.
# This policy adds to devops-default-perimeter-egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: infra-ssh-egress
  namespace: devops
  labels:
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: infra
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.1.0/24
      ports:
        - protocol: TCP
          port: 22
