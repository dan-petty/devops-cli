---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: squid
  namespace: squid
  labels:
    app.kubernetes.io/name: squid
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: squid
  template:
    metadata:
      labels:
        app.kubernetes.io/name: squid
        app.kubernetes.io/part-of: devops-cli-stack
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9301"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - squid
                topologyKey: kubernetes.io/hostname
      containers:
        # ---------------------------------------------------------------------
        # Primary Squid Caching Proxy Container
        # ---------------------------------------------------------------------
        - name: squid
          image: 192.168.1.4:30500/squid:0.2.16
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-proxy
              containerPort: 3128
              protocol: TCP
            - name: snmp
              containerPort: 3401
              protocol: UDP
          livenessProbe:
            httpGet:
              path: /squid-internal-mgr/info
              port: 3128
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /squid-internal-mgr/info
              port: 3128
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 4000m
              memory: 8Gi
          volumeMounts:
            - name: squid-cache
              mountPath: /var/spool/squid
            - name: squid-config
              mountPath: /etc/squid/squid.conf
              subPath: squid.conf

        # ---------------------------------------------------------------------
        # Observability Sidecar: Prometheus Squid Exporter
        # ---------------------------------------------------------------------
        - name: squid-exporter
          image: boynux/squid-exporter:v1.12.0
          imagePullPolicy: IfNotPresent
          command:
            - /squid-exporter
            - -squid-hostname
            - localhost
            - -squid-port
            - "3128"
            - -listen
            - :9301
          ports:
            - name: metrics
              containerPort: 9301
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9301
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

      volumes:
        - name: squid-cache
          persistentVolumeClaim:
            claimName: squid-cache-pvc
        - name: squid-config
          configMap:
            name: squid-config
