# Helm values for argo/argocd-image-updater (Application argocd-image-updater, #1485).
#
# The ImageUpdater below is its only configuration. It ships with the chart, so it syncs with
# its CRD and Argo CD skips its dry run until the CRD exists. It keeps Application devops on the
# digest service:latest points at: with no writeBackConfig, Image Updater writes
# `service:latest@sha256:<digest>` into the Application's spec.source.kustomize.images and
# nothing into git. The cluster app-of-apps leaves that field alone
# (k8s/argocd/bootstrap/cluster.yaml). The GHCR package is public, so no registry entry or
# credential is needed. Image Updater updates only the images that a pod in the Application's
# tree runs, unless `forceUpdate` is true. No such pod runs the service image: CronJob
# `devops-cli` is a suspended template, `roadmap-service` can be at 0 replicas, and the Jobs
# that `devops k8s run-job` starts are outside the tree. So `forceUpdate` is true. The same
# holds for the runner image of CronJob `devops-cli-runner`. When the
# Application already names the digest, Image Updater writes nothing.
extraObjects:
  - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
    kind: ImageUpdater
    metadata:
      name: devops
      namespace: argocd
    spec:
      applicationRefs:
        - namePattern: devops
          images:
            - alias: service
              imageName: ghcr.io/dan-petty/devops-cli/service:latest
              commonUpdateSettings:
                updateStrategy: digest
                forceUpdate: true
            # The image of CronJob devops-cli-runner, the template of the implement Job
            # (#2667). It is a suspended template too, so it needs `forceUpdate` as well.
            - alias: runner
              imageName: ghcr.io/dan-petty/devops-cli/runner:latest
              commonUpdateSettings:
                updateStrategy: digest
                forceUpdate: true
