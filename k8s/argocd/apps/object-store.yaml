apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: object-store
  namespace: argocd
  annotations:
    # After Application seaweedfs-operator (sync-wave -1), whose CRD the Seaweed CR needs (#4750).
    argocd.argoproj.io/sync-wave: "0"
    notifications.argoproj.io/subscribe.on-deployed.github: ""
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  source:
    repoURL: https://github.com/dan-petty/devops-cli
    targetRevision: main
    path: k8s/object-store
  destination:
    server: https://kubernetes.default.svc
    namespace: object-store
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
    # The first sync can come before the CRD of the operator exists; the retries then apply it.
    - SkipDryRunOnMissingResource=true
