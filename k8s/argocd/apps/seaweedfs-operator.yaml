apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seaweedfs-operator
  namespace: argocd
  annotations:
    # The operator and its CRDs sync before Application object-store, whose Seaweed CR needs them
    # (#4750).
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  sources:
  # Chart 0.1.48 installs operator 1.0.45 (its appVersion), which builds against SeaweedFS 4.54.
  # The version rule of the object store is in k8s/README.md, section Object Store.
  - repoURL: https://seaweedfs.github.io/seaweedfs-operator
    chart: seaweedfs-operator
    targetRevision: 0.1.48
    helm:
      valueFiles:
      - $values/k8s/object-store/operator-values.yaml
  - repoURL: https://github.com/dan-petty/devops-cli
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: object-store
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
    # The CRD file of the chart is larger than the last-applied annotation of a client-side apply.
    - ServerSideApply=true
