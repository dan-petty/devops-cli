    repoURL: git://host.minikube.internal:9418/k8s
    targetRevision: HEAD
    path: otel
  destination:
    server: https://kubernetes.default.svc
    namespace: otel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
