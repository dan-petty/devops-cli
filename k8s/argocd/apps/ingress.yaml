apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress
  namespace: argocd
  # `cluster` applies this Application server-side in every sync, automated or by hand, so a
  # sync deletes only the fields of its own field manager and keeps the host overrides that
  # deploy-stack sets in spec.source.kustomize (#1817, k8s/README.md, GitOps).
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab-system
  source:
    repoURL: https://github.com/dan-petty/devops-cli
    targetRevision: main
    path: k8s/overlays/homelab/ingress
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - SkipDryRunOnMissingResource=true
