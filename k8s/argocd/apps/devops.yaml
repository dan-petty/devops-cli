apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops
  namespace: argocd
  # `cluster` applies this Application server-side in every sync, automated or by hand, so a
  # sync deletes only the fields of its own field manager and keeps the overrides in
  # spec.source.kustomize that deploy-stack and Image Updater set (#1817, k8s/README.md, GitOps).
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
    notifications.argoproj.io/subscribe.on-deployed.mattermost: ""
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  source:
    repoURL: https://github.com/dan-petty/devops-cli
    targetRevision: main
    path: k8s/overlays/homelab/devops
  destination:
    server: https://kubernetes.default.svc
    namespace: devops
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
