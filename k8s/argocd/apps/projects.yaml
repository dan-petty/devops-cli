apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab
  namespace: argocd
spec:
  description: Workloads and infrastructure of the homelab cluster
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  sourceRepos:
    - https://github.com/dan-petty/devops-cli
    - https://github.com/dan-petty/homelab
    - https://argoproj.github.io/argo-helm
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://grafana-community.github.io/helm-charts
    - https://open-telemetry.github.io/opentelemetry-helm-charts
    - https://nvidia.github.io/dcgm-exporter/helm-charts
    - https://open-webui.github.io/helm-charts
    - https://qdrant.github.io/qdrant-helm
    - https://traefik.github.io/charts
    - https://dl.gitea.com/charts/
    - https://seaweedfs.github.io/seaweedfs-operator
  destinations:
    - server: https://kubernetes.default.svc
      namespace: agents
    - server: https://kubernetes.default.svc
      namespace: argo-workflows
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: cloudflared
    - server: https://kubernetes.default.svc
      namespace: devops
    - server: https://kubernetes.default.svc
      namespace: llm
    - server: https://kubernetes.default.svc
      namespace: logging
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: otel
    - server: https://kubernetes.default.svc
      namespace: gitea
    - server: https://kubernetes.default.svc
      namespace: registry
    - server: https://kubernetes.default.svc
      namespace: mattermost
    - server: https://kubernetes.default.svc
      namespace: mattermost-operator
    - server: https://kubernetes.default.svc
      namespace: cnpg-system
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: object-store
  orphanedResources:
    warn: true
    ignore:
      - group: ''
        kind: Secret
        name: cloudflared-token
      - group: ''
        kind: Secret
        name: llm-gateway-secrets
      - group: ''
        kind: Secret
        name: qdrant-api-key
      - group: ''
        kind: Secret
        name: valkey-runs-auth
      - group: ''
        kind: Secret
        name: valkey-auth
      - group: ''
        kind: Secret
        name: valkey-devops-auth
      - group: ''
        kind: Secret
        name: crawl4ai
      - group: ''
        kind: Secret
        name: searxng
      - group: ''
        kind: Secret
        name: mcp-server
      - group: ''
        kind: Secret
        name: renovate
      - group: ''
        kind: Secret
        name: devops-cli
      - group: ''
        kind: Secret
        name: roadmap-service-llm-key
      - group: ''
        kind: ConfigMap
        name: devops-cli-config
      # The CloudNativePG operator writes this ConfigMap into every namespace that has a Cluster,
      # with no ownerReferences and no tracking id, so Argo CD reports it as an orphan (#5303).
      - group: ''
        kind: ConfigMap
        name: cnpg-default-monitoring
      - group: ''
        kind: Secret
        name: alertmanager-mattermost
      - group: ''
        kind: Secret
        name: grafana-admin
      - group: ''
        kind: Secret
        name: grafana-image-renderer
      - group: ''
        kind: Secret
        name: argocd-notifications-secret
      # The owner makes the repository credential of the homelab repository; it never goes into git.
      - group: ''
        kind: Secret
        name: repo-homelab
      - group: ''
        kind: Secret
        name: gitea-admin
      # `devops k8s push-secrets` writes the two Secrets of the object store (#4750), and
      # cert-manager writes the webhook certificate of the SeaweedFS operator.
      - group: ''
        kind: Secret
        name: seaweedfs-admin
      - group: ''
        kind: Secret
        name: seaweedfs-s3
      - group: ''
        kind: Secret
        name: seaweedfs-operator-webhook-server-cert
      # `devops k8s push-secrets` writes the key pair of each writer of the object store (#4756).
      - group: ''
        kind: Secret
        name: object-store-devops
      - group: ''
        kind: Secret
        name: object-store-argo
      - group: ''
        kind: Secret
        name: mattermost-db
      - group: ''
        kind: Secret
        name: argocd-initial-admin-secret
      - group: ''
        kind: Secret
        name: argocd-redis
      - group: ''
        kind: Secret
        name: agent-grant-*
      - group: ''
        kind: PersistentVolumeClaim
      - group: batch
        kind: Job
        name: devops-cli-*
      - group: argoproj.io
        kind: Workflow
        name: devops-cli-version-*
      - group: argoproj.io
        kind: AppProject
        name: default
      - group: argoproj.io
        kind: Application
        name: trial-*
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab-system
  namespace: argocd
spec:
  description: System workloads, ingress controllers and cluster-wide addons
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  sourceRepos:
    - https://github.com/dan-petty/devops-cli
    - https://github.com/dan-petty/homelab
    - https://argoproj.github.io/argo-helm
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://grafana-community.github.io/helm-charts
    - https://open-telemetry.github.io/opentelemetry-helm-charts
    - https://nvidia.github.io/dcgm-exporter/helm-charts
    - https://open-webui.github.io/helm-charts
    - https://qdrant.github.io/qdrant-helm
    - https://traefik.github.io/charts
    - https://cloudnative-pg.github.io/charts
    - https://helm.mattermost.com
    - https://charts.jetstack.io
  destinations:
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: default
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: cloudflared
    - server: https://kubernetes.default.svc
      namespace: devops
    - server: https://kubernetes.default.svc
      namespace: llm
    - server: https://kubernetes.default.svc
      namespace: logging
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: otel
    - server: https://kubernetes.default.svc
      namespace: gitea
    - server: https://kubernetes.default.svc
      namespace: registry
    - server: https://kubernetes.default.svc
      namespace: cnpg-system
    - server: https://kubernetes.default.svc
      namespace: mattermost-operator
    - server: https://kubernetes.default.svc
      namespace: cert-manager
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: trial
  namespace: argocd
spec:
  description: Transient trial applications deployed from internal Gitea branches
  clusterResourceWhitelist: []
  sourceRepos:
    - http://gitea-http.gitea.svc.cluster.local:3000/*/*
  destinations:
    - server: https://kubernetes.default.svc
      namespace: trial-*
