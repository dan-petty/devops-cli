apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows-manifests
  namespace: argocd
  annotations:
    # Syncs after the argo-workflows chart, whose CRDs the WorkflowTemplate needs. The dry run is
    # skipped as well, for the first sync before the CRDs exist.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  source:
    repoURL: https://github.com/dan-petty/devops-cli
    targetRevision: main
    path: k8s/argo-workflows
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-workflows
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - SkipDryRunOnMissingResource=true
