apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster
  namespace: argocd
  # The Applications `devops` and `ingress` are applied server-side (their sync-options
  # annotation). Before that, this Application applied them client-side as `argocd-controller`.
  # The first server-side sync moves the fields of that entry to the server-side apply entry,
  # so a field that git removes from them also leaves the cluster
  # (https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/#client-side-apply-migration).
  annotations:
    argocd.argoproj.io/client-side-apply-migration-manager: argocd-controller
spec:
  project: default
  source:
    repoURL: https://github.com/dan-petty/devops-cli
    targetRevision: main
    path: k8s/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # `devops k8s deploy-stack` sets the homelab's hosts on these Applications as Kustomize
  # overrides from config.yaml, so they never enter git, and Argo CD Image Updater sets the
  # Service image's digest on `devops` (k8s/argocd/image-updater-values.yaml); this app-of-apps
  # leaves that field to them
  # (https://argo-cd.readthedocs.io/en/stable/operator-manual/cluster-bootstrapping/#ignoring-differences-in-child-applications).
  # The diff ignores the field. A sync keeps it because the two Applications are applied
  # server-side, not because of RespectIgnoreDifferences: a manual sync can omit that option (#1817).
  ignoreDifferences:
  - group: argoproj.io
    kind: Application
    name: devops
    namespace: argocd
    jsonPointers:
    - /spec/source/kustomize
  - group: argoproj.io
    kind: Application
    name: ingress
    namespace: argocd
    jsonPointers:
    - /spec/source/kustomize
  # Argo CD dynamically adds pre-delete and post-delete finalizers when rendered child application
  # manifests contain PreDelete or PostDelete hooks (such as k8s-monitoring's pre-delete cleanup Job).
  # Ignoring these finalizers prevents the cluster app-of-apps from stripping and re-adding them on every sync (#1674).
  - group: argoproj.io
    kind: Application
    jqPathExpressions:
    - '.metadata.finalizers[] | select(startswith("pre-delete-finalizer.argocd.argoproj.io") or startswith("post-delete-finalizer.argocd.argoproj.io"))'
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
    - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
