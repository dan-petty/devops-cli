apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dan-petty/devops-cli
    targetRevision: main
    path: k8s/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # `devops k8s deploy-stack` sets the homelab's hosts on these Applications as Kustomize
  # overrides from config.yaml, so they never enter git, and Argo CD Image Updater sets the
  # Service image's digest on `devops` (k8s/argocd/image-updater-values.yaml); this app-of-apps
  # leaves that field to them
  # (https://argo-cd.readthedocs.io/en/stable/operator-manual/cluster-bootstrapping/#ignoring-differences-in-child-applications).
  ignoreDifferences:
  - group: argoproj.io
    kind: Application
    name: devops
    namespace: argocd
    jsonPointers:
    - /spec/source/kustomize
  - group: argoproj.io
    kind: Application
    name: ingress
    namespace: argocd
    jsonPointers:
    - /spec/source/kustomize
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
