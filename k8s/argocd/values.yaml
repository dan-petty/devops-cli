# ArgoCD Helm values — minimal dev-mode configuration for minikube.
# Chart: argo/argo-cd
# Repo:  https://argoproj.github.io/argo-helm

global:
  logging:
    level: warn

# Single-replica, non-HA for local development
controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 2000m
      memory: 2048Mi

server:
  replicas: 1
  service:
    # Local minikube: NodePort allows direct access.
    # Production: Use type: ClusterIP with an Ingress Controller and TLS termination.
    type: NodePort
  # Local minikube: --insecure disables internal TLS for plain HTTP NodePort access.
  # Production: Remove --insecure, configure ingress.tls or cert-manager X.509 certs.
  extraArgs:
    - --insecure
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 1024Mi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 4000m
      memory: 4096Mi
  # The chart defaults the liveness timeout to 1 second. The repo server fetches git
  # repositories and renders manifests, so a slow fetch trips the probe and restarts the
  # pod -- which loses in-flight work and empties the repository cache, making the next
  # probe likelier to time out. Observed in this cluster as recurring
  # "Liveness probe failed: context deadline exceeded" events.
  livenessProbe:
    timeoutSeconds: 10
    periodSeconds: 30
    failureThreshold: 3
  readinessProbe:
    timeoutSeconds: 10
    periodSeconds: 20
    failureThreshold: 3

# Valkey replacement for Redis under BSD-3-Clause open-source license
redis:
  enabled: true
  image:
    repository: valkey/valkey
    tag: 8.0-alpine
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 1024Mi

# Disable components unnecessary for local dev
dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  enabled: false
