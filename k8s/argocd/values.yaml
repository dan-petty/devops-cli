# Argo CD Helm values. Argo CD's Application `argocd` installs them on the k3s homelab, and
# `devops k8s deploy-stack` installs them on either cluster.
# Chart: argo/argo-cd
# Repo:  https://argoproj.github.io/argo-helm

global:
  logging:
    level: warn

crds:
  keep: true
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false,Delete=false

# Single-replica, non-HA for local development
controller:
  replicas: 1
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 2000m
      memory: 2048Mi

server:
  replicas: 1
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  service:
    # NodePort: on minikube, `minikube service argocd-server -n argocd --url` gives its URL. On the
    # homelab, Ingress argocd/argocd-ingress (k8s/ingress/ingress-routes.yaml) routes argocd.<domain>
    # to port 80.
    type: NodePort
  # --insecure serves plain HTTP. On the homelab, TLS ends at the Cloudflare edge, and Traefik's
  # `web` entrypoint sends the request to port 80 in plain HTTP (k8s/ingress/ingress-routes.yaml).
  extraArgs:
    - --insecure
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 1024Mi

repoServer:
  replicas: 1
  # The repo server renders manifests and does not call the Kubernetes API; the upstream install
  # manifest also runs it without a ServiceAccount token (#1652).
  automountServiceAccountToken: false
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 4000m
      memory: 4096Mi
  # The chart defaults the liveness timeout to 1 second. The repo server fetches git
  # repositories and renders manifests, so a slow fetch trips the probe and restarts the
  # pod -- which loses in-flight work and empties the repository cache, making the next
  # probe likelier to time out. Observed in this cluster as recurring
  # "Liveness probe failed: context deadline exceeded" events.
  livenessProbe:
    timeoutSeconds: 10
    periodSeconds: 30
    failureThreshold: 3
  readinessProbe:
    timeoutSeconds: 10
    periodSeconds: 20
    failureThreshold: 3

# Valkey replacement for Redis under BSD-3-Clause open-source license
redis:
  enabled: true
  # Valkey and its exporter do not call the Kubernetes API. The redis-secret-init hook Job, with
  # its own ServiceAccount, writes the password Secret (#1652).
  automountServiceAccountToken: false
  image:
    repository: valkey/valkey
    tag: 9.1.2-alpine
  exporter:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 1024Mi

# Disable components unnecessary for local dev
dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  # The upstream argo-cd chart has no enable switch for this controller; replicas: 0 disables
  # pod execution while its SA, Role, RoleBinding and Service still render (#1673).
  # #1082 turns it back on (with replicas >= 1 and a NetworkPolicy for webhook port 7000).
  replicas: 0

configs:
  cm:
    # Web terminal: a shell in any pod an Application manages, from the pod's Terminal tab. The
    # chart grants argocd-server `create` on pods/exec when this is "true", and the built-in
    # role:admin already holds `exec, create`, so no RBAC policy is added here.
    exec.enabled: "true"
    resource.customizations: |
      networking.k8s.io/Ingress:
        health.lua: |
          hs = {}
          hs.status = "Healthy"
          return hs
