apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-feature-discovery
  namespace: gpu-feature-discovery
  labels:
    app.kubernetes.io/name: gpu-feature-discovery
    app.kubernetes.io/part-of: nvidia-gpu
    app.kubernetes.io/version: 0.16.2
  annotations:
    ignore-check.kube-linter.io/no-liveness-probe: >-
      The container serves no endpoint: it writes the GPU features to a file of the node (#6068).
    ignore-check.kube-linter.io/no-readiness-probe: >-
      The container serves no traffic: it writes the GPU features to a file of the node (#6068).
    ignore-check.kube-linter.io/non-isolated-pod: >-
      No NetworkPolicy of namespace gpu-feature-discovery selects the pod yet (#6109).
    ignore-check.kube-linter.io/privileged-container: >-
      The NVIDIA manifest runs privileged to read the GPUs through NVML, until #5646.
    ignore-check.kube-linter.io/privilege-escalation-container: >-
      A privileged container allows privilege escalation, until #5646.
    ignore-check.kube-linter.io/run-as-non-root: >-
      The NVIDIA manifest runs as root to read the GPUs and /sys, until #5646.
    ignore-check.kube-linter.io/sensitive-host-mounts: >-
      The container reads the PCI devices of the node from /sys, until #5646.
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: gpu-feature-discovery
      app.kubernetes.io/part-of: nvidia-gpu
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-feature-discovery
        app.kubernetes.io/part-of: nvidia-gpu
        app.kubernetes.io/version: 0.16.2
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: In
                values:
                - "true"
            - matchExpressions:
              - key: feature.node.kubernetes.io/cpu-model.vendor_id
                operator: In
                values:
                - NVIDIA
            - matchExpressions:
              - key: nvidia.com/gpu.present
                operator: In
                values:
                - "true"
      containers:
      - name: gpu-feature-discovery
        image: nvcr.io/nvidia/k8s-device-plugin:v0.20.2
        imagePullPolicy: IfNotPresent
        command:
        - /usr/bin/gpu-feature-discovery
        env:
        - name: MIG_STRATEGY
          value: none
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          privileged: true
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/kubernetes/node-feature-discovery/features.d
          name: output-dir
        - mountPath: /sys
          name: host-sys
      volumes:
      - hostPath:
          path: /etc/kubernetes/node-feature-discovery/features.d
          type: ""
        name: output-dir
      - hostPath:
          path: /sys
          type: ""
        name: host-sys
