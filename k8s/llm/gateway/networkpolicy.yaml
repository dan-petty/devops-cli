# NetworkPolicy for LiteLLM Gateway in llm namespace.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-gateway-perimeter
  namespace: llm
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: llm-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The gateway is the authenticated entry point for LAN clients (via its NodePort), Open WebUI,
    # devops-cli workloads and monitoring. LiteLLM rejects requests without the master key, so the
    # API port admits any source; egress below stays limited to the inference backends.
    - ports:
        - protocol: TCP
          port: 4000
  egress:
    # Allow communication to backend inference pods (Ollama, vLLM) and Valkey cache
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ollama
      ports:
        - protocol: TCP
          port: 11434
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vllm
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vllm-single
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: lightllm
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
      ports:
        - protocol: TCP
          port: 6379
    # DNS queries to kube-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Squid forward proxy in squid namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: squid
      ports:
        - protocol: TCP
          port: 3128
