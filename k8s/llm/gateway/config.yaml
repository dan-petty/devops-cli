# LiteLLM Proxy / AI Gateway routing configuration. kustomization.yaml generates ConfigMap
# llm-gateway-config-<hash> from this file, so a change here rolls the gateway Deployment (#1929).
# Gateway routes target standardized <llm_provider>-<vram_gib>-[slow,standard,fast] services.
model_list:
  - model_name: devops-chat
    litellm_params:
      model: ollama_chat/qwen3.8:27b
      api_base: http://ollama-48gib-fast.llm.svc.cluster.local:11434
      model_info:
        max_input_tokens: 128000
  - model_name: devops-chat
    litellm_params:
      model: ollama_chat/qwen3.8:27b
      api_base: http://ollama-64gib-standard.llm.svc.cluster.local:11434
      model_info:
        max_input_tokens: 160000

  - model_name: devops-coder
    litellm_params:
      model: ollama_chat/qwen3-coder:30b
      api_base: http://ollama-48gib-fast.llm.svc.cluster.local:11434

  - model_name: devops-reasoning
    litellm_params:
      model: ollama_chat/qwen3-coder:30b
      api_base: http://ollama-48gib-fast.llm.svc.cluster.local:11434

  # Every serving tier holds the embedding model. The router tries the order 1 deployments
  # first, shuffled among them, and an order 2 deployment only when they all fail (#1987, #2027).
  # The 48gib-fast and 64gib-standard tiers embed a 32-chunk RAG batch in under 5 s, beside
  # their chat model. The 16gib-fast tier is faster, but its chat model leaves no VRAM for
  # the embedder, so each embedding evicts it. The background tier ollama-48gib-slow takes
  # 12 to 30 s.
  # num_ctx is CONST_RAG_MAX_CHUNK_TOKENS, so the largest RAG chunk fits. Without it, Ollama
  # loads the embedder with 32,768 tokens: 5.2 GB, not 2.9 GB, on the 64gib-standard tier.
  # mode: embedding makes health checks embed rather than generate.
  - model_name: qwen3-embedding:0.6b
    litellm_params:
      model: ollama/qwen3-embedding:0.6b
      api_base: http://ollama-48gib-fast.llm.svc.cluster.local:11434
      num_ctx: 8192
      order: 1
    model_info:
      mode: embedding
  - model_name: qwen3-embedding:0.6b
    litellm_params:
      model: ollama/qwen3-embedding:0.6b
      api_base: http://ollama-64gib-standard.llm.svc.cluster.local:11434
      num_ctx: 8192
      order: 1
    model_info:
      mode: embedding
  - model_name: qwen3-embedding:0.6b
    litellm_params:
      model: ollama/qwen3-embedding:0.6b
      api_base: http://ollama-16gib-fast.llm.svc.cluster.local:11434
      num_ctx: 8192
      order: 2
    model_info:
      mode: embedding
  # ollama-48gib-slow is the background tier, in no interactive or review pool. Its profile
  # keeps two models loaded for good, the embedding model and qwen3.8:27b, and this list
  # sends it no other. A third model would evict one of them (#1064, #1221).
  - model_name: qwen3-embedding:0.6b
    litellm_params:
      model: ollama/qwen3-embedding:0.6b
      api_base: http://ollama-48gib-slow.llm.svc.cluster.local:11434
      num_ctx: 8192
      order: 2
    model_info:
      mode: embedding

  # Background tier: ollama-48gib-slow's only generation model. Batch, cluster services and
  # --watch jobs reach it through devops-background (k8s/README.md), and devops-review falls back to it.
  # No max_input_tokens: LiteLLM writes a deployment's model_info into the cost-map entry
  # that every ollama_chat/qwen3.8:27b deployment reads, so it would become the window
  # of the pinned and interactive groups too. The tier's context length caps it instead.
  - model_name: devops-background
    litellm_params:
      model: ollama_chat/qwen3.8:27b
      api_base: http://ollama-48gib-slow.llm.svc.cluster.local:11434
      # The longest wait for the tier's reply, or for its next token in a streamed call. The
      # call then fails, and no gateway retry re-queues the same work on the tier's one slot.
      timeout: 1100
      num_retries: 0

  # devops-review: one model name spread over the interactive Ollama tiers. The least-busy
  # router sends each request to the deployment with the fewest requests in flight:
  # - qwen3-coder:30b on ollama-48gib-fast (2x RTX 3090) and ollama-64gib-standard (Tesla V100).
  # - gpt-oss:20b on ollama-16gib-fast.
  # The background tier (ollama-48gib-slow) is left out; it is devops-review's fallback.
  - model_name: devops-review
    litellm_params:
      model: ollama_chat/qwen3-coder:30b
      api_base: http://ollama-48gib-fast.llm.svc.cluster.local:11434
      num_retries: 0
  - model_name: devops-review
    litellm_params:
      model: ollama_chat/qwen3-coder:30b
      api_base: http://ollama-64gib-standard.llm.svc.cluster.local:11434
      num_retries: 0
  - model_name: devops-review
    litellm_params:
      model: ollama_chat/gpt-oss:20b
      api_base: http://ollama-16gib-fast.llm.svc.cluster.local:11434
      num_retries: 0
    model_info:
      supports_reasoning: true

  # One group per devops-review model, copying its deployments exactly, so a
  # review can be pinned to one model and routed as the pool routes it. No max_input_tokens
  # and no fallback: either would send a request somewhere the pool would not.
  - model_name: qwen3-coder:30b
    litellm_params:
      model: ollama_chat/qwen3-coder:30b
      api_base: http://ollama-48gib-fast.llm.svc.cluster.local:11434
      num_retries: 0
  - model_name: qwen3-coder:30b
    litellm_params:
      model: ollama_chat/qwen3-coder:30b
      api_base: http://ollama-64gib-standard.llm.svc.cluster.local:11434
      num_retries: 0

  - model_name: gpt-oss:20b
    litellm_params:
      model: ollama_chat/gpt-oss:20b
      api_base: http://ollama-16gib-fast.llm.svc.cluster.local:11434
      num_retries: 0
    model_info:
      supports_reasoning: true

  - model_name: gemma4:31b
    litellm_params:
      model: ollama_chat/gemma4:31b
      api_base: http://ollama-48gib-fast.llm.svc.cluster.local:11434
      model_info:
        max_input_tokens: 128000
  - model_name: gemma4:31b
    litellm_params:
      model: ollama_chat/gemma4:31b
      api_base: http://ollama-64gib-standard.llm.svc.cluster.local:11434
      model_info:
        max_input_tokens: 160000

  - model_name: qwen3.8:27b
    litellm_params:
      model: ollama_chat/qwen3.8:27b
      api_base: http://ollama-48gib-fast.llm.svc.cluster.local:11434
      model_info:
        max_input_tokens: 128000
  - model_name: qwen3.8:27b
    litellm_params:
      model: ollama_chat/qwen3.8:27b
      api_base: http://ollama-64gib-standard.llm.svc.cluster.local:11434
      model_info:
        max_input_tokens: 160000

  - model_name: deepseek-r1:70b
    litellm_params:
      model: ollama_chat/deepseek-r1:70b
      api_base: http://ollama-64gib-standard.llm.svc.cluster.local:11434
      model_info:
        max_input_tokens: 160000

litellm_settings:
  # Per-deployment requests, failures and latency at /metrics/, scraped by Prometheus. The
  # Ollama nodes export no metrics of their own, so this is how their load is seen.
  callbacks: ["prometheus"]
  require_auth_for_metrics_endpoint: false
  # Write the end-user id that a request names as the `end_user` label of the request and token
  # series. Every caller sends the master key, so this label is how the AI spend dashboard tells
  # callers apart (#1668). devops-cli names its OTel service name in `x-litellm-end-user-id`.
  # Open WebUI names no end user: it sends a `user` field only to a pipeline, as an object, which
  # LiteLLM drops, so no person's id reaches a label.
  enable_end_user_cost_tracking_prometheus_only: true
  drop_params: true
  telemetry: false
  # A streamed chat reply with no data for this many seconds gets an SSE comment (": ping"),
  # also before its first token. The Cloudflare edge cuts a request after 125 s with no data
  # (#2365), and the CLI streams every chat call, so a long prefill, queue or reasoning
  # reaches the client. A call whose first token comes sooner keeps its x-litellm-* headers.
  sse_keepalive_ping_interval_seconds: 30

router_settings:
  # least-busy routes requests to the backend with the fewest in-flight requests,
  # preventing pile-ups behind long generations across Ollama nodes.
  routing_strategy: least-busy
  # Spread embedding batches across order 1 tiers (#2027). Under least-busy, zero-in-flight
  # ties select the first deployment every time.
  routing_groups:
    - group_name: embedding
      models:
        - qwen3-embedding:0.6b
      routing_strategy: simple-shuffle
  num_retries: 5
  allowed_fails: 3
  cooldown_time: 30
  # The longest wait for a deployment's reply, or for its next token in a streamed call. Long
  # code reviews on the 32B model can generate for several minutes.
  timeout: 1500
  # Check prompt size against max_input_tokens before calling a backend, so an oversized
  # prompt moves straight to its context-window fallback instead of failing first.
  enable_pre_call_checks: true
  # Backend unavailable: prefer the larger model before the small model.
  fallbacks:
    - devops-reasoning: [devops-coder]
    - devops-coder: [devops-reasoning, devops-chat]
    # Once devops-review's retries fail, timeouts included. The keepalive keeps the client's
    # streamed call open, so the client reads the background tier's reply. With
    # context_window_fallbacks set, an oversized devops-review prompt re-raises instead.
    # No devops-chat rule: fallbacks chain, so devops-coder and devops-reasoning failures
    # would reach the background tier through devops-chat.
    - devops-review: [devops-background]
  # Prompt too long for the model: escalate to a larger context window.
  context_window_fallbacks:
    - devops-chat: [devops-coder, devops-reasoning]
    - devops-coder: [devops-reasoning]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  cancel_on_disconnect: true
  store_model_in_db: false
  proxy_batch_write_at: 10
