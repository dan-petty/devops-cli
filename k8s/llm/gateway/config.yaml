# LiteLLM Proxy / AI Gateway routing configuration. kustomization.yaml generates ConfigMap
# llm-gateway-config-<hash> from this file, so a change here rolls the gateway Deployment (#1929).
# Gateway routes target standardized <llm_provider>-<vram_gib>-[slow,standard,fast] services.
# The tiers ollama-48gib-fast and ollama-64gib-standard load qwen3.8:27b and no other model, so
# no deployment of this file sends another model, an embedding model included, to either (#3567).
# Every ollama_chat deployment sets max_input_tokens in its own top-level model_info, equal to the
# OLLAMA_CONTEXT_LENGTH of its tier (devops ai gateway render keeps them equal). LiteLLM reads the
# window only there: a model_info under litellm_params is ignored. A deployment that sets no
# window reads the cost-map entry of its backend model, which the last deployment registered
# wrote, so each deployment sets its own. Ollama cuts a prompt longer than the window without
# an error (#2825).
model_list:
  - model_name: devops-chat
    litellm_params:
      model: ollama_chat/qwen3.8:27b
      api_base: http://ollama-48gib-fast.llm.svc.cluster.local:11434
    model_info:
      max_input_tokens: 262144
  - model_name: devops-chat
    litellm_params:
      model: ollama_chat/qwen3.8:27b
      api_base: http://ollama-64gib-standard.llm.svc.cluster.local:11434
    model_info:
      max_input_tokens: 262144

  - model_name: devops-coder
    litellm_params:
      model: ollama_chat/qwen3.8:27b
      api_base: http://ollama-48gib-fast.llm.svc.cluster.local:11434
    model_info:
      max_input_tokens: 262144

  - model_name: devops-reasoning
    litellm_params:
      model: ollama_chat/qwen3.8:27b
      api_base: http://ollama-48gib-fast.llm.svc.cluster.local:11434
    model_info:
      max_input_tokens: 262144

  # The router tries the lowest order first, shuffled among its deployments, and the next order
  # only when they all fail (#1987, #2027). Order 1 is each instance of a tier at or below the
  # embedding_only threshold, in the rendered region: an idle one embeds a batch of 32 chunks of
  # the largest size in 2 s, and it has no chat model to wait for or to evict (#3501). There is no
  # next order: ollama-16gib does not serve (k8s/README.md, GPU Placement), and the 48gib-fast and
  # 64gib-standard tiers hold no embedding model (#3567). An embedding fails when order 1 fails.
  # num_ctx is CONST_RAG_MAX_CHUNK_TOKENS, so the largest RAG chunk fits. Without it, Ollama
  # loads the embedder with 32,768 tokens, which is more than twice the memory.
  # mode: embedding makes health checks embed rather than generate.
  # BEGIN rendered by devops ai gateway render from gpu-thresholds.yaml
  - model_name: qwen3-embedding:0.6b
    litellm_params:
      model: ollama/qwen3-embedding:0.6b
      api_base: http://ollama-24gib-embed-gpu0.llm.svc.cluster.local:11434
      num_ctx: 8192
      order: 1
    model_info:
      mode: embedding
  - model_name: qwen3-embedding:0.6b
    litellm_params:
      model: ollama/qwen3-embedding:0.6b
      api_base: http://ollama-24gib-embed-gpu1.llm.svc.cluster.local:11434
      num_ctx: 8192
      order: 1
    model_info:
      mode: embedding
  # END rendered by devops ai gateway render from gpu-thresholds.yaml

  # Background group: batch, cluster services and --watch jobs reach it through devops-background
  # (k8s/README.md), and devops-review falls back to it. It runs on the 64gib-standard tier, the
  # slowest chat tier, since a tier at or below the embedding_only threshold serves no chat model.
  # Its window is the 262144 of the tier, the same as that of the qwen3.8:27b group, so a prompt
  # that this group refuses is refused there too.
  - model_name: devops-background
    litellm_params:
      model: ollama_chat/qwen3.8:27b
      api_base: http://ollama-64gib-standard.llm.svc.cluster.local:11434
      # The longest wait for the tier's reply, or for its next token in a streamed call. The
      # call then fails, and no gateway retry re-queues the same work on the tier's one slot.
      timeout: 1100
      num_retries: 0
    model_info:
      max_input_tokens: 262144

  # devops-triage: fast triage and roadmap intake on the 64 GiB standard tier.
  - model_name: devops-triage
    litellm_params:
      model: ollama_chat/qwen3.8:27b
      api_base: http://ollama-64gib-standard.llm.svc.cluster.local:11434
    model_info:
      max_input_tokens: 262144

  # devops-review: one model name spread over the interactive Ollama tiers. The least-busy
  # router sends each request to the deployment with the fewest requests in flight:
  # - qwen3.8:27b on ollama-48gib-fast (2x RTX 3090) and ollama-64gib-standard (2x Tesla V100).
  # devops-background is left out; it is devops-review's fallback.
  - model_name: devops-review
    litellm_params:
      model: ollama_chat/qwen3.8:27b
      api_base: http://ollama-48gib-fast.llm.svc.cluster.local:11434
      num_retries: 0
    model_info:
      max_input_tokens: 262144
  - model_name: devops-review
    litellm_params:
      model: ollama_chat/qwen3.8:27b
      api_base: http://ollama-64gib-standard.llm.svc.cluster.local:11434
      num_retries: 0
    model_info:
      max_input_tokens: 262144

  # A review can be pinned to the model of the pool and routed as the pool routes it. qwen3.8:27b
  # copies the backends and windows of its devops-review deployments, and is the fallback of
  # devops-triage and devops-background.
  - model_name: qwen3.8:27b
    litellm_params:
      model: ollama_chat/qwen3.8:27b
      api_base: http://ollama-48gib-fast.llm.svc.cluster.local:11434
    model_info:
      max_input_tokens: 262144
  - model_name: qwen3.8:27b
    litellm_params:
      model: ollama_chat/qwen3.8:27b
      api_base: http://ollama-64gib-standard.llm.svc.cluster.local:11434
    model_info:
      max_input_tokens: 262144

  # Hosted models (#3113). A prompt sent to these groups leaves the cluster for the provider, and
  # the provider bills each token. No pool and no fallback names them, so a request reaches a
  # provider only when its caller names the group. The key of each comes from the Secret
  # llm-gateway-secrets, which `devops k8s push-secrets` writes. Without the key a call to the
  # group fails and no other group is affected.
  # The cost map of the pinned LiteLLM image lists gemini/gemini-3.8-flash and both Claude 5.5
  # models with their windows and prices. The two Claude groups still set their own windows and
  # prices (USD per token, from the Anthropic pricing page), so a new map does not change the
  # spend. The API answers 400 to temperature, top_p and top_k on both models. The map marks
  # them `supports_sampling_params: false`, and each Claude group drops the three itself too,
  # so the refusal does not depend on the map. Sonnet 5.5
  # also answers an error to a forced tool call (tool_choice "required" or a named tool): a
  # caller of the group sends "auto". LiteLLM turns a `response_format` into such a forced tool
  # call unless its model map says that the model supports native structured output, so each
  # Claude group sets `supports_native_structured_output` and `supports_response_schema` and
  # LiteLLM sends the schema as Anthropic `output_format` (#3140).
  - model_name: gemini-3.8-flash
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      max_input_tokens: 1048576
  - model_name: claude-sonnet-5-5
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      additional_drop_params: [temperature, top_p, top_k]
    model_info:
      max_input_tokens: 1000000
      supports_native_structured_output: true
      supports_response_schema: true
      input_cost_per_token: 2.0e-06
      output_cost_per_token: 1.0e-05
      cache_creation_input_token_cost: 2.5e-06
      cache_read_input_token_cost: 1.0e-07
  # Haiku 5.5 costs more above 100,000 prompt tokens (0.50 USD input and 2.50 USD output per
  # million). LiteLLM has no price tier at that size, so the prices below are the ones up to it,
  # and the spend of a longer prompt reads low.
  - model_name: claude-haiku-5-5
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      additional_drop_params: [temperature, top_p, top_k]
    model_info:
      max_input_tokens: 1000000
      supports_native_structured_output: true
      supports_response_schema: true
      input_cost_per_token: 1.0e-07
      output_cost_per_token: 5.0e-07
      cache_creation_input_token_cost: 1.25e-07
      cache_read_input_token_cost: 1.0e-08
  # OpenRouter routes a prompt to a provider of its choice (#3144). The suffix `:floor` picks the
  # cheapest provider, `quantizations: [fp8]` keeps it to fp8 weights, and `data_collection: deny`
  # keeps it to providers that do not store or train on prompts. A provider that fails a filter is
  # skipped, so the price can be higher than the cheapest fp8 provider. The cost map of the pinned
  # LiteLLM image lists no -1017 snapshot, so the group sets its window and its prices (USD per
  # token): the endpoint deepinfra/fp8/flex in the OpenRouter API on 2026-11-11, which is within 7%
  # of the cost that OpenRouter reported for the calls of the group from 2026-11-08 to 2026-11-11.
  # OpenRouter reports the real cost of a call. devops-cli prices the group at the same rates
  # (`_HOSTED_GROUP_PRICES` in src/devops_cli/ai/spend/pricing.py), and a test fails when they
  # differ. A caller sets the reasoning effort (`ai.tasks.<task>.reasoning_effort`).
  - model_name: deepseek-v4.1-flash-1017
    litellm_params:
      model: openrouter/deepseek/deepseek-v4.1-flash-1017:floor
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          quantizations: [fp8]
          data_collection: deny
    model_info:
      max_input_tokens: 1048576
      input_cost_per_token: 7.84e-08
      output_cost_per_token: 2.352e-07
      cache_read_input_token_cost: 2.352e-09
  # The fallback of deepseek-v4.1-flash-1017 (owner decision of 2026-11-13, #5564). It calls the
  # undated model with no `floor` route, so OpenRouter balances a call across its providers when
  # the cheapest provider of the dated model fails. It asks for the same fp8 weights and the same
  # `data_collection: deny`. Its prices are the list prices of the model in the OpenRouter API on
  # 2026-11-13, the top of what its providers charge: OpenRouter reports the real cost of a call.
  # devops-cli prices the group at the same rates (`_HOSTED_GROUP_PRICES`).
  - model_name: deepseek-v4.1-flash
    litellm_params:
      model: openrouter/deepseek/deepseek-v4.1-flash
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          quantizations: [fp8]
          data_collection: deny
    model_info:
      max_input_tokens: 1048576
      input_cost_per_token: 3.0e-07
      output_cost_per_token: 1.2e-06
      cache_read_input_token_cost: 6.0e-09
      supports_response_schema: true
litellm_settings:
  # Per-deployment requests, failures and latency at /metrics/, scraped by Prometheus. The
  # Ollama nodes export no metrics of their own, so this is how their load is seen.
  # `otel` sends a span for each request, with its queue, retry and fallback time, to the
  # OpenTelemetry Collector that the OTEL_* variables of the Deployment name (#4518). A request
  # with a `traceparent` header gets its span as a child of the caller's span. LiteLLM writes the
  # key hash, the key alias and the request headers on each span, and the Collector deletes them
  # before Tempo (k8s/otel/values.yaml).
  callbacks: ["prometheus", "otel"]
  # Keep the prompt and the reply off every span: this forces the `NO_CONTENT` capture mode of
  # the `otel` callback, over any other content setting
  # (https://docs.litellm.ai/docs/observability/opentelemetry_integration).
  turn_off_message_logging: true
  require_auth_for_metrics_endpoint: false
  # Write the end-user id that a request names as the `end_user` label of the request and token
  # series. Every caller sends the master key, so this label is how the AI spend dashboard tells
  # callers apart (#1668). devops-cli names its OTel service name in `x-litellm-end-user-id`.
  # Open WebUI names no end user: it sends a `user` field only to a pipeline, as an object, which
  # LiteLLM drops, so no person's id reaches a label.
  enable_end_user_cost_tracking_prometheus_only: true
  drop_params: true
  telemetry: false
  # A streamed chat reply with no data for this many seconds gets an SSE comment (": ping"),
  # also before its first token. The Cloudflare edge cuts a request after 125 s with no data
  # (#2365), and the CLI streams every chat call, so a long prefill, queue or reasoning
  # reaches the client. A call whose first token comes sooner keeps its x-litellm-* headers.
  sse_keepalive_ping_interval_seconds: 30

router_settings:
  # least-busy routes requests to the backend with the fewest in-flight requests,
  # preventing pile-ups behind long generations across Ollama nodes.
  routing_strategy: least-busy
  # Spread embedding batches across order 1 tiers (#2027). Under least-busy, every embedding batch
  # went to the first deployment at 1, 2, 4 and 8 streams: 0.55 batches a second on two GPUs,
  # against 0.85 to 1.08 with simple-shuffle (#3518).
  routing_groups:
    - group_name: embedding
      models:
        - qwen3-embedding:0.6b
      routing_strategy: simple-shuffle
  num_retries: 5
  allowed_fails: 3
  cooldown_time: 30
  # The longest wait for a deployment's reply, or for its next token in a streamed call. Long
  # code reviews on the 32B model can generate for several minutes.
  timeout: 1500
  # Check prompt size against the max_input_tokens of each deployment before calling a backend,
  # so a prompt never reaches a deployment whose window it exceeds. A prompt longer than every
  # window of a group tries the plain fallbacks below, and fails with a ContextWindowExceededError
  # only when no group of the chain holds it. No context_window_fallbacks: the tiers
  # ollama-48gib-fast and ollama-64gib-standard have the window of 262144, the largest, so a
  # prompt that one group of them refuses does not fit the others.
  enable_pre_call_checks: true
  # Backend unavailable: devops-coder and devops-reasoning name the only model of ollama-48gib-fast,
  # so their fallback is devops-chat, which also holds ollama-64gib-standard (#3567).
  fallbacks:
    - devops-reasoning: [devops-chat]
    - devops-coder: [devops-chat]
    # Once devops-review's retries fail, timeouts included. The keepalive keeps the client's
    # streamed call open, so the client reads the devops-background reply. The pre-call check
    # keeps a prompt longer than the window of that group off it, and all windows of the large
    # tiers are 262144.
    # No devops-chat rule: fallbacks chain, so devops-coder and devops-reasoning failures
    # would reach devops-background through devops-chat.
    - devops-review: [devops-background]
    # A hosted group falls back to a hosted group only (#3152). A call to claude-sonnet-5-5 that
    # fails (an Anthropic error, a rate limit, a spend limit) goes to deepseek-v4.1-flash-1017: in
    # the review of 12 golden plans it found 38% of the known defects against 56% for Sonnet, and
    # the Flash Lite, Gemma and older Gemini models found 7 to 25%, so they are no fallback. The
    # prompt then goes to the OpenRouter provider and not to Anthropic.
    - claude-sonnet-5-5: [deepseek-v4.1-flash-1017]
    # A failed call of deepseek-v4.1-flash-1017, such as a timeout of its `floor` route, goes to
    # the undated model through the same provider with the same filters (#5564).
    - deepseek-v4.1-flash-1017: [deepseek-v4.1-flash]
    # Fallback chain: devops-review -> devops-background -> qwen3.8:27b means background and
    # review work can reach ollama-48gib-fast when the 64gib-standard tier fails. devops-triage
    # falls back to qwen3.8:27b if the standard tier deployment is unavailable.
    - devops-triage: [qwen3.8:27b]
    - devops-background: [qwen3.8:27b]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  cancel_on_disconnect: true
  # The models stay in git, so the database holds virtual keys and nothing LiteLLM must encrypt,
  # and the gateway sets no LITELLM_SALT_KEY. Set one before this turns on (k8s/README.md).
  store_model_in_db: false
  # allow_requests_on_db_unavailable stays unset (false): the gateway is reachable from outside
  # the cluster, so a key that it cannot check while the database is down is refused.
  proxy_batch_write_at: 10
  # The spend-log table gets about 71,000 rows a week, and no code reads a row older than a
  # month: the AI spend dashboard reads Prometheus. The gateway deletes the rows older than 30
  # days, so the database stays inside its 5Gi claim (#4994). LiteLLM runs the cleanup 24 hours
  # after each start of the gateway process (the default maximum_spend_logs_retention_interval),
  # and then each 24 hours. A restart before 24 hours delays the run (k8s/README.md, Spend logs).
  maximum_spend_logs_retention_period: 30d
  # TypeSafe Jev 1.14 is a decision model. OpenRouter refuses it on chat completions (HTTP 400),
  # so it has no model_list entry. The client (src/devops_cli/ai/jev.py) posts the System One
  # protocol to {ai.gateway_url}/systemone, and this pass-through forwards that body unchanged to
  # the System One endpoint of OpenRouter (https://openrouter.ai/docs/guides/community/jev). The
  # route serves any System One decision model: the model name in the request selects it. A
  # decision model answers closed questions and writes no text, so it is not a chat model and it
  # takes no route in model_list. The gateway checks the key of the caller (auth), sends the
  # OpenRouter key from its own environment, and forwards no header of the caller. It cannot set provider preferences such as
  # data_collection in the body, so the privacy setting of the OpenRouter account applies.
  # tests/ai/test_jev_gateway_route.py fails when this path and the client path differ.
  pass_through_endpoints:
    - path: /v1/systemone
      target: https://openrouter.ai/api/v1/systemone
      methods: [POST]
      auth: true
      forward_headers: false
      include_subpath: false
      headers:
        Authorization: bearer os.environ/OPENROUTER_API_KEY
        content-type: application/json
