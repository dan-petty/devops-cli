# LiteLLM Proxy / AI Gateway Deployment.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: llm
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-gateway
        app.kubernetes.io/part-of: devops-cli-stack
    spec:
      automountServiceAccountToken: false
      # On SIGTERM, uvicorn stops to accept connections and waits for each open call. LiteLLM sets
      # no timeout_graceful_shutdown, so only the kubelet ends the wait. The default of 30 s cut
      # calls that run for minutes (#5301). 600 s covers a normal long call and is shorter than
      # the router timeout of config.yaml. The rolling update starts the new pod first, so the
      # old pod only finishes its calls and writes its spend queue in this time. No preStop hook.
      terminationGracePeriodSeconds: 600
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.103.11
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          args:
            - "--config"
            - "/app/config.yaml"
            - "--port"
            - "4000"
            - "--host"
            - "0.0.0.0"
          env:
            # Clients authenticate with this key (`Authorization: Bearer <key>`); it starts with
            # `sk-`. `devops k8s push-secrets` writes it from the keyring (deploy-stack runs it).
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-secrets
                  key: master-key
            # The keys of the hosted model groups (#3113). `devops k8s push-secrets` writes them
            # from the keyring. A key that is not stored leaves its group failing, and the
            # gateway still starts.
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-secrets
                  key: gemini-api-key
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-secrets
                  key: anthropic-api-key
                  optional: true
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-secrets
                  key: openrouter-api-key
                  optional: true
            # The virtual keys live in the database that CloudNativePG runs (../gateway-db.yaml).
            # The operator writes this connection string into its Secret, so git holds no
            # password. The pod waits for the Secret and the database.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-db-app
                  key: uri
            # A failed `prisma migrate deploy` ends the start-up. Without this variable LiteLLM
            # logs the failure and goes on with an empty schema, and nothing runs the migration
            # again.
            - name: ENFORCE_PRISMA_MIGRATION_CHECK
              value: "true"
            # LiteLLM copies its migrations here before `prisma migrate deploy`, because the root
            # file system is read-only.
            - name: LITELLM_MIGRATION_DIR
              value: /var/lib/litellm/migrations
            # Use the bundled model cost map: the gateway never fetches it from the internet.
            - name: LITELLM_LOCAL_MODEL_COST_MAP
              value: "True"
            - name: LITELLM_TELEMETRY
              value: "False"
            # The `otel` callback (config.yaml) sends its spans over OTLP/HTTP to the Service of
            # the in-cluster Collector, which deletes the key data on them before Tempo (#4518).
            # LiteLLM metrics and events stay off: they are not set here.
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector-opentelemetry-collector.otel.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: llm-gateway
          ports:
            - name: http
              containerPort: 4000
          volumeMounts:
            - name: config-volume
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: tmp-volume
              mountPath: /tmp
            - name: migrations-volume
              mountPath: /var/lib/litellm/migrations
          # The working set grows from about 660 to 1330 MiB in 4 days between rollouts, so the
          # memory limit is 4Gi (#4991). Do not set MAX_REQUESTS_BEFORE_RESTART: with one uvicorn
          # worker and one replica, every model call fails until the container starts again.
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 4Gi
          # One uvicorn worker answers each probe. One slow request, such as the unpaginated v1
          # /spend/logs, holds it for some seconds, so each probe waits 5 s, not the default 1 s
          # (#5301). The proxy opens its port only after it has applied the migrations, which take
          # longer on an empty database. The startup probe holds the other two back for up to ten
          # minutes, so the kubelet does not kill a pod that is still migrating.
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          # Readiness does not depend on the database: /health/readiness answers 503 while the
          # database is down, and Kubernetes would then remove every gateway pod from the Service,
          # also for clients of the master key. The liveliness path keeps the gateway in the
          # Service. A virtual key that the gateway cannot check is refused by the gateway itself.
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5

      volumes:
        # kustomization.yaml generates this ConfigMap from config.yaml and writes its name here,
        # with a hash of the content, so a changed config rolls this Deployment (#1929).
        - name: config-volume
          configMap:
            name: llm-gateway-config
        - name: tmp-volume
          emptyDir: {}
        - name: migrations-volume
          emptyDir: {}
