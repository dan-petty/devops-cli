# LiteLLM Proxy / AI Gateway routing configuration.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-gateway-config
  namespace: llm
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/part-of: devops-cli-stack
data:
  config.yaml: |
    # Ollama-backed groups list every Ollama pod (ollama-<n>.ollama-nodes, one per GPU node) as
    # its own deployment, so LiteLLM balances load and cools down failures per node. Through the
    # `ollama` Service its long-lived connections would pin all traffic to one pod. Keep one
    # entry per replica of k8s/llm/ollama.yaml.
    model_list:
      - model_name: devops-chat
        litellm_params:
          model: ollama_chat/qwen2.5-coder:7b
          api_base: http://ollama-0.ollama-nodes.llm.svc.cluster.local:11434
      - model_name: devops-chat
        litellm_params:
          model: ollama_chat/qwen2.5-coder:7b
          api_base: http://ollama-1.ollama-nodes.llm.svc.cluster.local:11434
      - model_name: devops-coder
        litellm_params:
          model: openai/qwen2.5-coder-14b-instruct
          api_base: http://vllm-single.llm.svc.cluster.local:8000/v1
          api_key: none
        # Prompt budget inside the 16K vLLM window, leaving 4K tokens for the reply.
        model_info:
          max_input_tokens: 12288
      - model_name: devops-reasoning
        litellm_params:
          model: openai/qwen2.5-coder-32b-instruct
          api_base: http://vllm.llm.svc.cluster.local:8000/v1
          api_key: none
        # Prompt budget inside the 64K vLLM window, leaving 4K tokens for the reply.
        model_info:
          max_input_tokens: 61440
      # mode: embedding makes health checks embed rather than generate, which bge-m3 rejects.
      - model_name: devops-embedding
        litellm_params:
          model: ollama/bge-m3
          api_base: http://ollama-0.ollama-nodes.llm.svc.cluster.local:11434
        model_info:
          mode: embedding
      - model_name: devops-embedding
        litellm_params:
          model: ollama/bge-m3
          api_base: http://ollama-1.ollama-nodes.llm.svc.cluster.local:11434
        model_info:
          mode: embedding

      # devops-review: one virtual model spread over every inference server, so a review's
      # parallel persona and verification calls use all of them. Each deployment's weight is its
      # share of requests, in proportion to measured throughput: the dual-GPU vLLM batches the
      # most, the single-GPU vLLM less, and each Ollama node serves one request at a time
      # (OLLAMA_NUM_PARALLEL=1). Pre-call checks keep a prompt off any deployment whose window it
      # exceeds; the remaining weights still apply.
      #
      # No max_parallel_requests: LiteLLM waits on it only after choosing a deployment, so
      # requests queued behind a cap are invisible to routing and pile up there while larger
      # servers idle. vLLM and Ollama queue excess requests themselves.
      - model_name: devops-review
        litellm_params:
          model: openai/qwen2.5-coder-32b-instruct
          api_base: http://vllm.llm.svc.cluster.local:8000/v1
          api_key: none
          weight: 5
        model_info:
          max_input_tokens: 61440
      - model_name: devops-review
        litellm_params:
          model: openai/qwen2.5-coder-14b-instruct
          api_base: http://vllm-single.llm.svc.cluster.local:8000/v1
          api_key: none
          weight: 3
        model_info:
          max_input_tokens: 12288
      # max_input_tokens is OLLAMA_CONTEXT_LENGTH (48000) minus 4K tokens for the reply.
      - model_name: devops-review
        litellm_params:
          model: ollama_chat/gpt-oss:20b
          api_base: http://ollama-0.ollama-nodes.llm.svc.cluster.local:11434
          weight: 1
        model_info:
          max_input_tokens: 43904
      - model_name: devops-review
        litellm_params:
          model: ollama_chat/gpt-oss:20b
          api_base: http://ollama-1.ollama-nodes.llm.svc.cluster.local:11434
          weight: 1
        model_info:
          max_input_tokens: 43904

      # Pass-through: any model on the Ollama nodes by name, e.g. `ollama/gpt-oss:20b`. Ollama's
      # OpenAI-compatible API serves both chat (with the model's own template) and embeddings.
      # A model pulled on only some nodes still answers: a node without it fails, and the retry
      # moves to another node. Health checks need a concrete model; without one LiteLLM probes a
      # placeholder that no node has.
      - model_name: ollama/*
        litellm_params:
          model: openai/*
          api_base: http://ollama-0.ollama-nodes.llm.svc.cluster.local:11434/v1
          api_key: none
        model_info:
          health_check_model: openai/qwen2.5-coder:7b
      - model_name: ollama/*
        litellm_params:
          model: openai/*
          api_base: http://ollama-1.ollama-nodes.llm.svc.cluster.local:11434/v1
          api_key: none
        model_info:
          health_check_model: openai/qwen2.5-coder:7b

    router_settings:
      # Weighted random choice spreads a burst of simultaneous calls (a review sends one per
      # persona at once) by weight. least-busy counts a request only once its backend call
      # starts, so a burst lands on the first-listed deployment. Deployments without a weight
      # share equally.
      routing_strategy: simple-shuffle
      num_retries: 2
      # Long code reviews on the 32B model can generate for several minutes.
      timeout: 600
      # Check prompt size against max_input_tokens before calling a backend, so an oversized
      # prompt moves straight to its context-window fallback instead of failing first.
      enable_pre_call_checks: true
      # Backend unavailable: prefer the larger vLLM model before the small Ollama model.
      fallbacks:
        - devops-reasoning: [devops-coder]
        - devops-coder: [devops-reasoning, devops-chat]
      # Prompt too long for the model: escalate to a larger context window.
      context_window_fallbacks:
        - devops-chat: [devops-coder, devops-reasoning]
        - devops-coder: [devops-reasoning]

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      store_model_in_db: false
      proxy_batch_write_at: 10
