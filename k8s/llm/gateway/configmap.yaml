# LiteLLM Proxy / AI Gateway routing configuration.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-gateway-config
  namespace: llm
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/part-of: devops-cli-stack
data:
  config.yaml: |
    # Gateway routes target standardized <llm_provider>-<vram_gib> services.
    model_list:
      - model_name: devops-chat
        litellm_params:
          model: ollama_chat/qwen2.5-coder:7b
          api_base: http://ollama-24gib.llm.svc.cluster.local:11434

      - model_name: devops-coder
        litellm_params:
          model: openai/qwen2.5-coder-14b-instruct
          api_base: http://vllm-16gib.llm.svc.cluster.local:8000/v1
          api_key: none
        # Prompt budget inside the 16K vLLM window, leaving 4K tokens for the reply.
        model_info:
          max_input_tokens: 12288

      - model_name: devops-reasoning
        litellm_params:
          model: openai/qwen3-coder:30b
          api_base: http://vllm-48gib.llm.svc.cluster.local:8000/v1
          api_key: none
        # Prompt budget inside the 64K vLLM window, leaving 4K tokens for the reply.
        model_info:
          max_input_tokens: 61440

      # mode: embedding makes health checks embed rather than generate, which bge-m3 rejects.
      - model_name: devops-embedding
        litellm_params:
          model: ollama/bge-m3
          api_base: http://ollama-24gib.llm.svc.cluster.local:11434
        model_info:
          mode: embedding

      # devops-review: unified virtual model spread across the dual-GPU inference engines.
      # Dynamic concurrency-aware least-busy routing with per-backend caps directs traffic:
      # - vLLM on dual-GPU node (2x RTX 3090, TP=2, 48GiB VRAM): continuous dynamic batching engine.
      # - Ollama on multi-GPU Volta node (Tesla V100 64GiB VRAM): dedicated inference worker (max 1 concurrent).
      - model_name: devops-review
        litellm_params:
          model: openai/qwen3-coder:30b
          api_base: http://vllm-48gib.llm.svc.cluster.local:8000/v1
          api_key: none
          weight: 6
          max_parallel_requests: 64
        model_info:
          max_input_tokens: 61440
      - model_name: devops-review
        litellm_params:
          model: openai/qwen3-coder:30b
          api_base: http://ollama-64gib.llm.svc.cluster.local:11434/v1
          api_key: none
          weight: 1
          max_parallel_requests: 1
        model_info:
          max_input_tokens: 43904

      - model_name: devops-flagship
        litellm_params:
          model: openai/cogito-v2:70b
          api_base: http://vllm-64gib.llm.svc.cluster.local:8000/v1
          api_key: none
        model_info:
          max_input_tokens: 32768

      - model_name: gemma4:31b
        litellm_params:
          model: ollama_chat/gemma4:31b
          api_base: http://ollama-64gib.llm.svc.cluster.local:11434
        model_info:
          max_input_tokens: 32768

      - model_name: ollama/*
        litellm_params:
          model: openai/*
          api_base: http://ollama-24gib.llm.svc.cluster.local:11434/v1
          api_key: none
        model_info:
          health_check_model: openai/qwen2.5-coder:7b

    litellm_settings:
      # Per-deployment requests, failures and latency at /metrics/, scraped by Prometheus. The
      # Ollama nodes export no metrics of their own, so this is how their load is seen.
      callbacks: ["prometheus"]
      drop_params: true

    router_settings:
      # least-busy routing combined with per-backend max_parallel_requests keeps both
      # dedicated V100 Ollama workers continuously busy (max 1 each) without
      # queue stalls, while routing all concurrent overflow to the vLLM batching engine.
      routing_strategy: least-busy
      num_retries: 3
      # Long code reviews on the 32B model can generate for several minutes.
      timeout: 600
      # Check prompt size against max_input_tokens before calling a backend, so an oversized
      # prompt moves straight to its context-window fallback instead of failing first.
      enable_pre_call_checks: true
      # Backend unavailable: prefer the larger vLLM model before the small Ollama model.
      fallbacks:
        - devops-reasoning: [devops-coder]
        - devops-coder: [devops-reasoning, devops-chat]
      # Prompt too long for the model: escalate to a larger context window.
      context_window_fallbacks:
        - devops-chat: [devops-coder, devops-reasoning]
        - devops-coder: [devops-reasoning]

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      store_model_in_db: false
      proxy_batch_write_at: 10
