# LiteLLM Proxy / AI Gateway routing configuration.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-gateway-config
  namespace: llm
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/part-of: devops-cli-stack
data:
  config.yaml: |
    # Gateway routes target standardized <llm_provider>-<vram_gib>-[slow,standard,fast] services.
    model_list:
      - model_name: devops-chat
        litellm_params:
          model: ollama_chat/hf.co/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF:IQ3_S
          api_base: http://ollama-16gib-fast.llm.svc.cluster.local:11434
          model_info:
            max_input_tokens: 96000
          weight: 10
      - model_name: devops-chat
        litellm_params:
          model: ollama_chat/qwen3.8:27b
          api_base: http://ollama-48gib-fast.llm.svc.cluster.local:11434
          model_info:
            max_input_tokens: 128000
          weight: 5
      - model_name: devops-chat
        litellm_params:
          model: ollama_chat/qwen3.8:27b
          api_base: http://ollama-64gib-standard.llm.svc.cluster.local:11434
          model_info:
            max_input_tokens: 128000
          weight: 3

      - model_name: devops-coder
        litellm_params:
          model: ollama_chat/qwen3-coder:30b
          api_base: http://ollama-48gib-fast.llm.svc.cluster.local:11434

      - model_name: devops-reasoning
        litellm_params:
          model: ollama_chat/qwen3-coder:30b
          api_base: http://ollama-48gib-fast.llm.svc.cluster.local:11434

      # ollama-48gib-slow is the background tier, in no interactive or review pool: it serves one
      # request at a time, so a background job there would queue in front of review calls. Its
      # profile keeps two models loaded, the embedding model and qwen3-coder:30b, and this list
      # sends it no other. A third model would evict one of them, and Ollama predicts a dense
      # ~30B model too large to fit beside the embedder, so it evicts the embedder (#1064).
      # mode: embedding makes health checks embed rather than generate, which bge-m3 rejects.
      - model_name: bge-m3:latest
        litellm_params:
          model: ollama/bge-m3:latest
          api_base: http://ollama-48gib-slow.llm.svc.cluster.local:11434
          weight: 3
        model_info:
          mode: embedding

      # Background tier: ollama-48gib-slow's only generation model. Batch and --watch jobs reach
      # it through environment overrides (k8s/README.md), and devops-review falls back to it.
      # No max_input_tokens: LiteLLM writes a deployment's model_info into the cost-map entry
      # that every ollama_chat/qwen3-coder:30b deployment reads, so it would become the window
      # of the pinned and interactive groups too. The tier's context length caps it instead.
      - model_name: devops-background
        litellm_params:
          model: ollama_chat/qwen3-coder:30b
          api_base: http://ollama-48gib-slow.llm.svc.cluster.local:11434
          # Under the review client's 1,200 s read timeout, so a call the client abandoned frees
          # the tier's one slot, and no gateway retry re-queues the same work on that slot.
          timeout: 1100
          num_retries: 0

      # devops-review: one model name spread over the interactive Ollama tiers, each deployment
      # weighted by its throughput:
      # - qwen3-coder:30b on ollama-48gib-fast (2x RTX 3090) and ollama-64gib-standard (Tesla V100).
      # - gpt-oss:20b on ollama-16gib-fast.
      # The background tier (ollama-48gib-slow) is left out; it is devops-review's fallback.
      - model_name: devops-review
        litellm_params:
          model: ollama_chat/qwen3-coder:30b
          api_base: http://ollama-48gib-fast.llm.svc.cluster.local:11434
          weight: 9
      - model_name: devops-review
        litellm_params:
          model: ollama_chat/qwen3-coder:30b
          api_base: http://ollama-64gib-standard.llm.svc.cluster.local:11434
          weight: 6
      - model_name: devops-review
        litellm_params:
          model: ollama_chat/gpt-oss:20b
          api_base: http://ollama-16gib-fast.llm.svc.cluster.local:11434
          weight: 6

      # One group per devops-review model, copying its deployments and weights exactly, so a
      # review can be pinned to one model and routed as the pool routes it. No max_input_tokens
      # and no fallback: either would send a request somewhere the pool would not.
      - model_name: qwen3-coder:30b
        litellm_params:
          model: ollama_chat/qwen3-coder:30b
          api_base: http://ollama-48gib-fast.llm.svc.cluster.local:11434
          weight: 9
      - model_name: qwen3-coder:30b
        litellm_params:
          model: ollama_chat/qwen3-coder:30b
          api_base: http://ollama-64gib-standard.llm.svc.cluster.local:11434
          weight: 6

      - model_name: gpt-oss:20b
        litellm_params:
          model: ollama_chat/gpt-oss:20b
          api_base: http://ollama-16gib-fast.llm.svc.cluster.local:11434
          weight: 6

      - model_name: gemma4:31b
        litellm_params:
          model: ollama_chat/gemma4:31b
          api_base: http://ollama-48gib-fast.llm.svc.cluster.local:11434
          model_info:
            max_input_tokens: 128000
          weight: 5
      - model_name: gemma4:31b
        litellm_params:
          model: ollama_chat/gemma4:31b
          api_base: http://ollama-64gib-standard.llm.svc.cluster.local:11434
          model_info:
            max_input_tokens: 128000
          weight: 3

      - model_name: qwen3.8:27b
        litellm_params:
          model: ollama_chat/hf.co/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF:IQ3_S
          api_base: http://ollama-16gib-fast.llm.svc.cluster.local:11434
          model_info:
            max_input_tokens: 96000
          weight: 5
      - model_name: qwen3.8:27b
        litellm_params:
          model: ollama_chat/qwen3.8:27b
          api_base: http://ollama-48gib-fast.llm.svc.cluster.local:11434
          model_info:
            max_input_tokens: 128000
          weight: 5
      - model_name: qwen3.8:27b
        litellm_params:
          model: ollama_chat/qwen3.8:27b
          api_base: http://ollama-64gib-standard.llm.svc.cluster.local:11434
          model_info:
            max_input_tokens: 128000
          weight: 3

      - model_name: deepseek-r1:70b
        litellm_params:
          model: ollama_chat/deepseek-r1:70b
          api_base: http://ollama-64gib-standard.llm.svc.cluster.local:11434
          model_info:
            max_input_tokens: 128000

    litellm_settings:
      # Per-deployment requests, failures and latency at /metrics/, scraped by Prometheus. The
      # Ollama nodes export no metrics of their own, so this is how their load is seen.
      callbacks: ["prometheus"]
      require_auth_for_metrics_endpoint: false
      drop_params: true
      telemetry: false

    router_settings:
      # simple-shuffle routes requests weighted by throughput (litellm_params.weight),
      # directing traffic according to measured backend capacity.
      routing_strategy: simple-shuffle
      num_retries: 5
      allowed_fails: 3
      cooldown_time: 30
      # Long code reviews on the 32B model can generate for several minutes.
      timeout: 1500
      # Check prompt size against max_input_tokens before calling a backend, so an oversized
      # prompt moves straight to its context-window fallback instead of failing first.
      enable_pre_call_checks: true
      # Backend unavailable: prefer the larger vLLM model before the small Ollama model.
      fallbacks:
        - devops-reasoning: [devops-coder]
        - devops-coder: [devops-reasoning, devops-chat]
        # Once devops-review's retries fail, timeouts included. The router's 1,500 s timeout
        # outlasts the review client's 1,200 s, so a call that timed out here was already given
        # up, and the background tier spends up to 1,100 s on a reply nobody reads. With
        # context_window_fallbacks set, an oversized devops-review prompt re-raises instead.
        # No devops-chat rule: fallbacks chain, so devops-coder and devops-reasoning failures
        # would reach the background tier through devops-chat.
        - devops-review: [devops-background]
      # Prompt too long for the model: escalate to a larger context window.
      context_window_fallbacks:
        - devops-chat: [devops-coder, devops-reasoning]
        - devops-coder: [devops-reasoning]

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      store_model_in_db: false
      proxy_batch_write_at: 10
