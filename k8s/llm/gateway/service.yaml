# LiteLLM Proxy / AI Gateway Service.
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: llm
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  # Local minikube/homelab: NodePort is the authenticated LAN entry point to every model; Kubernetes
  # assigns the port (`kubectl -n llm get svc llm-gateway`). Production: use an Ingress instead.
  type: NodePort
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      protocol: TCP
  selector:
    app.kubernetes.io/name: llm-gateway
