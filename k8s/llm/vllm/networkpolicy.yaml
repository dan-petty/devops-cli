# NetworkPolicy for vLLM in llm namespace.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vllm-perimeter
  namespace: llm
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vllm
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Restrict ingress to the LLM Gateway
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: llm-gateway
      ports:
        - protocol: TCP
          port: 8000
    # Prometheus scrapes /metrics (#546)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # CoreDNS queries to kube-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Squid forward proxy in squid namespace for model weight downloads
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: squid
      ports:
        - protocol: TCP
          port: 3128
