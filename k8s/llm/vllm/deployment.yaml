# vLLM Tensor-Parallel (TP=2) continuous batching inference engine for nodes with two or more
# Ampere-or-newer GPUs. Older architectures run Ollama (../ollama.yaml) instead.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: llm
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  replicas: 1
  # GPUs are exclusive, so a surge pod could never schedule beside the running one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
        app.kubernetes.io/part-of: devops-cli-stack
    spec:
      runtimeClassName: nvidia
      # A Service named `vllm` would inject VLLM_PORT=tcp://..., which vLLM reads as its own setting.
      enableServiceLinks: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            # Terms are ORed: NVIDIA GPU Feature Discovery labels, or architecture labels.
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.family
                    operator: In
                    values: [ampere, ada-lovelace, hopper, blackwell]
                  - key: nvidia.com/gpu.count
                    operator: Gt
                    values: ["1"]
              - matchExpressions:
                  - key: nvidia.com/gpu.architecture
                    operator: In
                    values: [ampere, ada-lovelace, hopper, blackwell]
                  - key: nvidia.com/gpu.count
                    operator: Gt
                    values: ["1"]
      initContainers:
        # Squid re-signs HTTPS with its own CA; merge it with the system bundle for model downloads.
        - name: ca-bundle
          image: vllm/vllm-openai:v0.30.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - cat /etc/ssl/certs/ca-certificates.crt /etc/ssl/squid-ca/squid-ca.pem > /etc/ssl/bundle/ca-certificates.crt
          volumeMounts:
            - name: squid-ca-cert
              mountPath: /etc/ssl/squid-ca
              readOnly: true
            - name: ca-bundle
              mountPath: /etc/ssl/bundle
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.30.0
          imagePullPolicy: IfNotPresent
          command: ["vllm", "serve"]
          args:
            - "Qwen/Qwen2.5-Coder-32B-Instruct-AWQ"
            - "--served-model-name"
            - "qwen2.5-coder-32b-instruct"
            - "--tensor-parallel-size"
            - "2"
            # Qwen2.5-Coder is trained for 32K tokens; static YaRN (factor 2) extends it to 64K.
            # vLLM reads the extended length from max_position_embeddings for YaRN models.
            - "--max-model-len"
            - "65536"
            - "--hf-overrides"
            - '{"max_position_embeddings": 65536, "rope_parameters": {"rope_type": "yarn", "factor": 2.0, "original_max_position_embeddings": 32768, "rope_theta": 1000000}}'
            - "--gpu-memory-utilization"
            - "0.95"
            - "--max-num-seqs"
            - "64"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
          env:
            - name: HF_HOME
              value: "/root/.cache/huggingface"
            # Xet chunk transfers fail authentication through the SSL-bumping proxy; plain HTTPS works.
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: HTTP_PROXY
              value: "http://squid.squid.svc.cluster.local:3128"
            - name: HTTPS_PROXY
              value: "http://squid.squid.svc.cluster.local:3128"
            - name: NO_PROXY
              value: "localhost,127.0.0.1,llm-gateway.llm.svc.cluster.local,ollama.llm.svc.cluster.local,vllm.llm.svc.cluster.local"
            - name: SSL_CERT_FILE
              value: "/etc/ssl/bundle/ca-certificates.crt"
            - name: REQUESTS_CA_BUNDLE
              value: "/etc/ssl/bundle/ca-certificates.crt"
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "4"
              memory: 32Gi
              nvidia.com/gpu: "2"
            limits:
              cpu: "16"
              memory: 48Gi
              nvidia.com/gpu: "2"
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
            - name: shm
              mountPath: /dev/shm
            - name: ca-bundle
              mountPath: /etc/ssl/bundle
              readOnly: true
          # First start downloads ~20 GB of weights and captures CUDA graphs. On a ~50 Mbps link shared
          # with other downloads that takes hours, so allow up to 3 hours; restarts lose partial files.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            failureThreshold: 720
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: vllm-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: squid-ca-cert
          configMap:
            name: squid-ca-cert
        - name: ca-bundle
          emptyDir: {}
