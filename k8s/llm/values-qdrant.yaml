# Qdrant Helm values — minimal dev-mode configuration for minikube.
# Chart: qdrant/qdrant
# Repo:  https://qdrant.github.io/qdrant-helm

replicaCount: 1

config:
  telemetry_disabled: true
  storage:
    performance:
      max_search_threads: 2

# API key: Qdrant refuses a REST or gRPC request without it. Only /, /healthz, /readyz, /livez
# and the files of the web UI need no key, and the chart's probes use / and /readyz. The key
# comes from Secret qdrant-api-key, which `devops k8s push-secrets` writes from the keyring
# before deploy-stack installs this release (k8s/README.md, Cluster Secrets). Open WebUI sends
# the same key as QDRANT_API_KEY. The chart renders `env` on the qdrant container. It has no
# `extraEnv`, and Helm drops a key that the chart does not read with no error, so every key here
# is a key of the chart's values.yaml (tests/test_k8s_qdrant_security.py). apiKey and
# readOnlyApiKey stay unset, so the chart makes no Secret of its own.
env:
  - name: QDRANT__SERVICE__API_KEY
    valueFrom:
      secretKeyRef:
        name: qdrant-api-key
        key: api-key

service:
  # Zero-trust perimeter: ClusterIP restricts network access to the cluster network.
  # For local minikube direct access from the workstation host without port-forwarding,
  # override with type: NodePort.
  type: ClusterIP

persistence:
  enabled: true
  size: 5Gi
  accessModes:
    - ReadWriteOnce

# local-path binds the volume on the node where the pod first runs, and the root disk of the
# control-plane node has the least free space (#1634; k8s/README.md, Local-Path Volume Placement).
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist

resources:
  requests:
    cpu: 250m
    memory: 512Mi

# The chart renders the container's securityContext from containerSecurityContext; it never reads
# a top-level securityContext. Helm merges this over the chart's defaults. The root filesystem stays
# read-only because the chart mounts writable volumes at /qdrant/storage, /qdrant/snapshots and
# /qdrant/init. runAsGroup matches podSecurityContext, whose fsGroup owns the volumes.
containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# fsGroup: 1000 manages volume permissions; disable root chown initContainer
updateVolumeFsOwnership: false

# Prometheus ServiceMonitor (#823): Alloy scrapes /metrics on port http (6333) with the
# Bearer token from Secret qdrant-api-key, which Qdrant requires on every HTTP endpoint.
metrics:
  serviceMonitor:
    enabled: true
    authorization:
      type: Bearer
      credentials:
        name: qdrant-api-key
        key: api-key
