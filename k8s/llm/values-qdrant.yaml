# Qdrant Helm values — minimal dev-mode configuration for minikube.
# Chart: qdrant/qdrant
# Repo:  https://qdrant.github.io/qdrant-helm

replicaCount: 1

config:
  telemetry_disabled: true
  storage:
    performance:
      max_search_threads: 2

# API Key Secret Protection
# Enforce authentication for Qdrant vector database API and Web UI.
# Setting apiKey: false prevents auto-generation of unmanaged credentials, while extraEnv
# injects the API key from a pre-provisioned Kubernetes secret ('qdrant-api-key').
apiKey: false
readOnlyApiKey: false

extraEnv:
  - name: QDRANT__SERVICE__API_KEY
    valueFrom:
      secretKeyRef:
        name: qdrant-api-key
        key: api-key

service:
  # Zero-trust perimeter: ClusterIP restricts network access to the cluster network.
  # For local minikube direct access from the workstation host without port-forwarding,
  # override with type: NodePort.
  type: ClusterIP

persistence:
  enabled: true
  size: 5Gi
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 250m
    memory: 512Mi

# The chart renders the container's securityContext from containerSecurityContext; it never reads
# a top-level securityContext. Helm merges this over the chart's defaults. The root filesystem stays
# read-only because the chart mounts writable volumes at /qdrant/storage, /qdrant/snapshots and
# /qdrant/init. runAsGroup matches podSecurityContext, whose fsGroup owns the volumes.
containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# fsGroup: 1000 manages volume permissions; disable root chown initContainer
updateVolumeFsOwnership: false
