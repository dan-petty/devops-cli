# Qdrant Helm values — minimal dev-mode configuration for minikube.
# Chart: qdrant/qdrant
# Repo:  https://qdrant.github.io/qdrant-helm

replicaCount: 1

config:
  telemetry_disabled: true
  storage:
    performance:
      max_search_threads: 2

service:
  # Local minikube: NodePort allows direct access from workstation host.
  # Production: Use ClusterIP with an Ingress/NetworkPolicy restricting access to the llm namespace.
  type: NodePort

persistence:
  enabled: true
  size: 5Gi
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 250m
    memory: 512Mi

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
