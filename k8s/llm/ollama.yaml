# Ollama serves GPUs older than Ampere, one pod per GPU node. A StatefulSet rather than a
# DaemonSet gives each pod a stable DNS name (ollama-<n>.ollama-nodes), so the gateway can list
# every node as its own deployment: through the `ollama` Service, LiteLLM's long-lived
# connections pin all gateway traffic to one pod.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
  namespace: llm
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  # One per GPU node that Ollama may use. Keep one gateway deployment per replica in
  # gateway/configmap.yaml (devops-chat, devops-embedding and the Ollama tier of devops-review).
  replicas: 2
  serviceName: ollama-nodes
  # Start and replace pods independently, so a node that is offline never holds up the others.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
      app.kubernetes.io/instance: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
        app.kubernetes.io/instance: ollama
        app.kubernetes.io/part-of: devops-cli-stack
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.present: "true"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            # Ampere-or-newer GPUs are served by vLLM (vllm/, vllm-single/); Ollama keeps older
            # architectures. NotIn also matches nodes that carry neither GPU label scheme.
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.family
                    operator: NotIn
                    values: [ampere, ada-lovelace, hopper, blackwell]
                  - key: nvidia.com/gpu.architecture
                    operator: NotIn
                    values: [ampere, ada-lovelace, hopper, blackwell]
        # One pod per node: each owns the node's GPUs, host port and model directory.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: ollama
                  app.kubernetes.io/instance: ollama
      containers:
        - name: ollama
          image: ollama/ollama:0.32.14
          imagePullPolicy: IfNotPresent
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_MODELS
              value: "/root/.ollama/models"
            - name: OLLAMA_CONTEXT_LENGTH
              value: "48000"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "2"
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_MAX_TRANSFER_STREAMS
              value: "128"
            - name: OLLAMA_KV_CACHE_TYPE
              value: "q8_0"
              # value: "q4_0"
            - name: OLLAMA_NO_CLOUD
              value: "1"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility"
            - name: HTTP_PROXY
              value: "http://squid.squid.svc.cluster.local:3128"
            - name: HTTPS_PROXY
              value: "http://squid.squid.svc.cluster.local:3128"
            - name: NO_PROXY
              value: "localhost,127.0.0.1"
            - name: SSL_CERT_DIR
              value: "/etc/ssl/certs:/etc/ssl/squid-ca"
          ports:
            - name: http
              containerPort: 11434
              # Local workstation GPU node: hostPort allows direct low-latency inference from host processes.
              # Production: Remove hostPort and route via in-cluster ClusterIP Service / Ingress.
              hostPort: 11434
              protocol: TCP
          resources:
            requests:
              cpu: 3000m
              memory: 8Gi
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
            - name: squid-ca-cert
              mountPath: /etc/ssl/squid-ca
              readOnly: true
          startupProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        # Node-local NVMe storage: direct PCIe bandwidth maximizes model load speeds into VRAM
        # and avoids saturating cluster network bandwidth with multi-gigabyte weight layers
        - name: ollama-data
          hostPath:
            path: /var/lib/ollama
            type: DirectoryOrCreate
        - name: squid-ca-cert
          configMap:
            name: squid-ca-cert
            optional: false
---
# Per-pod DNS for the gateway: ollama-<n>.ollama-nodes.llm.svc.cluster.local. Only ready pods
# resolve, so the gateway's retries skip a pod that is down.
apiVersion: v1
kind: Service
metadata:
  name: ollama-nodes
  namespace: llm
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/instance: ollama
  ports:
    - name: http
      port: 11434
      targetPort: 11434
      protocol: TCP
---
# Any Ollama node, for clients that need no particular one (Open WebUI, port-forwards, the
# gateway's ollama/* pass-through).
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: llm
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  # Local minikube/homelab: NodePort enables direct LAN access for CLI benchmarking.
  # Production: Use ClusterIP with an Ingress Controller or internal Service Mesh.
  type: NodePort
  selector:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/instance: ollama
  ports:
    - name: http
      port: 11434
      targetPort: 11434
      nodePort: 31434
      protocol: TCP
