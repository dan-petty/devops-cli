# Bridges Minikube cluster traffic to Ollama running on the workstation host.
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: llm
spec:
  ports:
    - name: http
      port: 11434
      targetPort: 11434
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ollama
  namespace: llm
subsets:
  - addresses:
      # Local minikube: 192.168.49.1 is the default host gateway IP on the minikube bridge.
      # Production: Replace with dedicated in-cluster DaemonSet pod IPs, ExternalName service, or DNS name.
      - ip: 192.168.49.1
    ports:
      - name: http
        port: 11434
