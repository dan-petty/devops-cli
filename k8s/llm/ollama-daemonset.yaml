apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ollama
  namespace: llm
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
      app.kubernetes.io/instance: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
        app.kubernetes.io/instance: ollama
        app.kubernetes.io/part-of: devops-cli-stack
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: ollama
          image: ollama/ollama:0.32.14
          imagePullPolicy: IfNotPresent
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_MODELS
              value: "/root/.ollama/models"
            - name: OLLAMA_CONTEXT_LENGTH
              value: "48000"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "2"
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_MAX_TRANSFER_STREAMS
              value: "128"
            - name: OLLAMA_KV_CACHE_TYPE
              value: "q8_0"
              # value: "q4_0"
            - name: OLLAMA_NO_CLOUD
              value: "1"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility"
          ports:
            - name: http
              containerPort: 11434
              # Local workstation GPU node: hostPort allows direct low-latency inference from host processes.
              # Production: Remove hostPort and route via in-cluster ClusterIP Service / Ingress.
              hostPort: 11434
              protocol: TCP
          resources:
            requests:
              cpu: 3000m
              memory: 12Gi
            limits:
              memory: 24Gi
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: ollama-data
          # Local homelab/workstation: NFS share for sharing multi-GB GGUF models across nodes.
          # Production: Use persistentVolumeClaim with ReadWriteMany CSI driver (e.g. CephFS, AWS EFS).
          nfs:
            server: 192.168.1.4
            path: /srv/nfs/ollama
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: llm
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  # Local minikube/homelab: NodePort enables direct LAN access for CLI benchmarking.
  # Production: Use ClusterIP with an Ingress Controller or internal Service Mesh.
  type: NodePort
  selector:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/instance: ollama
  ports:
    - name: http
      port: 11434
      targetPort: 11434
      nodePort: 31434
      protocol: TCP
