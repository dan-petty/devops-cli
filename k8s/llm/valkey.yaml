# Valkey manifest — high-performance Redis-compatible key-value store for local LLM caching.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: llm
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
        k8s.grafana.com/metrics.container: redis-exporter
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/part-of: devops-cli-stack
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: valkey
          image: valkey/valkey:9.1.2-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - valkey-server
            - "--save"
            - ""
            - "--appendonly"
            - "no"
            - "--dir"
            - "/data"
          volumeMounts:
            - name: valkey-data
              mountPath: /data
            - name: valkey-tmp
              mountPath: /tmp
          ports:
            - name: valkey
              containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 2048Mi
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
        - name: redis-exporter
          image: ghcr.io/oliver006/redis_exporter:v1.93.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          env:
            - name: REDIS_ADDR
              value: redis://localhost:6379
            - name: REDIS_EXPORTER_WEB_LISTEN_ADDRESS
              value: 0.0.0.0:9121
          ports:
            - name: metrics
              containerPort: 9121
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9121
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9121
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: valkey-data
          emptyDir: {}
        - name: valkey-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: llm
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: 6379
