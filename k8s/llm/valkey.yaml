# Valkey manifest — high-performance Redis-compatible key-value store for local LLM caching.
#
# Open WebUI keeps its state and its websocket pub/sub here. Valkey requires a password, which
# comes from the keyring: `devops k8s push-secrets --only llm/valkey-auth` writes it, generating
# one the first time, and deploy-stack pushes it before it applies this file. The policy
# valkey-perimeter admits only Open WebUI and the metrics scrapers.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: llm
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
        k8s.grafana.com/metrics.container: redis-exporter
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/part-of: devops-cli-stack
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: valkey
          image: valkey/valkey:9.1.2-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # The password goes into a config file on a memory volume rather than onto the command
          # line, where it would show in the process list.
          #
          # Valkey keeps at most 1536 MiB of data, three quarters of the 2048Mi limit (#711). The
          # Valkey administration guide sets maxmemory below the free memory by Valkey's own
          # overhead and the fragmentation ("10 GB free: set it to 8 or 9"). maxmemory counts the
          # bytes Valkey allocates, not its resident memory, and the allocator keeps the pages it
          # frees. At the measured allocator fragmentation of about 1.2, 1536 MiB of data is
          # about 1850 MiB resident. This Valkey has no replica, no AOF and no RDB, so it needs
          # no replication buffer and no fork.
          #
          # At the bound Valkey refuses writes and evicts no key. Open WebUI keeps its session
          # pools and token revocations here. Its Redis guide names noeviction, because an
          # evicted revocation makes a signed-out token valid again.
          command:
            - sh
            - -c
            - >-
              umask 077 &&
              printf 'requirepass "%s"\n' "$VALKEY_PASSWORD" > /run/valkey/auth.conf &&
              exec valkey-server /run/valkey/auth.conf
              --save ""
              --appendonly no
              --dir /data
              --maxmemory 1536mb
              --maxmemory-policy noeviction
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-auth
                  key: VALKEY_PASSWORD
          volumeMounts:
            - name: valkey-data
              mountPath: /data
            - name: valkey-tmp
              mountPath: /tmp
            - name: config
              mountPath: /run/valkey
          ports:
            - name: valkey
              containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 2048Mi
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
        - name: redis-exporter
          image: ghcr.io/oliver006/redis_exporter:v1.93.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          env:
            - name: REDIS_ADDR
              value: redis://localhost:6379
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-auth
                  key: VALKEY_PASSWORD
            - name: REDIS_EXPORTER_WEB_LISTEN_ADDRESS
              value: 0.0.0.0:9121
          ports:
            - name: metrics
              containerPort: 9121
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9121
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9121
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: valkey-data
          emptyDir: {}
        - name: valkey-tmp
          emptyDir: {}
        - name: config
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: llm
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey-perimeter
  namespace: llm
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: valkey
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Open WebUI is the only client (values-open-webui.yaml).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: open-webui
      ports:
        - protocol: TCP
          port: 6379
    # Alloy scrapes the redis-exporter sidecar.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9121
  # No egress: Valkey only answers, and the exporter reaches it on localhost.
  egress: []
