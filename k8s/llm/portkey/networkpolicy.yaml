# NetworkPolicy for Portkey AI Gateway in llm namespace.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: portkey-perimeter
  namespace: llm
  labels:
    app.kubernetes.io/name: portkey
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: portkey
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming API requests to port 8787 from stack workloads and monitoring
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: devops-cli-stack
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8787
  egress:
    # Allow communication to backend inference pods (Ollama). Every Ollama tier
    # (profiles/ollama-profiles.yaml) carries llm.devops.io/provider: ollama. Portkey reads its
    # cache only from REDIS_CONNECTION_STRING, which is not set, so it calls no Valkey.
    - to:
        - podSelector:
            matchLabels:
              llm.devops.io/provider: ollama
      ports:
        - protocol: TCP
          port: 11434
    # DNS queries to kube-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
