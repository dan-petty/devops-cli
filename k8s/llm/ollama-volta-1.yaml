# Secondary Ollama deployment for multi-GPU Volta nodes, pinning GPU 1 to serve
# qwen3-coder:30b alongside GPU 0 (ollama.yaml).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-volta-1
  namespace: llm
  labels:
    app.kubernetes.io/name: ollama-volta-1
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama-volta-1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-volta-1
        app.kubernetes.io/part-of: devops-cli-stack
        llm.devops.io/model: qwen3-coder-30b
        llm.devops.io/backend: ollama
        llm.devops.io/gpu-count: "1"
        llm.devops.io/vram-per-gpu: "32GiB"
    spec:
      runtimeClassName: nvidia
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.architecture
                    operator: In
                    values: [volta]
                  - key: nvidia.com/gpu.count
                    operator: Gt
                    values: ["1"]
      containers:
        - name: ollama
          image: ollama/ollama:0.32.14
          imagePullPolicy: IfNotPresent
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_MODELS
              value: "/root/.ollama/models"
            - name: OLLAMA_CONTEXT_LENGTH
              value: "48000"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "2"
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_MAX_TRANSFER_STREAMS
              value: "128"
            - name: OLLAMA_KV_CACHE_TYPE
              value: "q8_0"
            - name: OLLAMA_NO_CLOUD
              value: "1"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "1"
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility"
            - name: HTTP_PROXY
              value: "http://squid.squid.svc.cluster.local:3128"
            - name: HTTPS_PROXY
              value: "http://squid.squid.svc.cluster.local:3128"
            - name: NO_PROXY
              value: "localhost,127.0.0.1"
            - name: SSL_CERT_DIR
              value: "/etc/ssl/certs:/etc/ssl/squid-ca"
          ports:
            - name: http
              containerPort: 11434
              protocol: TCP
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
            - name: squid-ca-cert
              mountPath: /etc/ssl/squid-ca
              readOnly: true
          startupProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        - name: ollama-data
          hostPath:
            path: /var/lib/ollama
            type: DirectoryOrCreate
        - name: squid-ca-cert
          configMap:
            name: squid-ca-cert
            optional: false
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-volta-1
  namespace: llm
  labels:
    app.kubernetes.io/name: ollama-volta-1
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ollama-volta-1
  ports:
    - name: http
      port: 11434
      targetPort: 11434
      protocol: TCP
