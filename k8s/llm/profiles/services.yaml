# Standardized Kubernetes Services for LLM Inference Backends by VRAM Capacity.
# Decouples GPU node hardware configurations from cluster routing using <llm_provider>-<vram_gib> naming.
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-16gib
  namespace: llm
  labels:
    app.kubernetes.io/name: ollama-16gib
    app.kubernetes.io/part-of: devops-cli-stack
    llm.devops.io/provider: ollama
    llm.devops.io/vram-gib: "16gib"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 11434
      targetPort: 11434
      protocol: TCP
  selector:
    llm.devops.io/provider: ollama
    llm.devops.io/vram-gib: "16gib"
---
