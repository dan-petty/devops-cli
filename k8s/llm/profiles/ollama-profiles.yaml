# Ollama Inference Workload Profiles Consolidated by Total VRAM Capacity (<llm_provider>-<vram_gib>).
# Tiers: 16gib, 24gib, 32gib, 48gib, 64gib, 72gib, 96gib, 128gib.
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ollama-16gib
  namespace: llm
  labels:
    app.kubernetes.io/name: ollama-16gib
    app.kubernetes.io/part-of: devops-cli-stack
    llm.devops.io/backend: ollama
    llm.devops.io/provider: ollama
    llm.devops.io/vram-gib: 16gib
    llm.devops.io/total-vram-gib: "16"
    llm.devops.io/speed-tier: fast
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama-16gib
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-16gib
        app.kubernetes.io/part-of: devops-cli-stack
        llm.devops.io/backend: ollama
        llm.devops.io/provider: ollama
        llm.devops.io/vram-gib: 16gib
        llm.devops.io/total-vram-gib: "16"
        llm.devops.io/speed-tier: fast
    spec:
      runtimeClassName: nvidia
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  # - key: nvidia.com/gpu.architecture
                  #   operator: NotIn
                  #   values: ["ada-lovelace", "ampere", "blackwell", "hopper"]
                  # - key: nvidia.com/gpu.family
                  #   operator: NotIn
                  #   values: ["ada-lovelace", "ampere", "blackwell", "hopper"]
                  - key: nvidia.com/gpu.total-vram-gib
                    operator: In
                    values: ["16Gi", "20Gi"]
      containers:
        - name: ollama
          image: ollama/ollama:0.34.4
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: OLLAMA_MODELS
              value: /root/.ollama/models
            - name: OLLAMA_CONTEXT_LENGTH
              value: "48000"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "2"
            - name: OLLAMA_NUM_PARALLEL
              value: "2"
            - name: OLLAMA_KV_CACHE_TYPE
              value: q4_0
            - name: OLLAMA_NO_CLOUD
              value: "1"
          ports:
            - containerPort: 11434
              name: http
          resources:
            requests:
              cpu: 3000m
              memory: 8Gi
          startupProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
      volumes:
        - name: ollama-data
          hostPath:
            path: /var/lib/ollama
            type: DirectoryOrCreate
---
