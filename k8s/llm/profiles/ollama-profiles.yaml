# Ollama Inference Engine Profiles for Traditional Homelab GPU Configurations.
# Covers GPU counts [1, 2, 3, 4] and per-GPU VRAM sizes [16GiB, 24GiB, 32GiB].
---
# ── Profile 1: 1x 16GiB (ollama-1x16gb) ───────────────────────────────────────
# Target Hardware: Single RTX 4080 (16GB), RTX 4060 Ti 16GB, T4 (16GB).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-1x16gb
  namespace: llm
  labels:
    app.kubernetes.io/name: ollama-1x16gb
    app.kubernetes.io/part-of: devops-cli-stack
    llm.devops.io/model: qwen2.5-coder-7b
    llm.devops.io/backend: ollama
    llm.devops.io/gpu-count: "1"
    llm.devops.io/vram-per-gpu: "16GiB"
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama-1x16gb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-1x16gb
        app.kubernetes.io/part-of: devops-cli-stack
        llm.devops.io/model: qwen2.5-coder-7b
        llm.devops.io/backend: ollama
        llm.devops.io/gpu-count: "1"
        llm.devops.io/vram-per-gpu: "16GiB"
    spec:
      runtimeClassName: nvidia
      containers:
        - name: ollama
          image: ollama/ollama:0.32.14
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_CONTEXT_LENGTH
              value: "32768"
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_KV_CACHE_TYPE
              value: "q8_0"
            - name: OLLAMA_NO_CLOUD
              value: "1"
          ports:
            - containerPort: 11434
              name: http
          resources:
            requests:
              cpu: "2000m"
              memory: 8Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8000m"
              memory: 16Gi
              nvidia.com/gpu: "1"
---
