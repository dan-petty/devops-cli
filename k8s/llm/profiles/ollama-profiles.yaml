apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ollama-128gib
  namespace: llm
  labels:
    app.kubernetes.io/name: ollama-128gib
    app.kubernetes.io/part-of: devops-cli-stack
    llm.devops.io/backend: ollama
    llm.devops.io/provider: ollama
    llm.devops.io/vram-gib: 128gib
    llm.devops.io/total-vram-gib: "128"
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama-128gib
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-128gib
        app.kubernetes.io/part-of: devops-cli-stack
        llm.devops.io/backend: ollama
        llm.devops.io/provider: ollama
        llm.devops.io/vram-gib: 128gib
        llm.devops.io/total-vram-gib: "128"
    spec:
      runtimeClassName: nvidia
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  # - key: nvidia.com/gpu.architecture
                  #   operator: NotIn
                  #   values: ["ada-lovelace", "ampere", "blackwell", "hopper"]
                  # - key: nvidia.com/gpu.family
                  #   operator: NotIn
                  #   values: ["ada-lovelace", "ampere", "blackwell", "hopper"]
                  - key: nvidia.com/gpu.total-vram-gib
                    operator: In
                    values: ["128Gi"]
      containers:
        - name: ollama
          image: ollama/ollama:0.34.4
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: OLLAMA_MODELS
              value: /root/.ollama/models
            - name: OLLAMA_CONTEXT_LENGTH
              value: "256000"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "2"
            - name: OLLAMA_NUM_PARALLEL
              value: "4"
            - name: OLLAMA_KV_CACHE_TYPE
              value: q8_0
            - name: OLLAMA_SCHED_SPREAD
              value: "1"
            - name: OLLAMA_NO_CLOUD
              value: "1"
          ports:
            - containerPort: 11434
              name: http
          resources:
            requests:
              cpu: 8000m
              memory: 64Gi
          startupProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
      volumes:
        - name: ollama-data
          hostPath:
            path: /var/lib/ollama
            type: DirectoryOrCreate
