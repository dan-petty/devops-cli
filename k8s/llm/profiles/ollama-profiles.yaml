apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/name: ollama-24gib-embed-gpu0
    app.kubernetes.io/part-of: devops-cli-stack
    llm.devops.io/backend: ollama
    llm.devops.io/provider: ollama
    llm.devops.io/speed-tier: embed
    llm.devops.io/total-vram-gib: '24'
    llm.devops.io/vram-gib: 24gib
  name: ollama-24gib-embed-gpu0
  namespace: llm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama-24gib-embed-gpu0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-24gib-embed-gpu0
        app.kubernetes.io/part-of: devops-cli-stack
        llm.devops.io/backend: ollama
        llm.devops.io/provider: ollama
        llm.devops.io/speed-tier: embed
        llm.devops.io/total-vram-gib: '24'
        llm.devops.io/vram-gib: 24gib
        llm.devops.io/gpu-instance: '0'
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.architecture
                    operator: In
                    values:
                      - pascal
                      - maxwell
                      - kepler
                  - key: nvidia.com/gpu.total-vram-gib
                    operator: In
                    values:
                      - 48Gi
                      - 52Gi
                      - 56Gi
                      - 60Gi
      automountServiceAccountToken: false
      containers:
        - env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: HOME
              value: /home/ollama
            - name: OLLAMA_MODELS
              value: /home/ollama/.ollama/models
            - name: OLLAMA_CONTEXT_LENGTH
              value: '8192'
            - name: OLLAMA_MAX_LOADED_MODELS
              value: '1'
            - name: OLLAMA_NUM_PARALLEL
              value: '1'
            - name: OLLAMA_KEEP_ALIVE
              value: '-1'
            - name: OLLAMA_KV_CACHE_TYPE
              value: q8_0
            - name: OLLAMA_NO_CLOUD
              value: '1'
            - name: LLAMA_ARG_THREADS
              value: '1'
            - name: OLLAMA_NOPRUNE
              value: '1'
          image: ollama/ollama:0.40.12
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
          name: ollama
          ports:
            - containerPort: 11434
              name: http
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              memory: 4Gi
              nvidia.com/gpu: 1
            requests:
              cpu: 2000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /home/ollama/.ollama
              name: ollama-data
            - mountPath: /tmp
              name: tmp
      initContainers:
        - command:
            - chown
            - -R
            - 10001:10001
            - /home/ollama/.ollama
          image: ollama/ollama:0.40.12
          name: own-model-directory
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - mountPath: /home/ollama/.ollama
              name: ollama-data
      runtimeClassName: nvidia
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - hostPath:
            path: /var/lib/ollama
