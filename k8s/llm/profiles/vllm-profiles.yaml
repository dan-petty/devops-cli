# ── Profile 12: 4x 32GiB (vllm-4x32gb) ────────────────────────────────────────
# Target Hardware: Quad Tesla V100 32GB (128GB total, TP=4) serving 70B FP8/BF16.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-4x32gb
  namespace: llm
  labels:
    app.kubernetes.io/name: vllm-4x32gb
    app.kubernetes.io/part-of: devops-cli-stack
    llm.devops.io/model: cogito-v2-70b
    llm.devops.io/backend: vllm
    llm.devops.io/gpu-count: "4"
    llm.devops.io/vram-per-gpu: "32GiB"
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-4x32gb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-4x32gb
        app.kubernetes.io/part-of: devops-cli-stack
        llm.devops.io/model: cogito-v2-70b
        llm.devops.io/backend: vllm
        llm.devops.io/gpu-count: "4"
        llm.devops.io/vram-per-gpu: "32GiB"
    spec:
      runtimeClassName: nvidia
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.30.0
          command: ["vllm", "serve"]
          args:
            - "QuantTrio/Cogito-v2-70B-Instruct-AWQ"
            - "--served-model-name"
            - "cogito-v2:70b"
            - "--tensor-parallel-size"
            - "4"
            - "--max-model-len"
            - "65536"
            - "--kv-cache-dtype"
            - "fp8"
            - "--gpu-memory-utilization"
            - "0.95"
            - "--max-num-seqs"
            - "64"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: "4"
            limits:
              cpu: "32"
              memory: 128Gi
              nvidia.com/gpu: "4"
