# vLLM Inference Engine Profiles for Traditional Homelab GPU Configurations.
# Covers GPU counts [1, 2, 3, 4] and per-GPU VRAM sizes [16GiB, 24GiB, 32GiB].
---
# ── Profile 1: 1x 16GiB (vllm-1x16gb) ─────────────────────────────────────────
# Target Hardware: Single RTX 4080 (16GB), RTX 4060 Ti 16GB, T4 (16GB), V100 16GB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-1x16gb
  namespace: llm
  labels:
    app.kubernetes.io/name: vllm-1x16gb
    app.kubernetes.io/part-of: devops-cli-stack
    llm.devops.io/model: qwen2.5-coder-14b
    llm.devops.io/backend: vllm
    llm.devops.io/gpu-count: "1"
    llm.devops.io/vram-per-gpu: "16GiB"
spec:
  replicas: 0  # Enabled when targeting 1x16GiB nodes
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-1x16gb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-1x16gb
        app.kubernetes.io/part-of: devops-cli-stack
        llm.devops.io/model: qwen2.5-coder-14b
        llm.devops.io/backend: vllm
        llm.devops.io/gpu-count: "1"
        llm.devops.io/vram-per-gpu: "16GiB"
    spec:
      runtimeClassName: nvidia
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.30.0
          command: ["vllm", "serve"]
          args:
            - "Qwen/Qwen2.5-Coder-14B-Instruct-AWQ"
            - "--served-model-name"
            - "qwen2.5-coder-14b-instruct"
            - "--tensor-parallel-size"
            - "1"
            - "--max-model-len"
            - "16384"
            - "--kv-cache-dtype"
            - "fp8"
            - "--gpu-memory-utilization"
            - "0.95"
            - "--max-num-seqs"
            - "16"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "2"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 24Gi
              nvidia.com/gpu: "1"
---
