# The template of the Ollama tier for two GPUs of an old architecture (#3501). Kustomize does not
# read this file. `devops ai gateway render --apply` applies k8s/llm/profiles/gpu-thresholds.yaml to
# it and writes the result into ../ollama-profiles.yaml. The annotations say how many instances the
# tier runs at or below the per_gpu threshold, and which model it serves at or below the
# embedding_only threshold. As a chat tier it loads one model for good, as the tiers ollama-48gib
# and ollama-64gib do (#3567), and the gateway sends it no embedding batch. Its context length is
# the native limit of qwen3.8:27b. No one has measured that length on these GPUs: the VRAM total
# equals that of ollama-48gib, where 262144 takes 27 GB (see ollama-profiles.yaml).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ollama-48gib-slow
  namespace: llm
  labels:
    app.kubernetes.io/name: ollama-48gib-slow
    app.kubernetes.io/part-of: devops-cli-stack
    llm.devops.io/backend: ollama
    llm.devops.io/provider: ollama
    llm.devops.io/vram-gib: 48gib
    llm.devops.io/total-vram-gib: "48"
    llm.devops.io/speed-tier: slow
  annotations:
    llm.devops.io/gpu-count: "2"
    llm.devops.io/embedding-model: qwen3-embedding:0.6b
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama-48gib-slow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-48gib-slow
        app.kubernetes.io/part-of: devops-cli-stack
        llm.devops.io/backend: ollama
        llm.devops.io/provider: ollama
        llm.devops.io/vram-gib: 48gib
        llm.devops.io/total-vram-gib: "48"
        llm.devops.io/speed-tier: slow
    spec:
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.architecture
                    operator: In
                    values: ["pascal", "maxwell", "kepler"]
                  - key: nvidia.com/gpu.total-vram-gib
                    operator: In
                    values: ["48Gi", "52Gi", "56Gi", "60Gi"]
      initContainers:
        - name: own-model-directory
          image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
          command:
            - chown
            - -R
            - "10001:10001"
            - /home/ollama/.ollama
          resources:
            requests:
              cpu: 10m
            limits:
              memory: 64Mi
          volumeMounts:
            - name: ollama-data
              mountPath: /home/ollama/.ollama
      containers:
        - name: ollama
          image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: HOME
              value: /home/ollama
            - name: OLLAMA_MODELS
              value: /home/ollama/.ollama/models
            - name: OLLAMA_CONTEXT_LENGTH
              value: "262144"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
            - name: OLLAMA_KV_CACHE_TYPE
              value: q8_0
            - name: OLLAMA_SCHED_SPREAD
              value: "1"
            - name: OLLAMA_NO_CLOUD
              value: "1"
          ports:
            - containerPort: 11434
              name: http
          resources:
            requests:
              cpu: 6000m
              memory: 24Gi
          startupProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: ollama-data
              mountPath: /home/ollama/.ollama
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: ollama-data
          hostPath:
            path: /var/lib/ollama
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
