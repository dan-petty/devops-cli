apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-default-perimeter
  namespace: llm
  labels:
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow intra-namespace pod communications
    - from:
        - podSelector: {}
    # Allow ingress from monitoring for Prometheus metrics scraping
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
  egress:
    # Allow intra-namespace pod communications
    - to:
        - podSelector: {}
    # Allow CoreDNS lookups in kube-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow external model pulls while blocking cloud instance metadata endpoints (SSRF mitigation)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
