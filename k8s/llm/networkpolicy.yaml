apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-default-perimeter-ingress
  namespace: llm
  labels:
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values:
          - llm-gateway
          - portkey
          - valkey
          - valkey-runs
          - valkey-devops
      # The gateway database has its own policy (gateway-db.yaml).
      - key: cnpg.io/cluster
        operator: NotIn
        values:
          - llm-gateway-db
  policyTypes:
    - Ingress
  ingress:
    # Allow intra-namespace pod communications
    - from:
        - podSelector: {}
    # Allow ingress from monitoring for Prometheus metrics scraping
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    # Allow ingress from Traefik in kube-system for Ingress routing
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
    # Allow ingress from rag-ingest in namespace devops to Qdrant on port 6333 (#1653)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: devops
          podSelector:
            matchLabels:
              app.kubernetes.io/name: rag-ingest
      ports:
        - protocol: TCP
          port: 6333
    # Allow ingress from the devops namespace to Qdrant on port 6333 for the pods that load
    # Secret devops-cli with envFrom, such as a Job of CronJob devops-cli, which hold the read-only
    # key (#3823). The runner and the roadmap Service hold no Qdrant key (#6518). No other new
    # peer enters.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: devops
      ports:
        - protocol: TCP
          port: 6333
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-default-perimeter-egress
  namespace: llm
  labels:
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values:
          - llm-gateway
          - portkey
          - valkey
          - valkey-runs
          - valkey-devops
      # The gateway database has its own policy (gateway-db.yaml).
      - key: cnpg.io/cluster
        operator: NotIn
        values:
          - llm-gateway-db
  policyTypes:
    - Egress
  egress:
    # Allow intra-namespace pod communications
    - to:
        - podSelector: {}
    # Allow CoreDNS lookups in kube-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow external model pulls while blocking cloud instance metadata endpoints (SSRF mitigation)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
