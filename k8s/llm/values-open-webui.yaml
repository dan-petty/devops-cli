# Open WebUI Helm values. Argo CD's Application `open-webui` installs them on the k3s homelab, and
# `devops k8s deploy-stack --stack llm` installs them on either cluster.
# Chart: open-webui/open-webui
# Repo:  https://open-webui.github.io/helm-charts

image:
  repository: ghcr.io/open-webui/open-webui
  # A pinned release tag. A change of the tag is a pull request.
  tag: "v0.11.4"

ollama:
  enabled: false

pipelines:
  enabled: false

# No connection to Ollama's native API: with no `ollamaUrls` and no bundled Ollama, the chart sets
# ENABLE_OLLAMA_API=False, so every model call of Open WebUI goes through the gateway and is on
# the gateway's series that the AI spend dashboard reads (#1668). Open WebUI keeps the setting in
# its database after its first start, so the Admin Panel turns the live Ollama connection off.

# OpenAI-compatible connection to the LiteLLM gateway (Ollama models by virtual name),
# authenticated with the gateway master key. Applies on first start; Open WebUI persists
# connections in its database afterwards (Admin Panel > Settings > Connections).
enableOpenaiApi: true
openaiBaseApiUrl: "http://llm-gateway.llm.svc.cluster.local:4000/v1"
openaiApiKeyExistingSecret: llm-gateway-secrets
openaiApiKeyExistingSecretKey: master-key

extraEnvVars:
  - name: VECTOR_DB
    value: "qdrant"
  - name: QDRANT_URI
    value: "http://qdrant.llm.svc.cluster.local:6333"
  # Qdrant refuses a request without its API key (values-qdrant.yaml).
  - name: QDRANT_API_KEY
    valueFrom:
      secretKeyRef:
        name: qdrant-api-key
        key: api-key
  # RAG embeddings go through the gateway with its master key, to the embedding group that the
  # gateway serves. Open WebUI sets no RAG Ollama URL by default, so it called localhost, where
  # its pod runs no Ollama. The RAG OpenAI URL and key do not default to the gateway connection.
  - name: RAG_EMBEDDING_ENGINE
    value: "openai"
  - name: RAG_OPENAI_API_BASE_URL
    value: "http://llm-gateway.llm.svc.cluster.local:4000/v1"
  - name: RAG_OPENAI_API_KEY
    valueFrom:
      secretKeyRef:
        name: llm-gateway-secrets
        key: master-key
  - name: RAG_EMBEDDING_MODEL
    value: "qwen3-embedding:0.6b"
  # The default chat model: a model group of the gateway config (k8s/llm/gateway/config.yaml).
  # Open WebUI shows the groups that the gateway serves and the models that the tiers hold. It has
  # no allow list in the environment: it removed MODEL_FILTER_LIST in v0.4.0, and model access is
  # set in Admin Panel > Settings > Models.
  - name: DEFAULT_MODELS
    value: "devops-chat"
  - name: WEBUI_AUTH
    value: "true"
  - name: WEBUI_SECRET_KEY_FILE
    value: "/app/backend/data/.webui_secret_key"
  - name: ENABLE_VERSION_UPDATE_CHECK
    value: "false"
  - name: ANONYMIZED_TELEMETRY
    value: "false"
  - name: DO_NOT_TRACK
    value: "true"
  - name: SCARF_NO_ANALYTICS
    value: "true"

# Valkey cache integration (replaces Redis)
websocket:
  enabled: true
  manager: redis # python-socketio driver connects via Redis protocol to Valkey
  # The chart sets REDIS_URL and WEBSOCKET_REDIS_URL to this URL. Kubernetes replaces
  # $(VALKEY_PASSWORD) with the variable from extraEnvFrom below: envFrom variables come before
  # every env entry, and the chart puts extraEnvVars after these two URLs.
  url: "redis://:$(VALKEY_PASSWORD)@valkey.llm.svc.cluster.local:6379/0"
  redis:
    enabled: false # Embedded Redis subchart disabled in favor of standalone Valkey service

# VALKEY_PASSWORD, the only key of the Secret that `devops k8s push-secrets` writes (k8s/README.md,
# Cluster Secrets).
extraEnvFrom:
  - secretRef:
      name: valkey-auth

service:
  # NodePort: on minikube, `minikube service open-webui -n llm --url` gives its URL. On the homelab,
  # Ingress llm/open-webui-ingress (k8s/ingress/ingress-routes.yaml) routes chat.<domain> to it.
  type: NodePort
  port: 8080

persistence:
  enabled: true
  size: 5Gi
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false

# local-path binds the volume on the node where the pod first runs, and the root disk of the
# control-plane node has the least free space (#1634; k8s/README.md, Local-Path Volume Placement).
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 4000m
    memory: 4Gi
