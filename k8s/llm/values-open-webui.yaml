# Open-WebUI Helm values — minimal dev-mode configuration for minikube.
# Chart: open-webui/open-webui
# Repo:  https://open-webui.github.io/helm-charts

image:
  repository: ghcr.io/open-webui/open-webui
  # Local minikube: Uses floating "main" tag for fast prototyping.
  # Production: Pin to an explicit immutable semver release tag or sha256 digest (e.g. v0.5.0).
  tag: "v0.11.4"

ollama:
  enabled: false

pipelines:
  enabled: false

# Connections to Ollama's native API, through the speed Services of two serving tiers
# (k8s/README.md, GPU Placement): ollama-fast and ollama-standard. A speed Service names no VRAM
# size, so a host change moves its selector in profiles/services.yaml, not these URLs. Applies on
# first start, as the gateway connection below does.
ollamaUrls:
  - http://ollama-fast.llm.svc.cluster.local:11434
  - http://ollama-standard.llm.svc.cluster.local:11434

# OpenAI-compatible connection to the LiteLLM gateway (Ollama models by virtual name),
# authenticated with the gateway master key. Applies on first start; Open WebUI persists
# connections in its database afterwards (Admin Panel > Settings > Connections).
enableOpenaiApi: true
openaiBaseApiUrl: "http://llm-gateway.llm.svc.cluster.local:4000/v1"
openaiApiKeyExistingSecret: llm-gateway-secrets
openaiApiKeyExistingSecretKey: master-key

extraEnvVars:
  - name: VECTOR_DB
    value: "qdrant"
  - name: QDRANT_URI
    value: "http://qdrant.llm.svc.cluster.local:6333"
  # Qdrant refuses a request without its API key (values-qdrant.yaml).
  - name: QDRANT_API_KEY
    valueFrom:
      secretKeyRef:
        name: qdrant-api-key
        key: api-key
  # RAG embeddings go through the gateway with its master key, to the embedding group that the
  # gateway serves. Open WebUI sets no RAG Ollama URL by default, so it called localhost, where
  # its pod runs no Ollama. The RAG OpenAI URL and key do not default to the gateway connection.
  - name: RAG_EMBEDDING_ENGINE
    value: "openai"
  - name: RAG_OPENAI_API_BASE_URL
    value: "http://llm-gateway.llm.svc.cluster.local:4000/v1"
  - name: RAG_OPENAI_API_KEY
    valueFrom:
      secretKeyRef:
        name: llm-gateway-secrets
        key: master-key
  - name: RAG_EMBEDDING_MODEL
    value: "qwen3-embedding:0.6b"
  # Default virtual model served through the LiteLLM AI Gateway
  - name: DEFAULT_MODELS
    value: "devops-chat"
  # Allowed models. k8s/llm/gateway/configmap.yaml maps each gateway model to its Ollama tiers.
  - name: MODEL_FILTER_LIST
    value: "devops-chat;devops-coder;devops-reasoning;devops-review;devops-flagship;qwen3-coder:30b;deepseek-r1:70b;qwen2.5-coder:7b;gemma4:31b"
  - name: WEBUI_AUTH
    value: "true"
  - name: WEBUI_SECRET_KEY_FILE
    value: "/app/backend/data/.webui_secret_key"
  - name: ENABLE_VERSION_UPDATE_CHECK
    value: "false"
  - name: ANONYMIZED_TELEMETRY
    value: "false"
  - name: DO_NOT_TRACK
    value: "true"
  - name: SCARF_NO_ANALYTICS
    value: "true"

# Valkey cache integration (replaces Redis)
websocket:
  enabled: true
  manager: redis # python-socketio driver connects via Redis protocol to Valkey
  # The chart sets REDIS_URL and WEBSOCKET_REDIS_URL to this URL. Kubernetes replaces
  # $(VALKEY_PASSWORD) with the variable from extraEnvFrom below: envFrom variables come before
  # every env entry, and the chart puts extraEnvVars after these two URLs.
  url: "redis://:$(VALKEY_PASSWORD)@valkey.llm.svc.cluster.local:6379/0"
  redis:
    enabled: false # Embedded Redis subchart disabled in favor of standalone Valkey service

# VALKEY_PASSWORD, the only key of the Secret that `devops k8s push-secrets` writes (k8s/README.md,
# Cluster Secrets).
extraEnvFrom:
  - secretRef:
      name: valkey-auth

service:
  # Local minikube: NodePort allows direct browser access without ingress controller.
  # Production: Use ClusterIP with an Ingress resource and TLS certificate.
  type: NodePort
  port: 8080

persistence:
  enabled: true
  size: 5Gi
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 4000m
    memory: 4Gi
