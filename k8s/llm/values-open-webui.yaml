# Open-WebUI Helm values — minimal dev-mode configuration for minikube.
# Chart: open-webui/open-webui
# Repo:  https://open-webui.github.io/helm-charts

image:
  repository: ghcr.io/open-webui/open-webui
  # Local minikube: Uses floating "main" tag for fast prototyping.
  # Production: Pin to an explicit immutable semver release tag or sha256 digest (e.g. v0.5.0).
  tag: "v0.11.4"

ollama:
  enabled: false

pipelines:
  enabled: false

# Direct Ollama backend service URLs matching specific models and hardware tiers:
# - ollama-24gib (24GiB VRAM): Fast chat (qwen2.5-coder:7b) and semantic embeddings (bge-m3:latest)
# - ollama-64gib (64GiB VRAM): Dedicated reasoning, flagship, & multi-file code review
ollamaUrls:
  - http://ollama-24gib.llm.svc.cluster.local:11434
  - http://ollama-64gib.llm.svc.cluster.local:11434

# OpenAI-compatible connection to the LiteLLM gateway (vLLM and Ollama models by virtual name),
# authenticated with the gateway master key. Applies on first start; Open WebUI persists
# connections in its database afterwards (Admin Panel > Settings > Connections).
enableOpenaiApi: true
openaiBaseApiUrl: "http://llm-gateway.llm.svc.cluster.local:4000/v1"
openaiApiKeyExistingSecret: llm-gateway-secrets
openaiApiKeyExistingSecretKey: master-key

extraEnvVars:
  - name: VECTOR_DB
    value: "qdrant"
  - name: QDRANT_URI
    value: "http://qdrant.llm.svc.cluster.local:6333"
  # RAG Embedding Engine: Dedicated 16GiB Ollama node running bge-m3:latest
  - name: RAG_EMBEDDING_ENGINE
    value: "ollama"
  - name: RAG_EMBEDDING_MODEL
    value: "bge-m3:latest"
  # Default virtual model served through the LiteLLM AI Gateway
  - name: DEFAULT_MODELS
    value: "devops-chat"
  # Allowed models matched to ideal backend configurations:
  # - devops-chat (qwen2.5-coder:7b on ollama-16gib)
  # - devops-coder (qwen2.5-coder-14b-instruct AWQ on vllm-16gib)
  # - devops-reasoning (qwen3-coder:30b on vllm-48gib)
  # - devops-review (qwen3-coder:30b load-balanced across vllm-48gib & ollama-32gib)
  # - devops-flagship (cogito-v2:70b on vllm-64gib / ollama-48gib)
  - name: MODEL_FILTER_LIST
    value: "devops-chat;devops-coder;devops-reasoning;devops-review;devops-flagship;qwen3-coder:30b;cogito-v2:70b;qwen2.5-coder:7b;gemma4:31b"
  - name: WEBUI_AUTH
    value: "true"
  - name: WEBUI_SECRET_KEY_FILE
    value: "/app/backend/data/.webui_secret_key"

# Valkey cache integration (replaces Redis)
websocket:
  enabled: true
  manager: redis # python-socketio driver connects via Redis protocol to Valkey
  url: "redis://valkey.llm.svc.cluster.local:6379/0"
  redis:
    enabled: false # Embedded Redis subchart disabled in favor of standalone Valkey service

service:
  # Local minikube: NodePort allows direct browser access without ingress controller.
  # Production: Use ClusterIP with an Ingress resource and TLS certificate.
  type: NodePort
  port: 8080

persistence:
  enabled: true
  size: 5Gi

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 4000m
    memory: 4Gi
