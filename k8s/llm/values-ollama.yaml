# Ollama Helm values — minimal dev-mode configuration for minikube.
# Chart: ollama/ollama
# Repo:  https://otwld.github.io/ollama-helm/

ollama:
  gpu:
    enabled: false
  models:
    # Optional pre-pulled models upon container initialization
    - nomic-embed-text
    - llama3.2:1b

image:
  repository: ollama/ollama
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 11434
  nodePort: 31434

persistentVolume:
  enabled: true
  size: 30Gi
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 4000m
    memory: 8Gi
