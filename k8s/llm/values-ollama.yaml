# Ollama Helm values — minimal dev-mode configuration for minikube.
# Chart: ollama/ollama
# Repo:  https://otwld.github.io/ollama-helm/

ollama:
  gpu:
    enabled: false
  models:
    pull: []
    run: []

service:
  type: NodePort
  port: 11434

persistentVolume:
  enabled: true
  size: 10Gi
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 4Gi
