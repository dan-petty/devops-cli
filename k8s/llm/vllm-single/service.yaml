# vLLM single-GPU Service.
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-single
  namespace: llm
  labels:
    app.kubernetes.io/name: vllm-single
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  # Cluster-internal: clients reach vLLM through the authenticated llm-gateway.
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app.kubernetes.io/name: vllm-single
