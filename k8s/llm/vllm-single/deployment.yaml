# vLLM single-GPU continuous batching inference engine for nodes with one Ampere-or-newer GPU
# (16 GiB or more). Older architectures run Ollama (../ollama.yaml) instead.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-single
  namespace: llm
  labels:
    app.kubernetes.io/name: vllm-single
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  replicas: 1
  # GPUs are exclusive, so a surge pod could never schedule beside the running one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-single
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-single
        app.kubernetes.io/part-of: devops-cli-stack
    spec:
      runtimeClassName: nvidia
      # A Service named `vllm` would inject VLLM_PORT=tcp://..., which vLLM reads as its own setting.
      enableServiceLinks: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            # Terms are ORed: NVIDIA GPU Feature Discovery labels, or architecture labels.
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.family
                    operator: In
                    values: [ampere, ada-lovelace, hopper, blackwell]
                  - key: nvidia.com/gpu.count
                    operator: In
                    values: ["1"]
              - matchExpressions:
                  - key: nvidia.com/gpu.architecture
                    operator: In
                    values: [ampere, ada-lovelace, hopper, blackwell]
                  - key: nvidia.com/gpu.count
                    operator: In
                    values: ["1"]
      initContainers:
        # Squid re-signs HTTPS with its own CA; merge it with the system bundle for model downloads.
        - name: ca-bundle
          image: vllm/vllm-openai:v0.30.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - cat /etc/ssl/certs/ca-certificates.crt /etc/ssl/squid-ca/squid-ca.pem > /etc/ssl/bundle/ca-certificates.crt
          volumeMounts:
            - name: squid-ca-cert
              mountPath: /etc/ssl/squid-ca
              readOnly: true
            - name: ca-bundle
              mountPath: /etc/ssl/bundle
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.30.0
          imagePullPolicy: IfNotPresent
          command: ["vllm", "serve"]
          args:
            - "Qwen/Qwen2.5-Coder-14B-Instruct-AWQ"
            - "--served-model-name"
            - "qwen2.5-coder-14b-instruct"
            # ~10 GB of AWQ weights plus activation and CUDA graph memory leave under 2 GiB of a
            # 16 GiB GPU for KV cache (1.39 GiB measured at 0.92). With an FP8 cache that holds one
            # 16K-token sequence; longer prompts escalate to the dual-GPU profile via the gateway.
            - "--max-model-len"
            - "16384"
            - "--kv-cache-dtype"
            - "fp8"
            - "--gpu-memory-utilization"
            - "0.95"
            - "--max-num-seqs"
            - "16"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
          env:
            - name: HF_HOME
              value: "/root/.cache/huggingface"
            # Xet chunk transfers fail authentication through the SSL-bumping proxy; plain HTTPS works.
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: HTTP_PROXY
              value: "http://squid.squid.svc.cluster.local:3128"
            - name: HTTPS_PROXY
              value: "http://squid.squid.svc.cluster.local:3128"
            - name: NO_PROXY
              value: "localhost,127.0.0.1,llm-gateway.llm.svc.cluster.local,ollama.llm.svc.cluster.local,vllm-single.llm.svc.cluster.local"
            - name: SSL_CERT_FILE
              value: "/etc/ssl/bundle/ca-certificates.crt"
            - name: REQUESTS_CA_BUNDLE
              value: "/etc/ssl/bundle/ca-certificates.crt"
          ports:
            - name: http
              containerPort: 8000
          # Sized for 16 GiB-RAM worker nodes: weights stream from the cache into VRAM.
          resources:
            requests:
              cpu: "2"
              memory: 6Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 12Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
            - name: shm
              mountPath: /dev/shm
            - name: ca-bundle
              mountPath: /etc/ssl/bundle
              readOnly: true
          # First start downloads ~10 GB of weights and captures CUDA graphs. On a ~50 Mbps link shared
          # with other downloads that takes hours, so allow up to 3 hours; restarts lose partial files.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            failureThreshold: 720
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: vllm-single-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: squid-ca-cert
          configMap:
            name: squid-ca-cert
        - name: ca-bundle
          emptyDir: {}
