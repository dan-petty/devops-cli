apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cert-manager-webhook
  namespace: cert-manager
  labels:
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: webhook
      app.kubernetes.io/component: webhook
  policyTypes:
    - Ingress
  ingress:
    # 1. The API server calls the admission webhook on 10250 from the host network of the
    #    control-plane node. No selector names that address, and kube-router admits host traffic
    #    only to pods on the same node, so the rule names no peer. It opens only this port, and
    #    only on the webhook pods.
    - ports:
        - protocol: TCP
          port: 10250
