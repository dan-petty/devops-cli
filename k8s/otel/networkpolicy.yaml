apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-default-perimeter
  namespace: otel
  labels:
    app.kubernetes.io/part-of: devops-cli-stack
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 1. Allow intra-namespace pod communications (Jaeger, OTel collector)
    - from:
        - podSelector: {}
    # 2. UI port (16686): Ingress controllers, monitoring namespace, and local port forwards
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 16686
    # 3. OTLP gRPC/HTTP and Jaeger trace ingestion ports (4317, 4318, 14268) from all cluster workloads
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 14268
    # 4. Prometheus scrape on metrics ports (8888 for collector, 14269 for Jaeger)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8888
        - protocol: TCP
          port: 14269
  egress:
    # 1. Allow CoreDNS egress for cluster name resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 2. Allow intra-namespace communication
    - to:
        - podSelector: {}
    # 3. Allow metrics remote-write egress to Alloy (9090) and Pyroscope profiling (4040) in monitoring
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 4040
    # 4. Allow logs push egress to Loki in logging (3100)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: logging
      ports:
        - protocol: TCP
          port: 3100
