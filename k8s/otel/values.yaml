# OpenTelemetry Collector Helm values — local dev configuration.
# Chart: open-telemetry/opentelemetry-collector
# Repo:  https://open-telemetry.github.io/opentelemetry-helm-charts

mode: deployment

image:
  repository: "otel/opentelemetry-collector-contrib"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 1024Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# No pipeline reads the Kubernetes API (no k8sattributes processor and no Kubernetes preset), so
# the pod mounts no ServiceAccount token (#1652).
serviceAccount:
  automountServiceAccountToken: false


# ── Collector pipeline configuration ─────────────────────────────────────────
config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch:
      send_batch_size: 1024
      timeout: 5s

    memory_limiter:
      check_interval: 5s
      limit_mib: 400
      spike_limit_mib: 100
      limit_percentage: null
      spike_limit_percentage: null

    # devops-cli runs each command as its own short-lived process, so it sends counters and
    # histograms as deltas. This keeps each series' running total, which Prometheus needs. A
    # stream that gets no delta for max_stale starts again from zero. Prometheus writes a zero
    # sample at the start time of the new stream, so increase() counts its first delta (#4684).
    # Keep max_stale at 1h: the roadmap-service rules read a series with no sample in the hour
    # before as a new stream, and count all of its last value (#2505). With a longer max_stale,
    # such a series keeps its old total, and the rule counts all of that total again.
    deltatocumulative:
      max_stale: 1h

    # Prometheus adds no external label to the series that its OTLP receiver writes. So each
    # metric point gets the `cluster` label that Alloy gives the other series (#4684).
    transform/cluster:
      metric_statements:
        - context: datapoint
          statements:
            - set(datapoint.attributes["cluster"], "homelab-k3s")

    # Deletes gateway key data from each span before Tempo stores it (#4518). The LiteLLM `otel`
    # callback writes each key of its request metadata as `metadata.<key>`, also with message
    # logging off: the hash, alias, user and team of the API key, and the `x-` headers of the
    # request (https://docs.litellm.ai/docs/observability/opentelemetry_integration). A refused
    # key puts its SHA-256 hash in the error text of the span and of its exception event, so
    # gateway spans and events lose each 64-digit hex value. The key rules apply to all services:
    # no devops-cli span holds such an attribute. A management endpoint span of the gateway gets
    # each field of the request body as `request.<field>` and of the response as `response.<field>`
    # (#4539): the raw key of `/key/block` and the callback secrets of `/team/{team_id}/callback`.
    # Only those hooks write the two prefixes, so gateway spans lose all of them. Span and span
    # event statements are separate groups, because a group with both runs once per event and
    # skips a span with no event.
    # A failed statement drops the batch (propagate), so no span leaves with the data.
    # Functions: delete_matching_keys and replace_all_patterns of OTTL (contrib v0.161.0).
    transform/key_data:
      error_mode: propagate
      trace_statements:
        - context: span
          statements:
            - delete_matching_keys(span.attributes, "^metadata[.](user_api_key_|requester_custom_headers)")
            - delete_matching_keys(span.attributes, "(?i)(authorization|api[-_]?key)")
            - delete_matching_keys(span.attributes, "^(request|response)[.]") where resource.attributes["service.name"] == "llm-gateway"
            - replace_all_patterns(span.attributes, "value", "[0-9a-fA-F]{64}", "<redacted>") where resource.attributes["service.name"] == "llm-gateway"
        - context: spanevent
          statements:
            - delete_matching_keys(spanevent.attributes, "(?i)(authorization|api[-_]?key)")
            - replace_all_patterns(spanevent.attributes, "value", "[0-9a-fA-F]{64}", "<redacted>") where resource.attributes["service.name"] == "llm-gateway"

  exporters:
    # Send traces to Tempo in-cluster (local dev/homelab uses internal gRPC with insecure: true;
    # for production clusters, enable TLS certificates via cert-manager and set insecure: false).
    otlp_grpc/tempo:
      endpoint: tempo.otel.svc.cluster.local:4317
      tls:
        insecure: true

    # Push OTLP logs to Loki in logging namespace via native OTLP HTTP receiver.
    otlp_http/loki:
      endpoint: http://loki.logging.svc.cluster.local:3100/otlp
      tls:
        insecure: true

    # Send metrics to the OTLP receiver of the Prometheus server in one hop (#1132, #4684). The
    # two-hop Alloy path is not used, because there one late sample refused a batch of unrelated
    # cluster metrics. The receiver gets the start time of each point and writes a zero sample
    # at the start of each new stream, so increase() counts the one export of a cluster Job
    # (#2039). The receiver names the series (k8s/monitoring/prometheus-values.yaml, otlp).
    otlp_http/prometheus:
      metrics_endpoint: http://prometheus-server.monitoring.svc.cluster.local:9090/api/v1/otlp/v1/metrics

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, transform/key_data, batch]
        exporters: [otlp_grpc/tempo]

      metrics:
        receivers: [otlp]
        processors: [memory_limiter, deltatocumulative, transform/cluster, batch]
        exporters: [otlp_http/prometheus]

      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_http/loki]

# ClusterIP: In-cluster workloads export to otel-collector-opentelemetry-collector.otel.svc.cluster.local.
# Workstation export uses `devops k8s port-forward` or ingress routing.
service:
  type: ClusterIP

# The Prometheus server's kubernetes-pods job scrapes the collector's own telemetry on the
# metrics port, directly rather than through Alloy, so the export failures it counts stay
# visible when Alloy is what fails.
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8888"

ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: true
  otlp:
    enabled: true
  otlp-http:
    enabled: true
