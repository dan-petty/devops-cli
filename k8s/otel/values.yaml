# OpenTelemetry Collector Helm values — local dev configuration.
# Chart: open-telemetry/opentelemetry-collector
# Repo:  https://open-telemetry.github.io/opentelemetry-helm-charts

mode: deployment

image:
  repository: "otel/opentelemetry-collector-contrib"
  tag: "0.159.0"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ── Collector pipeline configuration ─────────────────────────────────────────
config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch:
      send_batch_size: 1024
      timeout: 5s

    memory_limiter:
      check_interval: 5s
      limit_mib: 400
      spike_limit_mib: 100

  exporters:
    # Debug exporter for local development visibility.
    # In production environments, remove 'debug' from service.pipelines or gate verbosity.
    debug:
      verbosity: basic

    # Send traces to Jaeger in-cluster (local dev/homelab uses internal gRPC with insecure: true;
    # for production clusters, enable TLS certificates via cert-manager and set insecure: false).
    otlp_grpc/jaeger:
      endpoint: jaeger.otel.svc.cluster.local:4317
      tls:
        insecure: true

    # Prometheus remote write to in-cluster Prometheus (local dev uses internal HTTP service;
    # for production zero-trust networking, configure https endpoint, TLS secrets, and basic_auth).
    prometheusremotewrite:
      endpoint: http://kube-prometheus-kube-prome-prometheus.monitoring.svc.cluster.local:9090/api/v1/write

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug, otlp_grpc/jaeger]




      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug, prometheusremotewrite]

      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug]

# Expose OTLP ports via ClusterIP (internal cluster networking only)
service:
  type: ClusterIP

ports:
  metrics:
    enabled: true
  otlp:
    enabled: true
  otlp-http:
    enabled: true
