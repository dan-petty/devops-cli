# OpenTelemetry Collector Helm values — local dev configuration.
# Chart: open-telemetry/opentelemetry-collector
# Repo:  https://open-telemetry.github.io/opentelemetry-helm-charts

mode: deployment

image:
  repository: "otel/opentelemetry-collector-contrib"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 1024Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault


# ── Collector pipeline configuration ─────────────────────────────────────────
config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch:
      send_batch_size: 1024
      timeout: 5s

    memory_limiter:
      check_interval: 5s
      limit_mib: 400
      spike_limit_mib: 100
      limit_percentage: null
      spike_limit_percentage: null

    # devops-cli runs each command as its own short-lived process, so it sends counters and
    # histograms as deltas. This keeps each series' running total, which Prometheus needs; a
    # series idle for max_stale starts again from zero, read by rate() as a counter reset.
    deltatocumulative:
      max_stale: 1h

  exporters:
    # Send traces to Tempo in-cluster (local dev/homelab uses internal gRPC with insecure: true;
    # for production clusters, enable TLS certificates via cert-manager and set insecure: false).
    otlp_grpc/tempo:
      endpoint: tempo.otel.svc.cluster.local:4317
      tls:
        insecure: true

    # Push OTLP logs to Loki in logging namespace via native OTLP HTTP receiver.
    otlp_http/loki:
      endpoint: http://loki.logging.svc.cluster.local:3100/otlp
      tls:
        insecure: true

    # Direct Prometheus remote-write (#1132). Bypasses the two-hop Alloy receiver path so late
    # samples do not poison unrelated cluster metrics batches.
    prometheus_remote_write:
      endpoint: http://prometheus-server.monitoring.svc.cluster.local:9090/api/v1/write
      external_labels:
        cluster: homelab-k3s
      # devops-cli names its metrics as Prometheus does (`_total`, `_seconds`); added unit
      # suffixes turned `devops_cli_command_total` into `devops_cli_command_total_ratio`,
      # which no dashboard queries.
      translation_strategy: UnderscoreEscapingWithoutSuffixes
      # Send created timestamps for cumulative counters. This allows Prometheus to record
      # zero values at series start times, so single-export cluster jobs count in increase() (#2039).
      export_created_metric: true

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_grpc/tempo]

      metrics:
        receivers: [otlp]
        processors: [memory_limiter, deltatocumulative, batch]
        exporters: [prometheus_remote_write]

      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_http/loki]

# ClusterIP: In-cluster workloads export to otel-collector.otel.svc.cluster.local.
# Workstation export uses `devops k8s port-forward` or ingress routing.
service:
  type: ClusterIP

# The Prometheus server's kubernetes-pods job scrapes the collector's own telemetry on the
# metrics port, directly rather than through Alloy, so the export failures it counts stay
# visible when Alloy is what fails.
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8888"

ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: true
  otlp:
    enabled: true
  otlp-http:
    enabled: true
