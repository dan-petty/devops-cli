# Grafana Tempo Helm values — single binary mode with local-path persistence.
# The chart builds the Tempo config from these values; a `config` override here would pin a copy of
# one Tempo version's layout, and Tempo 3 removed the `compactor` and `ingester` blocks it held (#1813).
# Chart: grafana-community/tempo
# Repo:  https://grafana-community.github.io/helm-charts

replicas: 1

# The otel namespace enforces PodSecurity restricted (k8s/namespaces.yaml), which admits a pod only
# with a seccomp profile and a container that drops every capability and cannot escalate (#1627).
# Tempo writes only under the /var/tempo volume, so its root filesystem stays read-only.
securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Tempo does not call the Kubernetes API, so its pod mounts no ServiceAccount token (#1652).
serviceAccount:
  automountServiceAccountToken: false

tempo:
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  reportingEnabled: false
  retention: 168h
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 2048Mi

persistence:
  enabled: true
  enableStatefulSetAutoDeletePVC: false
  storageClassName: local-path
  size: 10Gi
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false

# local-path binds the volume on the node where the pod first runs, and the root disk of the
# control-plane node has the least free space (#1634; k8s/README.md, Local-Path Volume Placement).
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist
