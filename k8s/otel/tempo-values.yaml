# Grafana Tempo Helm values — single binary mode with local-path persistence.
# The chart builds the Tempo config from these values; a `config` override here would pin a copy of
# one Tempo version's layout, and Tempo 3 removed the `compactor` and `ingester` blocks it held (#1813).
# Chart: grafana-community/tempo
# Repo:  https://grafana-community.github.io/helm-charts

replicas: 1

# The otel namespace enforces PodSecurity restricted (k8s/namespaces.yaml), which admits a pod only
# with a seccomp profile and a container that drops every capability and cannot escalate (#1627).
# Tempo writes only under the /var/tempo volume, so its root filesystem stays read-only.
securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Tempo does not call the Kubernetes API, so its pod mounts no ServiceAccount token (#1652).
serviceAccount:
  automountServiceAccountToken: false

tempo:
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  reportingEnabled: false
  retention: 168h
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 2048Mi
  # A read holds memory until it ends, so the values bound the reads that wait and run at once, the
  # result count of a search and the time of a read. Ten searches then stay under the 2048Mi memory
  # limit of the pod, which OOM-killed tempo-0 twice in one minute when no limit bounded them
  # (#6616). The `charts` row parses the rendered config with the Tempo image of the chart, which
  # refuses a key that its version does not have (#6730). Tempo 3.1.1 has no limit on the byte
  # rate of a search, and `search.max_duration` is the largest time range of a search, not the
  # time that it runs, so the values set neither.
  queryFrontend:
    max_outstanding_per_tenant: 10
    # The frontend stops a read after 30s and cancels its queued jobs.
    api_timeout: 30s
    search:
      max_result_limit: 50
  querier:
    max_concurrent_queries: 4
  # The chart renders `tempo.overrides` into the `overrides` block of the Tempo config; it does not
  # render `tempo.global_overrides`. Tempo applies the limit of 1000000 bytes to a trace that a
  # search reads, to a trace that it receives and to compaction. A trace that the store already
  # holds can be larger, and it leaves the store within the retention of 168h (#6616).
  overrides:
    defaults:
      global:
        max_bytes_per_trace: 1000000

persistence:
  enabled: true
  enableStatefulSetAutoDeletePVC: false
  storageClassName: local-path
  size: 10Gi
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false

# local-path binds the volume on the node where the pod first runs, and the root disk of the
# control-plane node has the least free space (#1634; k8s/README.md, Local-Path Volume Placement).
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist
