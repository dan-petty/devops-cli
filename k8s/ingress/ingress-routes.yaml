apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ollama-ingress
  namespace: llm
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: devops-cli-stack
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: ollama.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              # Ollama's native API on the fast tier. A speed Service names no VRAM size, so a
              # host change moves its selector in k8s/llm/profiles/services.yaml, not this route.
              service:
                name: ollama-fast
                port:
                  number: 11434
