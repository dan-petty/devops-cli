# Core Stack Ingress Routes for Cloudflare Wildcard Tunnel Integration
#
# Incoming requests via the wildcard Cloudflare Tunnel (*.example.com)
# retain the original Host header and route to internal ClusterIP services.
#
# This manifest acts as a template. Apply with domain substitution from config.yaml:
#   devops k8s apply k8s/ingress/ingress-routes.yaml --template
#   devops k8s apply k8s/ingress/ --template
# Or preview rendered YAML:
#   devops k8s render k8s/ingress/ingress-routes.yaml
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui-ingress
  namespace: llm
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/part-of: devops-cli-stack
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: chat.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-webui
                port:
                  number: 8080
    - host: homelab.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-webui
                port:
                  number: 8080
