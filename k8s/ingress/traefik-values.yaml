# Traefik Helm Chart Values for Cloudflare Tunnel Integration
# Configures Traefik as an internal ClusterIP ingress controller so external traffic
# enters solely through the authenticated Cloudflare Tunnel.

additionalArguments:
  - "--global.sendanonymoususage=false"
  - "--global.checknewversion=false"

service:
  spec:
    type: ClusterIP

providers:
  kubernetesIngress:
    publishedService:
      enabled: true

ports:
  web:
    forwardedHeaders:
      insecure: true
  metrics:
    port: 9100
    expose:
      default: false
    exposedPort: 9100

api:
  dashboard: true

metrics:
  prometheus:
    entryPoint: metrics
    addRoutersLabels: true
    addServicesLabels: true

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
