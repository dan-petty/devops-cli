# GitHub Pages builds this directory with Jekyll, which parses `{% ... %}` and
# `{{ ... }}` as Liquid before rendering Markdown. The agent records in `agent/`
# document this project's Jinja2 templating and CI expressions, so they contain those
# delimiters as prose. Liquid tries to execute them: an unclosed `{% if minikube %}` in
# one record aborted the whole build and failed every Pages deployment on main.
#
# These files are internal records rather than published documentation, so they are
# excluded from the site rather than escaped one by one.
#
# The `docs-site` job of `.github/workflows/ci.yml` builds this directory with the GitHub Pages
# builder on each pull request that changes it, so a Liquid error fails before the merge.
exclude:
  - agent/
