# The site settings of https://dan-petty.github.io/devops-cli/. GitHub Pages builds `main:/docs`
# and runs Jekyll with no `--config` option, so Jekyll reads this file and no other. Keep every
# site setting here: a setting in a different file has no effect, and Pages publishes that file
# as a static file. `devops gh pages verify` checks this file.
#
# This is not the runtime configuration of devops-cli, which is `config.yaml`.

title: "devops-cli"
description: "A Python command-line tool that automates workstation, GitHub, Kubernetes and code-review work"
# The Pages build gets the same url and baseurl from the GitHub metadata. The offline build of
# the `docs-site` job has no metadata, so these two lines make it build the published links.
url: "https://dan-petty.github.io"
baseurl: "/devops-cli"
repository: "dan-petty/devops-cli"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"

# `_layouts/default.html` uses the `{% seo %}` tag of this plugin.
plugins:
  - jekyll-seo-tag

# Each page uses `_layouts/default.html`.
defaults:
  - scope:
      path: ""
    values:
      layout: "default"

# Remove source .md files from published output so only built .html files remain (#2070).
optional_front_matter:
  remove_originals: true

# Jekyll parses `{% ... %}` and `{{ ... }}` as Liquid before it renders Markdown. The agent
# records in `agent/` document this project's Jinja2 templating and CI expressions, so they
# contain those delimiters as prose. Liquid tries to execute them: an unclosed `{% if minikube %}`
# in one record aborted the whole build and failed every Pages deployment on main.
#
# These files are internal records rather than published documentation, so they are excluded
# from the site rather than escaped one by one.
#
# The `docs-site` job of `.github/workflows/ci.yml` builds this directory with the GitHub Pages
# builder on each pull request that changes it, so a Liquid error fails before the merge.
exclude:
  - agent/
