# The GitHub repository that publishes the advisories of a pinned component (#3987).
#
# `devops research advisories` reads the advisories that a repository published
# (`GET /repos/{owner}/{repo}/security-advisories`) for each component named here, and matches the
# pinned version to the range of each advisory. An image, a chart or a release binary has no
# advisory database of its own, and OSV has no ecosystem for it. A Python package, a Node package
# and a GitHub Action are covered by other sources and are not named here.
#
# `ecosystem` and `name` are those of `devops research inventory`. Map a component only when its
# version is a version of the repository: a chart with its own numbering is not, and an image tag
# with a variant such as `-alpine` names no one release.
#
# A repository names the packages of its advisories as it wishes. Set `package` to the name that
# the advisories of the repository give to the package whose versions the component pins (the Go
# module of the major version of a binary, or the PyPI package of an image); the command then
# ignores the ranges of other packages. Without `package`, every vulnerability of an advisory
# counts. The names below are those that the repositories used on 2026-11-07.
#
# `osv_ecosystem` and `osv_name` are the identity that OSV gives the component, which differs from
# its inventory identity: an image is a Debian package, and a Go release binary is the module path
# of its repository in the ecosystem `Go`. The advisory and release steps query OSV with that pair.
#
# A `[[pin]]` entry declares a component that no file of this repository holds, such as the
# operating system of a node or a driver. `devops research inventory` lists it at the file
# `external` and line 0. Leave `version` out when the environment holds the version and this
# repository does not, and write no host name, no address and no device path here.
#
# Not mapped, because the advisories of its repository name no package that matches the pin: the
# image `portkeyai/gateway` (no package name). The devtools image audits the tools that it
# installs, so no release binary is named here (#4363).

# Images and charts.

[[watch]]
ecosystem = "helm"
name = "qdrant"
repo = "qdrant/qdrant"
package = "qdrant"

[[watch]]
ecosystem = "docker"
name = "ghcr.io/berriai/litellm"
repo = "BerriAI/litellm"
package = "litellm"

[[watch]]
ecosystem = "docker"
name = "ghcr.io/open-webui/open-webui"
repo = "open-webui/open-webui"
package = "open-webui"

[[watch]]
ecosystem = "docker"
name = "unclecode/crawl4ai"
repo = "unclecode/crawl4ai"
package = "crawl4ai"

[[watch]]
ecosystem = "docker"
name = "ghcr.io/astral-sh/uv"
repo = "astral-sh/uv"
package = "uv"

[[watch]]
ecosystem = "docker"
name = "ollama/ollama"
repo = "ollama/ollama"

[[watch]]
ecosystem = "docker"
name = "mattermost/mattermost-team-edition"
repo = "mattermost/mattermost"

[[watch]]
ecosystem = "docker"
name = "ghcr.io/oliver006/redis_exporter"
repo = "oliver006/redis_exporter"

# Pins outside the repository: no file of it holds these, so the inventory lists them at the file
# `external` and line 0.

[[pin]]
kind = "tool"
name = "ubuntu"
osv_ecosystem = "Ubuntu"
osv_name = "linux"

[[pin]]
kind = "tool"
name = "nvidia-driver"
