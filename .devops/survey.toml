# Comparable tools and outward-facing capabilities configuration (#425)

[[tools]]
name = "gh"
description = "GitHub CLI"
url = "https://cli.github.com"

[[tools]]
name = "k9s"
description = "Kubernetes CLI dashboard"
url = "https://k9scli.io"

[[tools]]
