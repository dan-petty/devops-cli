# The answers of the live Prometheus to the query of the "Local Cloud Savings in Range" panel of
# k8s/devops/dashboards/ai-spend.json, and the gateway token series that it read (#2194, #5914).
# tests/prometheus/test_k8s_monitoring_dashboards.py checks that `expr` is the query of the panel,
# and that the `result` of each record is the total of its `series` of a local provider
# (`ollama_chat` for chat, `ollama` for embeddings), priced at the prices of the dashboard. A
# hosted provider adds nothing.
#
# Each record ran `expr` as one instant query at `end`, with `$__range` set to `range` and
# `${reference_price_usd_per_token:raw}` set to the value of that dashboard constant, as Grafana
# sets them. `series` is the answer at `end` of
#   sum by (api_provider) (increase(litellm_input_tokens_metric_total[<range>]))   as type prompt
#   sum by (api_provider) (increase(litellm_output_tokens_metric_total[<range>]))  as type completion
# The query reads no other label of the token counters.
#
# The first range holds the hours before #5874 went live at `client_label_fix`. Then devops-cli's
# own token series gave hosted DeepSeek tokens `local="true"` (#5867), and the panel showed $167.87
# for these 6 h. The gateway counters put the 142.6 million prompt tokens of DeepSeek in this
# range under `openrouter`, so they add nothing.
#
# Record again when the query or a price of the dashboard changes. Run the queries read-only
# against the Prometheus HTTP API (`/api/v1/query` with `time=<end>`), for example with the
# `query_prometheus` tool of the Grafana MCP server, and copy the values. Prometheus keeps 30 d of
# samples, so select ranges inside the retention window.
captured: "2026-11-16"
expr: 'sum(label_replace(label_replace(label_replace(sum by (api_provider) (increase(litellm_input_tokens_metric_total{api_provider=~"ollama_chat|ollama"}[$__range])), "type", "prompt", "", "") or label_replace(sum by (api_provider) (increase(litellm_output_tokens_metric_total{api_provider=~"ollama_chat|ollama"}[$__range])), "type", "completion", "", ""), "operation", "chat", "api_provider", "ollama_chat"), "operation", "embeddings", "api_provider", "ollama") * on (operation, type) group_left () (${reference_price_usd_per_token:raw})) or vector(0)'
# The time from which #5874 (v0.159.0) ran in the cluster.
client_label_fix: "2026-11-15T23:43:00Z"
records:
