# The hosts of the recorded check-mode runs of `devops infra plan` (#5124). Each host stands for one
# case. node-2 connects with SSH, but the reboot action returns in check mode before it connects.
[k3s_agent]
node-3.example.com ansible_connection=local

[demo]
node-1.example.com ansible_connection=local

[reboot]
node-2.example.com ansible_connection=ssh ansible_host=192.0.2.12

[failing]
node-4.example.com ansible_connection=local

[all:vars]
ansible_python_interpreter="{{ ansible_playbook_python }}"
