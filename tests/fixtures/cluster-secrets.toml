# Environment Secret rows for tests and environment trees (#6685).

[[secret]]
namespace = "llm"
name = "llm-gateway-secrets"
stack = "llm"
labels = { "app.kubernetes.io/name" = "llm-gateway" }
change_note = "Open WebUI keeps the gateway connection stored in its database: update the key under Admin Panel > Settings > Connections."
restarts = [
  { kind = "deployment", name = "llm-gateway" },
]

[[secret.entry]]
key = "master-key"
required = true
value_prefix = "sk-"
[secret.entry.keyring]
key = "llm_gateway_master_key"
[secret.entry.generator]
encoding = "hex"
nbytes = 24
prefix = "sk-"

[[secret.entry]]
key = "gemini-api-key"
required = false
[secret.entry.keyring]
key = "gemini_api_key"
option = "gemini.api_key"

[[secret.entry]]
key = "anthropic-api-key"
required = false
[secret.entry.keyring]
key = "anthropic_api_key"
option = "anthropic.api_key"

[[secret.entry]]
key = "openrouter-api-key"
required = false
[secret.entry.keyring]
key = "openrouter_api_key"
option = "openrouter.api_key"

[[secret]]
namespace = "llm"
name = "qdrant-api-key"
stack = "llm"
labels = { "app.kubernetes.io/name" = "qdrant" }
restarts = [
  { kind = "statefulset", name = "qdrant" },
  { kind = "statefulset", name = "open-webui" },
]

[[secret.entry]]
key = "api-key"
required = true
[secret.entry.keyring]
key = "qdrant_api_key"
option = "qdrant.api_key"
[secret.entry.generator]
encoding = "urlsafe"
nbytes = 32

[[secret.entry]]
key = "read-only-api-key"
required = true
[secret.entry.keyring]
key = "qdrant_read_only_api_key"
option = "qdrant.read_only_api_key"
[secret.entry.generator]
encoding = "urlsafe"
nbytes = 32

[[secret]]
namespace = "llm"
name = "valkey-auth"
stack = "llm"
labels = { "app.kubernetes.io/name" = "valkey" }
restarts = [
  { kind = "deployment", name = "valkey" },
  { kind = "statefulset", name = "open-webui" },
]

[[secret.entry]]
key = "VALKEY_PASSWORD"
required = true
[secret.entry.keyring]
key = "valkey_password"
option = "valkey.password"
[secret.entry.generator]
encoding = "hex"
nbytes = 32

[[secret]]
namespace = "cloudflared"
name = "cloudflared-token"
stack = "base"
labels = { "app.kubernetes.io/name" = "cloudflared" }
restarts = [
  { kind = "deployment", name = "cloudflared" },
]

[[secret.entry]]
key = "token"
required = false
[secret.entry.keyring]
key = "cloudflare_tunnel_token"
option = "cloudflare.tunnel_token"

[[secret]]
namespace = "monitoring"
name = "grafana-admin"
stack = "infra"
labels = { "app.kubernetes.io/name" = "grafana" }
restarts = [
  { kind = "deployment", name = "grafana" },
]

[[secret.entry]]
key = "admin-user"
required = true
[secret.entry.literal]
value = "admin"

[[secret.entry]]
key = "admin-password"
required = true
[secret.entry.keyring]
key = "grafana_password"
option = "grafana.password"
[secret.entry.generator]
encoding = "urlsafe"
nbytes = 32
[secret.entry.adopt_from]
namespace = "monitoring"
name = "grafana"
key = "admin-password"

[[secret.entry]]
key = "secret-key"
required = true
[secret.entry.keyring]
key = "grafana_secret_key"
[secret.entry.generator]
encoding = "urlsafe"
nbytes = 32

[[secret.entry]]
key = "llm-gateway-key"
required = true
value_prefix = "sk-"
[secret.entry.keyring]
key = "llm_gateway_master_key"
[secret.entry.generator]
encoding = "hex"
nbytes = 24
prefix = "sk-"

[[secret]]
namespace = "monitoring"
name = "grafana-image-renderer"
stack = "infra"
labels = { "app.kubernetes.io/name" = "grafana-image-renderer" }
restarts = [
  { kind = "deployment", name = "grafana" },
  { kind = "deployment", name = "grafana-image-renderer" },
]

[[secret.entry]]
key = "token"
required = true
[secret.entry.keyring]
key = "grafana_renderer_token"
[secret.entry.generator]
encoding = "urlsafe"
nbytes = 32

[[secret]]
namespace = "monitoring"
name = "alertmanager-mattermost"
stack = "infra"
labels = { "app.kubernetes.io/name" = "alertmanager" }

[[secret.entry]]
key = "url"
required = false
[secret.entry.derived]
template = "http://mattermost.mattermost.svc.cluster.local:8065/hooks/{hook}"
[secret.entry.derived.inputs.hook.keyring]
key = "mattermost_alerts_hook"
option = "mattermost.alerts_hook"

[[secret]]
namespace = "argocd"
name = "argocd-notifications-secret"
stack = "infra"
labels = { "app.kubernetes.io/part-of" = "argocd" }

[[secret.entry]]
key = "github-appID"
required = true
[secret.entry.setting]
option = "argocd.github_app_id"

[[secret.entry]]
key = "github-installationID"
required = true
[secret.entry.setting]
option = "argocd.github_app_installation_id"

[[secret.entry]]
key = "github-privateKey"
required = true
[secret.entry.keyring]
key = "argocd_github_app_private_key"
option = "argocd.github_app_private_key"

[[secret.entry]]
key = "mattermost-deploys-url"
required = false
[secret.entry.derived]
template = "http://mattermost.mattermost.svc.cluster.local:8065/hooks/{hook}"
[secret.entry.derived.inputs.hook.keyring]
key = "mattermost_deploys_hook"
option = "mattermost.deploys_hook"

[[secret]]
namespace = "gitea"
name = "gitea-admin"
stack = "gitea"
labels = { "app.kubernetes.io/name" = "gitea" }
restarts = [
  { kind = "deployment", name = "gitea" },
]

[[secret.entry]]
key = "username"
required = true
[secret.entry.literal]
value = "gitea_admin"

[[secret.entry]]
key = "password"
required = true
[secret.entry.keyring]
key = "gitea_admin_password"
option = "gitea.admin_password"

[[secret]]
namespace = "argocd"
name = "gitea-repo-creds"
stack = "gitea"
gate_namespace = "gitea"
labels = { "argocd.argoproj.io/secret-type" = "repo-creds" }

[[secret.entry]]
key = "url"
required = true
[secret.entry.literal]
value = "http://gitea-http.gitea.svc.cluster.local:3000/"

[[secret.entry]]
key = "username"
required = true
[secret.entry.setting]
option = "gitea.argocd_username"

[[secret.entry]]
key = "type"
required = true
[secret.entry.literal]
value = "git"

[[secret.entry]]
key = "password"
required = true
[secret.entry.keyring]
key = "gitea_argocd_token"
option = "gitea.argocd_token"

[[secret]]
namespace = "mattermost"
name = "mattermost-db"
stack = "chat"
secret_type = "kubernetes.io/basic-auth"
labels = { "app.kubernetes.io/name" = "mattermost-db" }

[[secret.entry]]
key = "username"
required = true
[secret.entry.literal]
value = "mattermost"

[[secret.entry]]
key = "password"
required = true
[secret.entry.keyring]
key = "mattermost_db_password"
[secret.entry.generator]
encoding = "urlsafe"
nbytes = 32
[secret.entry.adopt_from]
namespace = "mattermost"
name = "mattermost-db"
key = "password"

[[secret.entry]]
key = "DB_CONNECTION_STRING"
required = true
[secret.entry.derived]
template = "postgres://{username}:{password}@mattermost-db-rw.mattermost.svc.cluster.local:5432/mattermost?sslmode=require&connect_timeout=10"
[secret.entry.derived.inputs.username.literal]
value = "mattermost"
[secret.entry.derived.inputs.password.keyring]
key = "mattermost_db_password"

[[secret]]
namespace = "object-store"
name = "seaweedfs-admin"
stack = "infra"
labels = { "app.kubernetes.io/name" = "seaweedfs" }
restarts = [
  { kind = "statefulset", name = "seaweedfs-admin" },
]

[[secret.entry]]
key = "adminUser"
required = true
[secret.entry.literal]
value = "admin"

[[secret.entry]]
key = "adminPassword"
required = true
[secret.entry.keyring]
key = "seaweedfs_admin_password"
[secret.entry.generator]
encoding = "urlsafe"
nbytes = 32

[[secret]]
namespace = "object-store"
name = "seaweedfs-s3"
stack = "infra"
labels = { "app.kubernetes.io/name" = "seaweedfs" }
restarts = [
  { kind = "deployment", name = "seaweedfs-s3" },
]

[[secret.entry]]
key = "s3.json"
required = true
[secret.entry.literal]
value = '{"identities": []}'
