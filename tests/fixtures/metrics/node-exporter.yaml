# Metric families the deployed Prometheus node-exporter DaemonSet serves on port 9100 (#1136):
# names, types and label names, never label values. tests/test_stack_dashboards.py checks
# k8s-views-global.json, k8s-views-namespaces.json and k8s-views-nodes.json against them.
exporter: Prometheus node-exporter
image: quay.io/prometheus/node-exporter:v1.12.1
chart: grafana/k8s-monitoring 4.5.2
captured: "2026-10-21"
taken_from: >-
  The k8s-monitoring-node-exporter pods' port 9100 /metrics in monitoring on the homelab k3s
  cluster, read through the Kubernetes API pod proxy.
scraped_by: >-
  k8s-monitoring's hostMetrics.linuxHosts job (job="integrations/node_exporter") in
  k8s/monitoring/k8s-monitoring-values.yaml, with useDefaultAllowList: false and
  useIntegrationAllowList: false so every series node-exporter serves reaches Prometheus (#1129).
target_labels: [app, cluster, component, container, instance, job, namespace, pod, source, workload]
