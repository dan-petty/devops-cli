  quic_client_receive_bytes: {type: counter, labels: [conn_index]}
  quic_client_received_frames: {type: counter, labels: [conn_index, frame_type]}
  quic_client_sent_bytes: {type: counter, labels: [conn_index]}
  quic_client_sent_frames: {type: counter, labels: [conn_index, frame_type]}
  quic_client_smoothed_rtt: {type: gauge, labels: [conn_index]}
  quic_client_total_connections: {type: counter, labels: []}
