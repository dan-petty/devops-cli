# Metric families the deployed NVIDIA DCGM exporter serves (#693): names, types and label
# names, never label values. tests/test_stack_dashboards.py checks llm-stack.json's GPU
# panels against them.
#
# `families` lists every family exactly as its `# TYPE` line printed it, with its type and
# the label names its samples carried. A family without `labels` printed its `# TYPE` line
# but no sample, so its labels could not be read from the capture.
exporter: NVIDIA DCGM exporter
image: nvcr.io/nvidia/k8s/dcgm-exporter:4.6.1-4.8.4-distroless
chart: nvidia-dcgm/dcgm-exporter 4.8.4
captured: "2026-10-01"
taken_from: >-
  One dcgm-exporter pod's /metrics on the homelab cluster, on a node whose GPU reports the
  profiling (DCGM_FI_PROF_*) fields, read in the plain text format (version 0.0.4) through
  the Kubernetes API service proxy.
scraped_by: >-
  The chart's own ServiceMonitor (serviceMonitor.enabled in
  k8s/monitoring/dcgm-exporter-values.yaml), read by Alloy (k8s-monitoring 4.5.2), which
  remote-writes to the Prometheus server.
target_labels: [cluster, container, endpoint, instance, job, namespace, node, pod, service]
families:
  DCGM_FI_DEV_DEC_UTIL: {type: gauge, labels: [DCGM_FI_DRIVER_VERSION, UUID, device, gpu, hostname, modelName, pci_bus_id]}
  DCGM_FI_DEV_ENC_UTIL: {type: gauge, labels: [DCGM_FI_DRIVER_VERSION, UUID, device, gpu, hostname, modelName, pci_bus_id]}
  DCGM_FI_DEV_FB_FREE: {type: gauge, labels: [DCGM_FI_DRIVER_VERSION, UUID, device, gpu, hostname, modelName, pci_bus_id]}
  DCGM_FI_DEV_FB_RESERVED: {type: gauge, labels: [DCGM_FI_DRIVER_VERSION, UUID, device, gpu, hostname, modelName, pci_bus_id]}
  DCGM_FI_DEV_FB_USED: {type: gauge, labels: [DCGM_FI_DRIVER_VERSION, UUID, device, gpu, hostname, modelName, pci_bus_id]}
  DCGM_FI_DEV_GPU_TEMP: {type: gauge, labels: [DCGM_FI_DRIVER_VERSION, UUID, device, gpu, hostname, modelName, pci_bus_id]}
  DCGM_FI_DEV_GPU_UTIL: {type: gauge, labels: [DCGM_FI_DRIVER_VERSION, UUID, device, gpu, hostname, modelName, pci_bus_id]}
  DCGM_FI_DEV_MEMORY_TEMP: {type: gauge, labels: [DCGM_FI_DRIVER_VERSION, UUID, device, gpu, hostname, modelName, pci_bus_id]}
  DCGM_FI_DEV_MEM_CLOCK: {type: gauge, labels: [DCGM_FI_DRIVER_VERSION, UUID, device, gpu, hostname, modelName, pci_bus_id]}
  DCGM_FI_DEV_MEM_COPY_UTIL: {type: gauge, labels: [DCGM_FI_DRIVER_VERSION, UUID, device, gpu, hostname, modelName, pci_bus_id]}
  DCGM_FI_DEV_PCIE_REPLAY_COUNTER: {type: counter, labels: [DCGM_FI_DRIVER_VERSION, UUID, device, gpu, hostname, modelName, pci_bus_id]}
  DCGM_FI_DEV_POWER_USAGE: {type: gauge, labels: [DCGM_FI_DRIVER_VERSION, UUID, device, gpu, hostname, modelName, pci_bus_id]}
  DCGM_FI_DEV_SM_CLOCK: {type: gauge, labels: [DCGM_FI_DRIVER_VERSION, UUID, device, gpu, hostname, modelName, pci_bus_id]}
  DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION: {type: counter, labels: [DCGM_FI_DRIVER_VERSION, UUID, device, gpu, hostname, modelName, pci_bus_id]}
  DCGM_FI_DEV_VGPU_LICENSE_STATUS: {type: gauge, labels: [DCGM_FI_DRIVER_VERSION, UUID, device, gpu, hostname, modelName, pci_bus_id]}
  DCGM_FI_PROF_DRAM_ACTIVE: {type: gauge, labels: [DCGM_FI_DRIVER_VERSION, UUID, device, gpu, hostname, modelName, pci_bus_id]}
  DCGM_FI_PROF_GR_ENGINE_ACTIVE: {type: gauge, labels: [DCGM_FI_DRIVER_VERSION, UUID, device, gpu, hostname, modelName, pci_bus_id]}
  DCGM_FI_PROF_PCIE_RX_BYTES: {type: gauge, labels: [DCGM_FI_DRIVER_VERSION, UUID, device, gpu, hostname, modelName, pci_bus_id]}
  DCGM_FI_PROF_PCIE_TX_BYTES: {type: gauge, labels: [DCGM_FI_DRIVER_VERSION, UUID, device, gpu, hostname, modelName, pci_bus_id]}
  DCGM_FI_PROF_PIPE_TENSOR_ACTIVE: {type: gauge, labels: [DCGM_FI_DRIVER_VERSION, UUID, device, gpu, hostname, modelName, pci_bus_id]}
