  DCGM_FI_DEV_GPU_TEMP: {type: gauge, labels: [DCGM_FI_DRIVER_VERSION, UUID, device, gpu, hostname, modelName, pci_bus_id]}
  DCGM_FI_DEV_GPU_UTIL: {type: gauge, labels: [DCGM_FI_DRIVER_VERSION, UUID, device, gpu, hostname, modelName, pci_bus_id]}
  DCGM_FI_DEV_MEMORY_TEMP: {type: gauge, labels: [DCGM_FI_DRIVER_VERSION, UUID, device, gpu, hostname, modelName, pci_bus_id]}
  DCGM_FI_DEV_MEM_CLOCK: {type: gauge, labels: [DCGM_FI_DRIVER_VERSION, UUID, device, gpu, hostname, modelName, pci_bus_id]}
  DCGM_FI_DEV_MEM_COPY_UTIL: {type: gauge, labels: [DCGM_FI_DRIVER_VERSION, UUID, device, gpu, hostname, modelName, pci_bus_id]}
  DCGM_FI_DEV_PCIE_REPLAY_COUNTER: {type: counter, labels: [DCGM_FI_DRIVER_VERSION, UUID, device, gpu, hostname, modelName, pci_bus_id]}
  DCGM_FI_DEV_POWER_USAGE: {type: gauge, labels: [DCGM_FI_DRIVER_VERSION, UUID, device, gpu, hostname, modelName, pci_bus_id]}
