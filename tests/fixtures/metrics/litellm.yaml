  litellm_provider_remaining_budget_metric: {type: gauge}
  litellm_proxy_failed_requests_metric_total: {type: counter}
  litellm_proxy_total_requests_metric_created: {type: gauge, labels: [api_key_alias, api_provider, client_ip, end_user, hashed_api_key, model_id, org_alias, org_id, requested_model, route, status_code, team, team_alias, user, user_agent, user_email]}
  litellm_proxy_total_requests_metric_total: {type: counter, labels: [api_key_alias, api_provider, client_ip, end_user, hashed_api_key, model_id, org_alias, org_id, requested_model, route, status_code, team, team_alias, user, user_agent, user_email]}
  litellm_remaining_api_key_budget_metric: {type: gauge, labels: [api_key_alias, hashed_api_key]}
  litellm_remaining_api_key_requests_for_model: {type: gauge, labels: [api_key_alias, hashed_api_key, model, model_id]}
  litellm_remaining_api_key_tokens_for_model: {type: gauge, labels: [api_key_alias, hashed_api_key, model, model_id]}
  litellm_remaining_customer_budget_metric: {type: gauge}
  litellm_remaining_org_budget_metric: {type: gauge}
  litellm_remaining_requests_metric: {type: gauge}
  litellm_remaining_team_budget_metric: {type: gauge}
  litellm_remaining_tokens_metric: {type: gauge}
  litellm_remaining_user_budget_metric: {type: gauge, labels: [user]}
  litellm_request_queue_time_seconds: {type: histogram, labels: [api_key_alias, api_provider, end_user, hashed_api_key, model, model_id, org_alias, org_id, requested_model, team, team_alias, user]}
