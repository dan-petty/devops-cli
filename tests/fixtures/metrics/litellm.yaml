  litellm_managed_batch_created_total: {type: counter}
  litellm_managed_batch_duration_seconds: {type: histogram}
  litellm_managed_file_created_total: {type: counter}
  litellm_managed_file_deleted_total: {type: counter}
  litellm_managed_file_size_bytes: {type: gauge}
  litellm_mcp_tool_call_spend_metric_total: {type: counter}
  litellm_mcp_tool_calls_total: {type: counter}
  litellm_org_budget_remaining_hours_metric: {type: gauge}
  litellm_org_max_budget_metric: {type: gauge}
  litellm_output_audio_tokens_metric_total: {type: counter}
  litellm_output_reasoning_tokens_metric_created: {type: gauge, labels: [api_key_alias, api_provider, end_user, hashed_api_key, model, model_id, requested_model, team, team_alias, user, user_email]}
  litellm_output_reasoning_tokens_metric_total: {type: counter, labels: [api_key_alias, api_provider, end_user, hashed_api_key, model, model_id, requested_model, team, team_alias, user, user_email]}
  litellm_output_tokens_metric_created: {type: gauge, labels: [api_key_alias, api_provider, end_user, hashed_api_key, model, model_id, org_alias, org_id, requested_model, team, team_alias, user, user_email]}
  litellm_output_tokens_metric_total: {type: counter, labels: [api_key_alias, api_provider, end_user, hashed_api_key, model, model_id, org_alias, org_id, requested_model, team, team_alias, user, user_email]}
  litellm_overhead_latency_metric: {type: histogram, labels: [api_base, api_key_alias, api_provider, hashed_api_key, litellm_model_name, model_group, model_id]}
  litellm_overhead_latency_metric_created: {type: gauge, labels: [api_base, api_key_alias, api_provider, hashed_api_key, litellm_model_name, model_group, model_id]}
  litellm_overhead_with_guardrails_latency_metric: {type: histogram, labels: [api_base, api_key_alias, api_provider, hashed_api_key, litellm_model_name, model_group, model_id]}
