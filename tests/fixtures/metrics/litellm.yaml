from_source:
  litellm_deployment_cooled_down_total:
    type: counter
    labels: [api_base, api_provider, exception_status, litellm_model_name, model_id]
    source: https://github.com/BerriAI/litellm/blob/v1.103.0/litellm/types/integrations/prometheus.py#L665-L671
  litellm_deployment_failed_fallbacks_total:
    type: counter
    labels: [api_key_alias, exception_class, exception_status, fallback_model, hashed_api_key, model_id, requested_model, team, team_alias]
    source: https://github.com/BerriAI/litellm/blob/v1.103.0/litellm/types/integrations/prometheus.py#L673-L685
  litellm_deployment_failure_responses_total:
    type: counter
    labels: [api_base, api_key_alias, api_provider, client_ip, exception_class, exception_status, hashed_api_key, litellm_model_name, model_id, requested_model, team, team_alias, user_agent]
    source: https://github.com/BerriAI/litellm/blob/v1.103.0/litellm/types/integrations/prometheus.py#L762-L776
