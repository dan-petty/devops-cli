# Metric families the deployed Prometheus server serves about itself (#693): names, types and
# label names, never label values. tests/test_stack_dashboards.py checks
# prometheus-server.json against them.
#
# `families` lists every family exactly as its `# TYPE` line printed it, with its type and
# the label names its samples carried. A family without `labels` printed its `# TYPE` line
# but no sample, so its labels could not be read from the capture.
exporter: Prometheus server
image: quay.io/prometheus/prometheus:v3.15.0
chart: prometheus-community/prometheus 29.35.0
captured: "2026-10-01"
taken_from: >-
  The prometheus-server Service's /metrics on the homelab cluster, read in the plain text
  format (version 0.0.4) through the Kubernetes API service proxy.
scraped_by: >-
  The server's own prometheus job, which scrapes localhost:9090 (scrapeConfigs.prometheus in
  k8s/monitoring/prometheus-values.yaml). Its relabelling adds the cluster label.
target_labels: [cluster, instance, job]
