# Metric families the deployed kube-state-metrics serves on port 8080 (#1136):
# names, types and label names, never label values. tests/test_stack_dashboards.py checks
# k8s-views-global.json, k8s-views-namespaces.json and k8s-views-nodes.json against them.
exporter: kube-state-metrics
image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
chart: grafana/k8s-monitoring 4.5.2
captured: "2026-10-21"
taken_from: >-
  The k8s-monitoring-kube-state-metrics pod's port 8080 /metrics in monitoring on the
  homelab k3s cluster, read through the Kubernetes API pod proxy.
scraped_by: >-
  k8s-monitoring's clusterMetrics.kube-state-metrics job
  (job="integrations/kubernetes/kube-state-metrics") in
  k8s/monitoring/k8s-monitoring-values.yaml, filtered by the chart's default allow list plus
  clusterMetrics.kube-state-metrics.metricsTuning.includeMetrics.
target_labels: [cluster, instance, job, source]
