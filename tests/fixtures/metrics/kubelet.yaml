# Metric families the k3s kubelet serves at /metrics (#1136):
# names, types and label names, never label values. tests/test_stack_dashboards.py checks
# k8s-views-global.json, k8s-views-namespaces.json and k8s-views-nodes.json against them.
exporter: Kubernetes kubelet
version: v1.31.4+k3s1
captured: "2026-10-21"
taken_from: >-
  Each cluster node's /api/v1/nodes/<node>/proxy/metrics on the homelab k3s cluster.
scraped_by: >-
  k8s-monitoring's clusterMetrics.kubelet job (job="integrations/kubernetes/kubelet") in
  k8s/monitoring/k8s-monitoring-values.yaml, filtered by the chart's default allow list.
target_labels: [cluster, instance, job, node, source]
