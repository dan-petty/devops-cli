# Metric families the k3s embedded cAdvisor serves at /metrics/cadvisor (#1136):
# names, types and label names, never label values. tests/test_stack_dashboards.py checks
# ingress-tunnel.json, k8s-views-global.json, k8s-views-namespaces.json and
# k8s-views-nodes.json against them.
exporter: cAdvisor (kubelet /metrics/cadvisor)
version: v1.31.4+k3s1
captured: "2026-10-21"
taken_from: >-
  Each cluster node's /api/v1/nodes/<node>/proxy/metrics/cadvisor on the homelab k3s cluster.
scraped_by: >-
  k8s-monitoring's clusterMetrics.cadvisor job (job="integrations/kubernetes/cadvisor") in
  k8s/monitoring/k8s-monitoring-values.yaml, filtered by the chart's default allow list plus
  clusterMetrics.cadvisor.metricsTuning.includeMetrics.
target_labels: [cluster, instance, job, node, source]
families:
  cadvisor_version_info: {type: gauge, labels: [cadvisorRevision, cadvisorVersion, dockerVersion, kernelVersion, osVersion]}
  container_blkio_device_usage_total: {type: counter, labels: [container, device, id, image, major, minor, name, namespace, operation, pod]}
