---
# Source: example/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: example-alertmanager
spec:
  serviceName: example-alertmanager
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: quay.io/example/alertmanager:v1.0.0
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: storage
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
# Source: example/templates/crd.yaml
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.com
spec:
  group: example.com
  names:
    kind: Widget
    plural: widgets
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            image:
              type: string
            operator:
              type: string
              enum:
                - "="
                - "!="
---
# Source: example/templates/image-updater.yaml
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: service
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: service
      images:
        - alias: service
          imageName: ghcr.io/example/service:latest
