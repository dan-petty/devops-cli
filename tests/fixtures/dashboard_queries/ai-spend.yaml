# Cases of the spend and local-savings panels of k8s/devops/dashboards/ai-spend.json, which
# tests/prometheus/test_dashboard_queries.py evaluates with promtool (#4724, #5914). The test
# module tells the format, and docs/TESTING.md tells how to add a case. A query that reads the
# constant reference_price_usd_per_token takes it from the dashboard.
#
# A call through the gateway adds to the gateway's spend counter `litellm_spend_metric_total`.
# devops-cli also counts its own gateway calls, in `devops_cli_ai_spend_usd_total` with
# `provider="gateway"`, and its calls that did not go through the gateway, with another provider.
# The spend panels add the gateway counter and the direct calls, so they count no gateway call twice.
tests:
  # Each 15 min for 8 days, the gateway adds $0.25 for a hosted model and $0 for a local model:
  # $1 each hour. devops-cli sends $0.1875 of its gateway calls each 15 min ($0.75 each hour, 75 %
  # of the gateway spend: the rest of its telemetry did not arrive) and $0.0625 of direct calls
  # ($0.25 each hour).
  - name: the gateway counts its spend and devops-cli sends its direct spend each 15 min
    shape: sparse_counter
    interval: 15m
    input_series:
      - series: 'litellm_spend_metric_total{job="llm-gateway", api_provider="openrouter", model="deepseek/deepseek-v4.1-flash-1017:floor", requested_model="deepseek-v4.1-flash-1017"}'
        values: '0+0.25x768'
      - series: 'litellm_spend_metric_total{job="llm-gateway", api_provider="ollama_chat", model="qwen3.8:27b", requested_model="local/qwen3.8:27b"}'
        values: '0+0x768'
      - series: 'devops_cli_ai_spend_usd_total{job="roadmap-service", provider="gateway", server="llm-gateway", backend="llm-gateway", model="deepseek-v4.1-flash-1017"}'
        values: '0+0.1875x768'
      - series: 'devops_cli_ai_spend_usd_total{job="devops-cli", provider="openai", server="example.com", backend="openai", model="gpt-4o"}'
        values: '0+0.0625x768'
    promql_expr_test:
      # 24 h of the gateway ($24) and of the direct calls ($6). devops-cli's own count of its
      # gateway calls ($18) is not added.
      - panel: Cloud Spend in Range
        ref_id: A
        variables: {__range: 24h}
        expr: '(sum(increase(litellm_spend_metric_total[$__range])) or vector(0)) + (sum(increase(devops_cli_ai_spend_usd_total{provider!="gateway"}[$__range])) or vector(0))'
        eval_time: 192h
        exp_samples:
          - labels: '{}'
            value: 30
      # The last 7 days hold $168 of the gateway and $42 of direct calls: $30 each day, so $900
      # for 30 days. The projection is the same for a range of 6 h and of 7 d. The values are
      # as promtool gives them, with the float error of the rate.
      - panel: Projected 30-Day Run Rate
        ref_id: A
        variables: {__range: 6h}
        expr: '((sum(rate(litellm_spend_metric_total[7d])) or vector(0)) + (sum(rate(devops_cli_ai_spend_usd_total{provider!="gateway"}[7d])) or vector(0))) * 86400 * 30'
        eval_time: 192h
        exp_samples:
          - labels: '{}'
            value: 900.0000000000002
      - panel: Projected 30-Day Run Rate
        ref_id: A
        variables: {__range: 7d}
        expr: '((sum(rate(litellm_spend_metric_total[7d])) or vector(0)) + (sum(rate(devops_cli_ai_spend_usd_total{provider!="gateway"}[7d])) or vector(0))) * 86400 * 30'
        eval_time: 192h
        exp_samples:
          - labels: '{}'
            value: 900.0000000000002
      - panel: Projected 90-Day Run Rate
        ref_id: A
        variables: {__range: 24h}
        expr: '((sum(rate(litellm_spend_metric_total[7d])) or vector(0)) + (sum(rate(devops_cli_ai_spend_usd_total{provider!="gateway"}[7d])) or vector(0))) * 86400 * 90'
        eval_time: 192h
        exp_samples:
          - labels: '{}'
            value: 2700.0000000000005
      - panel: Projected 1-Year Run Rate
        ref_id: A
        variables: {__range: 24h}
        expr: '((sum(rate(litellm_spend_metric_total[7d])) or vector(0)) + (sum(rate(devops_cli_ai_spend_usd_total{provider!="gateway"}[7d])) or vector(0))) * 86400 * 365'
        eval_time: 192h
        exp_samples:
          - labels: '{}'
            value: 10950.000000000002
      # 24 hourly bars of $1.25 add up to the spend of the range.
      - panel: 'Spend: USD per hour'
        ref_id: A
        variables: {__interval: 1h}
        expr: 'sum(increase(litellm_spend_metric_total[$__interval]) or increase(devops_cli_ai_spend_usd_total{provider!="gateway"}[$__interval]))'
        bars: 24h
        total: 30
        eval_time: 192h
        exp_samples:
          - labels: '{}'
            value: 30
      # The gateway bars of the hosted model add up to $24. The local model spent $0, so it has
      # no bar and no legend entry.
      - panel: 'Spend by provider and model: USD per hour'
        ref_id: A
        variables: {__interval: 1h}
        expr: 'sum by (api_provider, model) (increase(litellm_spend_metric_total[$__interval])) > 0'
        bars: 24h
        total: 24
        eval_time: 192h
        exp_samples:
          - labels: '{api_provider="openrouter", model="deepseek/deepseek-v4.1-flash-1017:floor"}'
            value: 24
      # The bars of the direct calls add up to $6, and devops-cli's gateway calls have no bar.
      - panel: 'Spend by provider and model: USD per hour'
        ref_id: B
        variables: {__interval: 1h}
        expr: 'sum by (provider, model) (increase(devops_cli_ai_spend_usd_total{provider!="gateway"}[$__interval])) > 0'
        bars: 24h
        total: 6
        eval_time: 192h
        exp_samples:
          - labels: '{model="gpt-4o", provider="openai"}'
            value: 6
      # devops-cli counted $18 of the $24 that the gateway counted.
      - panel: devops-cli Coverage of Gateway Spend
        ref_id: A
        variables: {__range: 24h}
        expr: 'sum(increase(devops_cli_ai_spend_usd_total{provider="gateway"}[$__range])) / sum(increase(litellm_spend_metric_total[$__range]))'
        eval_time: 192h
        exp_samples:
          - labels: '{}'
            value: 0.75
  # The gateway counts the tokens of each deployment, which `model_id` names, and
  # litellm_deployment_total_requests_total names the `api_base` of each deployment. Each 15 min
  # for 8 days, the local deployments run tokens that are worth, at the reference prices of the
  # dashboard (0.035 USD prompt and 1.50 USD completion per million chat tokens, 0.01 USD per
  # million embedding tokens), $1 an hour on ollama-48gib-fast, $0.50 and $0.25 an hour for two
  # groups on ollama-64gib-standard, and $0.25 an hour of embeddings: $2 an hour. The embedding
  # deployment has no `api_base`, as LiteLLM gives none. The gateway container restarts at 175 h,
  # and its counter of ollama-48gib-fast starts again from the tokens of its first call. A hosted
  # DeepSeek deployment and a client series that gives hosted tokens `local="true"`, as before
  # #5874, add nothing.
  - name: the gateway counts the tokens of each local deployment and restarts once
    shape: counter_reset
    interval: 15m
    input_series:
      - series: 'litellm_input_tokens_metric_total{job="llm-gateway", end_user="roadmap-service", api_provider="ollama_chat", model="qwen3.8:27b", model_id="fast", requested_model="qwen3.8:27b"}'
        values: '0+5000000x700 5000000+5000000x67'
      - series: 'litellm_output_tokens_metric_total{job="llm-gateway", end_user="roadmap-service", api_provider="ollama_chat", model="qwen3.8:27b", model_id="fast", requested_model="qwen3.8:27b"}'
        values: '0+50000x700 50000+50000x67'
      - series: 'litellm_input_tokens_metric_total{job="llm-gateway", end_user="roadmap-service", api_provider="ollama_chat", model="qwen3.8:27b", model_id="standard", requested_model="local/qwen3.8:27b"}'
        values: '0+2500000x768'
      - series: 'litellm_output_tokens_metric_total{job="llm-gateway", end_user="roadmap-service", api_provider="ollama_chat", model="qwen3.8:27b", model_id="standard", requested_model="local/qwen3.8:27b"}'
        values: '0+25000x768'
      - series: 'litellm_input_tokens_metric_total{job="llm-gateway", end_user="roadmap-service", api_provider="ollama_chat", model="qwen3.8:27b", model_id="background", requested_model="devops-background"}'
        values: '0+1250000x768'
      - series: 'litellm_output_tokens_metric_total{job="llm-gateway", end_user="roadmap-service", api_provider="ollama_chat", model="qwen3.8:27b", model_id="background", requested_model="devops-background"}'
        values: '0+12500x768'
      - series: 'litellm_input_tokens_metric_total{job="llm-gateway", end_user="roadmap-service", api_provider="ollama", model="qwen3-embedding:0.6b", model_id="embed", requested_model="qwen3-embedding:0.6b"}'
        values: '0+6250000x768'
      - series: 'litellm_output_tokens_metric_total{job="llm-gateway", end_user="roadmap-service", api_provider="ollama", model="qwen3-embedding:0.6b", model_id="embed", requested_model="qwen3-embedding:0.6b"}'
        values: '0+0x768'
      - series: 'litellm_input_tokens_metric_total{job="llm-gateway", end_user="roadmap-service", api_provider="openrouter", model="deepseek/deepseek-v4.1-flash-1017:floor", model_id="deepseek", requested_model="deepseek-v4.1-flash-1017"}'
        values: '0+1000000x768'
      - series: 'litellm_output_tokens_metric_total{job="llm-gateway", end_user="roadmap-service", api_provider="openrouter", model="deepseek/deepseek-v4.1-flash-1017:floor", model_id="deepseek", requested_model="deepseek-v4.1-flash-1017"}'
        values: '0+100000x768'
      - series: 'litellm_deployment_total_requests_total{job="llm-gateway", api_base="http://ollama-48gib-fast.llm.svc.cluster.local:11434/api/chat", api_provider="ollama_chat", litellm_model_name="qwen3.8:27b", model_id="fast"}'
        values: '0+1x768'
      - series: 'litellm_deployment_total_requests_total{job="llm-gateway", api_base="http://ollama-64gib-standard.llm.svc.cluster.local:11434/api/chat", api_provider="ollama_chat", litellm_model_name="qwen3.8:27b", model_id="standard"}'
        values: '0+1x768'
      - series: 'litellm_deployment_total_requests_total{job="llm-gateway", api_base="http://ollama-64gib-standard.llm.svc.cluster.local:11434/api/chat", api_provider="ollama_chat", litellm_model_name="qwen3.8:27b", model_id="background"}'
        values: '0+1x768'
      - series: 'litellm_deployment_total_requests_total{job="llm-gateway", api_provider="ollama", litellm_model_name="qwen3-embedding:0.6b", model_id="embed"}'
        values: '0+1x768'
      - series: 'litellm_deployment_total_requests_total{job="llm-gateway", api_base="https://openrouter.ai/api/v1/chat/completions", api_provider="openrouter", litellm_model_name="deepseek/deepseek-v4.1-flash-1017:floor", model_id="deepseek"}'
        values: '0+1x768'
      # Live, a failed request of a deployment also has a series with no `api_base`, and some
      # series have no `model_id`. A join on `model_id` with one of them as a second match fails.
      - series: 'litellm_deployment_total_requests_total{job="llm-gateway", api_provider="ollama_chat", litellm_model_name="qwen3.8:27b", model_id="fast"}'
        values: '0+1x768'
      - series: 'litellm_deployment_total_requests_total{job="llm-gateway", api_base="http://ollama-48gib-fast.llm.svc.cluster.local:11434/api/chat", api_provider="ollama_chat", litellm_model_name="qwen3.8:27b"}'
        values: '0+1x768'
      - series: 'litellm_deployment_total_requests_total{job="llm-gateway", api_base="http://ollama-64gib-standard.llm.svc.cluster.local:11434/api/chat", api_provider="ollama_chat", litellm_model_name="qwen3.8:27b"}'
        values: '0+1x768'
      - series: 'devops_cli_ai_tokens_total{job="roadmap-service", local="true", operation="chat", type="prompt", provider="gateway", server="llm-gateway", model="deepseek-v4.1-flash-1017"}'
        values: '0+1000000x768'
    promql_expr_test:
      # 24 h at $2 an hour, across the restart.
      - panel: 'Local Cloud Savings in Range'
        ref_id: A
        variables: {__range: 24h}
        expr: 'sum(label_replace(label_replace(label_replace(sum by (api_provider) (increase(litellm_input_tokens_metric_total{api_provider=~"ollama_chat|ollama"}[$__range])), "type", "prompt", "", "") or label_replace(sum by (api_provider) (increase(litellm_output_tokens_metric_total{api_provider=~"ollama_chat|ollama"}[$__range])), "type", "completion", "", ""), "operation", "chat", "api_provider", "ollama_chat"), "operation", "embeddings", "api_provider", "ollama") * on (operation, type) group_left () (${reference_price_usd_per_token:raw})) or vector(0)'
        eval_time: 192h
        exp_samples:
          - labels: '{}'
            value: 48
      # The last 7 days hold $2 an hour, so 30 days hold $1,440, for a range of 6 h and of
      # 7 d. The values are as promtool gives them, with the float error of the rate.
      - panel: 'Projected 30-Day Run Rate'
        ref_id: B
        variables: {__range: 6h}
        expr: 'sum(label_replace(label_replace(label_replace(sum by (api_provider) (rate(litellm_input_tokens_metric_total{api_provider=~"ollama_chat|ollama"}[7d])), "type", "prompt", "", "") or label_replace(sum by (api_provider) (rate(litellm_output_tokens_metric_total{api_provider=~"ollama_chat|ollama"}[7d])), "type", "completion", "", ""), "operation", "chat", "api_provider", "ollama_chat"), "operation", "embeddings", "api_provider", "ollama") * on (operation, type) group_left () (${reference_price_usd_per_token:raw})) * 86400 * 30 or vector(0)'
        eval_time: 192h
        exp_samples:
          - labels: '{}'
            value: 1440.0000000000002
      - panel: 'Projected 30-Day Run Rate'
        ref_id: B
        variables: {__range: 7d}
        expr: 'sum(label_replace(label_replace(label_replace(sum by (api_provider) (rate(litellm_input_tokens_metric_total{api_provider=~"ollama_chat|ollama"}[7d])), "type", "prompt", "", "") or label_replace(sum by (api_provider) (rate(litellm_output_tokens_metric_total{api_provider=~"ollama_chat|ollama"}[7d])), "type", "completion", "", ""), "operation", "chat", "api_provider", "ollama_chat"), "operation", "embeddings", "api_provider", "ollama") * on (operation, type) group_left () (${reference_price_usd_per_token:raw})) * 86400 * 30 or vector(0)'
        eval_time: 192h
        exp_samples:
          - labels: '{}'
            value: 1440.0000000000002
      - panel: 'Projected 90-Day Run Rate'
        ref_id: B
        variables: {__range: 24h}
        expr: 'sum(label_replace(label_replace(label_replace(sum by (api_provider) (rate(litellm_input_tokens_metric_total{api_provider=~"ollama_chat|ollama"}[7d])), "type", "prompt", "", "") or label_replace(sum by (api_provider) (rate(litellm_output_tokens_metric_total{api_provider=~"ollama_chat|ollama"}[7d])), "type", "completion", "", ""), "operation", "chat", "api_provider", "ollama_chat"), "operation", "embeddings", "api_provider", "ollama") * on (operation, type) group_left () (${reference_price_usd_per_token:raw})) * 86400 * 90 or vector(0)'
        eval_time: 192h
        exp_samples:
          - labels: '{}'
            value: 4320.000000000001
      - panel: 'Projected 1-Year Run Rate'
        ref_id: B
        variables: {__range: 24h}
        expr: 'sum(label_replace(label_replace(label_replace(sum by (api_provider) (rate(litellm_input_tokens_metric_total{api_provider=~"ollama_chat|ollama"}[7d])), "type", "prompt", "", "") or label_replace(sum by (api_provider) (rate(litellm_output_tokens_metric_total{api_provider=~"ollama_chat|ollama"}[7d])), "type", "completion", "", ""), "operation", "chat", "api_provider", "ollama_chat"), "operation", "embeddings", "api_provider", "ollama") * on (operation, type) group_left () (${reference_price_usd_per_token:raw})) * 86400 * 365 or vector(0)'
        eval_time: 192h
        exp_samples:
          - labels: '{}'
            value: 17520.000000000004
      # 24 hourly bars of $2 add up to the savings of the range.
      - panel: 'Local savings: USD per hour'
        ref_id: A
        variables: {__interval: 1h}
        expr: 'sum(label_replace(label_replace(label_replace(sum by (api_provider) (increase(litellm_input_tokens_metric_total{api_provider=~"ollama_chat|ollama"}[$__interval])), "type", "prompt", "", "") or label_replace(sum by (api_provider) (increase(litellm_output_tokens_metric_total{api_provider=~"ollama_chat|ollama"}[$__interval])), "type", "completion", "", ""), "operation", "chat", "api_provider", "ollama_chat"), "operation", "embeddings", "api_provider", "ollama") * on (operation, type) group_left () (${reference_price_usd_per_token:raw}))'
        bars: 24h
        total: 48
        eval_time: 192h
        exp_samples:
          - labels: '{}'
            value: 48
      # The bar of each Kubernetes service in one hour: the two groups on ollama-64gib-standard
      # add up to one bar, and the embedding deployment takes the name of its model.
      - panel: 'Local savings by backend server: USD per hour'
        ref_id: A
        variables: {__interval: 1h}
        expr: 'sum by (backend) (label_replace(label_replace(label_replace(sum by (api_provider, model_id) (increase(litellm_input_tokens_metric_total{api_provider=~"ollama_chat|ollama"}[$__interval])), "type", "prompt", "", "") or label_replace(sum by (api_provider, model_id) (increase(litellm_output_tokens_metric_total{api_provider=~"ollama_chat|ollama"}[$__interval])), "type", "completion", "", ""), "operation", "chat", "api_provider", "ollama_chat"), "operation", "embeddings", "api_provider", "ollama") * on (operation, type) group_left () (${reference_price_usd_per_token:raw}) * on (model_id) group_left (backend) (group by (model_id, backend) (label_replace(increase(litellm_deployment_total_requests_total{api_provider=~"ollama_chat|ollama", model_id!="", api_base!=""}[$__interval]), "backend", "$1", "api_base", "https?://([^.:/]+).*")) or on (model_id) group by (model_id, backend) (label_replace(increase(litellm_deployment_total_requests_total{api_provider=~"ollama_chat|ollama", model_id!=""}[$__interval]), "backend", "$1", "litellm_model_name", "(.+)")))) > 0'
        eval_time: 192h
        exp_samples:
          - labels: '{backend="ollama-48gib-fast"}'
            value: 1
          - labels: '{backend="ollama-64gib-standard"}'
            value: 0.75
          - labels: '{backend="qwen3-embedding:0.6b"}'
            value: 0.25
