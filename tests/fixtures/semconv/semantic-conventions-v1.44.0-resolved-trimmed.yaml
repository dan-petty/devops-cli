# Trimmed from the resolved.yaml that weaver 0.26.1 wrote for:
#   weaver registry package --v2 \
#     -r 'https://github.com/open-telemetry/semantic-conventions.git@v1.44.0[model]' \
#     --resolved-registry-uri 'https://github.com/open-telemetry/semantic-conventions.git@v1.44.0[model]' \
#     -o <dir>
# semantic-conventions v1.44.0 (e10a930844c6951757a43b849d364f7d056ac32b) is the registry the
# pinned GenAI conventions depend on. The GenAI registry itself has no deprecated attribute or
# metric at its pinned commit, while this one marks the GenAI names deprecated, moved to that
# repository, and still defines the HTTP client span and metric.
# Kept: the spans gen_ai.inference.client (deprecated) and http.client, the metrics
# gen_ai.client.operation.duration (deprecated) and http.client.request.duration, and the
# attributes gen_ai.usage.prompt_tokens (deprecated), http.request.method, server.address,
# server.port and url.full, with every catalog entry the kept registry and signals point
# at. Each kept entry is weaver's, with its references to other attributes dropped and its
# catalog indexes renumbered. Groups, events, entities and refinements are emptied.
file_format: resolved/2.0
schema_url: https://opentelemetry.io/schemas/1.44.0
attribute_catalog:
- key: gen_ai.usage.prompt_tokens
  type: int
  examples:
  - 42
  brief: Deprecated, use `gen_ai.usage.input_tokens` instead.
  stability: development
  deprecated:
    reason: uncategorized
    note: |
      Replaced by `gen_ai.usage.input_tokens`, which has moved to the [OpenTelemetry GenAI semantic conventions repository](https://github.com/open-telemetry/semantic-conventions-genai).
  annotations:
    dependency_resolution:
      exclude: true
- key: http.request.method
  type:
    members:
    - id: connect
      value: CONNECT
      brief: CONNECT method.
      stability: stable
    - id: delete
      value: DELETE
      brief: DELETE method.
      stability: stable
    - id: get
      value: GET
      brief: GET method.
      stability: stable
    - id: head
      value: HEAD
      brief: HEAD method.
      stability: stable
    - id: options
      value: OPTIONS
      brief: OPTIONS method.
      stability: stable
    - id: patch
      value: PATCH
      brief: PATCH method.
      stability: stable
    - id: post
      value: POST
      brief: POST method.
      stability: stable
    - id: put
      value: PUT
      brief: PUT method.
      stability: stable
    - id: trace
      value: TRACE
      brief: TRACE method.
      stability: stable
    - id: query
      value: QUERY
      brief: QUERY method.
      stability: development
    - id: other
      value: _OTHER
      brief: Any HTTP method that the instrumentation has no prior knowledge of.
      stability: stable
  examples:
  - GET
  - POST
  - HEAD
  brief: HTTP request method.
  note: |
    HTTP request method value SHOULD be "known" to the instrumentation.
    By default, this convention defines "known" methods as the ones listed in [RFC9110](https://www.rfc-editor.org/rfc/rfc9110.html#name-methods),
    the PATCH method defined in [RFC5789](https://www.rfc-editor.org/rfc/rfc5789.html)
    and the QUERY method defined in [httpbis-safe-method-w-body](https://datatracker.ietf.org/doc/draft-ietf-httpbis-safe-method-w-body/?include_text=1).

    If the HTTP request method is not known to instrumentation, it MUST set the `http.request.method` attribute to `_OTHER`.

    If the HTTP instrumentation could end up converting valid HTTP request methods to `_OTHER`, then it MUST provide a way to override
    the list of known HTTP methods. If this override is done via environment variable, then the environment variable MUST be named
    OTEL_INSTRUMENTATION_HTTP_KNOWN_METHODS and support a comma-separated list of case-sensitive known HTTP methods.

    ![Development](https://img.shields.io/badge/-development-blue)
    If this override is done via declarative configuration, then the list MUST be configurable via the `known_methods` property
    (an array of case-sensitive strings with minimum items 0) under `.instrumentation/development.general.http.client` and/or
    `.instrumentation/development.general.http.server`.

    In either case, this list MUST be a full override of the default known methods,
    it is not a list of known methods in addition to the defaults.

    HTTP method names are case-sensitive and `http.request.method` attribute value MUST match a known HTTP method name exactly.
    Instrumentations for specific web frameworks that consider HTTP methods to be case insensitive, SHOULD populate a canonical equivalent.
    Tracing instrumentations that do so, MUST also set `http.request.method_original` to the original value.
  stability: stable
- key: server.address
  type: string
  examples:
  - example.com
  - 10.1.2.80
  - /tmp/my.sock
  brief: GenAI server address.
  note: |
    When observed from the client side, and when communicating through an intermediary, `server.address` SHOULD represent the server address behind any intermediaries, for example proxies, if it's available.
  stability: stable
- key: server.address
  type: string
  examples:
  - example.com
  - 10.1.2.80
  - /tmp/my.sock
  brief: Server domain name if available without reverse DNS lookup; otherwise, IP address or UNIX domain
    socket name.
  note: |
    In HTTP/1.1, when the [request target](https://www.rfc-editor.org/rfc/rfc9112.html#name-request-target)
    is passed in its [absolute-form](https://www.rfc-editor.org/rfc/rfc9112.html#section-3.2.2),
    the `server.address` SHOULD match the host component of the request target.

    In all other cases, `server.address` SHOULD match the host component of the
    `Host` header in HTTP/1.1 or the `:authority` pseudo-header in HTTP/2 and HTTP/3.
  stability: stable
- key: server.address
  type: string
  examples:
  - example.com
  - 10.1.2.80
  - /tmp/my.sock
  brief: Server domain name if available without reverse DNS lookup; otherwise, IP address or UNIX domain
    socket name.
  note: |
    When observed from the client side, and when communicating through an intermediary, `server.address` SHOULD represent the server address behind any intermediaries, for example proxies, if it's available.
  stability: stable
- key: server.port
  type: int
  examples:
  - 80
  - 8080
  - 443
  brief: GenAI server port.
  note: |
    When observed from the client side, and when communicating through an intermediary, `server.port` SHOULD represent the server port behind any intermediaries, for example proxies, if it's available.
  stability: stable
- key: server.port
  type: int
  examples:
  - 80
  - 8080
  - 443
  brief: Server port number.
  note: |
    In the case of HTTP/1.1, when the [request target](https://www.rfc-editor.org/rfc/rfc9112.html#name-request-target)
    is passed in its [absolute-form](https://www.rfc-editor.org/rfc/rfc9112.html#section-3.2.2),
    the `server.port` SHOULD match the port component of the request target.

    In all other cases, `server.port` SHOULD match the port component of the
    `Host` header in HTTP/1.1 or the `:authority` pseudo-header in HTTP/2 and HTTP/3.
  stability: stable
- key: server.port
  type: int
  examples:
  - 80
  - 8080
  - 443
  brief: Server port number.
  note: |
    When observed from the client side, and when communicating through an intermediary, `server.port` SHOULD represent the server port behind any intermediaries, for example proxies, if it's available.
  stability: stable
- key: url.full
  type: string
  examples:
  - https://www.foo.bar/search?q=OpenTelemetry#SemConv
  - //localhost
  brief: Absolute URL describing a network resource according to [RFC3986](https://www.rfc-editor.org/rfc/rfc3986)
  note: |
    For network calls, URL usually has `scheme://host[:port][path][?query][#fragment]` format, where the fragment
    is not transmitted over HTTP, but if it is known, it SHOULD be included nevertheless.

    `url.full` MUST NOT contain credentials passed via URL in form of `https://username:password@www.example.com/`.
    In such case username and password SHOULD be redacted and attribute's value SHOULD be `https://REDACTED:REDACTED@www.example.com/`.

    `url.full` SHOULD capture the absolute URL when it is available (or can be reconstructed).

    Sensitive content provided in `url.full` SHOULD be scrubbed when instrumentations can identify it.

    ![Development](https://img.shields.io/badge/-development-blue)
    Query string values for the following keys SHOULD be redacted by default and replaced by the
    value `REDACTED`:

    * [`X-Amz-Signature`](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_sigv-authentication-methods.html)
    * [`X-Amz-Credential`](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_sigv-authentication-methods.html)
    * [`X-Amz-Security-Token`](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_sigv-authentication-methods.html)
    * [`sig`](https://learn.microsoft.com/azure/storage/common/storage-sas-overview#sas-token)
    * [`X-Goog-Signature`](https://cloud.google.com/storage/docs/access-control/signed-urls)

    This list is subject to change over time.

    Matching of query parameter keys against the sensitive list SHOULD be case-sensitive.

    ![Development](https://img.shields.io/badge/-development-blue)
    Instrumentation MAY provide a way to override this list via declarative configuration.
    If so, it SHOULD use the `sensitive_query_parameters` property
    (an array of case-sensitive strings with minimum items 0) under
    `.instrumentation/development.general.sanitization.url`.
    This list is a full override of the default sensitive query parameter keys,
    it is not a list of keys in addition to the defaults.

    When a query string value is redacted, the query string key SHOULD still be preserved, e.g.
    `https://www.example.com/path?color=blue&sig=REDACTED`.
  stability: stable
registry:
  attributes:
  - 0
  - 1
  - 4
  - 7
  - 8
  attribute_groups: []
  spans:
  - type: gen_ai.inference.client
    kind: client
    name:
      note: ''
    attributes:
    - base: 2
      requirement_level: recommended
      sampling_relevant: true
    - base: 5
      requirement_level:
        conditionally_required: If `server.address` is set.
      sampling_relevant: true
    brief: |
      This span represents a client call to Generative AI model or service that generates a response or requests a tool call based on the input prompt.
    note: |
      **Span name** SHOULD be `{gen_ai.operation.name} {gen_ai.request.model}`.
      Semantic conventions for individual GenAI systems and frameworks MAY specify different span name format
      and MUST follow the overall [guidelines for span names](https://github.com/open-telemetry/opentelemetry-specification/blob/v1.59.0/specification/trace/api.md#span).

      **Span kind** SHOULD be `CLIENT` and MAY be set to `INTERNAL` on spans representing
      call to models running in the same process. It's RECOMMENDED to use `CLIENT` kind
      when the GenAI system being instrumented usually runs in a different process than its
      client or when the GenAI call happens over instrumented protocol such as HTTP.
    stability: development
    deprecated:
      reason: uncategorized
      note: |
        Moved to the [OpenTelemetry GenAI semantic conventions repository](https://github.com/open-telemetry/semantic-conventions-genai).
    annotations:
      dependency_resolution:
        exclude: true
  - type: http.client
    kind: client
    name:
      note: ''
    attributes:
    - base: 1
      requirement_level: required
      sampling_relevant: true
    - base: 3
      requirement_level: required
      sampling_relevant: true
    - base: 6
      requirement_level: required
      sampling_relevant: true
    - base: 8
      requirement_level: required
      sampling_relevant: true
    brief: |
      This span represents an outbound HTTP request.
    note: |
      There are two ways HTTP client spans can be implemented in an instrumentation:

      1. Instrumentations SHOULD create an HTTP span for each attempt to send an HTTP request over the wire.
         In case the request is resent, the resend attempts MUST follow the [HTTP resend spec](#http-request-retries-and-redirects).
         In this case, instrumentations SHOULD NOT (also) emit a logical encompassing HTTP client span.

      2. If for some reason it is not possible to emit a span for each send attempt (because e.g. the instrumented library does not expose hooks that would allow this),
         instrumentations MAY create an HTTP span for the top-most operation of the HTTP client.
         In this case, the `url.full` MUST be the absolute URL that was originally requested, before any HTTP-redirects that may happen when executing the request.

      **Span name:** refer to the [Span Name](/docs/http/http-spans.md#name) section.

      **Span kind** MUST be `CLIENT`.

      **Span status:** refer to the [Span Status](/docs/http/http-spans.md#status) section.
    stability: stable
  metrics:
  - name: gen_ai.client.operation.duration
    instrument: histogram
    unit: s
    attributes:
    - base: 2
      requirement_level: recommended
    - base: 5
      requirement_level:
        conditionally_required: If `server.address` is set.
    brief: GenAI operation duration.
    stability: development
    deprecated:
      reason: uncategorized
      note: |
        Moved to the [OpenTelemetry GenAI semantic conventions repository](https://github.com/open-telemetry/semantic-conventions-genai).
    annotations:
      code_generation:
        metric_value_type: double
      dependency_resolution:
        exclude: true
  - name: http.client.request.duration
    instrument: histogram
    unit: s
    attributes:
    - base: 1
      requirement_level: required
    - base: 3
      requirement_level: required
    - base: 6
      requirement_level: required
    brief: Duration of HTTP client requests.
    stability: stable
    annotations:
      code_generation:
        metric_value_type: double
  events: []
  entities: []
refinements:
  spans: []
  metrics: []
  events: []
  entities: []
