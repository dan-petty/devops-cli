# promtool rule unit tests of the alert group roadmap-service-items in
# k8s/devops/monitoring/prometheus-rules-values.yaml (#5495). The alert fires when an item in a
# phase has been stalled for more than 1 hour. It names the item, read from the oldest item number
# series with the same labels. It stays quiet when stalled items is 0, before 1 hour has elapsed,
# and for a series of another job (such as job="devops-cli").
rule_files:
  - roadmap-service-items.rules.yaml

evaluation_interval: 1m

tests:
  - name: A stalled item fires at 1 hour and names its item number, but not before
    interval: 1m
    input_series:
      - series: 'devops_cli_roadmap_stalled_items{job="roadmap-service", repo="example/app", phase="ready"}'
        values: '1x90'
      - series: 'devops_cli_roadmap_oldest_item_number{job="roadmap-service", repo="example/app", phase="ready"}'
        values: '2754x90'
    alert_rule_test:
      - eval_time: 59m
        alertname: RoadmapServiceItemStuck
        exp_alerts: []
      - eval_time: 1h
        alertname: RoadmapServiceItemStuck
        exp_alerts:
          - exp_labels:
              severity: warning
              repo: example/app
              phase: ready
            exp_annotations:
              summary: "Item #2754 of example/app has been stalled in phase ready"
              description: "An item of the roadmap stayed in one phase for more than 24 hours with no unit running and no person cause. Run devops roadmap inbox to see the item (docs/CLUSTER.md, Roadmap service)."

  - name: Zero stalled items stays quiet even after 1 hour
    interval: 1m
    input_series:
      - series: 'devops_cli_roadmap_stalled_items{job="roadmap-service", repo="example/app", phase="ready"}'
        values: '0x90'
      - series: 'devops_cli_roadmap_oldest_item_number{job="roadmap-service", repo="example/app", phase="ready"}'
        values: '2713x90'
    alert_rule_test:
      - eval_time: 1h
        alertname: RoadmapServiceItemStuck
        exp_alerts: []

  - name: A series of another job stays quiet, even over 1 hour
    interval: 1m
    input_series:
      - series: 'devops_cli_roadmap_stalled_items{job="devops-cli", repo="example/app", phase="ready"}'
        values: '1x90'
      - series: 'devops_cli_roadmap_oldest_item_number{job="devops-cli", repo="example/app", phase="ready"}'
        values: '2919x90'
    alert_rule_test:
      - eval_time: 1h
        alertname: RoadmapServiceItemStuck
        exp_alerts: []

  - name: A stalled item with no number series is named without a number
    interval: 1m
    input_series:
      - series: 'devops_cli_roadmap_stalled_items{job="roadmap-service", repo="example/app", phase="planned"}'
        values: '1x90'
    alert_rule_test:
      - eval_time: 1h
        alertname: RoadmapServiceItemStuck
        exp_alerts:
          - exp_labels:
              severity: warning
              repo: example/app
              phase: planned
            exp_annotations:
              summary: "Item of example/app has been stalled in phase planned"
              description: "An item of the roadmap stayed in one phase for more than 24 hours with no unit running and no person cause. Run devops roadmap inbox to see the item (docs/CLUSTER.md, Roadmap service)."
