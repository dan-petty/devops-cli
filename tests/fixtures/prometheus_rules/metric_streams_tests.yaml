# promtool rule unit tests of the alert group metric-streams in
# k8s/monitoring/prometheus-values.yaml (#4697). The rule fires when Prometheus holds two
# target_info series of one job and instance for 30 minutes: the OpenTelemetry collector keys a
# metric stream by every resource attribute, while Prometheus keeps only job and instance, so two
# streams write one series and each total of the series starts again at zero. It stays quiet on
# one stream, and on the ten minutes that two streams overlap at a pod change.
#
# tests/test_k8s_monitoring_alerting.py writes the group to the file that `rule_files` names,
# beside a copy of this file, and runs `promtool test rules` on the copy. promtool starts each
# series at time 0, with one sample each `interval`. target_info carries the resource attributes
# that the OTLP receiver of Prometheus writes as labels, so a second stream of one job and
# instance shows as a second series that differs in `host_name`.
rule_files:
  - metric-streams.rules.yaml

evaluation_interval: 1m

tests:
  - name: Two target_info series of one job and instance fire after 30 minutes
    interval: 1m
    input_series:
      - series: 'target_info{job="roadmap-service", instance="roadmap-service", host_name="roadmap-service-6d9c8f7b5-abcde"}'
        values: '1x40'
      - series: 'target_info{job="roadmap-service", instance="roadmap-service", host_name="roadmap-service-6d9c8f7b5-fghij"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: DevopsCliMetricStreamsShareSeries
        exp_alerts: []
      - eval_time: 40m
        alertname: DevopsCliMetricStreamsShareSeries
        exp_alerts:
          - exp_labels:
              severity: warning
              job: roadmap-service
              instance: roadmap-service
            exp_annotations:
              summary: "Two metric streams write the series roadmap-service roadmap-service"
              description: "Prometheus holds two target_info series for job roadmap-service and instance roadmap-service for 30 minutes. Each stream carries its own metric Resource attributes, so the totals of both streams start again at zero in one series and their counts are lost. Remove the extra stream: a workload sets one service.instance.id in OTEL_RESOURCE_ATTRIBUTES (k8s/README.md, Alerting)."

  - name: One target_info series of one job and instance stays quiet
    interval: 1m
    input_series:
      - series: 'target_info{job="devops-cli-job", instance="devops-cli-job", host_name="devops-cli-job-abcde"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: DevopsCliMetricStreamsShareSeries
        exp_alerts: []

  - name: A ten minute overlap at a pod change stays quiet
    interval: 1m
    input_series:
      # The old pod sends until minute 20, the new one starts at minute 10: the two streams
      # overlap for ten minutes, shorter than the 30 minutes the rule waits.
      - series: 'target_info{job="devops-cli-job", instance="devops-cli-job", host_name="devops-cli-job-old"}'
        values: '1x20'
      - series: 'target_info{job="devops-cli-job", instance="devops-cli-job", host_name="devops-cli-job-new"}'
        values: '_x10 1x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: DevopsCliMetricStreamsShareSeries
        exp_alerts: []
      - eval_time: 40m
        alertname: DevopsCliMetricStreamsShareSeries
        exp_alerts: []
