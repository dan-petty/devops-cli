# promtool rule unit tests of the alert group roadmap-service in
# k8s/monitoring/prometheus-values.yaml (#2472). Each alert fires on a sample series and stays
# quiet on a normal one. The series of another job (a workstation as job="devops-cli", or the
# server's old kubernetes-pods job) are in each normal case, and the rules must not count them.
#
# tests/test_k8s_monitoring_alerting.py writes the group to the file that `rule_files` names,
# beside a copy of this file, and runs `promtool test rules` on the copy. promtool starts each
# series at time 0, one sample each `interval`, and `time()` is the seconds since time 0. A value
# in an annotation is what increase() gives over the samples: for example, a counter that grows by
# 10 each minute gives 590 over the 59 minutes of samples in a 1h range, and increase() makes it
# 600 by extrapolation to the range. A counter with no sample in the hour before the range started
# in the range, and the count rules give its last value (#2505).
rule_files:
  - roadmap-service.rules.yaml

evaluation_interval: 1m

tests:
  - name: A refused identity fires and holds; a workstation's refusal does not count
    interval: 1m
    input_series:
      - series: 'devops_cli_service_identity_refused_total{job="roadmap-service", identity="devops-cli-service"}'
        values: '_x5 1x30'
      - series: 'devops_cli_service_identity_refused_total{job="devops-cli", identity="example-user"}'
        values: '1x40'
      - series: 'devops_cli_service_identity_refused_total{job="kubernetes-pods", identity="devops-cli-service"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 3m
        alertname: RoadmapServiceIdentityRefused
        exp_alerts: []
      - eval_time: 30m
        alertname: RoadmapServiceIdentityRefused
        exp_alerts:
          - exp_labels:
              severity: critical
              identity: devops-cli-service
            exp_annotations:
              summary: "GitHub refused the identity devops-cli-service of the roadmap Service"
              description: "The roadmap Service stopped all rounds and starts no round, also after a restart, until a person removes its halt record. Its health check stays healthy. Repair the GitHub App, remove the halt record, then restart the Service (k8s/README.md, Roadmap service)."

  - name: One throttle fires for 15 minutes; a workstation's throttle does not count
    interval: 1m
    input_series:
      - series: 'devops_cli_github_throttle_wait_seconds{job="roadmap-service", resource="graphql"}'
        values: '{{schema:0 sum:30 count:1 buckets:[1] offset:5}}'
      - series: 'devops_cli_github_throttle_wait_seconds{job="devops-cli", resource="core"}'
        values: '{{schema:0 sum:30 count:1 buckets:[1] offset:5}}'
    alert_rule_test:
      - eval_time: 5m
        alertname: RoadmapServiceGitHubThrottled
        exp_alerts:
          - exp_labels:
              severity: critical
              resource: graphql
            exp_annotations:
              summary: "GitHub throttled graphql requests of the roadmap Service"
              description: "In the last 15 minutes GitHub refused a graphql request of the roadmap Service with a rate limit, or gave a 5xx for a read. The Service waited and sent the request again (k8s/README.md, Roadmap service)."
      - eval_time: 20m
        alertname: RoadmapServiceGitHubThrottled
        exp_alerts: []

  - name: A row whose new error series reaches 3 fires; one more error of an older series does not
    interval: 1m
    input_series:
      # A new series: 3 failed rounds in a row, then the job is suspended.
      - series: 'devops_cli_service_jobs_total{job="roadmap-service", repo="example/app", lane="model", row="refine", result="error"}'
        values: '_x60 1x4 2x4 3x40'
      # A series that was there an hour ago and gets one more error.
      - series: 'devops_cli_service_jobs_total{job="roadmap-service", repo="example/app", lane="status", row="metrics", result="error"}'
        values: '5x70 6x40'
      - series: 'devops_cli_service_jobs_total{job="roadmap-service", repo="example/app", lane="status", row="metrics", result="success"}'
        values: '0+1x110'
      - series: 'devops_cli_service_jobs_total{job="kubernetes-pods", repo="example/app", lane="model", row="refine", result="error"}'
        values: '0+1x110'
    alert_rule_test:
      - eval_time: 62m
        alertname: RoadmapServiceJobsFailing
        exp_alerts: []
      - eval_time: 80m
        alertname: RoadmapServiceJobsFailing
        exp_alerts: []
      - eval_time: 95m
        alertname: RoadmapServiceJobsFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              repo: example/app
              lane: model
              row: refine
            exp_annotations:
              summary: "All refine jobs of example/app failed in the last hour, on the model lane"
              description: '{namespace="devops"} | json | repo="example/app" | lane="model" (k8s/README.md, Roadmap service)'

  - name: An error series with no sample near the start of the hour counts only the errors of the hour
    interval: 10m
    input_series:
      # Samples at 50m, 70m and 110m: two jobs failed in the hour before 120m. The series has no
      # sample in the 5 minutes before 60m, and it is not new.
      - series: 'devops_cli_service_jobs_total{job="roadmap-service", repo="example/app", lane="model", row="refine", result="error"}'
        values: '_x5 5 _ 6 _ _ _ 7'
    alert_rule_test:
      - eval_time: 120m
        alertname: RoadmapServiceJobsFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              repo: example/app
              lane: model
              row: refine
            exp_annotations:
              summary: "All refine jobs of example/app failed in the last hour, on the model lane"
              description: '{namespace="devops"} | json | repo="example/app" | lane="model" (k8s/README.md, Roadmap service)'

  - name: A new error series with one sample of 3 fires
    interval: 10m
    input_series:
      # One sample at 60m: 3 jobs failed before the Service sent the series.
      - series: 'devops_cli_service_jobs_total{job="roadmap-service", repo="example/app", lane="model", row="refine", result="error"}'
        values: '_x5 0 3'
    alert_rule_test:
      - eval_time: 65m
        alertname: RoadmapServiceJobsFailing
        exp_alerts: []
      - eval_time: 95m
        alertname: RoadmapServiceJobsFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              repo: example/app
              lane: model
              row: refine
            exp_annotations:
              summary: "All refine jobs of example/app failed in the last hour, on the model lane"
              description: '{namespace="devops"} | json | repo="example/app" | lane="model" (k8s/README.md, Roadmap service)'

  - name: A row that fails each round fires while another row of its lane succeeds
    interval: 1m
    input_series:
      - series: 'devops_cli_service_jobs_total{job="roadmap-service", repo="example/app", lane="status", row="implement", result="error"}'
        values: '0+1x110'
      - series: 'devops_cli_service_jobs_total{job="roadmap-service", repo="example/app", lane="status", row="implement", result="success"}'
        values: '0x110'
      - series: 'devops_cli_service_jobs_total{job="roadmap-service", repo="example/app", lane="status", row="metrics", result="success"}'
        values: '0+1x110'
    alert_rule_test:
      - eval_time: 45m
        alertname: RoadmapServiceJobsFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              repo: example/app
              lane: status
              row: implement
            exp_annotations:
              summary: "All implement jobs of example/app failed in the last hour, on the status lane"
              description: '{namespace="devops"} | json | repo="example/app" | lane="status" (k8s/README.md, Roadmap service)'

  - name: A lane with no job start for over 2 hours fires after 10 minutes while a replica is available
    interval: 1m
    input_series:
      # The last job of the lane started at time 0.
      - series: 'devops_cli_service_job_start_timestamp_seconds{job="roadmap-service", repo="example/app", lane="model"}'
        values: '0x140'
      # A job of the lane starts each minute.
      - series: 'devops_cli_service_job_start_timestamp_seconds{job="roadmap-service", repo="example/app", lane="status"}'
        values: '0+60x140'
      - series: 'devops_cli_service_job_start_timestamp_seconds{job="kubernetes-pods", repo="example/app", lane="default"}'
        values: '0x140'
      - series: 'kube_deployment_status_replicas_available{namespace="devops", deployment="roadmap-service"}'
        values: '1x140'
    alert_rule_test:
      - eval_time: 125m
        alertname: RoadmapServiceLaneStalled
        exp_alerts: []
      - eval_time: 135m
        alertname: RoadmapServiceLaneStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              repo: example/app
              lane: model
            exp_annotations:
              summary: "No model job of example/app started for 2h 15m 0s"
              description: "The roadmap Service has an available replica, but no model job of example/app started for over 2 hours (k8s/README.md, Roadmap service)."

  - name: A lane with no job start stays quiet while no replica is available
    interval: 1m
    input_series:
      - series: 'devops_cli_service_job_start_timestamp_seconds{job="roadmap-service", repo="example/app", lane="model"}'
        values: '0x140'
      - series: 'kube_deployment_status_replicas_available{namespace="devops", deployment="roadmap-service"}'
        values: '0x140'
    alert_rule_test:
      - eval_time: 135m
        alertname: RoadmapServiceLaneStalled
        exp_alerts: []

  - name: A lane of a new pod that starts no job fires 2 hours after its worker started
    interval: 1m
    input_series:
      # The last model job of the old pod started at time 0, and the old pod stops at 30m.
      - series: 'devops_cli_service_job_start_timestamp_seconds{job="roadmap-service", instance="192.0.2.10:8000", repo="example/app", lane="model"}'
        values: '0x30 stale'
      # The worker of the new pod starts at 31m (1860 s) and starts no job.
      - series: 'devops_cli_service_job_start_timestamp_seconds{job="roadmap-service", instance="192.0.2.11:8000", repo="example/app", lane="model"}'
        values: '_x31 1860x190'
      - series: 'kube_deployment_status_replicas_available{namespace="devops", deployment="roadmap-service"}'
        values: '1x220'
    alert_rule_test:
      - eval_time: 155m
        alertname: RoadmapServiceLaneStalled
        exp_alerts: []
      - eval_time: 200m
        alertname: RoadmapServiceLaneStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              repo: example/app
              lane: model
            exp_annotations:
              summary: "No model job of example/app started for 2h 49m 0s"
              description: "The roadmap Service has an available replica, but no model job of example/app started for over 2 hours (k8s/README.md, Roadmap service)."

  - name: A restart of the service container fires; a pod with no restart and another namespace do not
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="devops", pod="roadmap-service-7d9f8b6c5-x2x4z", container="service"}'
        values: '0x60 1x60'
      - series: 'kube_pod_container_status_restarts_total{namespace="devops", pod="roadmap-service-7d9f8b6c5-q7w8e", container="service"}'
        values: '0x120'
      - series: 'kube_pod_container_status_restarts_total{namespace="llm", pod="llm-gateway-5c9d7f8b6-q7w8e", container="gateway"}'
        values: '0x60 3x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: RoadmapServiceRestarted
        exp_alerts: []
      - eval_time: 90m
        alertname: RoadmapServiceRestarted
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: devops
              pod: roadmap-service-7d9f8b6c5-x2x4z
              container: service
            exp_annotations:
              summary: "The roadmap Service container in roadmap-service-7d9f8b6c5-x2x4z restarted"
              description: "The restart count of container service of pod devops/roadmap-service-7d9f8b6c5-x2x4z increased by 1 in the last hour (k8s/README.md, Roadmap service)."

  - name: The memory near the limit fires after 10 minutes; another namespace or container does not count
    interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="devops", pod="roadmap-service-7d9f8b6c5-x2x4z", container="service"}'
        values: '800000000x5 900000000x30'
      - series: 'kube_pod_container_resource_limits{namespace="devops", pod="roadmap-service-7d9f8b6c5-x2x4z", container="service", resource="memory"}'
        values: '1000000000x40'
      - series: 'container_memory_working_set_bytes{namespace="devops", pod="roadmap-service-7d9f8b6c5-x2x4z", container="sidecar"}'
        values: '990000000x40'
      - series: 'kube_pod_container_resource_limits{namespace="devops", pod="roadmap-service-7d9f8b6c5-x2x4z", container="sidecar", resource="memory"}'
        values: '1000000000x40'
      - series: 'container_memory_working_set_bytes{namespace="llm", pod="llm-gateway-5c9d7f8b6-q7w8e", container="service"}'
        values: '990000000x40'
      - series: 'kube_pod_container_resource_limits{namespace="llm", pod="llm-gateway-5c9d7f8b6-q7w8e", container="service", resource="memory"}'
        values: '1000000000x40'
    alert_rule_test:
      - eval_time: 12m
        alertname: RoadmapServiceMemoryNearLimit
        exp_alerts: []
      - eval_time: 25m
        alertname: RoadmapServiceMemoryNearLimit
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: devops
              pod: roadmap-service-7d9f8b6c5-x2x4z
            exp_annotations:
              summary: "The roadmap Service container in roadmap-service-7d9f8b6c5-x2x4z uses 90% of its memory limit"
              description: "The working set of container service of pod devops/roadmap-service-7d9f8b6c5-x2x4z has been above 85% of its memory limit for 10 minutes, and the kernel kills the container at 100% (k8s/README.md, Roadmap service)."

  - name: An unavailable replica fires after 10 minutes; another deployment does not count
    interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_unavailable{namespace="devops", deployment="roadmap-service"}'
        values: '0x10 1x30'
      - series: 'kube_deployment_status_replicas_unavailable{namespace="devops", deployment="example"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: RoadmapServiceUnavailable
        exp_alerts: []
      - eval_time: 25m
        alertname: RoadmapServiceUnavailable
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: devops
              deployment: roadmap-service
            exp_annotations:
              summary: "The roadmap Service has an unavailable replica"
              description: "Deployment devops/roadmap-service has had an unavailable replica for 10 minutes (k8s/README.md, Roadmap service)."

  - name: A rollout with no available replica for 4 minutes stays quiet
    interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_unavailable{namespace="devops", deployment="roadmap-service"}'
        values: '0x10 1x3 0x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: RoadmapServiceUnavailable
        exp_alerts: []

  - name: 600 GitHub requests in an hour fire
    interval: 1m
    input_series:
      - series: 'devops_cli_github_requests_total{job="roadmap-service", resource="graphql"}'
        values: '0+10x90'
      # The Service reports its budget on its own scrape, so the series has the pod's instance and
      # pod labels, and the request counter (OTLP) has another instance (#2755).
      - series: 'devops_cli_service_budget_limit_requests{job="roadmap-service", instance="192.0.2.10:8000", namespace="devops", pod="roadmap-service-5d9c7b8f4-x2k7q", container="service"}'
        values: '500x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: RoadmapServiceGitHubRequestsHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The roadmap Service sent 600 GitHub requests in the last hour"
              description: "The roadmap Service sent more than 90% of its hourly GitHub request budget in one hour (k8s/README.md, Roadmap service)."

  - name: 600 GitHub requests in an hour with 480 answered 304 stay quiet
    interval: 1m
    input_series:
      # GitHub does not count a 304 answer against its rate limit, and the budget leaves it out
      # (#3939): 120 requests count.
      - series: 'devops_cli_github_requests_total{job="roadmap-service", resource="core", status="200"}'
        values: '0+2x90'
      - series: 'devops_cli_github_requests_total{job="roadmap-service", resource="core", status="304"}'
        values: '0+8x90'
      - series: 'devops_cli_service_budget_limit_requests{job="roadmap-service", instance="192.0.2.10:8000", namespace="devops", pod="roadmap-service-5d9c7b8f4-x2k7q", container="service"}'
        values: '500x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: RoadmapServiceGitHubRequestsHigh
        exp_alerts: []

  - name: A GitHub request stream that starts in the hour counts its first flush
    interval: 5m
    input_series:
      # The first flush of the stream at 60m holds 300 requests, and 20 more come every 5
      # minutes: 520 requests in the hour before 115m.
      - series: 'devops_cli_github_requests_total{job="roadmap-service", resource="graphql"}'
        values: '_x12 300+20x11'
      # The Service reports its budget on its own scrape, so the series has the pod's instance and
      # pod labels, and the request counter (OTLP) has another instance (#2755).
      - series: 'devops_cli_service_budget_limit_requests{job="roadmap-service", instance="192.0.2.10:8000", namespace="devops", pod="roadmap-service-5d9c7b8f4-x2k7q", container="service"}'
        values: '500x30'
    alert_rule_test:
      - eval_time: 115m
        alertname: RoadmapServiceGitHubRequestsHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The roadmap Service sent 520 GitHub requests in the last hour"
              description: "The roadmap Service sent more than 90% of its hourly GitHub request budget in one hour (k8s/README.md, Roadmap service)."

  - name: A GitHub request stream from before the hour counts only the requests of the hour
    interval: 10m
    input_series:
      # Samples at 50m, 70m and 110m of a stream at 2000 requests: 20 requests in the hour before
      # 120m. The stream has no sample in the 5 minutes before 60m, and it is not new.
      - series: 'devops_cli_github_requests_total{job="roadmap-service", resource="graphql"}'
        values: '_x5 2000 _ 2010 _ _ _ 2020'
      # The Service reports its budget on its own scrape, so the series has the pod's instance and
      # pod labels, and the request counter (OTLP) has another instance (#2755).
      - series: 'devops_cli_service_budget_limit_requests{job="roadmap-service", instance="192.0.2.10:8000", namespace="devops", pod="roadmap-service-5d9c7b8f4-x2k7q", container="service"}'
        values: '500x30'
    alert_rule_test:
      - eval_time: 120m
        alertname: RoadmapServiceGitHubRequestsHigh
        exp_alerts: []

  - name: 300 GitHub requests in an hour stay quiet; a workstation's requests do not count
    interval: 1m
    input_series:
      - series: 'devops_cli_github_requests_total{job="roadmap-service", resource="graphql"}'
        values: '0+5x90'
      - series: 'devops_cli_github_requests_total{job="devops-cli", resource="graphql"}'
        values: '0+10x90'
      # The Service reports its budget on its own scrape, so the series has the pod's instance and
      # pod labels, and the request counter (OTLP) has another instance (#2755).
      - series: 'devops_cli_service_budget_limit_requests{job="roadmap-service", instance="192.0.2.10:8000", namespace="devops", pod="roadmap-service-5d9c7b8f4-x2k7q", container="service"}'
        values: '500x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: RoadmapServiceGitHubRequestsHigh
        exp_alerts: []

  - name: 400 GitHub requests in an hour stay quiet for a limit of 500
    interval: 5m
    input_series:
      - series: 'devops_cli_github_requests_total{job="roadmap-service", instance="roadmap-service", resource="graphql"}'
        values: '_x12 400x11'
      # The Service reports its budget on its own scrape, so the series has the pod's instance and
      # pod labels, and the request counter (OTLP) has another instance (#2755).
      - series: 'devops_cli_service_budget_limit_requests{job="roadmap-service", instance="192.0.2.10:8000", namespace="devops", pod="roadmap-service-5d9c7b8f4-x2k7q", container="service"}'
        values: '500x30'
    alert_rule_test:
      - eval_time: 115m
        alertname: RoadmapServiceGitHubRequestsHigh
        exp_alerts: []

  - name: 900 GitHub requests in an hour stay quiet for a limit of 2000
    interval: 5m
    input_series:
      - series: 'devops_cli_github_requests_total{job="roadmap-service", instance="roadmap-service", resource="graphql"}'
        values: '_x12 900x11'
      # The Service reports its budget on its own scrape, so the series has the pod's instance and
      # pod labels, and the request counter (OTLP) has another instance (#2755).
      - series: 'devops_cli_service_budget_limit_requests{job="roadmap-service", instance="192.0.2.10:8000", namespace="devops", pod="roadmap-service-5d9c7b8f4-x2k7q", container="service"}'
        values: '2000x30'
    alert_rule_test:
      - eval_time: 115m
        alertname: RoadmapServiceGitHubRequestsHigh
        exp_alerts: []

  - name: 600 GitHub requests in an hour stay quiet for a limit of 2000, where they fire for 500
    interval: 5m
    input_series:
      - series: 'devops_cli_github_requests_total{job="roadmap-service", instance="roadmap-service", resource="graphql"}'
        values: '_x12 600x11'
      # The Service reports its budget on its own scrape, so the series has the pod's instance and
      # pod labels, and the request counter (OTLP) has another instance (#2755).
      - series: 'devops_cli_service_budget_limit_requests{job="roadmap-service", instance="192.0.2.10:8000", namespace="devops", pod="roadmap-service-5d9c7b8f4-x2k7q", container="service"}'
        values: '2000x30'
    alert_rule_test:
      - eval_time: 115m
        alertname: RoadmapServiceGitHubRequestsHigh
        exp_alerts: []

  - name: 1900 GitHub requests in an hour fire for a limit of 2000
    interval: 5m
    input_series:
      - series: 'devops_cli_github_requests_total{job="roadmap-service", instance="roadmap-service", resource="graphql"}'
        values: '_x12 1900x11'
      # The Service reports its budget on its own scrape, so the series has the pod's instance and
      # pod labels, and the request counter (OTLP) has another instance (#2755).
      - series: 'devops_cli_service_budget_limit_requests{job="roadmap-service", instance="192.0.2.10:8000", namespace="devops", pod="roadmap-service-5d9c7b8f4-x2k7q", container="service"}'
        values: '2000x30'
    alert_rule_test:
      - eval_time: 115m
        alertname: RoadmapServiceGitHubRequestsHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The roadmap Service sent 1900 GitHub requests in the last hour"
              description: "The roadmap Service sent more than 90% of its hourly GitHub request budget in one hour (k8s/README.md, Roadmap service)."

  - name: A Service that reports no limit raises no volume alert; RoadmapServiceUnavailable covers a Service that is down
    interval: 5m
    input_series:
      - series: 'devops_cli_github_requests_total{job="roadmap-service", instance="roadmap-service", resource="graphql"}'
        values: '_x12 1900x11'
    alert_rule_test:
      - eval_time: 115m
        alertname: RoadmapServiceGitHubRequestsHigh
        exp_alerts: []

  - name: 420 model requests in an hour fire
    interval: 1m
    input_series:
      - series: 'devops_cli_ai_requests_total{job="roadmap-service", operation="chat", cached="false"}'
        values: '0+7x90'
    alert_rule_test:
      - eval_time: 90m
        alertname: RoadmapServiceModelRequestsHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The roadmap Service sent 420 model requests in the last hour"
              description: "The roadmap Service sent more than 352 model requests in one hour (k8s/README.md, Roadmap service)."

  - name: A model request stream that starts in the hour counts its first flush; cached answers do not count
    interval: 5m
    input_series:
      # The first flush of the stream at 60m holds 250 requests, and 15 more come every 5
      # minutes: 415 requests in the hour before 115m.
      - series: 'devops_cli_ai_requests_total{job="roadmap-service", operation="chat", cached="false"}'
        values: '_x12 250+15x11'
      - series: 'devops_cli_ai_requests_total{job="roadmap-service", operation="chat", cached="true"}'
        values: '_x12 250+15x11'
    alert_rule_test:
      - eval_time: 115m
        alertname: RoadmapServiceModelRequestsHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The roadmap Service sent 415 model requests in the last hour"
              description: "The roadmap Service sent more than 352 model requests in one hour (k8s/README.md, Roadmap service)."

  - name: 300 model requests in an hour stay quiet; cached answers and a workstation's requests do not count
    interval: 1m
    input_series:
      - series: 'devops_cli_ai_requests_total{job="roadmap-service", operation="chat", cached="false"}'
        values: '0+5x90'
      - series: 'devops_cli_ai_requests_total{job="roadmap-service", operation="chat", cached="true"}'
        values: '0+10x90'
      - series: 'devops_cli_ai_requests_total{job="devops-cli", operation="chat", cached="false"}'
        values: '0+10x90'
    alert_rule_test:
      - eval_time: 90m
        alertname: RoadmapServiceModelRequestsHigh
        exp_alerts: []
  - name: A pod change keeps the true total of the failure counter, because each pod starts at zero
    interval: 1m
    input_series:
      # Pod a counts 3 failures from minute 0 to minute 3, then stays at 3. Pod b starts at zero at
      # minute 10 (#3495) and counts 2 failures by minute 12.
      - series: 'devops_cli_service_implement_failures_total{job="roadmap-service", pod="a", repo="example/app", class="ci_infra"}'
        values: '0+1x3 3x40'
      - series: 'devops_cli_service_implement_failures_total{job="roadmap-service", pod="b", repo="example/app", class="ci_infra"}'
        values: '_x10 0+1x2 2x40'
    promql_expr_test:
      # increase() extrapolates to the window edges, so the sum reads 5.03 where the counts are 5.
      - expr: sum(increase(devops_cli_service_implement_failures_total{job="roadmap-service", class="ci_infra"}[1h]))
        eval_time: 50m
        exp_samples:
          - labels: '{}'
            value: 5.034090909090909

  # A state record that the Service could not write (#4048). The gauge is 1 while the last write of
  # the record failed and 0 after the next good write. The rule waits 15 minutes, so a fault that
  # the next write repairs does not alert.
  - name: A record that stays unwritten for 15 minutes fires with its name; a repaired record and another job do not count
    interval: 1m
    input_series:
      - series: 'devops_cli_service_state_unkept{job="roadmap-service", record="ledger"}'
        values: '0x5 1x40'
      - series: 'devops_cli_service_state_unkept{job="roadmap-service", record="budget"}'
        values: '0x5 1x5 0x35'
      - series: 'devops_cli_service_state_unkept{job="roadmap-service", record="halt"}'
        values: '0x45'
      - series: 'devops_cli_service_state_unkept{job="devops-cli", record="halt"}'
        values: '1x45'
      - series: 'devops_cli_service_state_unkept{job="kubernetes-pods", record="halt"}'
        values: '1x45'
    alert_rule_test:
      - eval_time: 15m
        alertname: RoadmapServiceStateUnkept
        exp_alerts: []
      - eval_time: 30m
        alertname: RoadmapServiceStateUnkept
        exp_alerts:
          - exp_labels:
              severity: warning
              record: ledger
            exp_annotations:
              summary: "The roadmap Service could not write its ledger record"
              description: "The roadmap Service could not write its ledger record to its volume, so a restart loses what the record holds. The Service goes on with memory only. Check the free space and the permissions of the volume, and the log line that starts with Could not write (k8s/README.md, Roadmap service)."
      - eval_time: 44m
        alertname: RoadmapServiceStateUnkept
        exp_alerts:
          - exp_labels:
              severity: warning
              record: ledger
            exp_annotations:
              summary: "The roadmap Service could not write its ledger record"
              description: "The roadmap Service could not write its ledger record to its volume, so a restart loses what the record holds. The Service goes on with memory only. Check the free space and the permissions of the volume, and the log line that starts with Could not write (k8s/README.md, Roadmap service)."

  - name: A record that is written again before 15 minutes pass stays quiet
    interval: 1m
    input_series:
      - series: 'devops_cli_service_state_unkept{job="roadmap-service", record="budget"}'
        values: '0x5 1x10 0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: RoadmapServiceStateUnkept
        exp_alerts: []

  # A row that stays suspended (#4065). The gauge is 1 while a row waits for its retry time or for
  # new input, by `repo`, `row` and `class`, and 0 after the row runs again. The rule waits 3
  # hours, so a wait of the longest class that a probe round ends (6 hours) alerts once, and a short
  # outage that the first probe round ends does not.
  - name: A row that stays suspended for 3 hours fires with its class; a row that runs again and another job do not count
    interval: 1m
    input_series:
      - series: 'devops_cli_service_job_suspended{job="roadmap-service", repo="example/app", row="intake", class="provider"}'
        values: '0x5 1x300'
      - series: 'devops_cli_service_job_suspended{job="roadmap-service", repo="example/app", row="stage", class="parser"}'
        values: '0x5 1x60 0x240'
      - series: 'devops_cli_service_job_suspended{job="devops-cli", repo="example/app", row="intake", class="provider"}'
        values: '1x305'
      - series: 'devops_cli_service_job_suspended{job="kubernetes-pods", repo="example/app", row="intake", class="provider"}'
        values: '1x305'
    alert_rule_test:
      - eval_time: 3h
        alertname: RoadmapServiceRowSuspended
        exp_alerts: []
      - eval_time: 200m
        alertname: RoadmapServiceRowSuspended
        exp_alerts:
          - exp_labels:
              severity: warning
              repo: example/app
              row: intake
              class: provider
            exp_annotations:
              summary: "The row intake of example/app stays suspended after a provider failure"
              description: "The roadmap Service did not run the row intake of example/app for 3 hours, because it failed 3 rounds in a row with the failure class provider. The row runs one probe round when its retry time comes, or at once when its input changes. The gauge devops_cli_service_job_retry_after_seconds shows the seconds before the next probe round (k8s/README.md, Roadmap service)."
      - eval_time: 300m
        alertname: RoadmapServiceRowSuspended
        exp_alerts:
          - exp_labels:
              severity: warning
              repo: example/app
              row: intake
              class: provider
            exp_annotations:
              summary: "The row intake of example/app stays suspended after a provider failure"
              description: "The roadmap Service did not run the row intake of example/app for 3 hours, because it failed 3 rounds in a row with the failure class provider. The row runs one probe round when its retry time comes, or at once when its input changes. The gauge devops_cli_service_job_retry_after_seconds shows the seconds before the next probe round (k8s/README.md, Roadmap service)."

  - name: A row whose class changes keeps one alert, for the class that is 1
    interval: 1m
    input_series:
      - series: 'devops_cli_service_job_suspended{job="roadmap-service", repo="example/app", row="intake", class="provider"}'
        values: '0x5 1x60 0x240'
      - series: 'devops_cli_service_job_suspended{job="roadmap-service", repo="example/app", row="intake", class="ci_infra"}'
        values: '0x65 1x240'
    alert_rule_test:
      - eval_time: 300m
        alertname: RoadmapServiceRowSuspended
        exp_alerts:
          - exp_labels:
              severity: warning
              repo: example/app
              row: intake
              class: ci_infra
            exp_annotations:
              summary: "The row intake of example/app stays suspended after a ci_infra failure"
              description: "The roadmap Service did not run the row intake of example/app for 3 hours, because it failed 3 rounds in a row with the failure class ci_infra. The row runs one probe round when its retry time comes, or at once when its input changes. The gauge devops_cli_service_job_retry_after_seconds shows the seconds before the next probe round (k8s/README.md, Roadmap service)."
