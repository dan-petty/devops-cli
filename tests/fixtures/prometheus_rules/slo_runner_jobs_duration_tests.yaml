# promtool rule unit tests of the SLO group slo-runner-jobs-duration in
# k8s/devops/monitoring/prometheus-rules-values.yaml (#4709). The group is the render of
# k8s/devops/monitoring/slos/runner-jobs-duration.yaml, so each case shows what the Sloth spec
# promises: the four burn-rate alerts of Table 2 of docs/guidelines/sre.md, and the 20-event guard
# of the low-sample rule. The SLI counts the runner Jobs that end at 3,600 s or later over the
# runner Jobs that end.
#
# tests/prometheus/test_k8s_monitoring_alerting.py writes the group to the file that `rule_files`
# names, beside a copy of this file, and runs `promtool test rules` on the copy. promtool starts
# each series at time 0, one sample each `interval`. kube_job_status_start_time is the start of a
# Job and kube_job_status_completion_time is its end, so a Job of 4,000 s is a start of 1000 and a
# completion of 5000, and a Job of 500 s is a completion of 1500. A Job with no end is a
# completion of 0, and a Job whose object is gone has no series.
#
# The 1 hour page alert of this SLO stays quiet in every case: its line is 13.44 * 0.1, which is an
# error ratio of 1.344, and the error count of a window is at most the count of the Jobs that end
# in it, so no case can reach it.
#
# The file sets evaluation_interval: 5m and each case sets interval: 1m, so the 5 minute short
# window of the page row holds five samples, and a case of 3 days makes 864 rounds, under
# MAX_PROMTOOL_ROUNDS.
rule_files:
  - slo-runner-jobs-duration.rules.yaml

evaluation_interval: 5m

tests:
  - name: 12 of the 20 runner Jobs end at 3,600 s or later, so every reachable alert fires
    interval: 1m
    input_series:
      # 20 runner Jobs end within the last hour, 12 of them at 4,000 s and 8 of them at 500 s: an
      # error ratio of 0.6, above the 0.56 of the 6 hour page row and above both ticket rows.
      - series: 'kube_job_status_start_time{job_name="devops-cli-runner-slow-01"}'
        values: '1000x91'
      - series: 'kube_job_status_completion_time{job_name="devops-cli-runner-slow-01"}'
        values: '5000x91'
