default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
        stages: [pre-commit]
      # The hook fails when the pattern matches the branch name, so the lookahead matches each
      # name that is not `<type>/<issue>-<slug>`. The types are those of release-please-config.json
      # (CONTRIBUTING.md, Naming).
      - id: no-commit-to-branch
        alias: branch-name
        name: branch name is <type>/<issue>-<slug> (CONTRIBUTING.md, Naming)
        args:
          - --pattern
          - '^(?!(?:feat|fix|perf|refactor|revert|docs|test|build|ci|style|chore)/[0-9]+-[a-z0-9]+(?:-[a-z0-9]+)*$)'
        stages: [pre-commit]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md, --markdown-linebreak-ext=markdown]
        # syrupy writes a blank line of a snapshot as its two-space indent; trimming it breaks the
        # snapshot, which is regenerated, never edited (docs/TESTING.md). A blank line of a
        # recorded diff is one space, and trimming it changes the record (#3030).
        exclude: (^|/)__snapshots__/|^tests/fixtures/roadmap_eval/.*\.diff$
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: mixed-line-ending
        args: [--fix=lf]
        stages: [pre-commit]
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^(\.devcontainer/|\.vscode/)
        stages: [pre-commit]
      - id: check-added-large-files
        # The recorded tiktoken encodings are data that the test floor loads, and each is larger
        # than the default limit (#3265).
        exclude: ^tests/fixtures/tiktoken/
        stages: [pre-commit]
      - id: detect-private-key
        exclude: ^tests/(ai/test_review_prompt_guardrails\.py|security/test_security_gitleaks\.py)$
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-json
        exclude: ^\.vscode/
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      # `--config pyproject.toml` makes this file the only Ruff configuration, so a nested
      # ruff.toml cannot outrank the complexity cap of 10 (C901) or the nesting cap of 4
      # blocks (PLR1702).
      - id: ruff-check
        args: [--config, pyproject.toml, --fix]
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: ast-grep-scan
        name: ast-grep scan (network constructs and working-directory reads in src, elapsed-time bounds in tests)
        entry: uv run ast-grep scan --error=unused-suppression --error=no-suppress-all src tests
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

      - id: ast-grep-test
        name: ast-grep test (rule tests)
        entry: uv run ast-grep test --skip-snapshot-tests
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

      # The OpenSpec gate (ADR 0010) over the plans and the committed skills: it needs Node and the
      # pinned openspec (`uv run devops install-tools --tool openspec --only-missing`), so it runs
      # only when a commit touches the files it checks. Every `devops ci` and the `Static Analysis`
      # check of CI run it with no path filter.
      - id: openspec-gate
        name: openspec gate (change folders and generated skills)
        entry: uv run devops ci --only openspec
        language: system
        stages: [pre-commit]
        files: ^(openspec/|\.claude/skills/|\.agents/skills/|\.kilocode/skills/)
        pass_filenames: false
        require_serial: true

      # Each push holds the latest `origin/main` (docs/SDLC.md, Branch Governance & Hierarchy;
      # #4670). `check-merge-conflict` finds conflict markers in the files of a commit; this hook
      # finds a branch behind `main`, which has none. A branch that holds `main` merges into it
      # with no conflict. Only a `git push` of a branch sets `PRE_COMMIT_REMOTE_BRANCH` to
      # `refs/heads/...`: a tag and the scoped run of the implement Job, which rebases in code,
      # pass. pre-commit runs no hook for a delete. `fail_fast` skips the hooks after a refusal.
      - id: branch-current
        name: branch holds origin/main (docs/SDLC.md, Phase 5)
        entry: sh -c
        args:
          - |
            case "$PRE_COMMIT_REMOTE_BRANCH" in refs/heads/*) ;; *) exit 0 ;; esac
            if ! timeout 20 git fetch --quiet --no-tags origin main; then
              echo "The hook cannot fetch main from origin, so it cannot check the branch. Make sure that origin is available, then push again."
              exit 1
            fi
            git merge-base --is-ancestor FETCH_HEAD "${PRE_COMMIT_TO_REF:-HEAD}" && exit 0
            echo "The branch does not hold the latest origin/main. Run: git fetch origin && git rebase origin/main"
            exit 1
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
        fail_fast: true

      # A push runs only the fast static checks, in check-only mode, so the hook changes no file
      # (#1752). A commit runs no tests (#2086). The required checks of CI run the test suite and
      # the other checks of `devops ci` before a merge, and `uv run devops ci` runs them by hand.
      # The runner Job of the implement job runs this stage with `pre-commit run` before it pushes
      # (#3043). coreutils `timeout` ends each check hook at its limit with SIGTERM, and `devops ci`
      # then stops each row with its process group and names it. The limits of this stage add up
      # to less than the 120 s default limit of the agent shell (#4775).
      - id: devops-ci-pre-push
        name: devops ci (fast static checks before a push)
        entry: timeout 40 uv run devops ci --check --only lint,format
        language: system
        stages: [pre-push]
        pass_filenames: false
        require_serial: true
        always_run: true

      # The two workflow checks read only the files of the workflows, so they run only when a push
      # changes one (#3043). The runner image holds no `actionlint`, and a check that does not
      # apply to a push is not run.
      - id: devops-ci-workflows-pre-push
        name: devops ci (workflow checks before a push that changes a workflow)
        entry: timeout 30 uv run devops ci --check --only actionlint,zizmor
        language: system
        stages: [pre-push]
        files: ^\.github/(workflows|actions)/
        pass_filenames: false
        require_serial: true
