default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: mixed-line-ending
        args: [--fix=lf]
        stages: [pre-commit]
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^(\.devcontainer/|\.vscode/)
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: detect-private-key
        exclude: ^tests/(test_review_prompt_guardrails\.py|test_security_gitleaks\.py)$
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-json
        exclude: ^\.vscode/
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: devops-ci-pre-commit
        name: devops ci (pre-commit quality gate)
        entry: uv run devops ci
        language: system
        stages: [pre-commit]
        pass_filenames: true
        require_serial: true
        always_run: true
