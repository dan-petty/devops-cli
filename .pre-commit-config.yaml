default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main, --pattern, '^release/.*']
        stages: [pre-commit]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md, --markdown-linebreak-ext=markdown]
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: mixed-line-ending
        args: [--fix=lf]
        stages: [pre-commit]
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^(\.devcontainer/|\.vscode/)
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: detect-private-key
        exclude: ^tests/(test_review_prompt_guardrails\.py|test_security_gitleaks\.py)$
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-json
        exclude: ^\.vscode/
        stages: [pre-commit]

  - repo: local
    hooks:
      # Pure-stdlib AST walk over the staged files: no devops_cli import, because loading
      # the package costs about five seconds before a single file is read, and a
      # commit-time gate has to cost less than the commit. Blocks on nesting depth, which
      # the tree currently satisfies; complexity is reported without blocking, since 240
      # functions breach that cap today and nothing enforces it.
      - id: structural-invariants
        name: AST structural invariants (nesting depth)
        entry: python3 scripts/check_structural_invariants.py
        language: system
        stages: [pre-commit]
        types: [python]

      # Runs only the tests covering the staged sources, so committing stays fast while
      # still verifying the change. Falls back to the full suite when a staged source has
      # no covering test, rather than passing without running anything.
      - id: devops-ci-test-changed
        name: devops ci test (covering tests for staged files)
        entry: uv run devops ci test
        language: system
        stages: [pre-commit]
        types: [python]
        require_serial: true

      - id: devops-ci-pre-push
        name: devops ci (pre-push quality gate)
        entry: uv run devops ci
        language: system
        stages: [pre-push]
        pass_filenames: false
        require_serial: true
        always_run: true
