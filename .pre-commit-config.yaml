default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main, --pattern, '^release/.*']
        stages: [pre-commit]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md, --markdown-linebreak-ext=markdown]
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: mixed-line-ending
        args: [--fix=lf]
        stages: [pre-commit]
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^(\.devcontainer/|\.vscode/)
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: detect-private-key
        exclude: ^tests/(test_review_prompt_guardrails\.py|test_security_gitleaks\.py)$
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-json
        exclude: ^\.vscode/
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]

  - repo: local
    hooks:
      # Stdlib AST walk over the staged files, the same metric the whole-tree test and
      # `devops scan complexity` read (devops_cli.core.code_metrics). It loads no scanner and
      # no pydantic_ai, because a commit-time gate has to cost less than the commit; the
      # package inits still load devops_cli.config and typer. The cap arrives as an argument
      # and a test pins it to DEFAULT_MAX_NESTING_DEPTH. Blocks on nesting depth, the
      # function body being depth 1. Complexity is not checked here: it is Ruff's C901,
      # run by the ruff-check hook above.
      - id: structural-invariants
        name: AST structural invariants (nesting depth)
        entry: uv run python3 -m devops_cli.core.code_metrics
        args: [--max-depth, "5"]
        language: system
        stages: [pre-commit]
        types: [python]

      # Runs only the tests covering the staged sources, so committing stays fast while
      # still verifying the change. Falls back to the full suite when a staged source has
      # no covering test, rather than passing without running anything.
      - id: devops-ci-test-changed
        name: devops ci test (covering tests for staged files)
        entry: uv run devops ci test
        language: system
        stages: [pre-commit]
        types: [python]
        require_serial: true

      - id: devops-ci-pre-push
        name: devops ci (pre-push quality gate)
        entry: uv run devops ci
        language: system
        stages: [pre-push]
        pass_filenames: false
        require_serial: true
        always_run: true
