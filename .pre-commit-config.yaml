default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main, --pattern, '^release/.*']
        stages: [pre-commit]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md, --markdown-linebreak-ext=markdown]
        # syrupy writes a blank line of a snapshot as its two-space indent; trimming it breaks the
        # snapshot, which is regenerated, never edited (docs/TESTING.md).
        exclude: ^tests/__snapshots__/
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: mixed-line-ending
        args: [--fix=lf]
        stages: [pre-commit]
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^(\.devcontainer/|\.vscode/)
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: detect-private-key
        exclude: ^tests/(test_review_prompt_guardrails\.py|test_security_gitleaks\.py)$
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-json
        exclude: ^\.vscode/
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]

  - repo: local
    hooks:
      # Stdlib AST walk over the staged files, the same metric the whole-tree test and
      # `devops scan complexity` read (devops_cli.core.code_metrics). Invoking the file
      # directly via `python3 -P` keeps it pure stdlib: no package inits, no venv sync,
      # and no OSV malware query at commit time. The cap arrives as an argument and a
      # test pins it to DEFAULT_MAX_NESTING_DEPTH. Blocks on nesting depth, the function
      # body being depth 1. Complexity is not checked here: it is Ruff's C901, run by
      # the ruff-check hook above.
      - id: structural-invariants
        name: AST structural invariants (nesting depth)
        entry: python3 -P src/devops_cli/core/code_metrics.py
        args: [--max-depth, "5"]
        language: system
        stages: [pre-commit]
        types: [python]
        require_serial: true

      # Runs only the tests covering the staged sources, so committing stays fast while
      # still verifying the change. Falls back to the full suite when a staged source has
      # no covering test, rather than passing without running anything.
      - id: devops-ci-test-changed
        name: devops ci test (covering tests for staged files)
        entry: uv run devops ci test
        language: system
        stages: [pre-commit]
        types: [python]
        require_serial: true

      - id: ast-grep-scan
        name: ast-grep scan (hand-rolled network constructs)
        entry: uv run ast-grep scan --error=unused-suppression --error=no-suppress-all src
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

      - id: ast-grep-test
        name: ast-grep test (network construct rule tests)
        entry: uv run ast-grep test --skip-snapshot-tests
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

      - id: devops-ci-pre-push
        name: devops ci (pre-push quality gate)
        entry: uv run devops ci
        language: system
        stages: [pre-push]
        pass_filenames: false
        require_serial: true
        always_run: true
