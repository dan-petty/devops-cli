id: net-normalise
language: python
severity: error
message: Host canonicalised by hand. httpx2.URL(value).host or urllib.parse.urlsplit(value).hostname drops brackets and lower-cases; ipaddress.ip_address and dns.name.from_text give the canonical form.
rule:
  kind: call
  all:
    - has:
        field: function
        kind: attribute
        has:
          field: attribute
          regex: ^(strip|rstrip|lstrip)$
    - any:
        - has:
            field: arguments
            has:
              kind: string
              regex: '^["'']\[\]["'']$'
        - all:
            - has:
                field: arguments
                has:
                  kind: string
                  regex: '^["'']\.["'']$'
            - regex: '\.lower\(\)'
