id: net-raw-http-client
language: python
severity: error
files:
  - "src/**"
message: Raw HTTP client or request call. Build HTTP clients with http_client or async_http_client of devops_cli.http.entry to check egress at the connect.
rule:
  all:
    - pattern: httpx2.$METHOD($$$ARGS)
    - not:
        inside:
          kind: function_definition
          has:
            field: name
            regex: '^(_build_client|_build_async_client)$'
          stopBy: end
constraints:
  METHOD:
    regex: '^(Client|AsyncClient|get|post|put|patch|delete|head|request|stream)$'
