id: net-ip-literal
language: python
severity: error
files:
  - "src/**"
message: Comparison with an IP address literal. Parse with ipaddress.ip_address(host) and test is_loopback, is_link_local, is_private, or membership in an ipaddress.ip_network.
rule:
  kind: comparison_operator
  has:
    stopBy: end
    kind: string
    regex: '^["\''](\d{1,3}(\.\d{1,3}){3}(/\d+)?|[0-9a-fA-F]*:[0-9a-fA-F:]*:[0-9a-fA-F]+(/\d+)?)["\'']$'
  not:
    all:
      - regex: '^["\''][0-9a-fA-F.:/]+["\'']\s+(not\s+)?in\s'
      - not:
          regex: '\sin\s+[\w.()\[\]]*(?i:host|url|addr|netloc|endpoint|server|target|ip)'
