id: test-function-has-assertion
valid:
  - |
    def test_with_assert():
        assert 1 == 1
  - |
    def test_with_raises():
        with pytest.raises(ValueError, match="bad value"):
            compute()
  - |
    def test_with_mock_assertion():
        mock.assert_called_once()
  - |
    def not_a_test():
        compute()
  - |
    async def test_async_with_assert():
        assert await get_data() == 1
invalid:
  - |
    def test_missing_assert():
        compute()
  - |
    async def test_async_missing_assert():
        await compute()
