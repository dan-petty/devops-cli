id: review-cwd-read
valid:
  - 'root = find_worktree_root(manifest)'
  - 'cwd = request.cwd or request.workdir'
  - 'workdir = Path(scan_dir)'
  - 'def run_scan(target: Path, *, isolated: bool = False): ...'
  - 'empty = curr == Path(".")'
invalid:
  - 'root = Path.cwd().resolve()'
  - 'root = pathlib.Path.cwd()'
  - 'here = os.getcwd()'
  - 'here = getcwd()'
  - 'default = Path.cwd'
  - 'def run_scan(target: Path = DEFAULT_CURRENT_PATH): ...'
  - 'def run_scan(target=DEFAULT_CURRENT_PATH): ...'
  - 'def run_scan(target: Path = Path(".")): ...'
  - 'def run_scan(target=Path(".")): ...'
