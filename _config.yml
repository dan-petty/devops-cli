title: "devops-cli"
description: "Workstation DevOps CLI & Multi-Persona AI Code Reviewer"
url: "https://dan-petty.github.io"
baseurl: "/devops-cli"
repository: "dan-petty/devops-cli"
version: "v0.2.13"

# Markdown & Syntax Highlighting
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

# Plugins supported by GitHub Pages
plugins:
  - jekyll-seo-tag

# Exclude build, virtualenv, and test directories from Jekyll processing
exclude:
  - .venv/
  - .data/
  - tests/
  - .ruff_cache/
  - .mypy_cache/
  - .pytest_cache/
  - uv.lock
  - pyproject.toml
