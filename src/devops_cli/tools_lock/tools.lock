# tools.lock: every tool `devops install-tools` installs, at an exact version (#1142).
#
# A binary tool's build for this platform is checked against its sha256 before it is unpacked. A
# Python tool installs into a virtual environment of its own from its hashed requirements file,
# with `uv pip sync --require-hashes`. A Node tool installs with `npm ci --ignore-scripts` from the
# `package.json` and `package-lock.json` in the directory beside this file that is named for it,
# and npm checks the sha512 of every package in that lockfile. No tool installs at any other
# version, and a build whose bytes differ from the lock is refused.
#
# To bump a binary tool, set its `version` and each platform's `url`, and take each `sha256` from
# the release asset's `digest` (`gh api repos/<owner>/<repo>/releases/tags/<tag>`), checked
# against the publisher's checksum file. Where the release has no digest, the publisher's file
# alone gives it: popeye's `checksums.sha256`, get.helm.sh's `<archive>.sha256sum` and
# dl.k8s.io's `kubectl.sha256`. Trivy's version is also the `version` of every
# `aquasecurity/trivy-action` step in `.github/workflows/`.
# cloudflared's release notes give each macOS checksum for the binary inside the `.tgz`, not
# the archive: check the archive's digest by unpacking it and hashing `cloudflared`.
# gh-dash publishes `checksums.txt`, but it comes from the same release as the asset `digest`, so
# the two do not check each other. It signs nothing. Never install it with `gh extension install`,
# `go install` or `brew`: each one skips this pin. A bump of gh-dash also replaces
# `tests/fixtures/gh_dash_schema/` with the schema of the new version, which
# `tests/test_gh_dash_config.py` checks against this `version`.
# tuicr publishes no checksum file, and its release workflow has no signing or attestation step, so
# the asset `digest` is the only source of each tuicr `sha256`. Never install it with `curl | sh`,
# `cargo install` or `brew`, and never run `tuicr update`: each one skips this pin. Take the Linux
# build from the `musl` archive, which is static. A bump of tuicr also needs a run of
# `tests/test_tuicr_config.py`.
# tflint publishes `.zip` archives only, each of one file, `tflint`, so its builds have the `zip`
# format and the member `tflint`. Each `sha256` is the asset `digest`, which equals the line of the
# release file `checksums.txt`. The release also has a cosign keyless signature of that file
# (`checksums.txt.keyless.sig` and `checksums.txt.pem`), which `devops install-tools` does not check.
#
# To bump a Python tool, set its `version` here and in `<name>.in`, then, in this directory, run
#   uv pip compile --universal --generate-hashes --python-version 3.14 <name>.in -o <name>.txt
# Bandit's version is the project's dev dependency in pyproject.toml.
#
# To bump a Node tool, set its `version` here and its one dependency in `<name>/package.json`, and
# in `<name>/` run `npm install --package-lock-only --ignore-scripts` with HOME set to an empty
# scratch directory, so that a registry in your `~/.npmrc` cannot rewrite the lockfile's URLs.
# Then, in a scratch copy of `<name>/`, run `npm ci --ignore-scripts` and `npm audit signatures`,
# which reads installed packages, and in `<name>/` run
#   osv-scanner scan source --lockfile package-lock.json
# OpenSpec's bump also rewrites the skills it generates, each of which embeds the version: install
# the new pin, run `uv run devops openspec regenerate` and commit the skills, run
# `uv run devops openspec check`, and record the tool again for the tests that replay it
# (`tests/support/openspec_recording.py` says how).
#
# Then run `uv run pytest tests/test_tools_lock.py tests/test_install_tools.py
# tests/test_workflow_contracts.py`, and `devops install-tools --target-dir <dir>` followed by
# `devops install-tools --check --target-dir <dir>` to install and confirm every pin.

python_version = "3.14"

