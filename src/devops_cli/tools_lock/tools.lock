version = "1.179.0"
description = "Semgrep static analysis"
source = "https://github.com/semgrep/semgrep"
requirements = "semgrep.txt"
# `semgrep` runs the `pysemgrep` it finds on PATH, so both link to this environment.
entry_points = ["semgrep", "pysemgrep"]

[python.bandit]
version = "1.9.4"
description = "PyCQA Bandit Python security linter"
source = "https://github.com/PyCQA/bandit"
requirements = "bandit.txt"
entry_points = ["bandit"]

[python.ansible-core]
version = "2.22.0"
description = "Ansible and ansible-runner, the engine of devops infra"
source = "https://github.com/ansible/ansible"
# One environment for ansible-core (GPL-3.0-or-later) and ansible-runner (Apache-2.0): devops runs
# them only as child processes, so no GPL code loads into the devops process. ansible-runner's pin
# is in `ansible-core.in`. devops starts the other Ansible commands from this environment's `bin`,
# so only `ansible-runner` goes on PATH: the `ansible-playbook` that a person has there, such as the
# community `ansible` package with its bundled collections, stays.
requirements = "ansible-core.txt"
entry_points = ["ansible-runner"]

