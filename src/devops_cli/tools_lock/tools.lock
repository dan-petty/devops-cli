# tools.lock: every tool `devops install-tools` installs, at an exact version (#1142).
#
# A binary tool's build for this platform is checked against its sha256 before it is unpacked. A
# Python tool installs into a virtual environment of its own from its hashed requirements file,
# with `uv pip sync --require-hashes`. No tool installs at any other version, and a build whose
# bytes differ from the lock is refused.
#
# To bump a binary tool, set its `version` and each platform's `url`, and take each `sha256` from
# the release asset's `digest` (`gh api repos/<owner>/<repo>/releases/tags/<tag>`), checked
# against the publisher's checksum file. Where the release has no digest, the publisher's file
# alone gives it: popeye's `checksums.sha256`, get.helm.sh's `<archive>.sha256sum` and
# dl.k8s.io's `kubectl.sha256`.
#
# To bump a Python tool, set its `version` here and in `<name>.in`, then, in this directory, run
#   uv pip compile --universal --generate-hashes --python-version 3.14 <name>.in -o <name>.txt
# Bandit's version is the project's dev dependency in pyproject.toml.
#
# Then run `uv run pytest tests/test_tools_lock.py tests/test_install_tools.py`, and
# `devops install-tools --target-dir <dir>` followed by `devops install-tools --check --target-dir
# <dir>` to install and confirm every pin.

python_version = "3.14"

