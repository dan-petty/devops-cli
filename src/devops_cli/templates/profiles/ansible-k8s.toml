# The type template `ansible-k8s`: an Ansible repository whose hosts are nodes of a Kubernetes
# cluster, such as dan-petty/homelab (#5121). devops-cli versions it. Detection in the repository
# and the repository's own `.devops/project.toml` win over it, in that order.

[ansible]
playbook_dir = "playbooks"
offline_group = "offline"

[tools]
# The repository installs its tools into its checkout, at the versions that it pins, with
# `make install` (dan-petty/homelab#62). `devops devcontainer post-start` runs it.
install = ["make", "install"]
