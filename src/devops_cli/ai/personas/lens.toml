# Ordered first-match persona lens selection rules (#4830).
# Order of precedence: flag -> fixed step role -> finding producer/CWE -> path -> type/scope labels.

[[rules]]
id = "flag.explicit"
matcher = "flag"
pattern = "*"
lens = "explicit"

[[rules]]
id = "step.refute"
matcher = "step_role"
pattern = "refute"
lens = "challenger"

[[rules]]
id = "finding.gitleaks"
matcher = "finding"
pattern = "gitleaks"
lens = "devsecops"

[[rules]]
id = "finding.trivy"
matcher = "finding"
pattern = "trivy"
lens = "devsecops"

[[rules]]
id = "finding.kube-linter"
matcher = "finding"
pattern = "kube-linter"
lens = "devsecops"

[[rules]]
id = "finding.bandit_cwe"
matcher = "finding"
pattern = "bandit"
requires_cwe = true
lens = "devsecops"

[[rules]]
id = "finding.semgrep_cwe"
matcher = "finding"
pattern = "semgrep"
requires_cwe = true
lens = "devsecops"

[[rules]]
id = "finding.mypy"
matcher = "finding"
pattern = "mypy"
lens = "architect"

[[rules]]
id = "finding.c901"
matcher = "finding"
pattern = "c901"
lens = "architect"

[[rules]]
id = "finding.pytest"
matcher = "finding"
pattern = "pytest"
lens = "qa"

[[rules]]
id = "finding.coverage"
matcher = "finding"
pattern = "coverage"
lens = "qa"

[[rules]]
id = "path.k8s"
matcher = "path"
pattern = "k8s/**"
lens = "devsecops"

[[rules]]
id = "path.tf"
matcher = "path"
pattern = "tf/**"
lens = "devsecops"

[[rules]]
id = "path.workflows"
matcher = "path"
pattern = ".github/workflows/**"
