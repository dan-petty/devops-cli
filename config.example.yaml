# devops-cli project configuration template
#
# Copy this file to config.yaml to activate project-level overrides.
#   cp config.example.yaml config.yaml
#
# Load order (last wins):
#   1. ~/.config/devops-cli/config.yaml  — user-global settings
#   2. config.yaml                       — this file, project-specific overrides
#   3. Environment variables             — DEVOPS_CLI_* vars override both files
#
# Secrets (tokens, API keys) are NEVER stored here.
# Set them via the keyring: devops config set <key> <value>

# ── GitHub ────────────────────────────────────────────────────────────────────
github:
  # Default GitHub organisation used by `devops repos clone-org` when no org is given.
  default_org: null

# ── SSH key management ────────────────────────────────────────────────────────
ssh:
  # Directory where managed Ed25519 keys are stored (id_ed25519-YYYYMMMDD pattern).
  key_dir: ~/.ssh
  # Days after which a key is considered stale and rotation is suggested.
  rotation_days: 90

# ── Repository management ─────────────────────────────────────────────────────
repos:
  # Root directory for all cloned repositories (relative to project root).
  base_dir: repos

# ── VS Code workspace ─────────────────────────────────────────────────────────
workspace:
  # Path to the .code-workspace file managed by `devops workspace`.
  file: .code-workspace

# ── Grafana ───────────────────────────────────────────────────────────────────
grafana:
  # Grafana instance base URL.
  # Example: https://example.com:3000
  url: null
  # Token: devops config set grafana.token <value>

# ── Prometheus ────────────────────────────────────────────────────────────────
prometheus:
  # Prometheus base URL.
  # Example: https://example.com:9090
  # Note: set DEVOPS_CLI_AI_ALLOW_PRIVATE_NETWORK=true for cluster-internal URLs.
  url: null

# ── ArgoCD ────────────────────────────────────────────────────────────────────
argocd:
  # ArgoCD server base URL.
  # Example: https://example.com:8080
  # Note: set DEVOPS_CLI_AI_ALLOW_PRIVATE_NETWORK=true for cluster-internal URLs.
  url: null
  # Token: devops config set argocd.token <value>

# ── Qdrant Vector Store ───────────────────────────────────────────────────────
qdrant:
  # Qdrant server base URL for Retrieval-Augmented Generation (RAG).
  # Example: http://localhost:6333 or https://example.com:6333
  url: http://localhost:6333
  collection_prefix: devops
  # Seconds each Qdrant request waits per attempt before it is retried, up to 3 attempts.
  # RAG searches and indexing's upserts and deletes share the client, so they share this.
  # 300 to 600 s suits a homelab Qdrant. Env: DEVOPS_CLI_QDRANT_TIMEOUT.
  timeout: 300

# ── Jaeger Tracing ────────────────────────────────────────────────────────────
jaeger:
  # Jaeger Query UI base URL for viewing OpenTelemetry traces.
  # Example: http://localhost:16686 or https://example.com:16686
  url: http://localhost:16686

# ── Telemetry ─────────────────────────────────────────────────────────────────
telemetry:
  # OpenTelemetry OTLP collector endpoint for devops-cli traces & metrics.
  enabled: true
  endpoint: http://localhost:4318

# ── AI / LLM ─────────────────────────────────────────────────────────────────
ai:
  # Provider to use for AI-powered commands (devops ai, devops ai review).
  # Options: ollama | claude | copilot | openai
  provider: ollama

  # Model name for the selected provider.
  # Ollama examples:  qwen3.8:27b, qwen2.5-coder:14b, deepseek-r1:14b
  # Claude examples:  claude-opus-4-5, claude-sonnet-4-5
  # Copilot/OpenAI:   gpt-4o, gpt-4o-mini
  model: qwen3.8:27b
  # reasoning_effort: low  # Reasoning effort level: low | medium | high

  # Reference model used for counterfactual cloud spend calculations and hardware payoff.
  # Defaults to gpt-4o-mini.
  reference_model: gpt-4o-mini

  # Total hardware investment cost in USD (e.g. GPU workstation or cluster node purchases).
  # Used by `devops ai cost` to calculate payback progress and amortization against local LLM usage.
  hardware_cost_usd: 0.0

  # Ollama server URLs (list or comma-separated string).
  # AI request loops automatically failover across configured servers if one is unreachable.
  # Use DEVOPS_CLI_AI_ALLOW_PRIVATE_NETWORK=true for remote/private IP hosts.
  ollama_urls:
    - http://localhost:11434

  # Custom base URL for claude/openai-compatible providers (leave null for defaults).
  api_base_url: null

  # Allow connections to private/RFC-1918 addresses for AI, ArgoCD, Grafana and Prometheus,
  # and to loopback addresses for ArgoCD, Grafana and Prometheus.
  # Required when Ollama or cluster services run on a private network (e.g. 192.168.x.x).
  # Configured AI, gateway, Ollama and Qdrant URLs on loopback (localhost, 127.0.0.1, ::1),
  # as in this file, need no opt-in. Cloud metadata addresses are always refused.
  # Equivalent to setting DEVOPS_CLI_AI_ALLOW_PRIVATE_NETWORK=true in the environment.
  allow_private_network: false

  # Seconds each LLM request waits for its reply; tasks.<task>.timeout sets one task's.
  # Unset, a request waits 3600 s and a review's analysis, verification and compose
  # requests 1200 s.
  # timeout: 1200

  # RAG (Retrieval-Augmented Generation) settings
  # Reviews, chat and analysis look up context with the embedding model (tasks.embedding).
  # If that model cannot embed a lookup, for example because no backend serves it, RAG is off
  # for the rest of the run after one warning; indexing and `devops ai rag query` fail with the
  # error. Serve the model, point tasks.embedding at a backend that serves it, or set
  # enabled: false.
  rag:
    enabled: true
    top_k: 5
    score_threshold: 0.35

  # Per-task model & server overrides (chat, metadata, analysis, compose, embedding)
  # All embedding configuration (model, server URLs, timeout) is configured under tasks.embedding
  # tasks:
  #   embedding:
  #     model: qwen3-embedding:0.6b
  #     ollama_urls:
  #       - http://localhost:11434

  # API key: devops config set ai.api_key <value>

# ── Kubernetes ────────────────────────────────────────────────────────────────
k8s:
  # Target Kubernetes cluster context (e.g. minikube, kind-cluster, remote cluster).
  # When set to minikube, minikube autostarts on container startup or context switch if stopped.
  context: minikube
  # Base or root domain name for homelab ingress routes and tunnel services (e.g. example.com).
  domain: null

# ── Cloudflare Zero Trust & Tunnel ───────────────────────────────────────────
cloudflare:
  # Zone or root domain managed in Cloudflare (e.g. example.com).
  domain: null
  # Tunnel name or identifier (e.g. homelab).
  tunnel: null
  # Cloudflare Account ID.
  account_id: null
  # Cloudflare Zone ID.
  zone_id: null
  # Homelab public IP address or CIDR permitted to bypass Cloudflare Access (e.g. 198.51.100.1/32).
  public_ip_bypass: null
  # Cloudflare Zero Trust Access configuration.
  access:
    enabled: false
    idp: google
    allowed_emails: []
    # Public IP addresses or CIDR blocks permitted to bypass Cloudflare Access.
    bypass_ips: []
    # Homelab public IP address or CIDR permitted to bypass Cloudflare Access.
    public_ip_bypass: null


# ── Sandbox ───────────────────────────────────────────────────────────────────
sandbox:
  # Exclude user home directory entirely from sandbox access (/home/**/* and ~/**/*).
  exclude_home_dir: true
