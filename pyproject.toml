[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "devops-cli"
version = "0.2.1"
description = "DevOps CLI for managing repos, SSH keys, Kubernetes, and more"
requires-python = ">=3.14"
dependencies = [
    "click==8.4.2",
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "PyGithub>=2",
    "gitpython>=3",
    "cryptography>=43",
    "httpx2==2.9.0",
    "keyring>=25",
    "PyYAML>=6",
    "jinja2>=3",
    "kubernetes>=30",
    "docker>=7",
    "fastmcp>=0.4.0",
    "qdrant-client>=1.11.0",
    "pydantic-settings>=2.4.0",
    "json-repair>=0.63.3",
    "tldextract>=5.3.2",
    "pathspec>=0.12.1",
    "packaging>=24.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "tiktoken>=0.8.0",
    "pydantic-ai>=2.0.0",
]

[project.scripts]
devops = "devops_cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3",
    "ruff>=0.9",
    "mypy>=1.11",
    "types-PyYAML>=6",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.6.0",
    "bandit>=1.9.4",
    "actionlint-py>=1.7.12",
    "pre-commit>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/devops_cli"]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["repos"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N818"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-n auto --maxprocesses=4"


[tool.coverage.run]
data_file = ".data/.coverage"
parallel = true

[tool.coverage.report]
fail_under = 78
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.uv]
preview-features = ["malware-check"]
