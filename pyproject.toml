[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "devops-cli"
version = "0.2.23"

description = "DevOps CLI for managing repos, SSH keys, Kubernetes, and more"
requires-python = ">=3.14"
dependencies = [
    "click==8.5.0",
    "typer==0.27.2",
    "rich==15.0.0",
    "pydantic==2.13.5",
    "PyGithub==2.10.0",
    "gitpython==3.1.62",
    "cryptography==50.0.1",
    "httpx2==2.13.0",
    "keyring==25.7.0",
    "PyYAML==6.0.3",
    "jinja2==3.1.6",
    "kubernetes==36.0.3",
    "docker==7.2.0",
    "fastmcp==3.4.7",
    "qdrant-client==1.19.1",
    "pydantic-settings==2.15.0",
    "json-repair==0.63.4",
    "tldextract==5.3.2",
    "pathspec==1.1.1",
    "python-hcl2==8.1.4",
    "packaging==26.3",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "tiktoken==0.14.0",
    "pydantic-ai==2.35.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
    "pydantic-handlebars==0.2.1",
    "textual==8.2.8",
    "ratelimit==2.2.1",
    "aiolimiter==1.3.0",
]

[project.scripts]
devops = "devops_cli.entry:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.15.1",
    "ruff==0.16.8",
    "mypy==2.3.1",
    "types-PyYAML==6.0.12.20260906",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "bandit==1.9.4",
    "actionlint-py==1.7.12.24",
    "pre-commit==4.6.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/devops_cli"]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["repos"]

[tool.ruff.lint]
# RUF022/RUF068 guard the declared public surface: F822 would catch a name in
# `__all__` that is defined nowhere, but a module-level `__getattr__` — which the
# lazily re-exporting packages all define — suppresses it for the entire module.
# Selected individually rather than as the whole RUF family, which is a separate
# roadmap item with its own triage.
select = ["E", "F", "I", "N", "W", "UP", "RUF022", "RUF068"]
ignore = ["E501", "N818"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ['pydantic.mypy']

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-n logical"


[tool.coverage.run]
data_file = ".data/.coverage"
parallel = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.coverage.xml]
output = ".data/coverage.xml"

[tool.coverage.html]
directory = ".data/htmlcov"

[tool.coverage.json]
output = ".data/coverage.json"

[tool.uv]
preview-features = ["malware-check", "check-command"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src"]
exclude = ["tests"]

[tool.ty.rules]
unresolved-import = "ignore"
invalid-generic-class = "ignore"
invalid-method-override = "ignore"
invalid-argument-type = "ignore"
invalid-return-type = "ignore"
unresolved-attribute = "ignore"
invalid-assignment = "ignore"
invalid-key = "ignore"
invalid-await = "ignore"
deprecated = "ignore"
call-non-callable = "ignore"
invalid-parameter-default = "ignore"
