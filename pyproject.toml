[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "devops-cli"
version = "0.38.0"

description = "DevOps CLI for managing repos, SSH keys, Kubernetes, and more"
requires-python = ">=3.14"
dependencies = [
    "click==8.5.0",
    "typer==0.27.2",
    "rich==15.0.0",
    "pydantic==2.13.5",
    "cryptography==50.0.2",
    "httpx2==2.13.1",
    "httpcore2==2.13.1",
    "anyio==4.15.1",
    "keyring==25.7.0",
    "PyYAML==6.0.3",
    "jinja2==3.1.6",
    "kubernetes==36.0.3",
    "docker==7.2.0",
    "fastmcp==4.1.2",
    "qdrant-client==1.19.1",
    "pydantic-settings==2.15.0",
    "json-repair==0.63.4",
    "jsonschema==4.26.0",
    "tldextract==5.3.2",
    "pathspec==1.1.1",
    "python-hcl2==8.1.4",
    "packaging==26.3",
    "platformdirs==4.11.8",
    "fastapi==0.142.2",
    "uvicorn==0.53.0",
    "tiktoken==0.14.0",
    "pydantic-ai[spec]==2.59.0",
    "pydantic-ai-harness[coder]==0.59.0",
    "logfire==5.2.0",
    "pynacl==1.6.2",
    "openai==3.26.1",
    "anthropic==1.12.1",
    "opentelemetry-api==1.45.1",
    "opentelemetry-semantic-conventions==0.66b1",
    "secretstorage==3.5.0; sys_platform == 'linux'",
    "jeepney==0.9.0",
    "dnspython[idna]==2.9.0",
    "genai-prices==0.1.13",
    "opentelemetry-sdk==1.45.1",
    "textual==8.2.8",
    "tenacity==9.1.4",
    "tree-sitter==0.26.0",
    "tree-sitter-python==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-go==0.25.0",
    "tree-sitter-rust==0.24.2",
    "tree-sitter-java==0.23.5",
    "tree-sitter-hcl==1.2.0",
    "tree-sitter-c-sharp==0.23.5",
    "tree-sitter-c==0.24.2",
    "tree-sitter-cpp==0.23.4",
    "tree-sitter-bash==0.25.1",
    "tree-sitter-markdown==0.5.1",
    "tree-sitter-dockerfile==0.2.0",
    "tree-sitter-yaml==0.7.2",
    "markdown-it-py==4.2.0",
    "graphql-core==3.3.1",
    "statsmodels==0.15.0",
    "prometheus-client==0.26.0",
    "gidgethub==6.0.0",
    "cachetools==7.1.8",
    "valkey==6.2.0",
    "pybreaker==1.4.1",
    "ruamel-yaml==0.19.1",
    "filelock==4.2.4",
    "psutil==7.2.2",
    "unidiff==1.0.1",
