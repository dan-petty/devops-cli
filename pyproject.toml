[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "devops-cli"
version = "0.2.26"

description = "DevOps CLI for managing repos, SSH keys, Kubernetes, and more"
requires-python = ">=3.14"
dependencies = [
    "click==8.5.0",
    "typer==0.27.2",
    "rich==15.0.0",
    "pydantic==2.13.5",
    "PyGithub==2.10.0",
    "gitpython==3.1.62",
    "cryptography==50.0.2",
    "httpx2==2.13.0",
    "keyring==25.7.0",
    "PyYAML==6.0.3",
    "jinja2==3.1.6",
    "kubernetes==36.0.3",
    "docker==7.2.0",
    "fastmcp==3.4.7",
    "qdrant-client==1.19.1",
    "pydantic-settings==2.15.0",
    "json-repair==0.63.4",
    "jsonschema==4.26.0",
    "tldextract==5.3.2",
    "pathspec==1.1.1",
    "python-hcl2==8.1.4",
    "packaging==26.3",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "tiktoken==0.14.0",
    "pydantic-ai==2.35.0",
    "genai-prices==0.1.9",
    "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
    "pydantic-handlebars==0.2.1",
    "textual==8.2.8",
    "tenacity==9.1.4",
    "ratelimit==2.2.1",
    "aiolimiter==1.3.0",
    "tree-sitter==0.26.0",
    "tree-sitter-python==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-go==0.25.0",
    "tree-sitter-rust==0.24.2",
    "tree-sitter-java==0.23.5",
    "tree-sitter-hcl==1.2.0",
    "tree-sitter-c-sharp==0.23.5",
    "tree-sitter-c==0.24.2",
    "tree-sitter-cpp==0.23.4",
    "tree-sitter-bash==0.25.1",
    "tree-sitter-markdown==0.5.1",
    "markdown-it-py==4.2.0",
    "mdit-py-plugins==0.6.1",
    "graphql-core==3.3.0",
]

[project.scripts]
devops = "devops_cli.entry:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.15.1",
    "ruff==0.16.8",
    "mypy==2.3.1",
    "types-PyYAML==6.0.12.20260906",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "bandit==1.9.4",
    "actionlint-py==1.7.12.25",
    "pre-commit==4.6.2",
    "hypothesis==6.168.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/devops_cli"]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["repos"]

[tool.ruff.lint]
# BLE family left out: #423 owns BLE001 and requires triage before enforcement.
# SIM family left out: readability preference; SIM115 (unclosed file) kept.
# PT018 left out: #851 decides composite assertion rewrites together with the tuple-assert mandate.
# C901 is the complexity cap of 10 (standard McCabe, #586).
select = [
    "E", "F", "I", "N", "W", "UP", "B", "RUF", "ASYNC",
    "C901", "PGH004", "PGH003", "RUF100", "SIM115", "PT011", "PT015", "PT017",
]
ignore = [
    "E501",      # ruff format owns line length
    "N818",      # AI exception names mirror pydantic-ai exception API
    "B009",      # getattr with constant preferred over dynamic access that fails mypy strict
    "B010",      # setattr with constant preferred over dynamic access that fails mypy strict
    "RUF005",    # array concatenation is a readability preference over unpacked list literals
    "ASYNC109",  # subprocess timeouts cancel and reap child rather than abandoning it
]
allowed-confusables = ["–", "×", "ℹ"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ['pydantic.mypy']
enable_error_code = ["ignore-without-code"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-n logical"
markers = [
    "bwrap: live sandbox tests requiring bubblewrap; skipped where bwrap is not installed",
]


[tool.coverage.run]
data_file = ".data/.coverage"
parallel = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.coverage.xml]
output = ".data/coverage.xml"

[tool.coverage.html]
directory = ".data/htmlcov"

[tool.coverage.json]
output = ".data/coverage.json"

[tool.uv]
preview-features = ["malware-check", "check-command"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src"]
exclude = ["tests"]

[tool.ty.rules]
unresolved-import = "ignore"
invalid-generic-class = "ignore"
invalid-method-override = "ignore"
invalid-argument-type = "ignore"
invalid-return-type = "ignore"
unresolved-attribute = "ignore"
invalid-assignment = "ignore"
invalid-key = "ignore"
invalid-await = "ignore"
deprecated = "ignore"
call-non-callable = "ignore"
invalid-parameter-default = "ignore"
