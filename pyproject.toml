[project.scripts]
devops = "devops_cli.entry:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.16.0",
    "ruff==0.16.8",
    "mypy==2.3.1",
    "ty==0.0.92",
    "types-PyYAML==6.0.12.20260906",
    "pytest-cov==7.1.0",
    "diff-cover==10.6.0",
    "pytest-xdist==3.8.0",
    "pytest-randomly==5.0.0",
    "pytest-timeout==2.4.0",
    "bandit==1.9.4",
    "zizmor==1.30.1",
    "pre-commit==4.6.2",
    "hypothesis==6.168.3",
    "h11==0.16.0",
    "deptry==0.25.1",
    "mutmut==3.8.0",
    "syrupy==6.1.1",
    "ast-grep-cli==0.51.0",
    "time-machine==3.5.1",
