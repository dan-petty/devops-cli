[tool.hatch.build.targets.wheel]
packages = ["src/devops_cli"]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["repos"]

[tool.ruff.lint]
# BLE family left out: #423 owns BLE001 and requires triage before enforcement.
# SIM family left out: readability preference; SIM115 (unclosed file) kept.
# C901 is the complexity cap of 10 (standard McCabe, #586).
# PLR1702 caps a function at 4 nested blocks (#1876). It is a preview rule in Ruff 0.16, so lint
# preview is on. `explicit-preview-rules` runs no preview rule that `select` does not name; the
# preview behavior of the stable rules (for example F822 on a lazy `__all__`) is on too. The
# formatter keeps its stable style: preview is set for lint only.
preview = true
explicit-preview-rules = true
select = [
    "E", "F", "I", "N", "W", "UP", "B", "RUF", "ASYNC",
    "C901", "PLR1702", "PGH004", "PGH003", "RUF100", "SIM115", "PT011", "PT015", "PT017", "PT018",
    "TID251",
    "PLE2502", "PLE2510", "PLE2512", "PLE2513", "PLE2514", "PLE2515",
]
ignore = [
    "E501",      # ruff format owns line length
    "N818",      # AI exception names mirror pydantic-ai exception API
    "B009",      # getattr with constant preferred over dynamic access that fails mypy strict
    "B010",      # setattr with constant preferred over dynamic access that fails mypy strict
    "RUF005",    # array concatenation is a readability preference over unpacked list literals
    "ASYNC109",  # subprocess timeouts cancel and reap child rather than abandoning it
]
allowed-confusables = ["–", "×", "ℹ"]

[tool.ruff.lint.mccabe]
max-complexity = 10

# Four nested blocks pass and five fail, as the removed nesting hook counted `if`, `for`, `while`,
# `with` and `except` (#1876). PLR1702 also counts a `try` body, and it does not count `match`.
[tool.ruff.lint.pylint]
max-nested-blocks = 4

[tool.ruff.lint.flake8-pytest-style]
raises-require-match-for = [
    "BaseException",
    "Exception",
    "ValueError",
    "KeyError",
    "AttributeError",
    "RuntimeError",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"socket.inet_aton".msg = "Parse and format addresses with ipaddress.ip_address."
"socket.inet_ntoa".msg = "Parse and format addresses with ipaddress.ip_address."
"socket.inet_pton".msg = "Parse and format addresses with ipaddress.ip_address."
"socket.inet_ntop".msg = "Parse and format addresses with ipaddress.ip_address."

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ['pydantic.mypy']
enable_error_code = ["ignore-without-code"]

# statsmodels ships no type information; `devops review score` calls its fleiss_kappa and
# aggregate_raters (#1138).
[[tool.mypy.overrides]]
module = "statsmodels.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
# Pytest workers: logical cores (ext4 benchmark: 8 workers ~4.2s vs 4 workers ~6.8s)
# `--dist worksteal` (#1725): `load` hands each worker blocks of consecutive tests that it alone
# then runs, so a block of slow tests handed out late keeps one worker busy after the rest are
# done; under `worksteal` a worker that runs dry takes half of another's unstarted tests. Over a
# full run's per-test times, xdist's two schedulers replayed end at 103.7 s (load) and 97.1 s
# (worksteal) on 16 workers, and at 358 s and 316 s on the CI runner's 4.
# pytest-randomly is installed for `devops ci test --repeat` and blocked here (-p no:randomly),
# so every other run keeps file order.
# `--hypothesis-profile=ci` (#2092) loads Hypothesis's built-in `ci` profile, which GitHub Actions
# loads by itself, in every run: no deadline and no `too_slow` health check, since a loaded host
# stretches an example's time; derandomized; no example database.
addopts = "-n logical --dist worksteal -p no:logfire -p no:pytest_logfire -p no:randomly --hypothesis-profile=ci"
# pytest-timeout fails a test that hangs, in its own process, so a stuck child process holds no
# run (#1669). A hang bound, not a speed target: the slowest test in 185 cached gate runs took 139 s
# at a load average of 30-50, and the slowest full run, 931 s, plus one hang stays under the run's
# 1800 s timeout. A test that needs longer says so with `@pytest.mark.timeout(<seconds>)`.
timeout = 600
timeout_method = "signal"
# `tmp_path` makes a numbered directory, and pytest finds the next number by listing every entry
# of the worker's base directory, so with the default policy `all` each test was slower than the
# one before it: 0.16 ms for the first directory and 1.6 ms for the 3,500th, 3 ms on average
# with the run's other work, 89 s of CPU in a run (#2699). Policy `failed` deletes the directory
# of a test that passed and keeps the directory of a test that failed, for its debugging.
tmp_path_retention_policy = "failed"
markers = [
    "bwrap: live sandbox tests requiring bubblewrap; skipped where bwrap is not installed",
    "live: live tests requiring the named local tool binaries; skipped where a binary is not installed",
    "unreachable: tests that exercise a refused endpoint before its fake lands",
]
# Logfire's token check warns from a background thread, so the warning fails a test only
# through pytest's unhandled-thread warning; both are errors so no test starts it (#965).
# A `tests.support` module imported before the root conftest marks it for assertion rewriting
# cannot be rewritten, and pytest only warns; as an error it fails the run (#1312).
filterwarnings = [
    "error:Logfire API is unreachable:UserWarning",
    "error::pytest.PytestUnhandledThreadExceptionWarning",
    "error::pytest.PytestAssertRewriteWarning",
]


[tool.coverage.run]
data_file = ".data/.coverage"
parallel = true

[tool.coverage.report]
# The floor of the whole tree (#2356). The changed lines of a pull request must be 90% covered:
# the `Changed-Line Coverage` step of ci.yml runs diff-cover with `--fail-under 90`.
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.coverage.xml]
output = ".data/coverage.xml"

[tool.coverage.html]
directory = ".data/htmlcov"

[tool.coverage.json]
output = ".data/coverage.json"

# `devops ci mutate` (#853). mutmut copies src, tests, pyproject.toml and uv.lock into mutants/
# itself; `also_copy` adds the other top-level entries the tests read. `.claude` holds local
# worktrees and `.vscode` local settings, and mutmut 3.8.0 cannot copy a nested file path.
[tool.mutmut]
source_paths = ["src/devops_cli"]
# Appended after addopts, so `-n 0` overrides `-n logical`: mutmut runs the tests in its process.
pytest_add_cli_args = ["-n", "0"]
# The suite runs from mutants/, whose src holds mutmut's generated code, which holds no git
# checkout and no .venv. A test is left out only when it reads src as data (it sees the generated
# code, or scans the 475 MB tree), relies on git tracking the checkout, or relies on its .venv:
# whole modules of source-tree invariants, and single tests elsewhere.
pytest_add_cli_args_test_selection = [
    # src as data
    "--ignore=tests/test_architectural_invariants.py",
    "--ignore=tests/test_public_export_surface.py",
    "--ignore=tests/test_docs.py",
    "--ignore=tests/test_docs_source_argv_collector.py",
    "--ignore=tests/test_ai_task_loader.py",
    "--deselect=tests/test_output.py::test_rich_imports_confined_to_output_submodule",
    # The caller it records is mutmut's trampoline, generated code between the test and the span.
    "--deselect=tests/test_telemetry.py::test_span_caller_location_and_runtime_attributes",
    # git tracking of the checkout
    "--deselect=tests/test_k8s_devops_runtime.py::test_kustomization_lists_every_manifest_and_pins_no_image_and_stays_out_of_the_root",
    "--deselect=tests/test_run_store.py::test_a_record_names_its_setup_and_subject_by_content",
    "--deselect=tests/test_url_credential_masking.py::test_no_forbidden_constructs_remain",
    # Without the checkout's git origin it fetches the pull request's head from GitHub.
    "--deselect=tests/test_review_scope.py::test_the_pr_command_reviews_against_the_pr_head",
    # the checkout's .venv
    "--deselect=tests/test_host_sandbox.py::test_every_allowlisted_criteria_binary_resolves_inside_the_sandbox_mounts",
]
also_copy = [
    ".devcontainer", ".devops", ".dockerignore", ".editorconfig", ".gh-dash.yml", ".gitattributes",
    ".github", ".gitignore", ".mcp.json", "kilo.jsonc", ".pre-commit-config.yaml", ".python-version",
    ".tuicrignore",
    ".trivyignore", "AGENTS.md", "ARCHITECTURE.md", "CHANGELOG.md", "CLAUDE.md", "CONTEXT.md",
    "CONTRIBUTING.md", "Dockerfile", "LICENSE", "README.md", "RELEASE_CYCLE.md", "SECURITY.md",
    "config.example.yaml", "docs", "k8s", "release-please-config.json", "tf",
    "GEMINI.md",
]

[tool.uv]
preview-features = ["malware-check", "check-command"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src"]
exclude = ["tests"]

[tool.ty.rules]
unresolved-import = "ignore"
invalid-generic-class = "ignore"
invalid-method-override = "ignore"
invalid-argument-type = "ignore"
invalid-return-type = "ignore"
unresolved-attribute = "ignore"
invalid-assignment = "ignore"
invalid-key = "ignore"
invalid-await = "ignore"
deprecated = "ignore"
call-non-callable = "ignore"
invalid-parameter-default = "ignore"

[tool.deptry.per_rule_ignores]
# Tree-sitter grammars are loaded by name in ai/ast/engine.py.
DEP002 = [
    "tree-sitter",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-c-sharp",
    "tree-sitter-cpp",
    "tree-sitter-go",
    "tree-sitter-hcl",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-typescript",
    "tree-sitter-dockerfile",
    "tree-sitter-yaml",
    "openai",
]
DEP003 = [
    "pydantic_evals",
]
