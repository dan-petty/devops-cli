# The image findings that no released version of the pinned tool fixes yet (SECURITY.md, A Finding
# with No Fix). Each entry names one finding in one binary: `paths` is the Trivy target of the
# binary and `purls` is the package that Trivy reports, so the entry hides no other binary.
