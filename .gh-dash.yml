# yaml-language-server: $schema=tests/fixtures/gh_dash_schema/schema.json
# Person-run dashboard for the pull request queue and issue triage. Start it at the root of the
# clone or worktree with `gh-dash --config .gh-dash.yml`. The flag stops GH_DASH_CONFIG from
# winning over this file. Each section is a GitHub search filter. gh-dash adds `is:pr` or
# `is:issue` and `archived:false`, and, started inside a clone, `repo:<owner>/<name>`.
# gh-dash ignores a key it does not know: tests/test_gh_dash_config.py checks every key.
prSections:
  # GitHub uses the first `sort:` in a query, so `sort:created-asc` here wins over the
  # ` sort:updated` that gh-dash appends. Every PR section lists the oldest pull request first.
  - title: Queue
    filters: is:open sort:created-asc
    limit: 50
  - title: Failing CI
    filters: is:open status:failure sort:created-asc
  - title: Needs review
    filters: is:open draft:false review:required sort:created-asc
  - title: Drafts
    filters: is:open draft:true sort:created-asc
issuesSections:
  # The first filter is the filter of the "Triage & Quality Table" view of the project board.
  - title: Triage and quality
    filters: is:open label:status/triage,status/blocked,type/bug
  - title: P0 and P1
    filters: is:open label:priority/p0-critical,priority/p1-high
  - title: No milestone
    filters: is:open no:milestone sort:created-asc
# The `s` key cycles PRs, Issues, Notifications, PRs. A person who presses it twice from PRs opens
# Notifications. This one section and the limit of 5 keep that view small: each notification
# costs one lookup and one comment-author request.
notificationsSections:
  - title: Review requested
    filters: reason:review-requested
includeReadNotifications: false
defaults:
  view: prs
  prsLimit: 20
  issuesLimit: 20
  notificationsLimit: 5
  # gh-dash refetches the current view at this interval, in minutes: 15 is 4 refreshes an hour.
  # `0` turns the timer off, and `R` refreshes on demand.
  refetchIntervalMinutes: 15
  preview:
    open: true
    width: 0.45
  # gh-dash draws each of these cells as a Nerd Font glyph, so the config hides them. The tabs
  # Failing CI, Needs review and Drafts carry the same facts as filters. Set `hidden: false` to
  # show a cell in a terminal with a Nerd Font.
  layout:
    prs:
      authorIcon:
        hidden: true
      state:
        hidden: true
      reviewStatus:
        hidden: true
      ci:
        hidden: true
    issues:
      creatorIcon:
        hidden: true
      state:
        hidden: true
showAuthorIcons: false
smartFilteringAtLaunch: true
keybindings:
  prs:
    # gh-dash puts a template value into the shell string without quotes. Only {{.RepoName}} and
    # {{.PrNumber}} appear here, because a branch name, an author or a title can hold shell
    # syntax. gh-dash returns to its screen when a command ends, so `w` waits for Enter and the
    # other keys page their output with `less -R`.
    - key: w
      name: monitor
      command: devops pr monitor {{.PrNumber}} --repo {{.RepoName}}; printf 'Press Enter to return. '; read -r _unused
    - key: T
      name: checks
      command: devops pr checks {{.PrNumber}} --repo {{.RepoName}} | less -R
    - key: D
      name: threads
      command: devops pr threads list {{.PrNumber}} --repo {{.RepoName}} --unresolved-only | less -R
    - key: d
      name: diff
      command: devops pr diff {{.PrNumber}} --repo {{.RepoName}} --color always | less -R
