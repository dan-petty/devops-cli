name: Rule Pack Tests

# Runs `semgrep --test` with the Semgrep of the devtools image and checks `rules.lock` when a pull
# request changes a file of the review rule pack or this workflow, kept outside `devops ci` and the
# pre-push hook (#1145). The native `paths` filter stops the run before a runner starts, so a pull
# request that changes no rule file starts no job and shows no check (#4653). The check is not
# required.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "src/devops_cli/review/rules/**"
      - ".github/workflows/rule-pack.yml"

permissions: {}

# A newer push to the pull request cancels the run of the older head.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No tool the job runs reports usage.
  DO_NOT_TRACK: "1"
  # uv runs only its own CPython builds, never the runner image's Python (#1494).
  UV_MANAGED_PYTHON: "1"

jobs:
  # The job runs in the devtools image, which holds Semgrep (#6416). The Semgrep of the image is a
  # venv that runs only with the Python of the image, so the job cannot take it to the runner host
  # with .github/actions/devtools-commands. Renovate moves the tag and the digest of the image in the
  # devtools group, with those of the Dockerfiles, so the pull request of a new image changes this
  # file and runs the job.
  rule-pack:
    name: Rule Pack Tests
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/dan-petty/devtools:1.1.11@sha256:c8f647d806a6c0a510eaeb6d54832910ff850a7c9646f86004830432c73a874e
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: rule-pack
          save-uv-cache: "false"

      - name: Run Semgrep Rule Pack Tests
        env:
          SEMGREP_ENABLE_VERSION_CHECK: "0"
        run: |
          semgrep --test --metrics off src/devops_cli/review/rules
          uv run devops review rules test --check
