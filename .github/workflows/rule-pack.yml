name: Rule Pack Tests

# Runs `semgrep --test` with the pinned Semgrep and checks `rules.lock` when a pull request changes
# a file of the review rule pack, kept outside `devops ci` and the pre-push hook (#1145). The
# native `paths` filter stops the run before a runner starts, so a pull request that changes no
# rule file starts no job and shows no check (#4653). The check is not required.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "src/devops_cli/review/rules/**"
      - ".github/workflows/rule-pack.yml"

permissions: {}

# A newer push to the pull request cancels the run of the older head.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No tool the job runs reports usage.
  DO_NOT_TRACK: "1"
  # uv runs only its own CPython builds, never the runner image's Python (#1494).
  UV_MANAGED_PYTHON: "1"

jobs:
  rule-pack:
    name: Rule Pack Tests
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: rule-pack
          save-uv-cache: "false"

      - name: Run Semgrep Rule Pack Tests
        env:
          SEMGREP_ENABLE_VERSION_CHECK: "0"
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run devops install-tools --tool semgrep --only-missing
          semgrep --test --metrics off src/devops_cli/review/rules
          uv run devops review rules test --check
