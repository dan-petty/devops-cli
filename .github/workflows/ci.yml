name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    # Deliberately excludes ready_for_review so converting draft PRs to ready does not
    # re-trigger redundant test suites, coverage reports, and container builds.
    # Project automation and card state transitions are handled natively via GitHub Projects v2 built-in workflows.
    types: [opened, synchronize, reopened]
    branches: [main]
  schedule:
    # Advisory dependency freshness sweep at 05:00 UTC, kept off the pull request
    # critical path so it never delays merge feedback.
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No tool the jobs run reports usage: the runner's CI=true already stops OpenSpec's events, and
  # this says so for every other tool that honors it.
  DO_NOT_TRACK: "1"
  # uv runs only its own CPython builds, never the runner image's Python: setup-uv exports
  # UV_PYTHON=3.14, which a runner's own 3.14 would otherwise satisfy (#1494). Never also set
  # UV_PYTHON_PREFERENCE; uv refuses to run with both.
  UV_MANAGED_PYTHON: "1"

jobs:
  # Fast-failing static gates. Split from the test suite so lint, typing, and formatting
  # errors surface in roughly a minute instead of queuing behind the full suite.
  static:
    name: Static Analysis
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: static

      # The Node that `.node-version` names runs the pinned OpenSpec, which the openspec row needs.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install OpenSpec
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv run devops install-tools --tool openspec --only-missing

      # The pinned Trivy runs `trivy-config`, the IaC scan of the Security Scan step, which took the
      # place of Checkov (#2214).
      - name: Install Trivy
        run: uv run devops install-tools --tool trivy --only-missing

      # The pinned actionlint validates the workflows. It is the same digest-pinned image that the
      # devcontainer Dockerfile copies, so the gate does not run actionlint twice (#1119).
      - name: Run actionlint
        uses: docker://docker.io/kjanat/actionlint:1.17.0@sha256:d484cccadf56b6a356466ade9af4c8e05c5dce1badaf0a9ecd0d7639d68d9c92

      - name: Static Analysis Quality Gate
        run: uv run devops ci --check --no-cache --skip test,outdated,actionlint

      # The scan skips Trivy's filesystem scan, `trivy`, which took 194 s over this tree. The audit
      # row of the quality gate checks the dependencies.
      - name: Security Scan
        if: always()
        run: uv run devops scan report --sarif .data/scan.sarif --skip bandit,trivy

      - name: Upload Security Scan SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: .data/scan.sarif
          category: "/devops-scan"

  # A pull request that only adds a plan under openspec/changes/<issue>-<slug>/ changes no line the
  # suite tests, so it runs tests/invariants, which read the change folders, and nothing more of
  # the suite (#2860). The filter `outside_plan` is true when any changed file is not a file of an
  # active change folder: the archive, the specs, the OpenSpec config, the workflows and every
  # other path count as outside. A renamed file lists its old path as deleted, so a move out of
  # src/ counts, too. Only the exact text `false` selects the reduced run. A push, a manual run
  # or a skipped filter step leaves no output, so those run the full gate. The REST list of the
  # files of a pull request holds 3000 files at most and gives no sign of a cut, so the filter
  # runs only for a pull request with fewer files. The job and its name stay as they are, so the
  # required check reports success.
  test:
    name: Tests & Coverage
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read # paths-filter reads the changed files from the REST API

    steps:
      - name: Detect Plan-Only Changes
        id: changes
        if: github.event_name == 'pull_request' && github.event.pull_request.changed_files < 3000
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            outside_plan:
              - '**'
              - '!openspec/changes/[0-9]*-*/**/*'

      # Full history so the changed-line coverage step can find the merge base.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: test
          save-uv-cache: "false"
          tooling-cache-paths: |
            .pytest_cache

      # The pinned promtool runs the rule checks and rule unit tests of
      # tests/test_k8s_monitoring_alerting.py, which skip where promtool is not installed (#2472).
      - name: Install promtool
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv run devops install-tools --tool promtool --only-missing

      - name: Tests & Coverage Quality Gate
        if: steps.changes.outputs.outside_plan != 'false'
        run: uv run devops ci --check --no-cache --only test

      # No coverage option: the coverage of tests/invariants alone is under the floor of the whole
      # tree, and a plan holds no Python line. `devops ci test` expands the directory to its test
      # modules and exits non-zero when it gives none, so a green step means that tests ran.
      - name: Plan-Only Invariant Tests
        if: steps.changes.outputs.outside_plan == 'false'
        run: uv run devops ci test tests/invariants

      # Changed-line coverage against the pull request's own base branch (#850). The job fails
      # when under 90% of the changed lines are covered (#2356); the global floor is
      # `fail_under` in pyproject.toml. The gate writes no XML report, so the step writes
      # .data/coverage.xml from the combined data that the gate keeps (#1743).
      # diff-cover truncates its output file, so it writes first and the pragma list
      # is appended after it. The step keeps diff-cover's status, so the list is in the summary
      # when the figure fails, and exits with that status last.
      - name: Changed-Line Coverage
        if: github.event_name == 'pull_request' && steps.changes.outputs.outside_plan != 'false'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          uv run coverage xml -q
          status=0
          uv run diff-cover .data/coverage.xml --compare-branch="origin/${BASE_REF}" --fail-under 90 --format "markdown:${GITHUB_STEP_SUMMARY}" || status=$?
          {
            echo "### Added pragma: no cover lines"
            echo "~~~diff"
            git diff --unified=0 -G 'pragma: no cover' "origin/${BASE_REF}...HEAD" -- src | grep -e '^+++ ' -e '^+.*pragma: no cover' || echo 'None.'
            echo "~~~"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # AGENTS.md rule 5: a check that averages more than 5 minutes is a P0 bug. The run of one pull
  # request is one sample, so this job reads the last ten completed pushes to main from the
  # Actions API and fails when the mean of the `Tests & Coverage` job is over 300 s (#2699). It
  # runs on every push to main and on the daily schedule, beside the test job, and no pull request
  # waits for it: the history it reads is main's, which a pull request cannot change. It sees the
  # runs before this one. It reads the conclusion of the test job, not of the run, so a run that
  # this job turned red still gives its test time to the next window. It needs `actions: read`
  # only.
  job-time:
    name: Test Job Duration
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: job-time
          save-uv-cache: "false"

      - name: Check the duration of Tests & Coverage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run devops ci job-time --repo "$GITHUB_REPOSITORY"

  # Builds the devcontainer image of every pull request and of every workflow_dispatch run, with
  # the actions release.yml uses (#1895). It
  # pushes the image by digest to a registry on the runner, starts it as its remote user, and
  # publishes nothing. On a pull request it runs only when the change alters image content; a
  # dispatch always builds.
  devcontainer:
    name: DevContainer Image
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    services:
      registry:
        image: registry:3@sha256:01cd312e67026f06f5d89c3e133a4a9adc7cb9eeb9b1194e0b2954dfd770efd2
        ports:
          - 5000:5000

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # IMAGE_CONTENT_PATHS lists every input of the image this check builds: the
      # .devcontainer build definition (Dockerfile, devcontainer.json and its lockfile),
      # the build context consumed by the Dockerfile's COPY directives (pyproject.toml,
      # uv.lock, README.md and the devops-cli source tree, which holds the CLI's pin in
      # tools.lock), the actions that build and start it, and this workflow.
      # tests/test_architectural_invariants.py asserts this list stays in sync with the
      # Dockerfile, so a new COPY cannot silently skip the image check.
      - name: Detect Image Content Changes
        id: image_changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          IMAGE_CONTENT_PATHS: |
            .devcontainer
            src
            pyproject.toml
            uv.lock
            README.md
            .dockerignore
            .github/actions/devcontainer-image
            .github/actions/devcontainer-smoke
            .github/workflows/ci.yml
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Workflow dispatch triggered; rebuilding."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The checkout above already fetched full history; this only ensures the base
          # branch ref exists locally, since a PR checkout resolves the merge ref instead.
          git fetch --no-tags origin "$BASE_REF"
          readarray -t WATCHED < <(printf '%s\n' "$IMAGE_CONTENT_PATHS" | sed '/^[[:space:]]*$/d')
          CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- "${WATCHED[@]}")
          if [ -n "$CHANGED" ]; then
            echo "Image content changed; rebuilding:"
            echo "$CHANGED"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No image content changed; skipping rebuild."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up uv toolchain
        if: steps.image_changes.outputs.changed == 'true'
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: devcontainer
          save-uv-cache: "false"

      # Read access only: the build reads the cache the release writes.
      - name: Log in to GitHub Container Registry (GHCR)
        if: steps.image_changes.outputs.changed == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata for DevContainer Image
        if: steps.image_changes.outputs.changed == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: localhost:5000/devcontainer
          labels: |
            org.opencontainers.image.title=devops-cli-devcontainer
            org.opencontainers.image.description=DevOps CLI workstation development container environment
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/dan-petty/devops-cli/blob/main/README.md
            org.opencontainers.image.source=https://github.com/dan-petty/devops-cli
            org.opencontainers.image.version=ci-${{ github.run_id }}

      - name: Build and Push DevContainer Image by Digest
        if: steps.image_changes.outputs.changed == 'true'
        id: image
        uses: ./.github/actions/devcontainer-image
        with:
          image: localhost:5000/devcontainer
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/devcontainer:buildcache

      - name: Start the DevContainer Image as Its Remote User
        if: steps.image_changes.outputs.changed == 'true'
        uses: ./.github/actions/devcontainer-smoke
        with:
          image-ref: localhost:5000/devcontainer@${{ steps.image.outputs.digest }}

  # Builds, smoke-tests and scans the Service image of every pull request, without pushing it;
  # release.yml publishes it when a release is created (#1486).
  service-image:
    name: Service Image
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect Image Content Changes
        id: image_changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          IMAGE_CONTENT_PATHS: |
            Dockerfile
            .dockerignore
            .trivyignore
            src
            pyproject.toml
            uv.lock
            README.md
            .github/workflows/ci.yml
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Workflow dispatch triggered; rebuilding."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF"
          readarray -t WATCHED < <(printf '%s\n' "$IMAGE_CONTENT_PATHS" | sed '/^[[:space:]]*$/d')
          CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- "${WATCHED[@]}")
          if [ -n "$CHANGED" ]; then
            echo "Image content changed; rebuilding:"
            echo "$CHANGED"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No image content changed; skipping rebuild."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.image_changes.outputs.changed == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v3

      - name: Build and Load Service Image
        if: steps.image_changes.outputs.changed == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: devops-cli-service:local
          # The final stage runs `apt-get upgrade`: never reuse it, or a cached layer keeps
          # packages a security update has since fixed.
          no-cache-filters: service
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Service Image Smoke Test
        if: steps.image_changes.outputs.changed == 'true'
        env:
          IMAGE: devops-cli-service:local
        run: |
          docker run -d --name svc --read-only --tmpfs /tmp --tmpfs /home/devops:uid=1000,gid=1000 --cap-drop ALL --security-opt no-new-privileges -p 8000:8000 "$IMAGE"
          curl -fsS --retry 10 --retry-connrefused --retry-all-errors --retry-delay 1 http://127.0.0.1:8000/healthz
          docker stop svc && docker rm svc
          docker run --rm --entrypoint id "$IMAGE" -u
          docker run --rm --entrypoint gh "$IMAGE" --version
          docker run --rm --entrypoint git "$IMAGE" --version
          docker run --rm --entrypoint openspec "$IMAGE" --version
          docker run --rm --read-only --tmpfs /tmp --tmpfs /home/devops:uid=1000,gid=1000 --cap-drop ALL --security-opt no-new-privileges --entrypoint python "$IMAGE" -c "import getpass, pathlib, subprocess; from devops_cli.config.settings import load_settings; from devops_cli.core.process import run_subprocess; from devops_cli.output.file_writer import write_text_file; write_text_file(load_settings().data.dir / 'probe.txt', 'ok'); repo = pathlib.Path.home() / 'probe'; subprocess.run(['git', 'init', '-q', str(repo)], check=True); assert run_subprocess(['git', 'status', '--porcelain'], cwd=repo).returncode == 0; assert getpass.getuser() == 'devops'"
          if docker run --rm --entrypoint sh "$IMAGE" -c 'command -v uv'; then exit 1; fi
          if docker run --rm --entrypoint sh "$IMAGE" -c 'command -v gcc'; then exit 1; fi
          if docker run --rm --entrypoint python "$IMAGE" -c 'import pytest'; then exit 1; fi

      - name: Scan Service Image for Vulnerabilities
        if: steps.image_changes.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devops-cli-service:local
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.75.0

  # Builds, smoke-tests and scans the runner image of every pull request, without pushing it;
  # release.yml publishes it when a release is created (#2667). It runs next to the Service image
  # job and shares its `builder` stage through the cache, so it adds no time to that job.
  runner-image:
    name: Runner Image
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect Image Content Changes
        id: image_changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          IMAGE_CONTENT_PATHS: |
            Dockerfile
            .dockerignore
            .trivyignore
            src
            pyproject.toml
            uv.lock
            README.md
            .github/workflows/ci.yml
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Workflow dispatch triggered; rebuilding."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF"
          readarray -t WATCHED < <(printf '%s\n' "$IMAGE_CONTENT_PATHS" | sed '/^[[:space:]]*$/d')
          CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- "${WATCHED[@]}")
          if [ -n "$CHANGED" ]; then
            echo "Image content changed; rebuilding:"
            echo "$CHANGED"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No image content changed; skipping rebuild."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.image_changes.outputs.changed == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v3

      - name: Build and Load Runner Image
        if: steps.image_changes.outputs.changed == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          load: true
          push: false
          tags: devops-cli-runner:local
          # The stage runs `apt-get upgrade`: never reuse it, or a cached layer keeps packages a
          # security update has since fixed.
          no-cache-filters: runner
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Runner Image Smoke Test
        if: steps.image_changes.outputs.changed == 'true'
        env:
          IMAGE: devops-cli-runner:local
        run: |
          docker run --rm --entrypoint id "$IMAGE" -u
          docker run --rm "$IMAGE" --version
          # The build ran the check of every tool in RUNNER_TOOLS (src/devops_cli/roadmap/runner_tools.py), so a missing tool failed it. Here the check runs again on the loaded image, and the size of the image stays under its bound.
          docker run --rm -e DEVOPS_CLI_USER_DATA_ROOT=/opt/devops-tools --entrypoint python "$IMAGE" -m devops_cli.roadmap.runner_tools
          size=$(docker image inspect "$IMAGE" --format '{{.Size}}')
          if [ "$size" -gt 3000000000 ]; then echo "The runner image is $size bytes, over the bound of 3000000000."; exit 1; fi
          docker run --rm --read-only --tmpfs /tmp --tmpfs /home/devops:uid=1000,gid=1000 --cap-drop ALL --security-opt no-new-privileges --entrypoint python "$IMAGE" -c "import getpass, pathlib, subprocess; from devops_cli.config.settings import load_settings; from devops_cli.core.process import run_subprocess; from devops_cli.output.file_writer import write_text_file; write_text_file(load_settings().data.dir / 'probe.txt', 'ok'); repo = pathlib.Path.home() / 'probe'; subprocess.run(['git', 'init', '-q', str(repo)], check=True); assert run_subprocess(['git', 'status', '--porcelain'], cwd=repo).returncode == 0; assert getpass.getuser() == 'devops'"
          if docker run --rm --entrypoint sh "$IMAGE" -c 'command -v gcc'; then exit 1; fi
          # The job and its steps run `uv run` in a worktree: the checkout's .python-version names a patch release that the base image can lack.
          docker run --rm --read-only --tmpfs /home/devops:uid=1000,gid=1000,exec,size=3g -v "$PWD:/checkout:ro" --cap-drop ALL --security-opt no-new-privileges --entrypoint sh "$IMAGE" -c 'mkdir /home/devops/project && tar -C /checkout --exclude=./.git --exclude=./.venv -cf - . | tar -C /home/devops/project -xf - && cd /home/devops/project && uv run --locked ruff --version'

      - name: Scan Runner Image for Vulnerabilities
        if: steps.image_changes.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devops-cli-runner:local
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.75.0


  # Advisory only: reports newer upstream releases without gating any merge. Scheduled so
  # the PyPI round-trip never sits on the pull request critical path.
  dependency-freshness:
    name: Dependency Freshness
    if: github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: freshness

      - name: Report Outdated Dependencies
        run: uv run devops ci outdated

  # Advisory: reruns the pull request's added or modified test files three times, one run after
  # another, each in a shuffled order, to catch tests that depend on the order they run in.
  # Shuffling the whole suite waits for thread-leak isolation.
  changed-tests:
    name: Changed-Test Independence
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect Changed Test Files
        id: changed_tests
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git diff --name-only --diff-filter=AMR "origin/${BASE_REF}...HEAD" -- ':(glob)tests/**/test_*.py' > "$RUNNER_TEMP/changed-tests.txt"
          if [ -s "$RUNNER_TEMP/changed-tests.txt" ]; then
            cat "$RUNNER_TEMP/changed-tests.txt"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No test file changed; skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up uv toolchain
        if: steps.changed_tests.outputs.changed == 'true'
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: changed-tests
          save-uv-cache: "false"
          tooling-cache-paths: |
            .pytest_cache

      - name: Run Changed Tests in Shuffled Order
        if: steps.changed_tests.outputs.changed == 'true'
        run: |
          readarray -t CHANGED_TESTS < "$RUNNER_TEMP/changed-tests.txt"
          uv run devops ci test --repeat 3 -- "${CHANGED_TESTS[@]}"

  # Runs `semgrep --test` with the pinned Semgrep when any file under src/devops_cli/review/rules/**
  # changes, kept outside `devops ci` and the pre-push hook (#1145).
  rule-pack:
    name: Rule Pack Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect Changed Rule Pack Files
        id: changed_rules
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- ':(glob)src/devops_cli/review/rules/**')
          if [ -n "$CHANGED" ]; then
            echo "$CHANGED"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No rule pack file changed; skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up uv toolchain
        if: steps.changed_rules.outputs.changed == 'true'
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: rule-pack
          save-uv-cache: "false"

      - name: Run Semgrep Rule Pack Tests
        if: steps.changed_rules.outputs.changed == 'true'
        env:
          SEMGREP_ENABLE_VERSION_CHECK: "0"
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run devops install-tools --tool semgrep --only-missing
          semgrep --test --metrics off src/devops_cli/review/rules
          uv run devops review rules test --check

  # Builds docs/ with the GitHub Pages builder when a pull request changes the site or this
  # workflow, because Pages publishes main:/docs at each merge (#1651). A Liquid or Jekyll error
  # then fails the pull request before it breaks the site. The action names its image by a tag,
  # so the step runs the image of actions/jekyll-build-pages v1.0.13 by digest. The container has
  # no network, so the GitHub metadata plugin makes no API call and needs no token. It mounts
  # docs/ read-only and keeps the built site inside the container. A pull request that changes
  # neither path skips the build, and the job reports success.
  docs-site:
    name: Docs Site Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # paths-filter reads the changed files from the REST API

    steps:
      - name: Detect Docs Site Changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            docs:
              - 'docs/**'
              - '.github/workflows/ci.yml'

      - name: Check out repository
        if: steps.changes.outputs.docs == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The variables are the ones that entrypoint.sh of the image reads. PAGES_BUILDER is the
      # digest of ghcr.io/actions/jekyll-build-pages:v1.0.13 on 2026-10-23. The resolver is
      # loopback: the GitHub metadata plugin catches the failed lookup and builds without
      # metadata, but the runner's resolver is unreachable with no network and raises
      # Errno::ENETUNREACH, which the plugin does not catch.
      - name: Build the Site with the GitHub Pages Builder
        if: steps.changes.outputs.docs == 'true'
        env:
          PAGES_BUILDER: ghcr.io/actions/jekyll-build-pages@sha256:6791ebfd912185ed59bfb5fb102664fa872496b79f87ff8b9cfba292a7345041
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_site"
          docker run --rm --network none --dns 127.0.0.1 \
            --volume "$GITHUB_WORKSPACE/docs:/github/workspace/docs:ro" \
            --volume "$GITHUB_WORKSPACE/_site:/github/site" \
            --env GITHUB_WORKSPACE=/github/workspace \
            --env GITHUB_REPOSITORY \
            --env GITHUB_API_URL \
            --env INPUT_SOURCE=docs \
            --env INPUT_DESTINATION=../site \
            --env INPUT_BUILD_REVISION="$GITHUB_SHA" \
            --env INPUT_VERBOSE=true \
            --env INPUT_FUTURE=false \
            --env DO_NOT_TRACK=1 \
            "$PAGES_BUILDER"

      # Verifies that the built documentation site has an index page, contains no raw source
      # Markdown files, and has no broken internal links (#2070). LYCHEE is the digest of
      # lycheeverse/lychee:v0.24.2.
      - name: Verify Built Site Pages and Links
        if: steps.changes.outputs.docs == 'true'
        env:
          LYCHEE: lycheeverse/lychee@sha256:eaff3e0a13603c9a701accfcc84f44158bb77bf36ecfa4622b626056c3463892
        run: |
          test -f "$GITHUB_WORKSPACE/_site/index.html" || {
            echo "::error::Built site is missing index.html at root"
            exit 1
          }
          if [ -n "$(find "$GITHUB_WORKSPACE/_site" -name '*.md')" ]; then
            echo "::error::Built site contains source markdown (.md) files"
            find "$GITHUB_WORKSPACE/_site" -name '*.md'
            exit 1
          fi
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE/_site:/site/devops-cli:ro" \
            "$LYCHEE" \
            --offline \
            --root-dir /site \
            --exclude '^file:///[^s]' \
            --exclude '^file:///s[^i]' \
            --exclude '^file:///si[^t]' \
            --exclude '^file:///sit[^e]' \
            --exclude '^file:///site[^/]' \
            --exclude '\.(md|yaml|py)(#.*)?$' \
            --exclude '/src/' \
            --exclude '/lang/en' \
            "/site/devops-cli/**/*.html"

  # Resolves each image that an Argo CD Application pins when a pull request changes the
  # manifests, the command or this workflow, so a wrong tag fails the pull request and not the
  # sync (#1994). `devops k8s image-pins` renders each Application as Argo CD does: a path source
  # with the runner's kubectl, as the Argo CD gate of the test row does, and a chart source with
  # the pinned helm and the repository's value files. It resolves each image once with
  # `docker buildx imagetools inspect`, an anonymous manifest read that Docker Hub counts as a
  # pull. A pull request that changes none of the paths skips the check, and the job reports
  # success.
  image-pins:
    name: Image Pins
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # paths-filter reads the changed files from the REST API

    steps:
      - name: Detect Image Pin Changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            pins:
              - 'k8s/**'
              - 'src/devops_cli/**/image_pins.py'
              - '.github/workflows/ci.yml'

      - name: Check out repository
        if: steps.changes.outputs.pins == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv toolchain
        if: steps.changes.outputs.pins == 'true'
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: image-pins
          save-uv-cache: "false"

      - name: Install Helm
        if: steps.changes.outputs.pins == 'true'
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv run devops install-tools --tool helm --only-missing

      - name: Resolve the Image Pins
        if: steps.changes.outputs.pins == 'true'
        run: uv run devops k8s image-pins
