name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    # Deliberately excludes ready_for_review so converting draft PRs to ready does not
    # re-trigger redundant test suites, coverage reports, and container builds.
    # Project automation and card state transitions are handled natively via GitHub Projects v2 built-in workflows.
    types: [opened, synchronize, reopened]
    branches: [main]
  schedule:
    # Advisory dependency freshness sweep at 05:00 UTC, kept off the pull request
    # critical path so it never delays merge feedback.
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No tool the jobs run reports usage: the runner's CI=true already stops OpenSpec's events, and
  # this says so for every other tool that honors it.
  DO_NOT_TRACK: "1"
  # uv runs only its own CPython builds, never the runner image's Python: setup-uv exports
  # UV_PYTHON=3.14, which a runner's own 3.14 would otherwise satisfy (#1494). Never also set
  # UV_PYTHON_PREFERENCE; uv refuses to run with both.
  UV_MANAGED_PYTHON: "1"

jobs:
  # Fast-failing static gates. Split from the test suite so lint, typing, and formatting
  # errors surface in roughly a minute instead of queuing behind the full suite.
  static:
    name: Static Analysis
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04 # moves to ubuntu-26.04 in #1501
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: static

      # The Node that `.node-version` names runs the pinned OpenSpec, which the openspec row needs.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install OpenSpec
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv run devops install-tools --tool openspec --only-missing

      - name: Static Analysis Quality Gate
        run: uv run devops ci --check --no-cache --skip test,outdated

      - name: Security Scan
        if: always()
        run: uv run devops scan report --sarif .data/scan.sarif

      - name: Upload Security Scan SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: .data/scan.sarif
          category: "/devops-scan"

  test:
    name: Tests & Coverage
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04 # moves to ubuntu-26.04 in #1501
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      # Full history so the changed-line coverage step can find the merge base.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: test
          save-uv-cache: "false"
          tooling-cache-paths: |
            .pytest_cache

      - name: Tests & Coverage Quality Gate
        run: uv run devops ci --check --no-cache --only test

      # Advisory changed-line coverage against the pull request's own base branch (#850).
      # No --fail-under: it reports in the job summary and never fails on the figure.
      # diff-cover truncates its output file, so it writes first and the pragma list
      # is appended after it.
      - name: Changed-Line Coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          uv run diff-cover .data/coverage.xml --compare-branch="origin/${BASE_REF}" --format "markdown:${GITHUB_STEP_SUMMARY}"
          {
            echo "### Added pragma: no cover lines"
            echo "~~~diff"
            git diff --unified=0 -G 'pragma: no cover' "origin/${BASE_REF}...HEAD" -- src | grep -e '^+++ ' -e '^+.*pragma: no cover' || echo 'None.'
            echo "~~~"
          } >> "$GITHUB_STEP_SUMMARY"

  # Builds the devcontainer image of every pull request and of every workflow_dispatch run, with
  # the actions release.yml uses (#1895). It
  # pushes the image by digest to a registry on the runner, starts it as its remote user, and
  # publishes nothing. On a pull request it runs only when the change alters image content; a
  # dispatch always builds.
  devcontainer:
    name: DevContainer Image
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04 # moves to ubuntu-26.04 in #1501
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    services:
      registry:
        image: registry:3@sha256:01cd312e67026f06f5d89c3e133a4a9adc7cb9eeb9b1194e0b2954dfd770efd2
        ports:
          - 5000:5000

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # IMAGE_CONTENT_PATHS lists every input of the image this check builds: the
      # .devcontainer build definition (Dockerfile, devcontainer.json and its lockfile),
      # the build context consumed by the Dockerfile's COPY directives (pyproject.toml,
      # uv.lock, README.md and the devops-cli source tree, which holds the CLI's pin in
      # tools.lock), the actions that build and start it, and this workflow.
      # tests/test_architectural_invariants.py asserts this list stays in sync with the
      # Dockerfile, so a new COPY cannot silently skip the image check.
      - name: Detect Image Content Changes
        id: image_changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          IMAGE_CONTENT_PATHS: |
            .devcontainer
            src
            pyproject.toml
            uv.lock
            README.md
            .dockerignore
            .github/actions/devcontainer-image
            .github/actions/devcontainer-smoke
            .github/workflows/ci.yml
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Workflow dispatch triggered; rebuilding."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The checkout above already fetched full history; this only ensures the base
          # branch ref exists locally, since a PR checkout resolves the merge ref instead.
          git fetch --no-tags origin "$BASE_REF"
          readarray -t WATCHED < <(printf '%s\n' "$IMAGE_CONTENT_PATHS" | sed '/^[[:space:]]*$/d')
          CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- "${WATCHED[@]}")
          if [ -n "$CHANGED" ]; then
            echo "Image content changed; rebuilding:"
            echo "$CHANGED"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No image content changed; skipping rebuild."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up uv toolchain
        if: steps.image_changes.outputs.changed == 'true'
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: devcontainer
          save-uv-cache: "false"

      # Read access only: the build reads the cache the release writes.
      - name: Log in to GitHub Container Registry (GHCR)
        if: steps.image_changes.outputs.changed == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata for DevContainer Image
        if: steps.image_changes.outputs.changed == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: localhost:5000/devcontainer
          labels: |
            org.opencontainers.image.title=devops-cli-devcontainer
            org.opencontainers.image.description=DevOps CLI workstation development container environment
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/dan-petty/devops-cli/blob/main/README.md
            org.opencontainers.image.source=https://github.com/dan-petty/devops-cli
            org.opencontainers.image.version=ci-${{ github.run_id }}

      - name: Build and Push DevContainer Image by Digest
        if: steps.image_changes.outputs.changed == 'true'
        id: image
        uses: ./.github/actions/devcontainer-image
        with:
          image: localhost:5000/devcontainer
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/devcontainer:buildcache

      - name: Start the DevContainer Image as Its Remote User
        if: steps.image_changes.outputs.changed == 'true'
        uses: ./.github/actions/devcontainer-smoke
        with:
          image-ref: localhost:5000/devcontainer@${{ steps.image.outputs.digest }}

  # Builds, smoke-tests and scans the Service image of every pull request, without pushing it;
  # release.yml publishes it when a release is created (#1486).
  service-image:
    name: Service Image
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04 # moves to ubuntu-26.04 in #1501
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect Image Content Changes
        id: image_changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          IMAGE_CONTENT_PATHS: |
            Dockerfile
            .dockerignore
            .trivyignore
            src
            pyproject.toml
            uv.lock
            README.md
            .github/workflows/ci.yml
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Workflow dispatch triggered; rebuilding."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF"
          readarray -t WATCHED < <(printf '%s\n' "$IMAGE_CONTENT_PATHS" | sed '/^[[:space:]]*$/d')
          CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- "${WATCHED[@]}")
          if [ -n "$CHANGED" ]; then
            echo "Image content changed; rebuilding:"
            echo "$CHANGED"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No image content changed; skipping rebuild."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.image_changes.outputs.changed == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v3

      - name: Build and Load Service Image
        if: steps.image_changes.outputs.changed == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: devops-cli-service:local
          # The final stage runs `apt-get upgrade`: never reuse it, or a cached layer keeps
          # packages a security update has since fixed.
          no-cache-filters: service
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Service Image Smoke Test
        if: steps.image_changes.outputs.changed == 'true'
        env:
          IMAGE: devops-cli-service:local
        run: |
          docker run -d --name svc --read-only --tmpfs /tmp --tmpfs /home/devops:uid=1000,gid=1000 --cap-drop ALL --security-opt no-new-privileges -p 8000:8000 "$IMAGE"
          curl -fsS --retry 10 --retry-connrefused --retry-all-errors --retry-delay 1 http://127.0.0.1:8000/healthz
          docker stop svc && docker rm svc
          docker run --rm --entrypoint id "$IMAGE" -u
          docker run --rm --entrypoint gh "$IMAGE" --version
          docker run --rm --entrypoint git "$IMAGE" --version
          docker run --rm --read-only --tmpfs /tmp --tmpfs /home/devops:uid=1000,gid=1000 --cap-drop ALL --security-opt no-new-privileges --entrypoint python "$IMAGE" -c "import getpass, pathlib, subprocess; from devops_cli.config.settings import load_settings; from devops_cli.core.process import run_subprocess; from devops_cli.output.file_writer import write_text_file; write_text_file(load_settings().data.dir / 'probe.txt', 'ok'); repo = pathlib.Path.home() / 'probe'; subprocess.run(['git', 'init', '-q', str(repo)], check=True); assert run_subprocess(['git', 'status', '--porcelain'], cwd=repo).returncode == 0; assert getpass.getuser() == 'devops'"
          if docker run --rm --entrypoint sh "$IMAGE" -c 'command -v uv'; then exit 1; fi
          if docker run --rm --entrypoint sh "$IMAGE" -c 'command -v gcc'; then exit 1; fi
          if docker run --rm --entrypoint python "$IMAGE" -c 'import pytest'; then exit 1; fi

      - name: Scan Service Image for Vulnerabilities
        if: steps.image_changes.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devops-cli-service:local
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.75.0


  # Advisory only: reports newer upstream releases without gating any merge. Scheduled so
  # the PyPI round-trip never sits on the pull request critical path.
  dependency-freshness:
    name: Dependency Freshness
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04 # moves to ubuntu-26.04 in #1501
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: freshness

      - name: Report Outdated Dependencies
        run: uv run devops ci outdated

  # Advisory: reruns the pull request's added or modified test files three times, one run after
  # another, each in a shuffled order, to catch tests that depend on the order they run in.
  # Shuffling the whole suite waits for thread-leak isolation.
  changed-tests:
    name: Changed-Test Independence
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04 # moves to ubuntu-26.04 in #1501
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect Changed Test Files
        id: changed_tests
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git diff --name-only --diff-filter=AMR "origin/${BASE_REF}...HEAD" -- ':(glob)tests/**/test_*.py' > "$RUNNER_TEMP/changed-tests.txt"
          if [ -s "$RUNNER_TEMP/changed-tests.txt" ]; then
            cat "$RUNNER_TEMP/changed-tests.txt"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No test file changed; skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up uv toolchain
        if: steps.changed_tests.outputs.changed == 'true'
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: changed-tests
          save-uv-cache: "false"
          tooling-cache-paths: |
            .pytest_cache

      - name: Run Changed Tests in Shuffled Order
        if: steps.changed_tests.outputs.changed == 'true'
        run: |
          readarray -t CHANGED_TESTS < "$RUNNER_TEMP/changed-tests.txt"
          uv run devops ci test --repeat 3 -- "${CHANGED_TESTS[@]}"

  # Runs `semgrep --test` with the pinned Semgrep when any file under src/devops_cli/review/rules/**
  # changes, kept outside the local pre-push gate (#1145).
  rule-pack:
    name: Rule Pack Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04 # moves to ubuntu-26.04 in #1501
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect Changed Rule Pack Files
        id: changed_rules
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- ':(glob)src/devops_cli/review/rules/**')
          if [ -n "$CHANGED" ]; then
            echo "$CHANGED"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No rule pack file changed; skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up uv toolchain
        if: steps.changed_rules.outputs.changed == 'true'
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: rule-pack
          save-uv-cache: "false"

      - name: Run Semgrep Rule Pack Tests
        if: steps.changed_rules.outputs.changed == 'true'
        env:
          SEMGREP_ENABLE_VERSION_CHECK: "0"
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run devops install-tools --tool semgrep --only-missing
          semgrep --test --metrics off src/devops_cli/review/rules
          uv run devops review rules test --check
