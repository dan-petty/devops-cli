name: CI Quality Gate

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]
  workflow_dispatch:

jobs:
  quality-gate:
    name: 10-Gate Quality Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30


    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"
          python-version: "3.14"

      - name: Synchronize dependencies
        run: uv sync --all-groups --all-extras

      - name: Initialize Workspace Directories
        run: mkdir -p .data/reviews .data/analysis .data/logs

      - name: Linting (Ruff)
        run: uv run ruff check .

      - name: Formatting Check (Ruff)
        run: uv run ruff format --check .

      - name: Strict Type Checking (Mypy)
        run: uv run mypy --python-version 3.14 --strict src

      - name: Documentation Freshness Check
        run: uv run devops docs check

      - name: Workflow Linting (actionlint)
        run: uv run actionlint

      - name: Unit Tests & Code Coverage
        run: uv run pytest -v --cov=src --cov-report=xml

      - name: Security Scan (Bandit)
        run: uv run bandit -r src/ -ll -ii
