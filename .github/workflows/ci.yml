name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    # Deliberately excludes ready_for_review so converting draft PRs to ready does not
    # re-trigger redundant test suites, coverage reports, and container builds.
    # Project automation and card state transitions are handled natively via GitHub Projects v2 built-in workflows.
    types: [opened, synchronize, reopened]
    branches: [main]
  schedule:
    # The daily run at 05:00 UTC: the advisory dependency freshness sweep and the job-time check,
    # kept off the pull request critical path so they never delay merge feedback.
    - cron: "0 5 * * *"
  workflow_dispatch:

# The event is part of the group: a push to main and the schedule run of main have the same ref, and
# a merge must not cancel the schedule run, which holds the job-time check (#4634). The group of a
# push to main is its commit, so the next merge cancels no push run: each merge gets one test run
# that ends, and the release pull request reads the result of that run (ADR 0014, #4639). A new
# push to a pull request cancels the run of the push before it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  # No tool the jobs run reports usage: the runner's CI=true already stops OpenSpec's events, and
  # this says so for every other tool that honors it.
  DO_NOT_TRACK: "1"
  # uv runs only its own CPython builds, never the runner image's Python: setup-uv exports
  # UV_PYTHON=3.14, which a runner's own 3.14 would otherwise satisfy (#1494). Never also set
  # UV_PYTHON_PREFERENCE; uv refuses to run with both.
  UV_MANAGED_PYTHON: "1"

# Each job limit is about two times the longest run of the job, and 5 minutes at least, so a hung
# job gives its runner back soon. The step that runs the gate or the tests has a shorter limit than
# its job: a hung step then fails with a message that names it, and the job keeps time for the
# steps after it (#4677).
# The release pull request runs only the required checks: each job that no rule of `main` reads
# skips a branch of this repository whose name starts with `release-please--`. That pull request
# changes `pyproject.toml` and `uv.lock`, which are image inputs, and release.yml builds, starts
# and scans each image before it publishes it (#4637).
jobs:
  # Fast-failing static gates. Split from the test suite so lint, typing, and formatting
  # errors surface in roughly a minute instead of queuing behind the full suite.
  static:
    name: Static Analysis
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 6
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: static

      # The Node that `.node-version` names runs the pinned OpenSpec, which the openspec row needs.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install OpenSpec
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv run devops install-tools --tool openspec --only-missing

      # The pinned Trivy runs `trivy-config`, the IaC scan of the Security Scan step, which took the
      # place of Checkov (#2214).
      - name: Install Trivy
        run: uv run devops install-tools --tool trivy --only-missing

      # The pinned actionlint validates the workflows. It is the same digest-pinned image that the
      # devcontainer Dockerfile copies, so the gate does not run actionlint twice (#1119).
      - name: Run actionlint
        uses: docker://docker.io/kjanat/actionlint:1.17.0@sha256:d484cccadf56b6a356466ade9af4c8e05c5dce1badaf0a9ecd0d7639d68d9c92

      - name: Static Analysis Quality Gate
        timeout-minutes: 3
        run: uv run devops ci --check --no-cache --skip test,outdated,actionlint

      # The scan skips Trivy's filesystem scan, `trivy`, which took 194 s over this tree. The audit
      # row of the quality gate checks the dependencies.
      - name: Security Scan
        if: always()
        run: uv run devops scan report --sarif .data/scan.sarif --skip bandit,trivy

      - name: Upload Security Scan SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: .data/scan.sarif
          category: "/devops-scan"

  # The test row runs in four shards on four runners (#3050). On one runner the suite took 355 s
  # to 528 s for the same tests, depending on the speed of the runner that GitHub gave: more than
  # the 300 s of AGENTS.md rule 5, and growing with the suite. Each shard runs a quarter of the
  # tests, keeps its coverage data, and checks no floor, since it measures a part of the tree. It
  # passes the paths of its own test files to pytest, so no worker collects the whole suite (#2371).
  # The job `Tests & Coverage` below joins the data and checks the floor. The matrix lists the
  # shards and `strategy.job-total` gives their number, so a fifth shard is one more entry. The
  # shard jobs are no required check: ADR 0004 binds the ruleset to the aggregate.
  #
  # A pull request that only adds a plan under openspec/changes/<issue>-<slug>/ changes no line the
  # suite tests, so shard 1 runs tests/invariants, which read the change folders, and no shard
  # runs more of the suite (#2860). The filter `outside_plan` is true when any changed file is not
  # a file of an active change folder: the archive, the specs, the OpenSpec config, the workflows
  # and every other path count as outside. A renamed file lists its old path as deleted, so a move
  # out of src/ counts, too. Only the exact text `false` selects the reduced run. A push, a manual
  # run or a skipped filter step leaves no output, so those run the full gate. The REST list of
  # the files of a pull request holds 3000 files at most and gives no sign of a cut, so the filter
  # runs only for a pull request with fewer files.
  # The release pull request of this repository runs no shard: the job `Tests on Main` reads the
  # tests of the commit of main that it is based on (#4639).
  test-shard:
    name: Tests & Coverage (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    if: >-
      github.event_name != 'schedule'
      && !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read # paths-filter reads the changed files from the REST API
    strategy:
      # Every shard runs to its end, so one run shows every failing test.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Detect Plan-Only Changes
        id: changes
        if: github.event_name == 'pull_request' && github.event.pull_request.changed_files < 3000
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            outside_plan:
              - '**'
              - '!openspec/changes/[0-9]*-*/**/*'

      # Full history, as the tests of the suite read the merge base.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # One tooling cache for each shard: four jobs that save one key at the same time race.
      - name: Set up uv toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: test-${{ matrix.shard }}
          save-uv-cache: "false"
          tooling-cache-paths: |
            .pytest_cache

      # The pinned promtool runs the rule checks and rule unit tests of
      # tests/test_k8s_monitoring_alerting.py, which skip where promtool is not installed (#2472).
      - name: Install promtool
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv run devops install-tools --tool promtool --only-missing

      - name: Tests & Coverage Quality Gate
        if: steps.changes.outputs.outside_plan != 'false'
        timeout-minutes: 17
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: uv run devops ci --check --no-cache --only test --shard "$SHARD" --shards "$SHARDS"

      # No coverage option: the coverage of tests/invariants alone is under the floor of the whole
      # tree, and a plan holds no Python line. `devops ci test` expands the directory to its test
      # modules and exits non-zero when it gives none, so a green step means that tests ran.
      - name: Plan-Only Invariant Tests
        if: steps.changes.outputs.outside_plan == 'false' && matrix.shard == 1
        run: uv run devops ci test tests/invariants

      # The combined data file of the shard, which the gate keeps (#1743), and the JUnit XML report
      # with the time of each test of the shard, for the split by measured time (#4673). The
      # coverage path starts with a dot, so the action needs `include-hidden-files`.
      - name: Upload Coverage Data and Test Report
        if: steps.changes.outputs.outside_plan != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: |
            .data/.coverage
            .data/junit.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # The required check. It waits for the shards, fails when one did not succeed (a skipped job
  # would count as a pass for a required check), joins their coverage data and applies the floor
  # `fail_under` of pyproject.toml to the whole. A plan-only pull request skips every step after
  # the filter, so the required check reports success. On the release pull request, no shard runs:
  # the check passes when the job `Tests on Main` passed, and the steps that need the data of the
  # shards are skipped (#4639). It runs unless the run was cancelled.
  test:
    name: Tests & Coverage
    needs: [test-shard, main-tests]
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter reads the changed files from the REST API

    steps:
      - name: Detect Plan-Only Changes
        id: changes
        if: github.event_name == 'pull_request' && github.event.pull_request.changed_files < 3000
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            outside_plan:
              - '**'
              - '!openspec/changes/[0-9]*-*/**/*'

      # The check fails unless the shards passed, or, on the release pull request, the tests of
      # main passed. The steps after this one run only when the shards passed.
      - name: Require Passing Test Shards
        if: needs.test-shard.result != 'success' && needs.main-tests.result != 'success'
        env:
          SHARDS_RESULT: ${{ needs.test-shard.result }}
          MAIN_RESULT: ${{ needs.main-tests.result }}
        run: |
          echo "::error::The test shards ended with the result $SHARDS_RESULT, and Tests on Main with the result $MAIN_RESULT."
          exit 1

      # Full history so the changed-line coverage step can find the merge base.
      - name: Check out repository
        if: needs.test-shard.result == 'success' && steps.changes.outputs.outside_plan != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv toolchain
        if: needs.test-shard.result == 'success' && steps.changes.outputs.outside_plan != 'false'
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: test
          save-uv-cache: "false"

      - name: Download Coverage Data
        if: needs.test-shard.result == 'success' && steps.changes.outputs.outside_plan != 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-shard-*
          path: .data/shards

      # The shards ran on the same paths, so the data of each names the files of this checkout.
      # `coverage report` fails below `fail_under`, the floor of the whole tree (#2356).
      - name: Combine and Check Coverage
        if: needs.test-shard.result == 'success' && steps.changes.outputs.outside_plan != 'false'
        run: |
          uv run coverage combine .data/shards/*/.coverage
          uv run coverage report

      # Changed-line coverage against the pull request's own base branch (#850). The job fails
      # when under 90% of the changed lines are covered (#2356); the global floor is
      # `fail_under` in pyproject.toml. The shards write no XML report, so the step writes
      # .data/coverage.xml from the combined data (#1743).
      # diff-cover truncates its output file, so it writes first and the pragma list
      # is appended after it. The step keeps diff-cover's status, so the list is in the summary
      # when the figure fails, and exits with that status last.
      - name: Changed-Line Coverage
        if: needs.test-shard.result == 'success' && github.event_name == 'pull_request' && steps.changes.outputs.outside_plan != 'false'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          uv run coverage xml -q
          status=0
          uv run diff-cover .data/coverage.xml --compare-branch="origin/${BASE_REF}" --fail-under 90 --format "markdown:${GITHUB_STEP_SUMMARY}" || status=$?
          {
            echo "### Added pragma: no cover lines"
            echo "~~~diff"
            git diff --unified=0 -G 'pragma: no cover' "origin/${BASE_REF}...HEAD" -- src | grep -e '^+++ ' -e '^+.*pragma: no cover' || echo 'None.'
            echo "~~~"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # The step keeps the report that coverage xml writes; a run with no report warns.
      - name: Upload Coverage XML
        if: always() && needs.test-shard.result == 'success' && github.event_name == 'pull_request' && steps.changes.outputs.outside_plan != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: .data/coverage.xml
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  # The release pull request runs no test shard (ADR 0014, #4639). After each merge, release-please
  # bases it on the new commit of main (`always-update`), and it adds only the version lines,
  # CHANGELOG.md and the manifest. The push run of that commit tests the same code, and no later
  # merge cancels that run. This job waits for that run to end, and it passes only when the job
  # `Tests & Coverage` of that run passed. Only a branch of this repository takes this path, so the
  # branch of a fork cannot take a release name to skip the tests. On 2026-11-11 and 2026-11-12,
  # `Tests & Coverage` of a push run of main ended at most 18 minutes after the run started (50
  # runs). The wait stops after 35 minutes, before the limit of its step, and the step limit is
  # under the job limit.
  main-tests:
    name: Tests on Main
    if: >-
      github.event_name == 'pull_request'
      && startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      actions: read # reads the push run of main and its jobs

    steps:
      - name: Read Tests & Coverage of Main
        timeout-minutes: 37
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          WAIT_SECONDS: "2100"
        run: |
          runs="repos/$REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=$BASE_SHA&per_page=1"
          deadline=$((SECONDS + WAIT_SECONDS))
          while :; do
            run=$(gh api "$runs" --jq '.workflow_runs[0] // empty | "\(.id) \(.status)"')
            if [ "${run#* }" = completed ]; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::The push run of main at $BASE_SHA did not end in $WAIT_SECONDS seconds. Its last state: ${run:-no run}."
              exit 1
            fi
            sleep 30
          done
          run_id=${run%% *}
          result=$(gh api "repos/$REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
            --jq '[.jobs[] | select(.name == "Tests & Coverage") | .conclusion] | first // "missing"')
          echo "Tests & Coverage of main at $BASE_SHA: $result. Run: $GITHUB_SERVER_URL/$REPOSITORY/actions/runs/$run_id"
          if [ "$result" != success ]; then
            echo "::error::Tests & Coverage of main at $BASE_SHA ended with the result $result. Fix main first."
            exit 1
          fi

  # AGENTS.md rule 5: a check that averages more than 5 minutes is a P0 bug. The run of one pull
  # request is one sample, so this job reads the last twenty completed pushes to main from the
  # Actions API and fails when the mean of the `Tests & Coverage` check is over 300 s (#2699). The
  # time of a run is the run time of the slowest shard job plus that of the job `Tests & Coverage`,
  # which joins the shards (#3050). The time the jobs waited for a runner is shown on its own line
  # and is not counted (#4634). The job runs only on the daily schedule and on a manual run: a
  # merge does not change the window of twenty runs much, and a red alarm on each push to main hid
  # the result of the tests of that push (#4634). No pull request waits for it. It reads the
  # conclusion of the test job, not of the run, so a failed run still gives its test time to the
  # window. It needs `actions: read` only.
  job-time:
    name: Test Job Duration
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: job-time
          save-uv-cache: "false"

      - name: Check the duration of Tests & Coverage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run devops ci job-time --repo "$GITHUB_REPOSITORY"

  # Builds, smoke-tests and scans the Service image of every pull request but the release pull
  # request, without pushing it; release.yml publishes it when a release is created (#1486).
  service-image:
    name: Service Image
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request')
      && !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect Image Content Changes
        id: image_changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          IMAGE_CONTENT_PATHS: |
            Dockerfile
            .dockerignore
            .trivyignore
            .trivyignore-mcp-server
            src
            pyproject.toml
            uv.lock
            README.md
            .github/workflows/ci.yml
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Workflow dispatch triggered; rebuilding."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF"
          readarray -t WATCHED < <(printf '%s\n' "$IMAGE_CONTENT_PATHS" | sed '/^[[:space:]]*$/d')
          CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- "${WATCHED[@]}")
          if [ -n "$CHANGED" ]; then
            echo "Image content changed; rebuilding:"
            echo "$CHANGED"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No image content changed; skipping rebuild."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.image_changes.outputs.changed == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and Load Service Image
        if: steps.image_changes.outputs.changed == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: devops-cli-service:local
          # The final stage runs `apt-get upgrade`: never reuse it, or a cached layer keeps
          # packages a security update has since fixed.
          no-cache-filters: service
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Service Image Smoke Test
        if: steps.image_changes.outputs.changed == 'true'
        env:
          IMAGE: devops-cli-service:local
        run: |
          docker run -d --name svc --read-only --tmpfs /tmp --tmpfs /home/devops:uid=1000,gid=1000 --cap-drop ALL --security-opt no-new-privileges -p 8000:8000 "$IMAGE"
          curl -fsS --retry 10 --retry-connrefused --retry-all-errors --retry-delay 1 http://127.0.0.1:8000/healthz
          docker stop svc && docker rm svc
          docker run --rm --entrypoint id "$IMAGE" -u
          docker run --rm --entrypoint gh "$IMAGE" --version
          docker run --rm --entrypoint git "$IMAGE" --version
          docker run --rm --entrypoint openspec "$IMAGE" --version
          docker run --rm --read-only --tmpfs /tmp --tmpfs /home/devops:uid=1000,gid=1000 --cap-drop ALL --security-opt no-new-privileges --entrypoint python "$IMAGE" -c "import getpass, pathlib, subprocess; from devops_cli.config.settings import load_settings; from devops_cli.core.process import run_subprocess; from devops_cli.output.file_writer import write_text_file; write_text_file(load_settings().data.dir / 'probe.txt', 'ok'); repo = pathlib.Path.home() / 'probe'; subprocess.run(['git', 'init', '-q', str(repo)], check=True); assert run_subprocess(['git', 'status', '--porcelain'], cwd=repo).returncode == 0; assert getpass.getuser() == 'devops'"
          if docker run --rm --entrypoint sh "$IMAGE" -c 'command -v uv'; then exit 1; fi
          if docker run --rm --entrypoint sh "$IMAGE" -c 'command -v gcc'; then exit 1; fi
          if docker run --rm --entrypoint python "$IMAGE" -c 'import pytest'; then exit 1; fi

      - name: Scan Service Image for Vulnerabilities
        if: steps.image_changes.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devops-cli-service:local
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.75.0

  # Builds, smoke-tests and scans the runner image of every pull request but the release pull
  # request, without pushing it; release.yml publishes it when a release is created (#2667). It
  # runs next to the Service image job and shares its `builder` stage through the cache, so it adds
  # no time to that job.
  runner-image:
    name: Runner Image
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request')
      && !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect Image Content Changes
        id: image_changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          IMAGE_CONTENT_PATHS: |
            Dockerfile
            .dockerignore
            .trivyignore
            .trivyignore-mcp-server
            src
            pyproject.toml
            uv.lock
            README.md
            .github/workflows/ci.yml
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Workflow dispatch triggered; rebuilding."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF"
          readarray -t WATCHED < <(printf '%s\n' "$IMAGE_CONTENT_PATHS" | sed '/^[[:space:]]*$/d')
          CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- "${WATCHED[@]}")
          if [ -n "$CHANGED" ]; then
            echo "Image content changed; rebuilding:"
            echo "$CHANGED"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No image content changed; skipping rebuild."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.image_changes.outputs.changed == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and Load Runner Image
        if: steps.image_changes.outputs.changed == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: runner
          load: true
          push: false
          tags: devops-cli-runner:local
          # The stage runs `apt-get upgrade`: never reuse it, or a cached layer keeps packages a
          # security update has since fixed.
          no-cache-filters: runner
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Runner Image Smoke Test
        if: steps.image_changes.outputs.changed == 'true'
        env:
          IMAGE: devops-cli-runner:local
        run: |
          docker run --rm --entrypoint id "$IMAGE" -u
          docker run --rm "$IMAGE" --version
          # The build ran the check of every tool in RUNNER_TOOLS (src/devops_cli/roadmap/runner_tools.py), so a missing tool failed it. Here the check runs again on the loaded image, and the size of the image stays under its bound.
          docker run --rm -e DEVOPS_CLI_USER_DATA_ROOT=/opt/devops-tools --entrypoint python "$IMAGE" -m devops_cli.roadmap.runner_tools
          size=$(docker image inspect "$IMAGE" --format '{{.Size}}')
          if [ "$size" -gt 3000000000 ]; then echo "The runner image is $size bytes, over the bound of 3000000000."; exit 1; fi
          docker run --rm --read-only --tmpfs /tmp --tmpfs /home/devops:uid=1000,gid=1000 --cap-drop ALL --security-opt no-new-privileges --entrypoint python "$IMAGE" -c "import getpass, pathlib, subprocess; from devops_cli.config.settings import load_settings; from devops_cli.core.process import run_subprocess; from devops_cli.output.file_writer import write_text_file; write_text_file(load_settings().data.dir / 'probe.txt', 'ok'); repo = pathlib.Path.home() / 'probe'; subprocess.run(['git', 'init', '-q', str(repo)], check=True); assert run_subprocess(['git', 'status', '--porcelain'], cwd=repo).returncode == 0; assert getpass.getuser() == 'devops'"
          if docker run --rm --entrypoint sh "$IMAGE" -c 'command -v gcc'; then exit 1; fi
          # The job and its steps run `uv run` in a worktree: the checkout's .python-version names a patch release that the base image can lack.
          docker run --rm --read-only --tmpfs /home/devops:uid=1000,gid=1000,exec,size=3g -v "$PWD:/checkout:ro" --cap-drop ALL --security-opt no-new-privileges --entrypoint sh "$IMAGE" -c 'mkdir /home/devops/project && tar -C /checkout --exclude=./.git --exclude=./.venv -cf - . | tar -C /home/devops/project -xf - && cd /home/devops/project && uv run --locked ruff --version'

      - name: Scan Runner Image for Vulnerabilities
        if: steps.image_changes.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devops-cli-runner:local
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.75.0

  # Builds, smoke-tests and scans the MCP server image of every pull request but the release pull
  # request, without pushing it (#3220).
  mcp-server-image:
    name: MCP Server Image
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request')
      && !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect Image Content Changes
        id: image_changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          IMAGE_CONTENT_PATHS: |
            Dockerfile
            .dockerignore
            .trivyignore
            .trivyignore-mcp-server
            src
            pyproject.toml
            uv.lock
            README.md
            .github/workflows/ci.yml
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Workflow dispatch triggered; rebuilding."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF"
          readarray -t WATCHED < <(printf '%s\n' "$IMAGE_CONTENT_PATHS" | sed '/^[[:space:]]*$/d')
          CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- "${WATCHED[@]}")
          if [ -n "$CHANGED" ]; then
            echo "Image content changed; rebuilding:"
            echo "$CHANGED"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No image content changed; skipping rebuild."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.image_changes.outputs.changed == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and Load MCP Server Image
        if: steps.image_changes.outputs.changed == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: mcp-server
          load: true
          push: false
          tags: devops-cli-mcp-server:local
          no-cache-filters: mcp-server
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run MCP Server Image Smoke Test
        if: steps.image_changes.outputs.changed == 'true'
        env:
          IMAGE: devops-cli-mcp-server:local
        run: |
          docker run --rm --entrypoint id "$IMAGE" -u
          docker run --rm "$IMAGE" --version
          docker run --rm -e DEVOPS_CLI_USER_DATA_ROOT=/opt/devops-tools --entrypoint devops "$IMAGE" install-tools --check --tool kubectl --target-dir /opt/devops-tools/bin
          docker run --rm -e DEVOPS_CLI_USER_DATA_ROOT=/opt/devops-tools --entrypoint devops "$IMAGE" install-tools --check --tool helm --target-dir /opt/devops-tools/bin
          size=$(docker image inspect "$IMAGE" --format '{{.Size}}')
          if [ "$size" -gt 3000000000 ]; then echo "The mcp-server image is $size bytes, over the bound of 3000000000."; exit 1; fi

      - name: Scan MCP Server Image for Vulnerabilities
        if: steps.image_changes.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devops-cli-mcp-server:local
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore,.trivyignore-mcp-server
          exit-code: "1"
          version: v0.75.0


  # Advisory only: reports newer upstream releases without gating any merge. Scheduled so
  # the PyPI round-trip never sits on the pull request critical path.
  dependency-freshness:
    name: Dependency Freshness
    if: github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: freshness

      - name: Report Outdated Dependencies
        run: uv run devops ci outdated

  # Advisory: reruns the pull request's added or modified test files three times, one run after
  # another, each in a shuffled order, to catch tests that depend on the order they run in.
  # Shuffling the whole suite waits for thread-leak isolation.
  changed-tests:
    name: Changed-Test Independence
    if: >-
      github.event_name == 'pull_request'
      && !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect Changed Test Files
        id: changed_tests
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git diff --name-only --diff-filter=AMR "origin/${BASE_REF}...HEAD" -- ':(glob)tests/**/test_*.py' > "$RUNNER_TEMP/changed-tests.txt"
          if [ -s "$RUNNER_TEMP/changed-tests.txt" ]; then
            cat "$RUNNER_TEMP/changed-tests.txt"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No test file changed; skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up uv toolchain
        if: steps.changed_tests.outputs.changed == 'true'
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: changed-tests
          save-uv-cache: "false"
          tooling-cache-paths: |
            .pytest_cache

      - name: Run Changed Tests in Shuffled Order
        if: steps.changed_tests.outputs.changed == 'true'
        run: |
          readarray -t CHANGED_TESTS < "$RUNNER_TEMP/changed-tests.txt"
          uv run devops ci test --repeat 3 -- "${CHANGED_TESTS[@]}"

  # The token build of docs/DESIGN.md: the pinned Style Dictionary builds the token files of
  # design/tokens/ with the configs of design/sd/, and the job fails when a committed output is
  # not the build, or when a test of tests/design fails. The job runs for every pull request but
  # the release pull request, and does its steps only when a path of its filter changed, so on any
  # other pull request it reports success. The filter holds the inputs of the build, its outputs,
  # and the files whose colors the design tests check. npm installs the lock outside the checkout,
  # so no node_modules shows in the diff. The design tests run in one process: they take seconds,
  # and pytest workers take longer to start. Each step limit is shorter than the job limit, and the
  # bound of one design test is shorter than its step, so pytest-timeout names a test that hangs.
  design-tokens:
    name: Design Tokens
    if: >-
      github.event_name == 'pull_request'
      && !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter reads the changed files from the REST API

    steps:
      - name: Detect Design Token Changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            design:
              - 'design/**'
              - 'src/devops_cli/tools_lock/style-dictionary/**'
              - 'src/devops_cli/design/**'
              - 'docs/assets/css/**'
              - 'k8s/startpage/**'
              - 'k8s/monitoring/dashboards/**'
              - '.github/labels.yml'
              - 'Makefile'
              - '.github/workflows/ci.yml'

      - name: Check out repository
        if: steps.changes.outputs.design == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv toolchain
        if: steps.changes.outputs.design == 'true'
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: design-tokens
          save-uv-cache: "false"

      - name: Set up Node.js
        if: steps.changes.outputs.design == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install Style Dictionary
        if: steps.changes.outputs.design == 'true'
        timeout-minutes: 2
        env:
          TOOL_DIR: ${{ runner.temp }}/style-dictionary
        run: |
          mkdir -p "$TOOL_DIR"
          cp src/devops_cli/tools_lock/style-dictionary/package.json src/devops_cli/tools_lock/style-dictionary/package-lock.json "$TOOL_DIR/"
          npm ci --ignore-scripts --no-audit --no-fund --prefix "$TOOL_DIR"
          echo "$TOOL_DIR/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Build the Design Tokens
        if: steps.changes.outputs.design == 'true'
        timeout-minutes: 1
        run: make design-tokens

      # `git add --intent-to-add` makes a new output that is not committed show in the diff.
      - name: Check the Committed Token Outputs
        if: steps.changes.outputs.design == 'true'
        timeout-minutes: 1
        run: |
          git add --intent-to-add -- docs/assets/css src/devops_cli/design
          git diff --exit-code -- docs/assets/css src/devops_cli/design

      - name: Run the Design Tests
        if: steps.changes.outputs.design == 'true'
        timeout-minutes: 2
        run: uv run pytest tests/design -n 0 --timeout 60
