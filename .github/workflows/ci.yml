name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality-gate:
    name: 7-Gate Quality Validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Synchronize dependencies
        run: uv sync --all-groups --all-extras


      - name: Linting (Ruff)
        run: uv run ruff check .

      - name: Formatting Check (Ruff)
        run: uv run ruff format --check .

      - name: Strict Type Checking (Mypy)
        run: uv run mypy --python-version 3.14 --strict src

      - name: Documentation Freshness Check
        run: uv run python -m devops_cli.main docs check

      - name: Unit Tests & Code Coverage
        run: uv run pytest -n auto --cov=src --cov-report=xml

      - name: Security Scan (Bandit)
        run: uv run bandit -r src/ -ll -ii

