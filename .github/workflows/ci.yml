name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    # Deliberately excludes ready_for_review so converting draft PRs to ready does not
    # re-trigger redundant test suites, coverage reports, and container builds.
    # Project automation and card state transitions are handled natively via GitHub Projects v2 built-in workflows.
    types: [opened, synchronize, reopened]
    branches: [main, "release/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-python: "true"
          prune-cache: "true"
          version: "latest"
          python-version: "3.14"

      - name: Restore Tooling Caches (Mypy, Ruff, Pytest)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .mypy_cache
            .ruff_cache
            .pytest_cache
          key: tooling-cache-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            tooling-cache-${{ runner.os }}-

      - name: Synchronize dependencies
        run: uv sync --all-groups --all-extras

      - name: Lockfile Freshness & Dependency Audit
        run: |
          uv lock --check
          uv audit
          uv tree --outdated --depth=1

      - name: Initialize Workspace Directories
        run: mkdir -p .data/reviews .data/analysis .data/logs

      - name: Type Checking & Project Validation (uv check)
        run: uv check

      - name: Linting (Ruff)
        run: uv run ruff check .

      - name: Formatting Check (Ruff)
        run: uv run ruff format --check .

      - name: Strict Type Checking (Mypy)
        run: uv run mypy --python-version 3.14 --strict src

      - name: Documentation Freshness Check
        run: uv run devops docs check

      - name: Workflow Linting (actionlint)
        run: uv run actionlint

      - name: DevContainer Manifest Smoke Test
        run: uv run devops devcontainer validate --workspace .

      - name: Unit Tests & Code Coverage
        run: uv run pytest -v --cov=src --cov-report=xml

      - name: Security Scan (Bandit)
        run: uv run bandit -r src/ -ll -ii

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Repository Name
        if: github.event_name == 'pull_request'
        id: image_repo
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/devcontainer" >> "$GITHUB_OUTPUT"

      - name: Check PR Open Status Prior to Publishing Image
        if: github.event_name == 'pull_request'
        id: pr_status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          PR_STATE=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state --jq .state)
          if [ -z "$PR_STATE" ]; then
            echo "Error: Unable to verify state for PR #${PR_NUMBER}; failing closed to protect registry." >&2
            exit 1
          fi
          echo "state=${PR_STATE}" >> "$GITHUB_OUTPUT"
          if [ "$PR_STATE" != "OPEN" ]; then
            echo "PR #${PR_NUMBER} is currently ${PR_STATE}; skipping devcontainer image build and publish."
          fi

      - name: Build & Publish PR DevContainer Image
        if: github.event_name == 'pull_request' && steps.pr_status.outputs.state == 'OPEN'
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          imageName: ${{ steps.image_repo.outputs.name }}
          cacheFrom: ${{ steps.image_repo.outputs.name }}:latest
          imageTag: pr-${{ github.event.pull_request.number }}
          push: "always"
