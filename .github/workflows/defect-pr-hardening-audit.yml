# Report a merged defect pull request that adds no guardrail (#3479). docs/SELF_IMPROVEMENT.md
# (Continuous self-hardening) says that a check that fails when the problem returns guards a
# defect: a regression test under tests/ or a requirement under openspec/specs/ is such a check,
# and the audit counts both. The job runs after the merge, so it cannot block the merge. It writes
# the report to the job summary and files no issue, because an issue from a job has no root cause.
name: Defect PR Hardening Audit

on:
  pull_request:
    types:
      - closed

permissions:
  contents: read
  pull-requests: read

env:
  # uv runs only its own CPython builds, never the runner image's Python (#1494).
  UV_MANAGED_PYTHON: "1"

jobs:
  audit-hardening:
    name: Audit Defect PR Hardening
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    if: >-
      github.event.pull_request.merged == true &&
      (contains(github.event.pull_request.labels.*.name, 'type/bug') ||
       contains(github.event.pull_request.labels.*.name, 'type/security'))

    steps:
      - name: Check token permissions for fork pull requests
        id: fork_guard
        if: github.event.pull_request.head.repo.fork == true
        run: |
          echo "Skip-not-fail: pull request originated from a fork; skipping hardening audit."
          exit 0

      - name: Check out repository
        if: "!github.event.pull_request.head.repo.fork"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv toolchain
        if: "!github.event.pull_request.head.repo.fork"
        uses: ./.github/actions/setup-toolchain

      # The command exits 0 for a pull request with no guardrail, so the report is the only result.
      # The step keeps the status of the command, so a pull request that GitHub cannot read still
      # fails the step.
      - name: Report hardening
        if: "!github.event.pull_request.head.repo.fork"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=0
          report=$(COLUMNS=120 uv run devops pr hardening-report --pr "$PR_NUMBER" 2>&1) || status=$?
          printf '%s\n' "$report"
          {
            echo "### Defect PR hardening audit"
            echo "~~~"
            printf '%s\n' "$report"
            echo "~~~"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
