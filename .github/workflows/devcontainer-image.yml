name: DevContainer Image

# Builds the devcontainer image with the actions release.yml uses (#1895), pushes it by digest to a
# registry on the runner, starts it as its remote user, and publishes nothing. It runs on the daily
# schedule, on a manual run and on a pull request that changes an image input other than src/: the
# build definition, the build context filter, the project and lock files, the README that the
# package build reads, the tool locks, the two actions or this workflow. The image installs the CLI
# with --no-deps, and Static Analysis builds the package, so a pull request that changes only src/
# starts no job here; the next daily run builds the image from main (#4658). The native paths
# filter stops the run before a runner starts. The check is not required.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".devcontainer/**"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "src/devops_cli/tools_lock/**"
      - ".github/actions/devcontainer-image/**"
      - ".github/actions/devcontainer-smoke/**"
      - ".github/workflows/devcontainer-image.yml"
  schedule:
    # Daily at 04:15 UTC, after the 04:00 UTC cleanup of the devcontainer images and before the
    # 04:30 UTC Service Image Tests.
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions: {}

# A newer push to the pull request cancels the run of the older head, and a manual run does not
# cancel the schedule run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No tool the job runs reports usage.
  DO_NOT_TRACK: "1"
  # uv runs only its own CPython builds, never the runner image's Python (#1494).
  UV_MANAGED_PYTHON: "1"

jobs:
  devcontainer:
    name: DevContainer Image
    runs-on: ubuntu-26.04
    # About three times its longest run of 416 s: a build with no cache takes longer (#4677).
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    services:
      registry:
        image: registry:3@sha256:01cd312e67026f06f5d89c3e133a4a9adc7cb9eeb9b1194e0b2954dfd770efd2
        ports:
          - 5000:5000

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: devcontainer
          save-uv-cache: "false"

      # Read access only: the build reads the cache the release writes.
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata for DevContainer Image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: localhost:5000/devcontainer
          labels: |
            org.opencontainers.image.title=devops-cli-devcontainer
            org.opencontainers.image.description=DevOps CLI workstation development container environment
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/dan-petty/devops-cli/blob/main/README.md
            org.opencontainers.image.source=https://github.com/dan-petty/devops-cli
            org.opencontainers.image.version=ci-${{ github.run_id }}

      - name: Build and Push DevContainer Image by Digest
        id: image
        uses: ./.github/actions/devcontainer-image
        with:
          image: localhost:5000/devcontainer
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/devcontainer:buildcache

      - name: Start the DevContainer Image as Its Remote User
        uses: ./.github/actions/devcontainer-smoke
        with:
          image-ref: localhost:5000/devcontainer@${{ steps.image.outputs.digest }}
