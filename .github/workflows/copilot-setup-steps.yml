name: Copilot Setup Steps

# GitHub runs the job named `copilot-setup-steps` in the Copilot cloud agent's environment before
# the agent starts, from the default branch only. It gives the agent the pinned OpenSpec, which the
# skills committed in `.agents/skills` call. It is written by hand because `openspec init
# --copilot-cloud` generates a workflow that runs an unpinned `actions/checkout@v4` and
# `npm install -g @fission-ai/openspec` (ADR 0010).

on:
  workflow_dispatch:
  push:
    # GitHub does not read `paths` for a tag push. The `branches` filter keeps each release tag
    # from starting a run.
    branches: ["**"]
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/devtools-commands/**
      - .devcontainer/Dockerfile
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/devtools-commands/**
      - .devcontainer/Dockerfile

env:
  # No tool the job runs reports usage; OpenSpec's own opt-outs are named so that a runner without
  # `CI=true` stops them too.
  DO_NOT_TRACK: "1"
  OPENSPEC_TELEMETRY: "0"
  OPENSPEC_NO_UPDATE_CHECK: "1"
  PYDANTIC_AI_NO_BANNER: "1"
  UV_MANAGED_PYTHON: "1"

jobs:
  copilot-setup-steps:
    name: Copilot Setup Steps
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: copilot
          save-uv-cache: "false"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install OpenSpec
        run: |
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          npm ci --ignore-scripts

      # GitHub runs this job on the runner host and ignores a `container` key of it, so the job copies
      # the agent tools of the devtools image and puts them on PATH (#6416). Semgrep is a Python tool
      # of the image that runs only with the Python of the image, so the agent gets no Semgrep.
      - name: Copy the agent tools of the devtools image
        id: devtools
        uses: ./.github/actions/devtools-commands
        with:
          commands: gitleaks osv-scanner tuicr

      - name: Put the agent tools of the devtools image on PATH
        env:
          BIN_DIR: ${{ steps.devtools.outputs.path }}
        run: echo "$BIN_DIR" >> "$GITHUB_PATH"

      # The commits and pushes of the agent run the hooks of `.pre-commit-config.yaml` only when this
      # step installs them. The firewall of the agent does not govern a setup step, so the step also
      # builds the environments of the hook repositories, which come from github.com and PyPI.
      - name: Install the git hooks
        run: uv run pre-commit install --install-hooks
