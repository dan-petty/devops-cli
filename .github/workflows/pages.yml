# Builds the docs site with Zensical and deploys it to GitHub Pages (#4656, #5152). The Pages
# source of the repository is GitHub Actions, so this workflow is the one deploy path. It runs on a
# push to main that changes a site source, and on a manual run, so a merge that changes no site
# file starts no Pages job. A release changes CHANGELOG.md and pyproject.toml, so each release
# builds the site with its new version. The Docs Site Build check of docs-site.yml runs the same
# build command on the pull request first.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "ARCHITECTURE.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "RELEASE_CYCLE.md"
      - "CONTEXT.md"
      - "AGENTS.md"
      - "CHANGELOG.md"
      - ".nav.yml"
      - "zensical.toml"
      - "overrides/**"
      - "pyproject.toml"
      - "src/devops_cli/docs/site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

# One deployment at a time, as in the GitHub starter workflow: a newer run replaces a pending
# run, and no run cancels a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # No tool the job runs reports usage.
  DO_NOT_TRACK: "1"
  # uv runs only its own CPython builds, never the runner image's Python (#1494).
  UV_MANAGED_PYTHON: "1"

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages site

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # The CI jobs of the same push save the uv cache, so this job only restores it.
      - name: Set up uv toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: pages
          tooling-cache-paths: ""
          save-uv-cache: "false"

      # The command stages the site in .data/site-src/ and builds it into .data/site-src/site/.
      # `--strict` fails on a broken link or anchor, and on a page that no nav tab lists.
      - name: Build the Site with Zensical
        run: uv run devops docs site build --strict

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .data/site-src/site

  deploy:
    name: Deploy Site
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write # create the Pages deployment
      id-token: write # prove to Pages that the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # The action stops its own wait after 5 minutes, before the job limit of 10 minutes.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: "300000"
