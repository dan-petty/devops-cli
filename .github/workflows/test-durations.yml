name: Test Durations

# The split of the test shards of ci.yml weighs each test module by its seconds in
# tests/module_durations.json (#5247). Each new or changed test module moves test time, so a
# record that nothing writes again goes stale, and the slowest shard sets the time of the required
# check `Tests & Coverage` (#7531). Each week this workflow writes the record again with
# `devops ci durations`, from the JUnit reports of the shards of the last 20 push runs of main, and
# opens one pull request with it, or updates the open one. A person merges that pull request.
# The release App opens it, because a pull request that GITHUB_TOKEN opens starts no workflow, and
# the required checks must run on it. To stop the schedule, disable this workflow in the Actions
# tab.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: test-durations
  cancel-in-progress: false

env:
  DO_NOT_TRACK: "1"
  # uv runs only its own CPython builds, never the runner image's Python (#1494).
  UV_MANAGED_PYTHON: "1"

jobs:
  # This job runs the project's code, so it gets only GITHUB_TOKEN, which reads the runs, their
  # jobs and their artifacts. The App token stays in the next job, which runs no project code.
  record:
    name: Write the Test Durations
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read # the checkout
      actions: read # the runs, their jobs and the shard artifacts

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: test-durations
          save-uv-cache: "false"
          compile-bytecode: "false"
          tooling-cache-paths: ""

      # On 2026-11-28 the read of 20 runs took 3 minutes from a devcontainer.
      - name: Write the Record
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run devops ci durations --repo "$GITHUB_REPOSITORY"

      - name: Upload the Record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: module-durations
          path: tests/module_durations.json
          if-no-files-found: error
          retention-days: 1

  # create-pull-request commits the record only when it changed, and pushes the same branch each
  # week, so at most one such pull request is open.
  pull-request:
    name: Open the Test Durations Pull Request
    needs: record
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment: release
    permissions:
      contents: read # the checkout; the App token pushes and opens the pull request

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download the Record
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: module-durations
          path: tests

      - name: Mint the Release App Token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # The push of the branch and the pull request need only these two.
          permission-contents: write
          permission-pull-requests: write

      # `sign-commits` makes the commit through the API as the App, so GitHub verifies it.
      - name: Open the Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app.outputs.token }}
          sign-commits: true
          add-paths: tests/module_durations.json
          branch: bot/test-durations
          delete-branch: true
          commit-message: "ci(ci): write the shard record again"
          title: "ci(ci): write the shard record again"
          labels: |
            type/infra
            scope/ci
          body: |
            `devops ci durations` wrote `tests/module_durations.json` again from the JUnit reports of the test shards of the last 20 push runs of `main`. The split of the test shards weighs each test module by these seconds, so each shard gets about the same test time.

            The weekly workflow `test-durations.yml` opened this pull request. A person merges it.
