name: Clear Status

# A closed issue is done, so it holds no Status label (ADR 0016). The workflow removes the
# `status/*` labels when an issue closes, by a merge or by a person.
on:
  issues:
    types: [closed]

permissions: {}

jobs:
  clear-status:
    name: Remove the Status labels
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Remove the status labels of the closed issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          status="$(jq -r '[.[] | select(startswith("status/"))] | join(",")' <<<"$LABELS")"
          if [ -n "$status" ]; then
            gh issue edit "$NUMBER" --remove-label "$status"
          fi
