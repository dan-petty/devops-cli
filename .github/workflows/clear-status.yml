name: Clear Status

# A closed issue is done, so it holds no Status label (ADR 0016). The workflow removes the
# `status/*` labels when an issue closes, by a merge or by a person. It reads the labels that the
# issue holds when the job runs, not the labels of the event: the Service may write a label between
# the close and the job.
on:
  issues:
    types: [closed]

permissions: {}

jobs:
  clear-status:
    name: Remove the Status labels
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Remove the status labels of the closed issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          status="$(gh issue view "$NUMBER" --json labels \
            --jq '[.labels[].name | select(startswith("status/"))] | join(",")')"
          if [ -n "$status" ]; then
            gh issue edit "$NUMBER" --remove-label "$status"
          fi
