name: Docs Site Build

# Builds the docs site with Zensical when a pull request changes a site source, the build code, a
# dependency or this workflow, so a broken link or anchor, a page that no nav tab lists or a
# Zensical update that breaks the build fails the pull request before `pages.yml` deploys from
# main (#1651, #5152). The native `paths` filter stops the run before a runner starts, so a pull
# request that changes none of the paths starts no job and shows no check (#4653). The check is
# not required. The release pull request skips the job: release-please changes only the version
# and CHANGELOG.md, and `pages.yml` builds the site again when the release merges.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "ARCHITECTURE.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "RELEASE_CYCLE.md"
      - "CONTEXT.md"
      - "AGENTS.md"
      - ".nav.yml"
      - "zensical.toml"
      - "overrides/**"
      - "pyproject.toml"
      - "uv.lock"
      - "src/devops_cli/docs/site.py"
      - ".github/workflows/docs-site.yml"

permissions: {}

# A newer push to the pull request cancels the run of the older head.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No tool the job runs reports usage.
  DO_NOT_TRACK: "1"
  # uv runs only its own CPython builds, never the runner image's Python (#1494).
  UV_MANAGED_PYTHON: "1"

jobs:
  docs-site:
    name: Docs Site Build
    if: >-
      !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: docs-site
          tooling-cache-paths: ""
          save-uv-cache: "false"

      # The same command as `pages.yml`. `--strict` fails on a broken link or anchor, and on a
      # page that no nav tab lists.
      - name: Build the Site with Zensical
        run: uv run devops docs site build --strict

      # The built site has a home page and holds no source Markdown file (#2070).
      - name: Verify Built Site Pages
        run: |
          site="$GITHUB_WORKSPACE/.data/site-src/site"
          test -f "$site/index.html" || {
            echo "::error::Built site is missing index.html at root"
            exit 1
          }
          if [ -n "$(find "$site" -name '*.md')" ]; then
            echo "::error::Built site contains source markdown (.md) files"
            find "$site" -name '*.md'
            exit 1
          fi
