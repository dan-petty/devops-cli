name: Release Orchestration

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish (e.g. 0.1.10)"
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      pull-requests: read

    # Run on:
    # 1. Annotated tag push (v*)
    # 2. Push / Merge to main
    # 3. Manual workflow dispatch
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "latest"
          python-version: "3.14"

      - name: Synchronize dependencies
        run: uv sync --all-groups --all-extras

      - name: Extract Target Version & Release Title
        id: ver
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          fi
          TAG="v${VERSION}"
          TITLE="${TAG}"

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "title=${TITLE}"
          } >> "$GITHUB_OUTPUT"

      - name: Authoritative Release Verification
        run: uv run devops release check --allow-dirty --skip-ci

      - name: Build Distribution Packages (Wheel & sdist)
        run: |
          uv build
          cd dist && sha256sum -- * > SHA256SUMS.txt && cd -

      - name: Extract Release Notes
        id: notes
        run: |
          uv run devops release notes --raw -v "${{ steps.ver.outputs.version }}" > release_notes.txt
          echo "notes_file=release_notes.txt" >> "$GITHUB_OUTPUT"

      - name: Create Git Tag (upon PR merge to main)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.ver.outputs.tag }}"
          TITLE="${{ steps.ver.outputs.title }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "$TITLE"
            git push origin "$TAG"
          else
            echo "Tag $TAG already exists."
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.title }}
          body_path: release_notes.txt
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Repository Name
        id: image_repo
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/devcontainer" >> "$GITHUB_OUTPUT"

      - name: DevContainer Manifest Pre-Build Smoke Test
        run: uv run devops devcontainer validate --workspace .

      - name: Build & Publish Reusable Dev Container Image
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          imageName: ${{ steps.image_repo.outputs.name }}
          imageTag: ${{ steps.ver.outputs.tag }},latest
          push: "always"
