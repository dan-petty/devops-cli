name: Release

# release-please makes every release (ADR 0013). On each push to main it opens or updates one
# release pull request, which holds the version, CHANGELOG.md and the manifest. A person merges
# that pull request, or the workflow release-merge.yml merges it every 6 hours (#3921), or, for an
# urgent fix, GitHub merges it when its checks pass (#1966); the next run then creates the GitHub
# release and its tag, and the publish jobs below run only for that run.
on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DO_NOT_TRACK: "1"
  # uv runs only its own CPython builds, never the runner image's Python: setup-uv exports
  # UV_PYTHON=3.14, which a runner's own 3.14 would otherwise satisfy (#1494). Never also set
  # UV_PYTHON_PREFERENCE; uv refuses to run with both.
  UV_MANAGED_PYTHON: "1"

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # The App token opens the release pull request, so its checks run like those of any other
    # pull request; a pull request that GITHUB_TOKEN opens starts no workflow.
    environment: release
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Mint the Release App Token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # The token gets only what release-please-action documents: the release pull request,
          # its labels, the CHANGELOG.md and version commits, the tag and the GitHub release.
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Turn on auto-merge on the release pull request with the release App token (#6851).
      # GitHub merges it when its required checks pass. The App token does it so that the
      # merge commit starts the workflow run that creates the release.
      - name: Enable auto-merge on the release pull request
        if: steps.release.outputs.releases_created != 'true' && steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          number=$(jq -r '.number // empty' <<< "$RELEASE_PR")
          if [ -n "$number" ]; then
            gh pr merge "$number" --repo "$REPOSITORY" --auto --squash
          fi

  assets:
    name: Upload Release Assets
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The commit that the release tags: a later push can start the run that creates it.
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # This workflow publishes, so it restores no cache another run could have written
          # (zizmor cache-poisoning).
          enable-cache: false
          version: "0.13.9"
          python-version: "3.14"

      - name: Build Distribution Packages (Wheel & sdist)
        run: |
          uv build
          cd dist && sha256sum -- * > SHA256SUMS.txt

      - name: Upload the Packages to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload --clobber "$TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt

  # The Dev Containers CLI builds the image, so it holds the features of
  # .devcontainer/devcontainer.json and the user vscode a child repository runs as (#1895). Three
  # jobs: the build pushes by digest; the smoke test starts that digest as vscode in a privileged
  # container, so its job holds no write scope and no OIDC token; then the last job attests and
  # tags the digest that passed.
  devcontainer-image:
    name: Build DevContainer Image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      DEVCONTAINER_IMAGE: ghcr.io/${{ github.repository }}/devcontainer
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The commit that the release tags: a later push can start the run that creates it.
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata for DevContainer Image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DEVCONTAINER_IMAGE }}
          tags: |
            type=raw,value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=devops-cli-devcontainer
            org.opencontainers.image.description=DevOps CLI workstation development container environment
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/dan-petty/devops-cli/blob/main/README.md
            org.opencontainers.image.source=https://github.com/dan-petty/devops-cli
            org.opencontainers.image.version=${{ needs.release-please.outputs.tag_name }}

      # A registry cache: the GitHub Actions cache needs the runtime token, which a `run:` step
      # gets only from a helper that exports it to every later step of its job.
      - name: Build and Push DevContainer Image by Digest
        id: image
        uses: ./.github/actions/devcontainer-image
        with:
          image: ${{ env.DEVCONTAINER_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/devcontainer:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/devcontainer:buildcache,mode=max

  devcontainer-smoke:
    name: Smoke-Test DevContainer Image
    needs: [release-please, devcontainer-image]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The commit that the release tags: a later push can start the run that creates it.
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the DevContainer Image as Its Remote User
        timeout-minutes: 10
        uses: ./.github/actions/devcontainer-smoke
        with:
          image-ref: ghcr.io/${{ github.repository }}/devcontainer@${{ needs.devcontainer-image.outputs.digest }}

      - name: Scan the DevContainer Image for Vulnerabilities
        timeout-minutes: 4
        uses: ./.github/actions/image-scan
        with:
          image-ref: ghcr.io/${{ github.repository }}/devcontainer@${{ needs.devcontainer-image.outputs.digest }}
          category: trivy-image-devcontainer
          exit-code: "0"
          upload-sarif: "false"

      - name: Upload Scan SARIF Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devcontainer-sarif
          path: trivy-image-devcontainer.sarif
          if-no-files-found: error

  devcontainer:
    name: Attest & Tag DevContainer Image
    needs: [devcontainer-image, devcontainer-smoke]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    env:
      DEVCONTAINER_IMAGE: ghcr.io/${{ github.repository }}/devcontainer

    steps:
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}/devcontainer
          subject-digest: ${{ needs.devcontainer-image.outputs.digest }}
          push-to-registry: true

      # A copy of one index keeps its digest, so each tag names the digest the smoke test started.
      - name: Tag the Attested DevContainer Image
        id: tag
        shell: bash
        env:
          DIGEST: ${{ needs.devcontainer-image.outputs.digest }}
          TAGS: ${{ needs.devcontainer-image.outputs.tags }}
        run: |
          set -euo pipefail
          TAG_ARGS=()
          while read -r TAG; do
            if [ -n "$TAG" ]; then TAG_ARGS+=(--tag "$TAG"); fi
          done <<< "$TAGS"
          docker buildx imagetools create "${TAG_ARGS[@]}" "${DEVCONTAINER_IMAGE}@${DIGEST}"
          while read -r TAG; do
            if [ -n "$TAG" ]; then
              test "$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest}}' | jq -r .digest)" = "$DIGEST"
            fi
          done <<< "$TAGS"

      - name: Download Scan SARIF Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: devcontainer-sarif

      - name: Upload DevContainer SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: trivy-image-devcontainer.sarif
          category: trivy-image-devcontainer

  # The service, runner and mcp-server images of the release, one call of release-image.yml for
  # each (#6407). A call builds its image one time and pushes it by digest, then smoke-tests and
  # scans that digest, and only then attests it and tags it with the release tag and latest.
  # Image Updater rolls the cluster onto the digest of latest (#1486, #2667, #4324). Each image
  # promotes on its own: a failed job of one call stops no job of another call. The mcp-server
  # package is public, so the pod pulls it with no credential (see the pull request of #4324).
  image:
    name: ${{ matrix.title }} Image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The final stage runs `apt-get upgrade`: never reuse it, or a cached layer keeps
          # packages a security update has since fixed.
          - image: service
            title: Service
            description: DevOps CLI Service runtime for scheduled jobs and webhooks
            no-cache-filters: service
            category: trivy-image-service
            scan-exit-code: "1"
          # The devtools image runs `apt-get upgrade` in its own build, so the runner stage runs
          # none and needs no filter. Its scan only reports (SECURITY.md, Dedicated Development
          # Resources and Sandboxes).
          - image: runner
            title: Runner
            description: DevOps CLI runner for the implement job of the roadmap
            no-cache-filters: ""
            category: trivy-image-runner
            scan-exit-code: "0"
          - image: mcp-server
            title: MCP Server
            description: DevOps CLI MCP server that serves role-scoped tool sets to cluster jobs
            no-cache-filters: mcp-server
            category: trivy-image-mcp-server
            scan-exit-code: "1"
    # A called workflow can only keep or lower these permissions; each of its jobs asks for less.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/release-image.yml
    with:
      image: ${{ matrix.image }}
      description: ${{ matrix.description }}
      no-cache-filters: ${{ matrix.no-cache-filters }}
      category: ${{ matrix.category }}
      scan-exit-code: ${{ matrix.scan-exit-code }}
      tag-name: ${{ needs.release-please.outputs.tag_name }}
      sha: ${{ needs.release-please.outputs.sha }}
