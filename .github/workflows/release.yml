name: Release Orchestration

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish (e.g. 0.1.10)"
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # uv runs only its own CPython builds, never the runner image's Python: setup-uv exports
  # UV_PYTHON=3.14, which a runner's own 3.14 would otherwise satisfy (#1494). Never also set
  # UV_PYTHON_PREFERENCE; uv refuses to run with both.
  UV_MANAGED_PYTHON: "1"

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-24.04 # moves to ubuntu-26.04 in #1501
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ver.outputs.version }}
    permissions:
      contents: write
      packages: write
      pull-requests: read
      issues: write

    # Run on:
    # 1. Annotated tag push (v*)
    # 2. Push / Merge to main
    # 3. Manual workflow dispatch
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-python: "true"
          prune-cache: "true"
          version: "latest"
          python-version: "3.14"

      - name: Synchronize dependencies
        run: uv sync --all-groups --all-extras

      - name: Extract Target Version & Release Title
        id: ver
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          fi
          TAG="v${VERSION}"
          TITLE="${TAG}"

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "title=${TITLE}"
          } >> "$GITHUB_OUTPUT"

      - name: Authoritative Release Verification
        run: uv run devops release check --allow-dirty --skip-ci

      - name: Build Distribution Packages (Wheel & sdist)
        run: |
          uv build
          cd dist && sha256sum -- * > SHA256SUMS.txt && cd -

      - name: Extract Release Notes
        id: notes
        run: |
          if ! uv run devops release notes --raw -v "${{ steps.ver.outputs.version }}" > release_notes.txt || [ ! -s release_notes.txt ]; then
            echo "Release notes extraction failed or empty; falling back to changelog compiler"
            uv run devops release changelog --raw -v "${{ steps.ver.outputs.version }}" > release_notes.txt
          fi
          echo "notes_file=release_notes.txt" >> "$GITHUB_OUTPUT"

      - name: Create Git Tag (upon PR merge to main)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.ver.outputs.tag }}"
          TITLE="${{ steps.ver.outputs.title }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "$TITLE"
            git push origin "$TAG"
          else
            echo "Tag $TAG already exists."
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.title }}
          body_path: release_notes.txt
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Close Release Milestone
        run: |
          uv run devops gh milestones close "${{ steps.ver.outputs.version }}" || echo "Milestone close skipped or already closed"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Repository Name
        id: image_repo
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/devcontainer" >> "$GITHUB_OUTPUT"

      - name: DevContainer Manifest Pre-Build Smoke Test
        run: uv run devops devcontainer validate --workspace .

      - name: Build & Publish Reusable Dev Container Image
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          imageName: ${{ steps.image_repo.outputs.name }}
          cacheFrom: ${{ steps.image_repo.outputs.name }}:latest
          imageTag: ${{ steps.ver.outputs.tag }},latest
          push: "always"

  service-image:
    name: Build & Publish Service Image
    needs: release
    # On main (a push, or a dispatch from main), after the release job, it builds, smoke-tests,
    # scans, pushes by digest and attests service:vX.Y.Z, then tags it vX.Y.Z and latest; Image
    # Updater rolls the cluster onto the new digest (#1486).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04 # moves to ubuntu-26.04 in #1501
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      SERVICE_IMAGE: ghcr.io/${{ github.repository }}/service

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v3

      - name: Extract Metadata for Service Image
        id: meta
        uses: docker/metadata-action@8e671d84a3bd81afdfc4fdbb96a42b07c2a80934 # v5
        with:
          images: ${{ env.SERVICE_IMAGE }}
          tags: |
            type=raw,value=v${{ needs.release.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.licenses=MIT

      - name: Build and Load Service Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: devops-cli-service:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Service Image Smoke Test
        env:
          IMAGE: devops-cli-service:local
        run: |
          docker run -d --name svc --read-only --tmpfs /tmp --tmpfs /home/devops:uid=1000,gid=1000 --cap-drop ALL --security-opt no-new-privileges -p 8000:8000 "$IMAGE"
          curl -fsS --retry 10 --retry-connrefused --retry-all-errors --retry-delay 1 http://127.0.0.1:8000/healthz
          docker stop svc && docker rm svc
          docker run --rm --entrypoint id "$IMAGE" -u
          docker run --rm --entrypoint gh "$IMAGE" --version
          docker run --rm --entrypoint git "$IMAGE" --version
          docker run --rm --read-only --tmpfs /tmp --tmpfs /home/devops:uid=1000,gid=1000 --cap-drop ALL --security-opt no-new-privileges --entrypoint python "$IMAGE" -c "import getpass, pathlib, subprocess; from devops_cli.config.settings import load_settings; from devops_cli.core.process import run_subprocess; from devops_cli.output.file_writer import write_text_file; write_text_file(load_settings().data.dir / 'probe.txt', 'ok'); repo = pathlib.Path.home() / 'probe'; subprocess.run(['git', 'init', '-q', str(repo)], check=True); assert run_subprocess(['git', 'status', '--porcelain'], cwd=repo).returncode == 0; assert getpass.getuser() == 'devops'"
          if docker run --rm --entrypoint sh "$IMAGE" -c 'command -v uv'; then exit 1; fi
          if docker run --rm --entrypoint sh "$IMAGE" -c 'command -v gcc'; then exit 1; fi
          if docker run --rm --entrypoint python "$IMAGE" -c 'import pytest'; then exit 1; fi

      - name: Scan Service Image for Vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devops-cli-service:local
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.75.0

      # Pushed by digest only: the tags move to the digest once its provenance is attested, so
      # a tag never names an unattested image and a failed attestation is retried by a re-run.
      - name: Build and Push Service Image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: .
          file: ./Dockerfile
          outputs: type=image,name=${{ env.SERVICE_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          cache-from: type=gha

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@9d57eef8c06cd9d6b433effeeb7a6a77b3ff94ad # v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/service
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Tag the Attested Service Image
        id: tag
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          TAG_ARGS=()
          while read -r TAG; do
            if [ -n "$TAG" ]; then TAG_ARGS+=(--tag "$TAG"); fi
          done <<< "$TAGS"
          docker buildx imagetools create "${TAG_ARGS[@]}" "${SERVICE_IMAGE}@${DIGEST}"
