name: Release Orchestration

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish (e.g. 0.1.10)"
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # uv runs only its own CPython builds, never the runner image's Python: setup-uv exports
  # UV_PYTHON=3.14, which a runner's own 3.14 would otherwise satisfy (#1494). Never also set
  # UV_PYTHON_PREFERENCE; uv refuses to run with both.
  UV_MANAGED_PYTHON: "1"

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-24.04 # moves to ubuntu-26.04 in #1501
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ver.outputs.version }}
    permissions:
      contents: write
      packages: write
      pull-requests: read
      issues: write

    # Run on:
    # 1. Annotated tag push (v*)
    # 2. Push / Merge to main
    # 3. Manual workflow dispatch
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          save-cache: false
          cache-dependency-glob: "uv.lock"
          cache-python: "true"
          prune-cache: "true"
          version: "latest"
          python-version: "3.14"

      - name: Synchronize dependencies
        run: uv sync --all-groups --all-extras

      - name: Extract Target Version & Release Title
        id: ver
        env:
          DISPATCHED_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="$DISPATCHED_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          fi
          TAG="v${VERSION}"
          TITLE="${TAG}"

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "title=${TITLE}"
          } >> "$GITHUB_OUTPUT"

      - name: Authoritative Release Verification
        run: uv run devops release check --allow-dirty --skip-ci

      - name: Build Distribution Packages (Wheel & sdist)
        run: |
          uv build
          cd dist && sha256sum -- * > SHA256SUMS.txt && cd -

      - name: Extract Release Notes
        id: notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if ! uv run devops release notes --raw -v "$VERSION" > release_notes.txt || [ ! -s release_notes.txt ]; then
            echo "Release notes extraction failed or empty; falling back to changelog compiler"
            uv run devops release changelog --raw -v "$VERSION" > release_notes.txt
          fi
          echo "notes_file=release_notes.txt" >> "$GITHUB_OUTPUT"

      - name: Create Git Tag (upon PR merge to main)
        if: github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          TITLE: ${{ steps.ver.outputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "$TITLE"
            git push origin "$TAG"
          elif [ "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA" ]; then
            echo "Tag $TAG already exists on this commit."
          else
            # A version already released from another commit is never published again: the
            # push to main is not that release, so stop before the release, its assets or the
            # images are touched (#1805).
            echo "::error::Tag $TAG is on $(git rev-parse "$TAG^{commit}"), not on $GITHUB_SHA, the commit being published. pyproject.toml must name a new version before this commit is merged to main."
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.title }}
          body_path: release_notes.txt
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Close Release Milestone
        run: |
          uv run devops gh milestones close "$VERSION" || echo "Milestone close skipped or already closed"
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: DevContainer Manifest Pre-Build Smoke Test
        run: uv run devops devcontainer validate --workspace .

  # The Dev Containers CLI builds the image, so it holds the features of
  # .devcontainer/devcontainer.json and the user vscode a child repository runs as (#1895). Three
  # jobs: the build pushes by digest; the smoke test starts that digest as vscode in a privileged
  # container, so its job holds no write scope and no OIDC token; then the last job attests and
  # tags the digest that passed.
  devcontainer-image:
    name: Build DevContainer Image
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04 # moves to ubuntu-26.04 in #1501
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      DEVCONTAINER_IMAGE: ghcr.io/${{ github.repository }}/devcontainer
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          save-cache: false
          cache-dependency-glob: "uv.lock"
          cache-python: "true"
          prune-cache: "true"
          version: "latest"
          python-version: "3.14"

      - name: Synchronize dependencies
        run: uv sync --all-groups --all-extras

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata for DevContainer Image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DEVCONTAINER_IMAGE }}
          tags: |
            type=raw,value=v${{ needs.release.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=devops-cli-devcontainer
            org.opencontainers.image.description=DevOps CLI workstation development container environment
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/dan-petty/devops-cli/blob/main/README.md
            org.opencontainers.image.source=https://github.com/dan-petty/devops-cli
            org.opencontainers.image.version=v${{ needs.release.outputs.version }}

      - name: Validate OCI Image Metadata Pre-Publish
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          uv run devops devcontainer validate --workspace . --oci-labels "$LABELS"

      # A registry cache: the GitHub Actions cache needs the runtime token, which a `run:` step
      # gets only from a helper that exports it to every later step of its job.
      - name: Build and Push DevContainer Image by Digest
        id: image
        uses: ./.github/actions/devcontainer-image
        with:
          image: ${{ env.DEVCONTAINER_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/devcontainer:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/devcontainer:buildcache,mode=max

  devcontainer-smoke:
    name: Smoke-Test DevContainer Image
    needs: [release, devcontainer-image]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04 # moves to ubuntu-26.04 in #1501
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          save-cache: false
          cache-dependency-glob: "uv.lock"
          cache-python: "true"
          prune-cache: "true"
          version: "latest"
          python-version: "3.14"

      - name: Synchronize dependencies
        run: uv sync --all-groups --all-extras

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the DevContainer Image as Its Remote User
        uses: ./.github/actions/devcontainer-smoke
        with:
          image-ref: ghcr.io/${{ github.repository }}/devcontainer@${{ needs.devcontainer-image.outputs.digest }}

  devcontainer:
    name: Attest & Tag DevContainer Image
    needs: [release, devcontainer-image, devcontainer-smoke]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04 # moves to ubuntu-26.04 in #1501
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      DEVCONTAINER_IMAGE: ghcr.io/${{ github.repository }}/devcontainer

    steps:
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@9d57eef8c06cd9d6b433effeeb7a6a77b3ff94ad # v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/devcontainer
          subject-digest: ${{ needs.devcontainer-image.outputs.digest }}
          push-to-registry: true

      # A copy of one index keeps its digest, so each tag names the digest the smoke test started.
      - name: Tag the Attested DevContainer Image
        id: tag
        shell: bash
        env:
          DIGEST: ${{ needs.devcontainer-image.outputs.digest }}
          TAGS: ${{ needs.devcontainer-image.outputs.tags }}
        run: |
          set -euo pipefail
          TAG_ARGS=()
          while read -r TAG; do
            if [ -n "$TAG" ]; then TAG_ARGS+=(--tag "$TAG"); fi
          done <<< "$TAGS"
          docker buildx imagetools create "${TAG_ARGS[@]}" "${DEVCONTAINER_IMAGE}@${DIGEST}"
          while read -r TAG; do
            if [ -n "$TAG" ]; then
              test "$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest}}' | jq -r .digest)" = "$DIGEST"
            fi
          done <<< "$TAGS"

  service-image:
    name: Build & Publish Service Image
    needs: release
    # On main (a push, or a dispatch from main), after the release job, it builds, smoke-tests,
    # scans, pushes by digest and attests service:vX.Y.Z, then tags it vX.Y.Z and latest; Image
    # Updater rolls the cluster onto the new digest (#1486).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04 # moves to ubuntu-26.04 in #1501
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      SERVICE_IMAGE: ghcr.io/${{ github.repository }}/service

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          save-cache: false
          cache-dependency-glob: "uv.lock"
          cache-python: "true"
          prune-cache: "true"
          version: "latest"
          python-version: "3.14"

      - name: Synchronize dependencies
        run: uv sync --all-groups --all-extras

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v3

      - name: Extract Metadata for Service Image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.SERVICE_IMAGE }}
          tags: |
            type=raw,value=v${{ needs.release.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=devops-cli-service
            org.opencontainers.image.description=DevOps CLI Service runtime for scheduled jobs and webhooks
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/dan-petty/devops-cli/blob/main/README.md
            org.opencontainers.image.source=https://github.com/dan-petty/devops-cli
            org.opencontainers.image.version=v${{ needs.release.outputs.version }}

      - name: Validate OCI Image Metadata Pre-Publish
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          uv run devops devcontainer validate --oci-labels "$LABELS"

      - name: Build and Load Service Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: devops-cli-service:local
          # The final stage runs `apt-get upgrade`: never reuse it, or a cached layer keeps
          # packages a security update has since fixed.
          no-cache-filters: service
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Service Image Smoke Test
        env:
          IMAGE: devops-cli-service:local
        run: |
          docker run -d --name svc --read-only --tmpfs /tmp --tmpfs /home/devops:uid=1000,gid=1000 --cap-drop ALL --security-opt no-new-privileges -p 8000:8000 "$IMAGE"
          curl -fsS --retry 10 --retry-connrefused --retry-all-errors --retry-delay 1 http://127.0.0.1:8000/healthz
          docker stop svc && docker rm svc
          docker run --rm --entrypoint id "$IMAGE" -u
          docker run --rm --entrypoint gh "$IMAGE" --version
          docker run --rm --entrypoint git "$IMAGE" --version
          docker run --rm --read-only --tmpfs /tmp --tmpfs /home/devops:uid=1000,gid=1000 --cap-drop ALL --security-opt no-new-privileges --entrypoint python "$IMAGE" -c "import getpass, pathlib, subprocess; from devops_cli.config.settings import load_settings; from devops_cli.core.process import run_subprocess; from devops_cli.output.file_writer import write_text_file; write_text_file(load_settings().data.dir / 'probe.txt', 'ok'); repo = pathlib.Path.home() / 'probe'; subprocess.run(['git', 'init', '-q', str(repo)], check=True); assert run_subprocess(['git', 'status', '--porcelain'], cwd=repo).returncode == 0; assert getpass.getuser() == 'devops'"
          if docker run --rm --entrypoint sh "$IMAGE" -c 'command -v uv'; then exit 1; fi
          if docker run --rm --entrypoint sh "$IMAGE" -c 'command -v gcc'; then exit 1; fi
          if docker run --rm --entrypoint python "$IMAGE" -c 'import pytest'; then exit 1; fi

      - name: Scan Service Image for Vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devops-cli-service:local
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.75.0

      # Pushed by digest only: the tags move to the digest once its provenance is attested, so
      # a tag never names an unattested image and a failed attestation is retried by a re-run.
      - name: Build and Push Service Image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.SERVICE_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          # The final stage runs `apt-get upgrade`: never reuse it, or a cached layer keeps
          # packages a security update has since fixed.
          no-cache-filters: service
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@9d57eef8c06cd9d6b433effeeb7a6a77b3ff94ad # v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/service
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Tag the Attested Service Image
        id: tag
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          TAG_ARGS=()
          while read -r TAG; do
            if [ -n "$TAG" ]; then TAG_ARGS+=(--tag "$TAG"); fi
          done <<< "$TAGS"
          docker buildx imagetools create "${TAG_ARGS[@]}" "${SERVICE_IMAGE}@${DIGEST}"
