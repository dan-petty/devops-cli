name: Release

# release-please makes every release (ADR 0013). On each push to main it opens or updates one
# release pull request, which holds the version, CHANGELOG.md and the manifest. A person merges
# that pull request, or, for an urgent fix, GitHub merges it when its checks pass (#1966); the
# next run then creates the GitHub release and its tag, and the publish jobs below run only for
# that run.
on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  DO_NOT_TRACK: "1"
  # uv runs only its own CPython builds, never the runner image's Python: setup-uv exports
  # UV_PYTHON=3.14, which a runner's own 3.14 would otherwise satisfy (#1494). Never also set
  # UV_PYTHON_PREFERENCE; uv refuses to run with both.
  UV_MANAGED_PYTHON: "1"

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # The App token opens the release pull request, so its checks run like those of any other
    # pull request; a pull request that GITHUB_TOKEN opens starts no workflow.
    environment: release
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Mint the Release App Token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # The token gets only what release-please-action documents: the release pull request,
          # its labels, the CHANGELOG.md and version commits, the tag and the GitHub release.
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # An urgent fix releases without a wait for a person (#1966, ADR 0013). When the pull
      # request of the pushed commit carries release-now, or closes an issue labeled
      # priority/p0-critical, or scope/security with priority/p1-high, this step turns on the
      # auto-merge of the release pull request, and GitHub merges it when its required checks
      # pass. gh merges at once when the checks already passed. The App token does it, because a
      # merge that GITHUB_TOKEN makes starts no workflow, and then no run creates the release.
      - name: Merge the Release Pull Request on an Urgent Fix
        if: steps.release.outputs.releases_created != 'true' && steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PUSHED_SHA: ${{ github.sha }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          pr=$(gh api "repos/$REPOSITORY/commits/$PUSHED_SHA/pulls" \
            --jq 'map(select(.merged_at != null)) | first | .number // empty')
          if [ -z "$pr" ]; then
            echo "The pushed commit has no merged pull request. A person merges the release pull request."
            exit 0
          fi
          urgent=$(gh api graphql -f owner="${REPOSITORY%%/*}" -f name="${REPOSITORY#*/}" -F number="$pr" \
            -f query="query(\$owner: String!, \$name: String!, \$number: Int!) {
              repository(owner: \$owner, name: \$name) {
                pullRequest(number: \$number) {
                  labels(first: 100) { nodes { name } }
                  closingIssuesReferences(first: 50) {
                    nodes { labels(first: 100) { nodes { name } } }
                  }
                }
              }
            }" \
            --jq '.data.repository.pullRequest
              | ([.labels.nodes[].name] | any(. == "release-now"))
                or any(.closingIssuesReferences.nodes[];
                  [.labels.nodes[].name]
                  | any(. == "priority/p0-critical")
                    or (any(. == "scope/security") and any(. == "priority/p1-high")))')
          if [ "$urgent" != "true" ]; then
            echo "Pull request #$pr is not an urgent fix. A person merges the release pull request."
            exit 0
          fi
          echo "Pull request #$pr is an urgent fix. The release pull request merges when its checks pass."
          RELEASE_PR=$(jq -r '.number // empty' <<< "$RELEASE_PR")
          if [ -z "$RELEASE_PR" ]; then
            echo "The release pull request could not be read. A person merges the release pull request."
            exit 0
          fi
          gh pr merge "$RELEASE_PR" --repo "$REPOSITORY" --auto --squash

  assets:
    name: Upload Release Assets
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The commit that the release tags: a later push can start the run that creates it.
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # This workflow publishes, so it restores no cache another run could have written
          # (zizmor cache-poisoning).
          enable-cache: false
          version: "latest"
          python-version: "3.14"

      - name: Build Distribution Packages (Wheel & sdist)
        run: |
          uv build
          cd dist && sha256sum -- * > SHA256SUMS.txt

      - name: Upload the Packages to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload --clobber "$TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt

  # The Dev Containers CLI builds the image, so it holds the features of
  # .devcontainer/devcontainer.json and the user vscode a child repository runs as (#1895). Three
  # jobs: the build pushes by digest; the smoke test starts that digest as vscode in a privileged
  # container, so its job holds no write scope and no OIDC token; then the last job attests and
  # tags the digest that passed.
  devcontainer-image:
    name: Build DevContainer Image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      DEVCONTAINER_IMAGE: ghcr.io/${{ github.repository }}/devcontainer
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The commit that the release tags: a later push can start the run that creates it.
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # This workflow publishes, so it restores no cache another run could have written
          # (zizmor cache-poisoning).
          enable-cache: false
          version: "latest"
          python-version: "3.14"

      - name: Synchronize dependencies
        run: uv sync --locked --all-groups --all-extras

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata for DevContainer Image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DEVCONTAINER_IMAGE }}
          tags: |
            type=raw,value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=devops-cli-devcontainer
            org.opencontainers.image.description=DevOps CLI workstation development container environment
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/dan-petty/devops-cli/blob/main/README.md
            org.opencontainers.image.source=https://github.com/dan-petty/devops-cli
            org.opencontainers.image.version=${{ needs.release-please.outputs.tag_name }}

      # A registry cache: the GitHub Actions cache needs the runtime token, which a `run:` step
      # gets only from a helper that exports it to every later step of its job.
      - name: Build and Push DevContainer Image by Digest
        id: image
        uses: ./.github/actions/devcontainer-image
        with:
          image: ${{ env.DEVCONTAINER_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/devcontainer:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/devcontainer:buildcache,mode=max

  devcontainer-smoke:
    name: Smoke-Test DevContainer Image
    needs: [release-please, devcontainer-image]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The commit that the release tags: a later push can start the run that creates it.
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # This workflow publishes, so it restores no cache another run could have written
          # (zizmor cache-poisoning).
          enable-cache: false
          version: "latest"
          python-version: "3.14"

      - name: Synchronize dependencies
        run: uv sync --locked --all-groups --all-extras

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the DevContainer Image as Its Remote User
        uses: ./.github/actions/devcontainer-smoke
        with:
          image-ref: ghcr.io/${{ github.repository }}/devcontainer@${{ needs.devcontainer-image.outputs.digest }}

  devcontainer:
    name: Attest & Tag DevContainer Image
    needs: [devcontainer-image, devcontainer-smoke]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      DEVCONTAINER_IMAGE: ghcr.io/${{ github.repository }}/devcontainer

    steps:
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@9d57eef8c06cd9d6b433effeeb7a6a77b3ff94ad # v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/devcontainer
          subject-digest: ${{ needs.devcontainer-image.outputs.digest }}
          push-to-registry: true

      # A copy of one index keeps its digest, so each tag names the digest the smoke test started.
      - name: Tag the Attested DevContainer Image
        id: tag
        shell: bash
        env:
          DIGEST: ${{ needs.devcontainer-image.outputs.digest }}
          TAGS: ${{ needs.devcontainer-image.outputs.tags }}
        run: |
          set -euo pipefail
          TAG_ARGS=()
          while read -r TAG; do
            if [ -n "$TAG" ]; then TAG_ARGS+=(--tag "$TAG"); fi
          done <<< "$TAGS"
          docker buildx imagetools create "${TAG_ARGS[@]}" "${DEVCONTAINER_IMAGE}@${DIGEST}"
          while read -r TAG; do
            if [ -n "$TAG" ]; then
              test "$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest}}' | jq -r .digest)" = "$DIGEST"
            fi
          done <<< "$TAGS"

  service-image:
    name: Build & Publish Service Image
    needs: release-please
    # It builds, smoke-tests, scans, pushes by digest and attests the service image of the
    # release, then tags it with the release tag and latest; Image Updater rolls the cluster onto
    # the new digest (#1486).
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      SERVICE_IMAGE: ghcr.io/${{ github.repository }}/service

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The commit that the release tags: a later push can start the run that creates it.
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v3

      - name: Extract Metadata for Service Image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.SERVICE_IMAGE }}
          tags: |
            type=raw,value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=devops-cli-service
            org.opencontainers.image.description=DevOps CLI Service runtime for scheduled jobs and webhooks
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/dan-petty/devops-cli/blob/main/README.md
            org.opencontainers.image.source=https://github.com/dan-petty/devops-cli
            org.opencontainers.image.version=${{ needs.release-please.outputs.tag_name }}

      - name: Build and Load Service Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: devops-cli-service:local
          # The final stage runs `apt-get upgrade`: never reuse it, or a cached layer keeps
          # packages a security update has since fixed.
          no-cache-filters: service
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Service Image Smoke Test
        env:
          IMAGE: devops-cli-service:local
        run: |
          docker run -d --name svc --read-only --tmpfs /tmp --tmpfs /home/devops:uid=1000,gid=1000 --cap-drop ALL --security-opt no-new-privileges -p 8000:8000 "$IMAGE"
          curl -fsS --retry 10 --retry-connrefused --retry-all-errors --retry-delay 1 http://127.0.0.1:8000/healthz
          docker stop svc && docker rm svc
          docker run --rm --entrypoint id "$IMAGE" -u
          docker run --rm --entrypoint gh "$IMAGE" --version
          docker run --rm --entrypoint git "$IMAGE" --version
          docker run --rm --entrypoint openspec "$IMAGE" --version
          docker run --rm --read-only --tmpfs /tmp --tmpfs /home/devops:uid=1000,gid=1000 --cap-drop ALL --security-opt no-new-privileges --entrypoint python "$IMAGE" -c "import getpass, pathlib, subprocess; from devops_cli.config.settings import load_settings; from devops_cli.core.process import run_subprocess; from devops_cli.output.file_writer import write_text_file; write_text_file(load_settings().data.dir / 'probe.txt', 'ok'); repo = pathlib.Path.home() / 'probe'; subprocess.run(['git', 'init', '-q', str(repo)], check=True); assert run_subprocess(['git', 'status', '--porcelain'], cwd=repo).returncode == 0; assert getpass.getuser() == 'devops'"
          if docker run --rm --entrypoint sh "$IMAGE" -c 'command -v uv'; then exit 1; fi
          if docker run --rm --entrypoint sh "$IMAGE" -c 'command -v gcc'; then exit 1; fi
          if docker run --rm --entrypoint python "$IMAGE" -c 'import pytest'; then exit 1; fi

      - name: Scan Service Image for Vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devops-cli-service:local
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.75.0

      # Pushed by digest only: the tags move to the digest once its provenance is attested, so
      # a tag never names an unattested image and a failed attestation is retried by a re-run.
      - name: Build and Push Service Image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=${{ env.SERVICE_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          # The final stage runs `apt-get upgrade`: never reuse it, or a cached layer keeps
          # packages a security update has since fixed.
          no-cache-filters: service
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@9d57eef8c06cd9d6b433effeeb7a6a77b3ff94ad # v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/service
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Tag the Attested Service Image
        id: tag
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          TAG_ARGS=()
          while read -r TAG; do
            if [ -n "$TAG" ]; then TAG_ARGS+=(--tag "$TAG"); fi
          done <<< "$TAGS"
          docker buildx imagetools create "${TAG_ARGS[@]}" "${SERVICE_IMAGE}@${DIGEST}"

  runner-image:
    name: Build & Publish Runner Image
    needs: release-please
    # It builds, smoke-tests, scans, pushes by digest and attests the runner image of the
    # release, then tags it with the release tag and latest; Image Updater rolls the Job template
    # of the implement job onto the new digest (#2667).
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      RUNNER_IMAGE: ghcr.io/${{ github.repository }}/runner

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The commit that the release tags: a later push can start the run that creates it.
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v3

      - name: Extract Metadata for Runner Image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.RUNNER_IMAGE }}
          tags: |
            type=raw,value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=devops-cli-runner
            org.opencontainers.image.description=DevOps CLI runner for the implement job of the roadmap
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/dan-petty/devops-cli/blob/main/README.md
            org.opencontainers.image.source=https://github.com/dan-petty/devops-cli
            org.opencontainers.image.version=${{ needs.release-please.outputs.tag_name }}

      - name: Build and Load Runner Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          load: true
          push: false
          tags: devops-cli-runner:local
          # The stage runs `apt-get upgrade`: never reuse it, or a cached layer keeps packages a
          # security update has since fixed.
          no-cache-filters: runner
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Runner Image Smoke Test
        env:
          IMAGE: devops-cli-runner:local
        run: |
          docker run --rm --entrypoint id "$IMAGE" -u
          docker run --rm "$IMAGE" --version
          # The build ran the check of every tool in RUNNER_TOOLS (src/devops_cli/roadmap/runner_tools.py), so a missing tool failed it. Here the check runs again on the loaded image, and the size of the image stays under its bound.
          docker run --rm -e DEVOPS_CLI_USER_DATA_ROOT=/opt/devops-tools --entrypoint python "$IMAGE" -m devops_cli.roadmap.runner_tools
          size=$(docker image inspect "$IMAGE" --format '{{.Size}}')
          if [ "$size" -gt 3000000000 ]; then echo "The runner image is $size bytes, over the bound of 3000000000."; exit 1; fi
          docker run --rm --read-only --tmpfs /tmp --tmpfs /home/devops:uid=1000,gid=1000 --cap-drop ALL --security-opt no-new-privileges --entrypoint python "$IMAGE" -c "import getpass, pathlib, subprocess; from devops_cli.config.settings import load_settings; from devops_cli.core.process import run_subprocess; from devops_cli.output.file_writer import write_text_file; write_text_file(load_settings().data.dir / 'probe.txt', 'ok'); repo = pathlib.Path.home() / 'probe'; subprocess.run(['git', 'init', '-q', str(repo)], check=True); assert run_subprocess(['git', 'status', '--porcelain'], cwd=repo).returncode == 0; assert getpass.getuser() == 'devops'"
          if docker run --rm --entrypoint sh "$IMAGE" -c 'command -v gcc'; then exit 1; fi
          # The job and its steps run `uv run` in a worktree: the checkout's .python-version names a patch release that the base image can lack.
          docker run --rm --read-only --tmpfs /home/devops:uid=1000,gid=1000,exec,size=3g -v "$PWD:/checkout:ro" --cap-drop ALL --security-opt no-new-privileges --entrypoint sh "$IMAGE" -c 'mkdir /home/devops/project && tar -C /checkout --exclude=./.git --exclude=./.venv -cf - . | tar -C /home/devops/project -xf - && cd /home/devops/project && uv run --locked ruff --version'

      - name: Scan Runner Image for Vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devops-cli-runner:local
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.75.0

      # Pushed by digest only: the tags move to the digest once its provenance is attested, so
      # a tag never names an unattested image and a failed attestation is retried by a re-run.
      - name: Build and Push Runner Image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          platforms: linux/amd64
          outputs: type=image,name=${{ env.RUNNER_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          no-cache-filters: runner
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@9d57eef8c06cd9d6b433effeeb7a6a77b3ff94ad # v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/runner
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Tag the Attested Runner Image
        id: tag
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          TAG_ARGS=()
          while read -r TAG; do
            if [ -n "$TAG" ]; then TAG_ARGS+=(--tag "$TAG"); fi
          done <<< "$TAGS"
          docker buildx imagetools create "${TAG_ARGS[@]}" "${RUNNER_IMAGE}@${DIGEST}"
