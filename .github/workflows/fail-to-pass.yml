name: Fail-to-Pass Test Replay

# Only a fix must show a proof that fails on its base (docs/TESTING.md). A change to the code
# under src/ can make a test fail on base, a changed check module of tests/gate/*_checks/ can make
# a gate case fail on base and pass on head (#4554), and a changed gate module of tests/gate/**
# can write a problem line on base that disappears on head (#4596). Code is a .py file under src/
# outside the knowledge base; a prompt, a pin, a lockfile or other data under src/ is no code, and
# a test of it would read a value (#6207). So the workflow runs for a pull request that changes
# source code or a path under tests/gate/**, and its job runs only for a fix title. `devops ci fail-to-pass` reads the same
# rule (`is_source_code`), so a local run agrees. A pull request that the filter skips gets no check run; a job that its condition skips
# reports Success. Neither is a required check of main (ADR 0004), so neither blocks a merge
# (#1879).
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
    paths:
      - "src/**/*.py"
      - "!src/devops_cli/ai/knowledge_base/**"
      - "tests/gate/**"

permissions:
  contents: read

# The release pull request changes no file under src/ or tests/gate/, so the path filter never
# starts this workflow for it. An edit of the body alone changes neither the replay nor the job condition: its
# run takes a group of its own, so it cannot cancel the replay of the head, and its job is skipped.
# An edit of the title or the base runs the job again (#4651).
concurrency:
  group: fail-to-pass-${{ github.ref }}-${{ github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base && github.run_id || 'head' }}
  cancel-in-progress: true

env:
  # uv runs only its own CPython builds, never the runner image's Python (#1494).
  UV_MANAGED_PYTHON: "1"

jobs:
  fail-to-pass:
    name: Fail-to-Pass Check
    # No edit of the body alone, no pull request of the Renovate App, and a title that
    # CONST_DEFECT_TITLE_PATTERN reads as a fix. startsWith ignores case. A dependency bump has
    # no test that fails on its base, so the job does not apply to the App's fix(deps) pull
    # requests (#4896). The fix pull requests of the Service App keep the check.
    if: >-
      ${{ !(github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base)
      && github.event.pull_request.user.login != 'dan-petty-renovate[bot]'
      && (startsWith(github.event.pull_request.title, 'fix(') || startsWith(github.event.pull_request.title, 'fix:') || startsWith(github.event.pull_request.title, 'fix!')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: fail-to-pass

      # The replay runs the `k8s` row of a changed check module, and that row runs the offline
      # lint of argo on the Argo objects of the product base (#5289). The next step puts the
      # directory of the command first on PATH for the replay.
      - name: Copy the tools of the devtools image
        id: devtools
        uses: ./.github/actions/devtools-commands
        with:
          commands: argo

      - name: Put the tools of the devtools image on PATH
        env:
          BIN_DIR: ${{ steps.devtools.outputs.path }}
        run: echo "$BIN_DIR" >> "$GITHUB_PATH"

      - name: Replay changed tests and gate checks against base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          uv run devops ci fail-to-pass --base "origin/${BASE_REF}"
