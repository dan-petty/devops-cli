name: Fail-to-Pass Test Replay

# Only a fix must show a test that fails on its base (rule 4 of AGENTS.md), and only a change to
# the code under src/ can make a test fail on base. So the workflow runs for a pull request that
# changes src/ outside the knowledge base, and its job runs only for a fix title. A pull request
# that the filter skips gets no check run; a job that its condition skips reports Success. Neither
# is a required check of main (ADR 0012), so neither blocks a merge (#1879).
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
    paths:
      - "src/**"
      - "!src/devops_cli/ai/knowledge_base/**"

permissions:
  contents: read

# The release pull request changes no file under src/, so the path filter never starts this
# workflow for it.
concurrency:
  group: fail-to-pass-${{ github.ref }}
  cancel-in-progress: true

env:
  # uv runs only its own CPython builds, never the runner image's Python (#1494).
  UV_MANAGED_PYTHON: "1"

jobs:
  fail-to-pass:
    name: Fail-to-Pass Check
    # The titles that CONST_DEFECT_TITLE_PATTERN reads as a fix. startsWith ignores case.
    if: ${{ startsWith(github.event.pull_request.title, 'fix(') || startsWith(github.event.pull_request.title, 'fix:') || startsWith(github.event.pull_request.title, 'fix!') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: fail-to-pass

      - name: Replay changed tests against base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          uv run devops ci fail-to-pass --base "origin/${BASE_REF}"
