name: PR Title

# release-please reads each squash title as a Conventional Commit and drops a title it cannot
# parse without a warning, so the title of every pull request into main is checked.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions: {}

jobs:
  semantic-title:
    name: Semantic PR title
    runs-on: ubuntu-24.04 # moves to ubuntu-26.04 in #1501
    timeout-minutes: 5
    permissions:
      pull-requests: read

    steps:
      - name: Check the Title Is a Conventional Commit
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
