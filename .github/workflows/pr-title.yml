name: PR Title

# release-please reads each squash title as a Conventional Commit and drops a title it cannot
# parse without a warning, so the title of every pull request into main is checked. The title is
# also the squash subject and the changelog line, so its summary has at most 60 characters
# (CONTRIBUTING.md section 4). The action matches subjectPattern against the summary only.
# The scope is one of the scopes that .github/labels.yml declares, so the pull request gets its
# scope label (#2800). `main` is the scope of the release pull request. A test holds this list
# equal to the labels file.
#
# The job `plan-check` runs `devops roadmap plan-check` on a plan pull request of the roadmap
# Service, and shows the form problems of the plan in its check run (#3103). It is advisory: it
# is not the independent review, which runs outside this repository, and it posts no
# `service-vetted` status. A person makes it a required check in the ruleset of `main` (ADR 0014)
# after the plan reader gives no false alarm. A job that its condition skips reports Success
# (see fail-to-pass.yml), so every other pull request passes.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions: {}

env:
  # uv runs only its own CPython builds, never the runner image's Python (#1494).
  UV_MANAGED_PYTHON: "1"

jobs:
  semantic-title:
    name: Semantic PR title
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: read

    steps:
      - name: Check the Title Is a Conventional Commit
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scopes: |
            agent
            agents
            ai
            argo
            argocd
            ci
            cli
            cloudflare
            config
            contributing
            deps
            design
            devcontainer
            docker
            docs
            exceptions
            fail-to-pass
            gate
            gh
            git
            github
            infra
            k8s
            lint
            main
            mcp
            monitoring
            openspec
            output
            pr
            rag
            release
            repos
            research
            review
            roadmap
            sandbox
            scan
            sdlc
            security
            service
            telemetry
            terraform
            tests
            ui
            valkey
            vault
          subjectPattern: ^.{1,60}$
          subjectPatternError: >-
            The summary after "<type>(<scope>): " has more than 60 characters. Shorten it to 60
            characters or fewer (CONTRIBUTING.md section 4).

  # `always()` lets the job run after a failed title check: the command then reports that check
  # as a problem. Without it, GitHub skips a job whose needed job failed. The condition reads the
  # author of the pull request, not `github.actor`, because a person who pushes to the branch of
  # the Service becomes the actor. GitHub compares both operators with no regard to case.
  plan-check:
    name: Plan Check
    needs: semantic-title
    if: "${{ always() && github.event.pull_request.user.login == 'devops-cli-service[bot]' && startsWith(github.event.pull_request.title, 'docs(openspec): plan #') }}"
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      checks: read
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: plan-check

      # The Node that `.node-version` names runs the pinned OpenSpec, which the command runs.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install OpenSpec
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv run devops install-tools --tool openspec --only-missing

      # The command counts tokens with the exact encoding and stops when the cache is missing.
      # tiktoken names a cache file by the SHA-1 of its blob URL and does not download the file
      # when the cache directory is empty, so the step copies the committed encodings there, as
      # `tests/conftest.py` does for the tests. No network and no unpinned input is involved.
      - name: Prepare the tiktoken cache
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken-cache
        run: |
          mkdir -p "$TIKTOKEN_CACHE_DIR"
          for encoding in o200k_base cl100k_base; do
            url="https://openaipublic.blob.core.windows.net/encodings/${encoding}.tiktoken"
            key="$(printf '%s' "$url" | sha1sum | cut -d ' ' -f 1)"
            cp "tests/fixtures/tiktoken/${encoding}.tiktoken" "$TIKTOKEN_CACHE_DIR/$key"
          done

      - name: Check the Plan
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken-cache
        run: uv run devops roadmap plan-check "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
