name: Image Pins

# Resolves each image that the product base k8s/devops pins when a pull request changes it, the
# command or this workflow, so a wrong tag fails the pull request and not the sync (#1994). The
# environment repository checks the images of its own tree (#7290).
# The native `paths` filter stops the run before a runner starts, so a pull request that changes
# none of the paths starts no job and shows no check (#4653). The check is not required.
# A push to main that changes the same paths runs the job too. The job only reads: it renders the
# folder and sends HEAD requests. The run on main saves the cache entry of kubectl that each pull
# request restores (#6416).
on:
  push:
    branches: [main]
    paths:
      - "k8s/devops/**"
      - "src/devops_cli/**/image_pins.py"
      - "src/devops_cli/k8s/template.py"
      - "src/devops_cli/docker/registry.py"
      - ".devcontainer/Dockerfile"
      - ".github/actions/devtools-commands/**"
      - ".github/workflows/image-pins.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "k8s/devops/**"
      - "src/devops_cli/**/image_pins.py"
      - "src/devops_cli/k8s/template.py"
      - "src/devops_cli/docker/registry.py"
      - ".devcontainer/Dockerfile"
      - ".github/actions/devtools-commands/**"
      - ".github/workflows/image-pins.yml"

permissions: {}

# A newer push to the pull request cancels the run of the older head. The group of a push to main
# is its commit, so a merge cancels no run of main before it saves the cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  # No tool the job runs reports usage.
  DO_NOT_TRACK: "1"
  # uv runs only its own CPython builds, never the runner image's Python (#1494).
  UV_MANAGED_PYTHON: "1"

jobs:
  # `devops k8s image-pins k8s/devops` renders the folder with kubectl and resolves each image once
  # with a HEAD request of its manifest (`tag_digest`), which Docker Hub does not count as a pull.
  # The 3 images of devops-cli carry no tag in git, because Image Updater sets their digest, so
  # --managed names them.
  image-pins:
    name: Image Pins
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-suffix: image-pins
          save-uv-cache: "false"

      # The kubectl of the devtools image, from the cache of the action (#6416). The job stays on
      # the runner host: a container job pulls the whole image on each run. The next step puts its
      # directory on PATH before /usr/local/bin, which holds the kubectl of the runner image.
      - name: Copy kubectl from the devtools image
        id: devtools
        uses: ./.github/actions/devtools-commands
        with:
          commands: kubectl

      - name: Put kubectl on PATH
        env:
          BIN_DIR: ${{ steps.devtools.outputs.path }}
        run: echo "$BIN_DIR" >> "$GITHUB_PATH"

      - name: Resolve the Image Pins
        run: >-
          uv run devops k8s image-pins k8s/devops
          --managed ghcr.io/dan-petty/devops-cli/service
          --managed ghcr.io/dan-petty/devops-cli/runner
          --managed ghcr.io/dan-petty/devops-cli/mcp-server
