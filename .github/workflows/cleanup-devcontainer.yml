name: Cleanup PR DevContainer

on:
  pull_request:
    types:
      - closed
  schedule:
    # Daily maintenance sweep at 04:00 UTC to clean any orphaned or stale PR tags
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Specific PR number to delete devcontainer image for (e.g. 38)"
        required: false
        type: string
      tag:
        description: "Exact tag or wildcard pattern to delete (e.g. pr-38, pr-*)"
        required: false
        type: string
        default: "pr-*"
      dry_run:
        description: "Simulate cleanup without deleting images"
        required: false
        type: boolean
        default: false

concurrency:
  group: cleanup-devcontainer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Prune PR DevContainer Images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
      contents: read
      pull-requests: read

    steps:
      - name: Resolve Target Cleanup and Exclusion Tags
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          CLOSING_PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$INPUT_PR_NUMBER" ]; then
            if ! [[ "$INPUT_PR_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "Error: Invalid PR number format '$INPUT_PR_NUMBER'; must be numeric." >&2
              exit 1
            fi
            TAG="pr-${INPUT_PR_NUMBER}"
            echo "Triggered manually for specific PR #${INPUT_PR_NUMBER}"
          elif [ -n "$INPUT_TAG" ] && [ "$INPUT_TAG" != "pr-*" ]; then
            if ! [[ "$INPUT_TAG" =~ ^[a-zA-Z0-9._-]+$ ]]; then
              echo "Error: Invalid tag format '$INPUT_TAG'; must be alphanumeric with allowed dots/dashes/underscores." >&2
              exit 1
            fi
            TAG="$INPUT_TAG"
            echo "Triggered manually for specific tag: ${TAG}"
          else
            TAG="pr-*"
            echo "Targeting all PR images matching: ${TAG}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # Dynamically determine open pull requests to protect their tags
          BASE_EXCLUDE="latest,v*,main"
          if OPEN_PRS=$(gh pr list --repo "$REPO" --state open --limit 200 --json number --jq '.[].number | "pr-\(.)"'); then
            OPEN_PR_TAGS=$(echo "$OPEN_PRS" | tr '\n' ',' | sed 's/,$//')
          else
            if [ "$EVENT_NAME" = "schedule" ] || [ "$TAG" = "pr-*" ]; then
              echo "Error: Failed to query open PRs from GitHub API on batch/scheduled cleanup; failing closed to protect active PR images." >&2
              exit 1
            fi
            OPEN_PR_TAGS=""
          fi

          if [ -n "$OPEN_PR_TAGS" ]; then
            EXCLUDE_TAGS="${BASE_EXCLUDE},${OPEN_PR_TAGS}"
          else
            EXCLUDE_TAGS="${BASE_EXCLUDE}"
          fi

          # If triggered by PR closure, guarantee closing PR is removed from exclusion
          if [ "$EVENT_NAME" = "pull_request" ]; then
            CLOSING_PR="pr-${CLOSING_PR_NUMBER}"
            EXCLUDE_TAGS=$(echo "$EXCLUDE_TAGS" | tr ',' '\n' | grep -v "^${CLOSING_PR}$" | tr '\n' ',' | sed 's/,$//')
          fi

          echo "exclude_tags=${EXCLUDE_TAGS}" >> "$GITHUB_OUTPUT"
          echo "Target delete pattern: ${TAG}"
          echo "Protected tags: ${EXCLUDE_TAGS}"

      - name: Delete PR DevContainer from GHCR
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          packages: devops-cli/devcontainer
          delete-tags: ${{ steps.target.outputs.tag }}
          exclude-tags: ${{ steps.target.outputs.exclude_tags }}
          delete-untagged: true
          delete-ghost-images: true
          delete-orphaned-images: true
          dry-run: ${{ inputs.dry_run || false }}
          token: ${{ secrets.GITHUB_TOKEN }}
