name: Third-Party Image Scan

# Scans the third-party image that Deployment `crawl4ai` pins, when a pull request changes its
# manifest, this workflow or the image scan action, and only reports (#3884, #4363). An image is
# not ours to rebuild: a finding in it is fixed by the upstream release that a Renovate pull
# request brings, so the scan never fails the job. The person who merges the bump
# reads the findings in the table of the log or in code scanning, category `trivy-image-<name>`
# (#6405). The native `paths` filter stops the run before a runner starts, so a pull request that
# changes none of the files starts no job and shows no check (#4653). The check is not required.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "k8s/devops/crawl4ai/deployment.yaml"
      - ".github/workflows/third-party-image-scan.yml"
      - ".github/actions/image-scan/**"

permissions: {}

# A newer push to the pull request cancels the run of the older head.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No tool the job runs reports usage.
  DO_NOT_TRACK: "1"

jobs:
  third-party-image-scan:
    name: Third-Party Image Scan (${{ matrix.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: crawl4ai
            manifest: k8s/devops/crawl4ai/deployment.yaml
            repository: unclecode/crawl4ai

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read the Pinned Image
        id: image
        env:
          MANIFEST: ${{ matrix.manifest }}
          REPOSITORY: ${{ matrix.repository }}
        run: |
          image=$(awk -v repo="$REPOSITORY" '$1 == "image:" && index($2, repo ":") == 1 { print $2 }' "$MANIFEST")
          test "$(printf '%s\n' "$image" | wc -l)" = 1 && test -n "$image"
          echo "ref=$image" >> "$GITHUB_OUTPUT"

      - name: Scan the Image for Vulnerabilities
        timeout-minutes: 4
        uses: ./.github/actions/image-scan
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          category: trivy-image-${{ matrix.name }}
          exit-code: "0"
