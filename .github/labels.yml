# ── Roadmap Item Fields (ADR 0016) ──────────────────────────────────────────
# One label of each family holds a field of a roadmap item. A roadmap job that
# sets a field replaces each label of the family with the label of the value.
- name: "status/new"
  color: "EDEDED"
  description: "Status New: the item is not ready yet"

- name: "status/ready"
  color: "1D76DB"
  description: "Status Ready: problem, acceptance criteria and an answer to each key question"

- name: "status/in-progress"
  color: "BFDADC"
  description: "Actively being designed or implemented by developer or agent"

- name: "status/in-review"
  color: "D4C5F9"
  description: "Pull request open and undergoing multi-persona review or CI gates"

- name: "status/blocked"
  color: "E11D21"
  description: "Execution blocked by external dependency or upstream review"

- name: "priority/p0-critical"
  color: "B60205"
  description: "Urgent blockages, critical vulnerabilities, or release blockers"

- name: "priority/p1-high"
  color: "D93F0B"
  description: "Priority P1: high-impact work for the next planned milestone"

- name: "priority/p2-medium"
  color: "FBCA04"
  description: "Standard priority feature work and architectural improvements"

- name: "priority/p3-low"
  color: "0E8A16"
  description: "Minor polish, low-severity improvements, and backlogged tasks"

- name: "value/high"
  color: "C2E0C6"
  description: "Value High: the delivery of the item matters much"

- name: "value/medium"
  color: "FEF2C0"
  description: "Value Medium"

- name: "value/low"
  color: "EDEDED"
  description: "Value Low: the delivery of the item matters little"

- name: "effort/high"
  color: "F9D0C4"
  description: "Effort High: much work, in one pull request"

- name: "effort/medium"
  color: "FEF2C0"
  description: "Effort Medium"

- name: "effort/low"
  color: "C2E0C6"
  description: "Effort Low: little work"

# ── Roadmap Labels ──────────────────────────────────────────────────────────
- name: "needs-split"
  color: "FBCA04"
  description: "Too big for one pull request; split it before work starts"

- name: "source/agent"
  color: "5319E7"
  description: "Filed by an agent"

# ── Review Feedback Labels ──────────────────────────────────────────────────
- name: "review/approved"
  color: "0E8A16"
  description: "Code changes reviewed and approved across all personas"

- name: "review/changes-requested"
  color: "D73A4A"
  description: "Findings or defects identified that require remediation"

- name: "review/ai-reviewed"
  color: "8A2BE2"
  description: "Automated multi-persona AI review executed on changeset"
