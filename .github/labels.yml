# ── Release Labels ──────────────────────────────────────────────────────────
- name: "autorelease: pending"
  color: "DCDCD6"
  description: "The release pull request that release-please keeps open"

- name: "autorelease: tagged"
  color: "DCDCD6"
  description: "A release pull request whose release release-please created"

- name: "release-now"
  color: "DCDCD6"
  description: "A person sets it on a fix pull request: its merge turns on auto-merge of the release pull request"

- name: "hold-release"
  color: "86867F"
  description: "A person sets it on the release pull request: the scheduled merge skips it"
