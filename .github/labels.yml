# GitHub Declarative Labels Schema for devops-cli
# Synced via: devops gh labels sync

# ── Type Labels ─────────────────────────────────────────────────────────────
- name: "type/feature"
  color: "0E8A16"
  description: "New user-facing functionality or capability addition"

- name: "type/bug"
  color: "D73A4A"
  description: "Defect, regression, or incorrect runtime behavior"

- name: "type/security"
  color: "B60205"
  description: "Security vulnerability, CVE, or credential protection"

- name: "type/refactor"
  color: "1D76DB"
  description: "Code simplification, deduplication, or structural reorganization"

- name: "type/docs"
  color: "0075CA"
  description: "Documentation additions, guides, manuals, or README updates"

- name: "type/infra"
  color: "5319E7"
  description: "Kubernetes, Docker, DevContainer, or OpenTofu infrastructure"

- name: "type/test"
  color: "FBCA04"
  description: "Unit, integration, invariant, or benchmark test authoring"

- name: "type/chore"
  color: "CFD3D7"
  description: "Dependency upgrades, tooling adjustments, or maintenance"

# ── Scope Labels ────────────────────────────────────────────────────────────
- name: "scope/ai"
  color: "6F42C1"
  description: "AI review pipeline, personas, prompts, LLM client, or RAG"

- name: "scope/k8s"
  color: "326CE5"
  description: "Kubernetes commands, Helm charts, pods, services, and policies"

- name: "scope/security"
  color: "E99695"
  description: "Security linters (trivy, bandit, gitleaks, kubeconform) and Vault"

- name: "scope/cli"
  color: "C2E0C6"
  description: "Core CLI framework, Typer subcommands, options, and tables"

- name: "scope/review"
  color: "D4C5F9"
  description: "Multi-persona code review engine, verification, and findings"

- name: "scope/config"
  color: "BFD4F2"
  description: "Settings, OS Keyring, environment variables, and defaults"

- name: "scope/mcp"
  color: "F9D0C4"
  description: "Model Context Protocol tools, system resources, and prompts"

- name: "scope/telemetry"
  color: "FEF2C0"
  description: "OpenTelemetry tracing spans, Prometheus metrics, and Jaeger"

- name: "scope/github"
  color: "24292E"
  description: "GitHub Projects v2, Views, Milestones, Labels, and PR automation"

- name: "scope/release"
  color: "1D76DB"
  description: "The release-please workflow, the changelog and the published artifacts"

- name: "scope/ci"
  color: "1D76DB"
  description: "GitHub Actions workflows, pre-commit hooks, CI gates, and runners"

- name: "scope/infra"
  color: "5319E7"
  description: "Docker container images, DevContainers, and infrastructure tooling"

- name: "autorelease: pending"
  color: "EDEDED"
  description: "The release pull request that release-please keeps open"

- name: "autorelease: tagged"
  color: "EDEDED"
  description: "A release pull request whose release release-please created"

# ── Roadmap Item Fields (ADR 0016) ──────────────────────────────────────────
# One label of each family holds a field of a roadmap item. A roadmap job that
# sets a field replaces each label of the family with the label of the value.
- name: "status/new"
  color: "EDEDED"
  description: "Status New: the item is not ready yet"

- name: "status/ready"
  color: "1D76DB"
  description: "Status Ready: problem, acceptance criteria and an answer to each key question"

- name: "status/in-progress"
  color: "BFDADC"
  description: "Actively being designed or implemented by developer or agent"

- name: "status/in-review"
  color: "D4C5F9"
  description: "Pull request open and undergoing multi-persona review or CI gates"

- name: "status/blocked"
  color: "E11D21"
  description: "Execution blocked by external dependency or upstream review"

- name: "priority/p0-critical"
  color: "B60205"
  description: "Urgent blockages, critical vulnerabilities, or release blockers"

- name: "priority/p1-high"
  color: "D93F0B"
  description: "Priority P1: high-impact work for the next planned milestone"

- name: "priority/p2-medium"
  color: "FBCA04"
  description: "Standard priority feature work and architectural improvements"

- name: "priority/p3-low"
  color: "0E8A16"
  description: "Minor polish, low-severity improvements, and backlogged tasks"

- name: "value/high"
  color: "C2E0C6"
  description: "Value High: the delivery of the item matters much"

- name: "value/medium"
  color: "FEF2C0"
  description: "Value Medium"

- name: "value/low"
  color: "EDEDED"
  description: "Value Low: the delivery of the item matters little"

- name: "effort/high"
  color: "F9D0C4"
  description: "Effort High: much work, in one pull request"

- name: "effort/medium"
  color: "FEF2C0"
  description: "Effort Medium"

- name: "effort/low"
  color: "C2E0C6"
  description: "Effort Low: little work"

# ── Roadmap Labels ──────────────────────────────────────────────────────────
- name: "needs-split"
  color: "FBCA04"
  description: "Too big for one pull request; split it before work starts"

- name: "source/agent"
  color: "5319E7"
  description: "Filed by an agent"

# ── Review Feedback Labels ──────────────────────────────────────────────────
- name: "review/approved"
  color: "0E8A16"
  description: "Code changes reviewed and approved across all personas"

- name: "review/changes-requested"
  color: "D73A4A"
  description: "Findings or defects identified that require remediation"

- name: "review/ai-reviewed"
  color: "8A2BE2"
  description: "Automated multi-persona AI review executed on changeset"
