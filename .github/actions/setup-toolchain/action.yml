name: Set up uv toolchain
description: >-
  Install the pinned uv-managed Python environment and restore incremental tooling caches.
  Shared by every quality-gate job so their setup cannot drift apart.

inputs:
  cache-suffix:
    description: >-
      Distinguishes the tooling cache between concurrent jobs, so two jobs finishing at the
      same time do not race to save the same cache key.
    required: false
    default: shared
  tooling-cache-paths:
    description: >-
      Newline-separated incremental tool cache directories to restore and save. An empty value
      skips the tooling cache.
    required: false
    default: |
      .mypy_cache
      .ruff_cache
  save-uv-cache:
    description: >-
      Whether setup-uv saves its cache at the end of the job. Set to "false" in jobs that run
      alongside Static Analysis on the same push or pull_request so only one job writes the key.
    required: false
    default: "true"
  compile-bytecode:
    description: >-
      Whether `uv sync` compiles bytecode. Set to "false" in the test jobs, where xdist workers
      compile the modules they import anyway and the sync compile costs 7 to 15 s (#4727).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install uv and Python
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        save-cache: ${{ inputs.save-uv-cache }}
        cache-dependency-glob: "uv.lock"
        cache-python: "true"
        prune-cache: "true"
        # Pinned rather than floating. Every `uses:` in this action is SHA-pinned, but the
        # toolchain it installs was not, so a broken or tampered uv release would enter
        # every job silently and reproducing a past CI run was impossible.
        version: "0.13.7"
        python-version: "3.14"

    - name: Restore tooling caches
      if: inputs.tooling-cache-paths != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.tooling-cache-paths }}
        key: tooling-${{ inputs.cache-suffix }}-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
        restore-keys: |
          tooling-${{ inputs.cache-suffix }}-${{ runner.os }}-

    # A fresh runner's environment holds no bytecode: compiling it once here, in parallel, spares
    # each xdist worker compiling the same modules while it collects (#1735). The test jobs skip
    # the compile, because their workers import most modules once (#4727).
    - name: Synchronize dependencies
      shell: bash
      env:
        COMPILE_BYTECODE: ${{ inputs.compile-bytecode }}
      run: |
        if [ "$COMPILE_BYTECODE" = "true" ]; then
          uv sync --locked --all-groups --all-extras --compile-bytecode
        else
          uv sync --locked --all-groups --all-extras
        fi

    - name: Initialize workspace directories
      shell: bash
      run: mkdir -p .data/reviews .data/analysis .data/logs
