version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    target-branch: "main"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "type/chore"
      - "scope/ci"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    target-branch: "main"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "type/chore"
      - "scope/cli"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    target-branch: "main"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "type/chore"
      - "scope/infra"
    open-pull-requests-limit: 5
