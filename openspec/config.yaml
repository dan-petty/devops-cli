schema: spec-driven

context: |
  devops-cli is pre-1.0 alpha software with no backwards compatibility. Artifacts describe the final state, never a transition, a shim or a legacy mode.
  One roadmap item is one GitHub issue and one change named <issue>-<slug>, for example 1144-semgrep-registry-fetch. It is usually one pull request. An item delivered as several pull requests (Part of #<issue>) keeps its folder in openspec/changes/ until the pull request that closes the issue.
  Status, priority, milestone and pull request numbers live on GitHub: never write them in an artifact. Artifacts are committed exactly as they will read once merged, so a task is ticked [x] only when its work is in the merged tree.
  Engineering standards (complexity caps, typing, security, telemetry) are in AGENTS.md and are not restated here. Never write an internal hostname, private address or private registry: use example.com, RFC 5737 addresses and roles such as <storage-node>.

rules:
  proposal:
    - >-
      Cite the issue as #<issue> in Why. End the proposal with two sections. "## Feasibility" names how the premise was confirmed against the real system (upstream documentation, library source, or command output with its version); when the premise fails, write no compensating code: state the evidence and propose the re-scope. "## Existing Tool Considered" names the open, maintained tool or library that covers the need; a change that builds instead states the written cost AGENTS.md asks for (the tokens to implement, maintain and fix it until it matches the tool, plus the elapsed time). Either way, list the internal code the change deletes. The cost of changing our own code to fit the tool is not a reason to keep that code.
    - >-
      State whether the change fits one pull request.
    - >-
      A change that alters no behavior a consumer observes (tests, CI workflows, documentation, a refactor that keeps behavior) has no spec delta and sets skip_specs: true in its .openspec.yaml. A devops command, option or message, a manifest and a service's behavior are observable: they carry a delta. Say why in What Changes.
  specs:
    - >-
      Run openspec list --specs first and reuse a capability. The delta that creates a capability starts with a "## Purpose" section of at least 50 characters, so archive never writes TBD. A capability that another active change creates is extended with ADDED requirements and no Purpose of its own.
    - >-
      Change an existing requirement only with MODIFIED, REMOVED or RENAMED, and only when it exists in openspec/specs/. When an active change adds it, name that issue as a blocker and archive after it. Archive refuses a MODIFIED of a spec that does not exist. Two active changes never MODIFY, REMOVE or RENAME one requirement: fold the items, or wait until the first archives.
    - >-
      Write only scenarios a test under tests/ can assert offline. Tests double only process edges and never reach a network, a cluster or a real scanner.
    - >-
      Never add a requirement for compatibility with the old behavior.
  design:
    - >-
      Record each rejected alternative with the evidence that rejected it.
  tasks:
    - >-
      Write one "## <n>. <Part title>" group per pull request. A pull request ticks only its own group, and the pull request that closes the issue leaves no task unticked.
    - >-
      Within each group order tasks as failing test, implementation, then documentation, and name each task's verification command, such as `uv run devops ci test tests/test_<feature>.py`.
    - >-
      Delete obsolete code and its tests in the group that replaces them.
    - >-
      Every group regenerates the documentation its code changes with `devops docs generate --sync-readme`. Only the closing group adds changelog.d/<issue>.md.
    - >-
      Work the item will not do is a plain bullet, with no checkbox, naming its follow-up issue under "## Workflow follow-up". A check only a person can run is a plain bullet starting "Pending a person:". A change that alters code may end with the plain bullet "Pending a person: review the diff in tuicr (tuicr -r <base>..HEAD)."

operations:
  apply:
    guidance:
      - >-
        Implement test-first on a topic branch as AGENTS.md requires. Tick a task in the commit that completes it. Push only after `uv run devops ci` passes completely. Do not run sync. The pull request that closes the issue archives its own change as its last commit. Run `uv run devops openspec archive <change>` after every task is ticked. It archives the change, then validates every spec and change. A pull request that says Part of #<issue> archives nothing.
