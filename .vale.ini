# Vale checks the hand-written prose of this repository against the ASD-STE100 rules of
# src/devops_cli/ai/tasks/style_ste100.md (#5157). Every rule is a suggestion, so the check
# reports the findings and passes until a measured run on main shows the precision of a rule.
StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = STE
